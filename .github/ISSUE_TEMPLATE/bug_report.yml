name: Bug report
description: Report defects, including regressions, crashes, and behavior bugs.
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              Keep this report concise, reproducible, and grounded in observed evidence. If you do not know an answer, write `Unknown`.

              For security vulnerabilities, please **do not** file a public issue. See [SECURITY.md](https://github.com/withcoral/coral/blob/main/SECURITY.md).

    - type: textarea
      id: summary
      attributes:
          label: What happened?
          description: A short description of the observed failure. Include exact error messages when available.
      validations:
          required: true

    - type: textarea
      id: repro
      attributes:
          label: Steps to reproduce
          description: Minimal commands, config, source spec, or workflow needed to reproduce.
          placeholder: |
              1. `coral source add --file my-source.yaml`
              2. `coral query "select * from my_source.foo"`
              3. ...
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: What should have happened instead? Cite docs, prior behavior, or a known-good version if relevant.
      validations:
          required: true

    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Coral version, install method, operating system, and any relevant source/MCP/config context.
          placeholder: |
              Coral: `coral --version`
              Install: Homebrew / script / cargo / source build
              OS: macOS 26.5.1 / Ubuntu 24.04 / Windows 11
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Logs, output, or evidence
          description: Paste redacted logs, command output, screenshots, traces, or links that support the report. `RUST_LOG=debug` or `RUST_BACKTRACE=1` may help for crashes.
          render: shell
