name: Feature request
description: Propose a new capability or product improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: |
              Help us evaluate the request with a concrete use case, desired behavior, and tradeoffs.

    - type: textarea
      id: summary
      attributes:
          label: Summary
          description: One-line statement of the requested capability.
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: Problem to solve
          description: What user pain this solves and why current behavior is insufficient.
      validations:
          required: true

    - type: textarea
      id: proposed_solution
      attributes:
          label: Proposed solution
          description: Desired behavior, API, CLI shape, config keys, output, or source-spec behavior.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Workarounds tried, other shapes considered, or constraints maintainers should know about.
