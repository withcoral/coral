name: CI

# The one workflow that pull requests and main start. It runs the gates from
# the Validation table in AGENTS.md on every change except documentation. Each
# job installs tools and runs the gate's own commands, so a local run and this
# one agree. desktop.yml and reel.yml hold the longer jobs.
#
# Job names read "Area / Check", so the checks on a pull request sort by area.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust: ${{ steps.filter.outputs.rust }}
      images: ${{ steps.filter.outputs.images }}
      desktop-app: ${{ steps.filter.outputs.desktop-app }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A push to main runs every gate. The filter would have to fetch the
      # commit before the push, and this checkout keeps no credentials to do so.
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          # A file selects a filter when it matches every pattern in it. The
          # filters name what a gate can ignore, not what it reads: a list of
          # each gate's inputs goes stale, and a stale list skips a gate that
          # would have failed.
          predicate-quantifier: every
          filters: |
            # Anything but documentation and license texts.
            code:
              - '**'
              - '!**/*.md'
              - '!**/LICENSE'
              - '!docs/**'
              - '!apps/docs/**'
            # The Rust gates also ignore the apps, which no Rust test reads,
            # except the Node version that the Postgres gate's script runs on.
            rust:
              - '**'
              - '!**/*.md'
              - '!**/LICENSE'
              - '!docs/**'
              - '!apps/**/!(.node-version)'
            # The image gate also ignores Desktop, which neither image builds
            # from, and Reel, which .dockerignore keeps out of both builds.
            images:
              - '**'
              - '!**/*.md'
              - '!**/LICENSE'
              - '!docs/**'
              - '!apps/docs/**'
              - '!apps/desktop/**'
              - '!apps/reef/e2e/**'
            # Desktop's macOS and Windows jobs cost the most, so they are the
            # only ones that name their inputs. desktop.yml also runs nightly.
            desktop-app:
              - '{.github/**,apps/desktop/**}'

  rust:
    name: Rust / Checks
    needs: changes
    if: ${{ needs.changes.outputs.rust != 'false' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # scripts/check-migrations.sh compares against the merge base with
          # main and reads the release tags, which a full fetch brings.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-rust
      - uses: taiki-e/install-action@5f57d6cb7cd20b14a8a27f522884c4bc8a187458 # v2.75.19
        with:
          tool: nextest,cargo-deny
      # make rust-checks installs Squawk and Buf from npm.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: apps/reef/.node-version
          package-manager-cache: false
      - run: make rust-checks

  # Runs on every change, apps and docs included: besides the Cargo checks,
  # it keeps the enterprise licence header out of every file outside ee/.
  ee-boundary:
    name: Rust / ee boundary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # `cargo metadata` needs the toolchain, not a build cache.
      - run: rustup show
      - run: make ee-boundary

  rust-embedded-js:
    name: Rust / Embedded JS
    needs: changes
    if: ${{ needs.changes.outputs.rust != 'false' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-install
        with:
          packages: crates/coral-v8
      - run: npm run check --prefix crates/coral-v8

  postgres:
    name: Rust / Postgres tests
    needs: changes
    if: ${{ needs.changes.outputs.rust != 'false' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-postgres
      - uses: taiki-e/install-action@5f57d6cb7cd20b14a8a27f522884c4bc8a187458 # v2.75.19
        with:
          tool: nextest
      # The gate's script is TypeScript that Node runs directly. It has no
      # packages to install.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: apps/reef/.node-version
          package-manager-cache: false
      # scripts/postgres.ts starts Postgres in a container, as it does locally.
      - run: make postgres-tests

  # The crates that touch the filesystem, credentials and process lifecycle,
  # where Windows differs most. Desktop / Windows install builds the release
  # runtime, so this job only tests.
  rust-windows:
    name: Rust / Windows tests
    needs: changes
    if: ${{ needs.changes.outputs.rust != 'false' }}
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-rust-windows
      - uses: taiki-e/install-action@5f57d6cb7cd20b14a8a27f522884c4bc8a187458 # v2.75.19
        with:
          tool: nextest
      # The coral-app lib test binary sometimes dies with 0xC0000409, a
      # fast-fail that prints nothing and names no test (#3517). It is likely
      # not a Rust stack overflow, which prints its thread and exits
      # 0xC00000FD. Have Windows keep a minidump of any process that crashes,
      # so the next one shows the fast-fail code and the faulting stack.
      # The key is the global one, not a per-exe key like desktop.yml's
      # node.exe, because each test binary's name carries a hash.
      - name: Keep crash dumps
        continue-on-error: true
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'crash'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
      # nextest runs each test in its own process, so a crash names its test
      # and exit code and no longer stops the rest of its binary. That also
      # stops tests sharing a process, which could hide an interaction between
      # them; Linux runs them this way too. These crates have no doctests.
      - run: cargo nextest run --locked --no-fail-fast -p coral-app -p coral -p coral-credentials -p coral-db -p coral-run-executor
      # A dump needs the crashed test binary and its PDB to name Rust frames.
      - name: Add the crashed test binaries to the dumps
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'crash'
          Get-ChildItem -Path $dumps -Filter '*.dmp' -ErrorAction SilentlyContinue | ForEach-Object {
            $exe = $_.Name -replace '\.\d+\.dmp$', ''
            $names = $exe, ($exe -replace '\.exe$', '.pdb')
            # Test binaries sit in deps or build; a spawned coral.exe sits in target\debug.
            @(Get-ChildItem -Path target\debug\* -Include $names -File -ErrorAction SilentlyContinue) +
              @(Get-ChildItem -Path target\debug\deps, target\debug\build -Recurse -Include $names -ErrorAction SilentlyContinue) |
              Copy-Item -Destination $dumps -Force
          }
      - name: Keep the crash evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-windows-test-crash-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash
          if-no-files-found: ignore
          retention-days: 7

  reef:
    name: Reef / Checks
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-install
        with:
          packages: apps/reef
      # npm test runs every story's play function in Chromium.
      - name: Install Playwright's Chromium
        working-directory: apps/reef
        run: npx playwright install --with-deps chromium
      - run: npm run check --prefix apps/reef
      - run: npm run typecheck --prefix apps/reef
      - run: npm test --prefix apps/reef
      - run: npm run build --prefix apps/reef
      - run: npm run test:server --prefix apps/reef

  # Builds the runtime and Reef images from this checkout and starts them on
  # fresh state. release.yml runs the same tests on the images it publishes.
  images:
    name: Images / Tests
    needs: changes
    if: ${{ needs.changes.outputs.images != 'false' }}
    # The runtime image's build compiles the release binary.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # make docker-test checks the Reef Dockerfile with Node before it builds.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: apps/reef/.node-version
          package-manager-cache: false
      # Keeps both images' layers and cache mounts between runs.
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: images
      - run: make docker-test

  dev:
    name: Dev scripts / Tests
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/npm-install
        with:
          packages: apps/reef
      - run: ./dev test

  desktop:
    name: Desktop
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    uses: ./.github/workflows/desktop.yml
    with:
      all-platforms: ${{ needs.changes.outputs.desktop-app == 'true' }}

  reel-desktop:
    name: Reel
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    uses: ./.github/workflows/reel.yml
    with:
      suite: desktop

  # The product journeys, on both databases. Four runners each take a quarter.
  reel-main:
    # A name that reads the matrix stops GitHub from adding its values, which
    # reel.yml's own job name already shows.
    name: Reel${{ matrix.shard && '' }}
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/reel.yml
    with:
      suite: main
      database: ${{ matrix.database }}
      shard: ${{ matrix.shard }}of4

  reel-local-mode:
    name: Reel
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    uses: ./.github/workflows/reel.yml
    with:
      suite: local-mode

  # Two Coral Instances on one Postgres database, behind a round-robin proxy.
  reel-multi-instance:
    name: Reel
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    uses: ./.github/workflows/reel.yml
    with:
      suite: multi-instance

  # Lints, renders and validates the Helm chart, and runs its helm-unittest
  # suites. The cache keeps kubeconform and helm-unittest, which come from
  # GitHub release downloads; pull requests never save it.
  chart:
    name: Chart / Checks
    needs: changes
    if: ${{ needs.changes.outputs.code != 'false' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      HELM_UNITTEST_VERSION: 1.2.1
      HELM_UNITTEST_SHA256: 48e86ecc1467b009630e5954375e5d8494139f73b466df5fe8c04fa45b634939
      TOOLS: ${{ github.workspace }}/../chart-tools
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS }}
          key: chart-tools-${{ env.KUBECONFORM_VERSION }}-${{ env.HELM_UNITTEST_VERSION }}
      - name: Download kubeconform and helm-unittest
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          curl -fsSLo unittest.tgz "https://github.com/helm-unittest/helm-unittest/releases/download/v$HELM_UNITTEST_VERSION/helm-unittest-linux-amd64-$HELM_UNITTEST_VERSION.tgz"
          echo "$HELM_UNITTEST_SHA256  unittest.tgz" | sha256sum -c -
          # The archive names the binary for its platform.
          tar -xzf unittest.tgz untt-linux-amd64
          mv untt-linux-amd64 untt
          rm kubeconform.tgz unittest.tgz
      - if: ${{ steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS }}
          key: chart-tools-${{ env.KUBECONFORM_VERSION }}-${{ env.HELM_UNITTEST_VERSION }}
      - run: echo "$TOOLS" >> "$GITHUB_PATH"
      # The helm-unittest binary runs the suites without a plugin install.
      - run: make chart-checks
        env:
          HELM_UNITTEST: untt

  # The one check to require. It passes when every gate passed or its paths
  # did not change. A skipped job passes a required check by itself, so
  # requiring the gates one by one would also pass when `changes` fails.
  required:
    name: Required
    needs: [changes, chart, rust, ee-boundary, rust-embedded-js, postgres, rust-windows, reef, images, dev, desktop, reel-desktop, reel-main, reel-local-mode, reel-multi-instance]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
