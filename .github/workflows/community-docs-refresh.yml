name: Community docs refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/community-docs-refresh.yml"
      - "Makefile"
      - "crates/coral-spec/**"
      - "sources/community/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-docs-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh community source catalog
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create GitHub App token
        id: github-app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: coral

      - name: Check out Coral
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.github-app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show

      - name: Regenerate community source catalog
        run: make docs-generate

      - name: Open or update refresh PR
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
          PR_BRANCH: automation/community-source-docs
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/reference/community-sources.mdx docs/docs.json; then
            echo "Community source catalog already up to date."
            exit 0
          fi

          git config user.name "coral-docs-refresh[bot]"
          git config user.email "coral-docs-refresh[bot]@users.noreply.github.com"
          git checkout -B "${PR_BRANCH}"
          git add docs/reference/community-sources.mdx docs/docs.json
          git commit -m "docs: refresh community source catalog"
          git push --force-with-lease origin "HEAD:${PR_BRANCH}"

          if gh pr view "${PR_BRANCH}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr edit "${PR_BRANCH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "docs: refresh community source catalog" \
              --body "Regenerates the community source catalog after source changes landed on main."
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${PR_BRANCH}" \
              --title "docs: refresh community source catalog" \
              --body "Regenerates the community source catalog after source changes landed on main."
          fi
