name: Dependencies

# The one place that checks the locked crates for RustSec advisories and
# yanked releases. Either can appear with no change to Cargo.lock, so pull
# requests do not run this check: a new advisory would fail an unrelated one.
# `make rust-checks` checks licences, bans and sources on every pull request.
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `cargo metadata` needs the toolchain, not a build cache.
      - run: rustup show
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - run: make advisory-check
