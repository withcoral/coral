name: Virtual Graph Core

on:
  pull_request:
    paths:
      - ".github/workflows/virtual-graph-core.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/coral-engine/**"
      - "docs/virtual-graph-*.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/virtual-graph-core.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/coral-engine/**"
      - "docs/virtual-graph-*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core engine synthetic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: coral-virtual-graph-${{ runner.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p coral-engine --all-targets --locked -- -D warnings

      - name: Virtual graph tests
        run: cargo test -p coral-engine virtual_graph --locked
