name: Virtual Graph Core

on:
  pull_request:
    paths:
      - ".github/workflows/virtual-graph-core.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "crates/coral-engine/**"
      - "docs/virtual-graph-*.md"
      - "xtask/Cargo.toml"
      - "xtask/src/main.rs"
      - "xtask/src/tck.rs"
  push:
    branches: [main, prod]
    paths:
      - ".github/workflows/virtual-graph-core.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "crates/coral-engine/**"
      - "docs/virtual-graph-*.md"
      - "xtask/Cargo.toml"
      - "xtask/src/main.rs"
      - "xtask/src/tck.rs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core engine synthetic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: coral-virtual-graph-${{ runner.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p coral-engine --all-targets --locked -- -D warnings

      - name: Virtual graph tests
        run: cargo test -p coral-engine virtual_graph --locked

      - name: openCypher TCK read baseline
        run: cargo test -p coral-engine opencypher_tck --locked

      - name: GraphQL read baseline
        run: cargo test -p coral-engine graphql_read_baseline --locked

      - name: openCypher TCK coverage report
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- virtual-graph-tck-report --json \
            | tee virtual-graph-tck-report.json
          {
            echo "### openCypher TCK coverage"
            echo
            echo '```json'
            cat virtual-graph-tck-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upstream openCypher TCK inventory
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          git clone --quiet --depth 1 --branch "2024.3" \
            https://github.com/opencypher/openCypher.git "$tmp_dir/openCypher"
          test "$(git -C "$tmp_dir/openCypher" rev-parse HEAD)" = \
            "677cbafabb8c3c5eed458fd3b1ec0daec8d67d23"
          cargo run --locked -p xtask -- virtual-graph-upstream-tck-report \
            --features-dir "$tmp_dir/openCypher/tck/features" \
            --json \
            | tee virtual-graph-upstream-tck-report.json
          {
            echo "### Upstream openCypher TCK inventory"
            echo
            echo '```json'
            cat virtual-graph-upstream-tck-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: GraphQL coverage report
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- virtual-graph-baseline-report \
            --fixture crates/coral-engine/tests/fixtures/virtual_graph/graphql_read_baseline.json \
            --json \
            | tee virtual-graph-graphql-report.json
          {
            echo "### GraphQL compatibility coverage"
            echo
            echo '```json'
            cat virtual-graph-graphql-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
