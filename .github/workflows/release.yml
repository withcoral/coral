name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-release-ref:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
    outputs:
      commit-sha: ${{ steps.verified-ref.outputs.commit-sha }}
      tag-name: ${{ steps.verified-ref.outputs.tag-name }}
    steps:
      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like vX.Y.Z, got '${TAG_NAME}'." >&2
            exit 1
          fi

          expected_ref="refs/tags/${TAG_NAME}"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "Release workflow must run on ${expected_ref}, got ${GITHUB_REF}." >&2
            echo "For a manual rerun, choose the release tag in the workflow ref picker." >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is reachable from main
        id: verified-ref
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${TAG_NAME}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$tag_commit" ]; then
            echo "Checked-out commit ${checked_out_commit} does not match ${TAG_NAME} (${tag_commit})." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag ${TAG_NAME} (${tag_commit}) is not reachable from origin/main." >&2
            exit 1
          fi
          echo "commit-sha=${tag_commit}" >> "$GITHUB_OUTPUT"
          echo "tag-name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  build-ui:
    needs: validate-release-ref
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      TAG_NAME: ${{ needs.validate-release-ref.outputs.tag-name }}
    outputs:
      has-ui: ${{ steps.detect-ui.outputs.has-ui }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-release-ref.outputs.commit-sha }}
          persist-credentials: false
      - name: Detect UI package
        id: detect-ui
        run: |
          if [ -f apps/ui/package.json ]; then
            echo "has-ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-ui=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.detect-ui.outputs.has-ui == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: apps/ui/.node-version
          package-manager-cache: false
      - name: Install UI dependencies
        if: steps.detect-ui.outputs.has-ui == 'true'
        run: npm ci --prefix apps/ui
      - name: Build UI
        if: steps.detect-ui.outputs.has-ui == 'true'
        run: npm run build --prefix apps/ui
      - name: Verify UI entrypoint
        if: steps.detect-ui.outputs.has-ui == 'true'
        run: test -s apps/ui/dist/index.html
      - name: Upload UI artifact
        if: steps.detect-ui.outputs.has-ui == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ui-dist
          path: apps/ui/dist

  build:
    needs:
      - validate-release-ref
      - build-ui
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME: ${{ needs.validate-release-ref.outputs.tag-name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-release-ref.outputs.commit-sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}
      - name: Download UI artifact
        if: needs.build-ui.outputs.has-ui == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: apps/ui/dist
      # No Rust cache here — release builds must compile from a clean state
      # to guard against cache poisoning attacks.
      - name: Install cross
        if: matrix.cross
        run: |
          set -euo pipefail
          cargo install cargo-binstall --locked
          cargo binstall --no-confirm --force --disable-strategies compile cross@0.2.5
      - name: Build Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CROSS: ${{ matrix.cross }}
          HAS_UI: ${{ needs.build-ui.outputs.has-ui }}
          TARGET: ${{ matrix.target }}
        run: |
          feature_args=()
          if [ "$HAS_UI" = "true" ]; then
            feature_args=(--features embedded-ui)
          fi

          if [ "$CROSS" = "true" ]; then
            cross build --locked --release --target "$TARGET" "${feature_args[@]}"
          else
            cargo build --locked --release --target "$TARGET" "${feature_args[@]}"
          fi

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HAS_UI: ${{ needs.build-ui.outputs.has-ui }}
          TARGET: ${{ matrix.target }}
        run: |
          $featureArgs = @()
          if ($env:HAS_UI -eq "true") {
            $featureArgs += @("--features", "embedded-ui")
          }

          cargo build --locked --release --target $env:TARGET @featureArgs

      - name: Smoke Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $coral = "target\$env:TARGET\release\coral.exe"
          & $coral --version
          & $coral source discover

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="coral-${TARGET}.tar.gz"
          cd "target/${TARGET}/release"
          tar czf "../../../${archive}" coral
          cd ../../../

      - name: Stage unsigned macOS binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          staging="unsigned-${TARGET}"
          mkdir -p "$staging"
          cp "target/${TARGET}/release/coral" "$staging/coral"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $staging = "package-$env:TARGET"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target\$env:TARGET\release\coral.exe" "$staging\coral.exe"
          Push-Location $staging
          Compress-Archive -Path coral.exe -DestinationPath "..\coral-$env:TARGET.zip" -Force
          Pop-Location

      - name: Upload artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coral-${{ matrix.target }}
          if-no-files-found: error
          path: |
            coral-${{ matrix.target }}.tar.gz
            coral-${{ matrix.target }}.zip

      - name: Upload unsigned macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-unsigned-${{ matrix.target }}
          path: unsigned-${{ matrix.target }}/coral

  sign-notarize-macos:
    needs:
      - validate-release-ref
      - build
    environment: release
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      TAG_NAME: ${{ needs.validate-release-ref.outputs.tag-name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-release-ref.outputs.commit-sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Download unsigned macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-unsigned-${{ matrix.target }}
          path: unsigned-${{ matrix.target }}

      - name: Build release helper
        run: cargo build --locked -p xtask

      - name: Sign, package, and notarize macOS artifact
        shell: bash
        env:
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          ./target/debug/xtask release-macos-sign-notarize \
            --target "$TARGET" \
            --binary "unsigned-${TARGET}/coral" \
            --zip "coral-${TARGET}.zip" \
            --tar "coral-${TARGET}.tar.gz" \
            --work-dir "$RUNNER_TEMP/coral-signing-${TARGET}"

      - name: Clean up Apple signing assets
        if: always()
        shell: bash
        run: |
          work_dir="$RUNNER_TEMP/coral-signing-${TARGET}"
          original_keychains_path="$work_dir/original-keychains.txt"
          if [ -s "$original_keychains_path" ]; then
            keychains=()
            while IFS= read -r existing_keychain; do
              [ -n "$existing_keychain" ] && keychains+=("$existing_keychain")
            done < "$original_keychains_path"
            if [ "${#keychains[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${keychains[@]}" || true
            fi
          fi
          security delete-keychain "$work_dir/coral-signing.keychain-db" || true
          rm -rf "$work_dir"

      - name: Upload signed macOS artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coral-${{ matrix.target }}
          if-no-files-found: error
          path: |
            coral-${{ matrix.target }}.zip
            coral-${{ matrix.target }}.tar.gz

  build-desktop-macos:
    needs:
      - validate-release-ref
    environment: release
    runs-on: macos-26
    env:
      TAG_NAME: ${{ needs.validate-release-ref.outputs.tag-name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-release-ref.outputs.commit-sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: apps/desktop/.node-version
          package-manager-cache: false

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop

      - name: Build xtask
        run: cargo build --locked -p xtask

      # Build before Apple credentials enter the environment: the desktop
      # build installs UI and Reef dependencies and executes Rust build scripts.
      # The release flag is compiled into the main process to enable updates;
      # signing and notarization still happen only in the credentialed step.
      - name: Build universal desktop inputs
        env:
          CORAL_DESKTOP_RELEASE: "1"
          CORAL_DESKTOP_UNIVERSAL: "1"
        run: npm run build --prefix apps/desktop

      - name: Verify release updater bundle
        run: npm run verify:release-build --prefix apps/desktop

      # Version/tag agreement, credential preflight, API-key staging,
      # packaging, and signature/notarization/artifact verification live in
      # xtask so they are testable and cannot drift from this workflow.
      - name: Package, sign, and notarize desktop app
        env:
          CSC_LINK: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          ./target/debug/xtask release-desktop-macos-package \
            --tag "$TAG_NAME" \
            --work-dir "$RUNNER_TEMP/coral-desktop-release"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coral-desktop-macos
          if-no-files-found: error
          path: |
            apps/desktop/dist/coral-desktop-*.dmg
            apps/desktop/dist/coral-desktop-*.zip
            apps/desktop/dist/coral-desktop-*.blockmap
            apps/desktop/dist/latest-mac.yml

  checksums:
    needs:
      - build
      - build-desktop-macos
      - sign-notarize-macos
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coral-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts
          # Only the globs decide "did any archive arrive?"; latest-mac.yml is a
          # literal that would always survive nullglob and mask an empty set.
          archives=(coral-*.tar.gz coral-*.zip coral-*.dmg coral-*.blockmap)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No Coral release archives found" >&2
            exit 1
          fi
          test -s latest-mac.yml
          sha256sum "${archives[@]}" latest-mac.yml > checksums.sha256
          test -s checksums.sha256
      - name: Upload checksums
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: checksums
          path: artifacts/checksums.sha256

  publish-version:
    needs:
      - validate-release-ref
      - checksums
    environment: release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.validate-release-ref.outputs.tag-name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "{coral-*,checksums}"
          path: artifacts
          merge-multiple: true

      - name: Create GitHub App token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: github-app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          repositories: |
            coral
            homebrew-tap

      - name: Upload artifacts to GitHub release
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Count only the globbed archives; the literals (latest-mac.yml,
          # checksums.sha256) would always survive nullglob and defeat the
          # emptiness guard.
          archives=(
            artifacts/coral-*.tar.gz
            artifacts/coral-*.zip
            artifacts/coral-*.dmg
            artifacts/coral-*.blockmap
          )
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No Coral release archives found" >&2
            exit 1
          fi
          test -s artifacts/latest-mac.yml
          test -s artifacts/checksums.sha256
          gh release upload "$TAG_NAME" \
            "${archives[@]}" \
            artifacts/latest-mac.yml \
            artifacts/checksums.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Promote GitHub release
        id: promote-release
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")"
          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          was_prerelease="$(printf '%s' "$release_json" | jq -r '.prerelease')"

          if [ "$was_prerelease" = "true" ]; then
            release_json="$(gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F prerelease=false \
              -F make_latest=true)"
          fi

          {
            echo "was_prerelease=${was_prerelease}"
            echo "tag_name=$(printf '%s' "$release_json" | jq -r '.tag_name')"
            echo "release_name=$(printf '%s' "$release_json" | jq -r '.name // ""')"
            echo "release_url=$(printf '%s' "$release_json" | jq -r '.html_url')"
            echo "body<<__RELEASE_BODY__"
            printf '%s' "$release_json" | jq -r '.body // ""'
            echo "__RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-release-ref.outputs.commit-sha }}
          fetch-depth: 0
          token: ${{ steps.github-app-token.outputs.token }}
          persist-credentials: false

      # Force push targets `docs` only — never `main`. Runs on both the
      # `release` event and manual `workflow_dispatch` against a tag, so docs
      # can be (re)pointed at a shipped tag by re-running this workflow.
      - name: Point docs branch at released commit
        env:
          GH_APP_TOKEN: ${{ steps.github-app-token.outputs.token }}
          RELEASE_COMMIT_SHA: ${{ needs.validate-release-ref.outputs.commit-sha }}
        run: |
          set -euo pipefail
          git push --force \
            "https://x-access-token:${GH_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${RELEASE_COMMIT_SHA}:refs/heads/docs"

      # Dispatch the tap workflow after publishing the release:
      # https://octokit.github.io/rest.js/v22/#repos-create-dispatch-event
      - name: Trigger Homebrew tap bump
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_VERSION: ${{ env.TAG_NAME }}
        with:
          github-token: ${{ steps.github-app-token.outputs.token }}
          script: |
            const version = process.env.RELEASE_VERSION.replace(/^v/, "");
            await github.rest.repos.createDispatchEvent({
              owner: "withcoral",
              repo: "homebrew-tap",
              event_type: "coral-release",
              client_payload: { version },
            });

      - name: Post promoted release to Discord
        if: steps.promote-release.outputs.was_prerelease == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          TAG_NAME: ${{ steps.promote-release.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.promote-release.outputs.release_name }}
          RELEASE_BODY: ${{ steps.promote-release.outputs.body }}
          RELEASE_URL: ${{ steps.promote-release.outputs.release_url }}
        run: |
          MAX_LEN=3500
          BODY="$RELEASE_BODY"
          if [ ${#BODY} -gt $MAX_LEN ]; then
            BODY="${BODY:0:$MAX_LEN}..."
          fi

          TITLE_MAX_LEN=256
          TITLE="🪸 ${RELEASE_NAME:-$TAG_NAME}"
          if [ ${#TITLE} -gt $TITLE_MAX_LEN ]; then
            TITLE="${TITLE:0:$((TITLE_MAX_LEN - 3))}..."
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg desc "$BODY" \
            --arg url "$RELEASE_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 16744272,
                footer: { text: "Fresh from the reef" }
              }]
            }' | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
