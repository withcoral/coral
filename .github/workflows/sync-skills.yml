name: Sync skills distribution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-skills.yml"
      - "plugins/coral/skills/**"
      - "xtask/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-skills-distribution
  cancel-in-progress: false

jobs:
  sync:
    name: Open skills sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out Coral
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Create GitHub App token
        id: github-app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ vars.SKILLS_SYNC_APP_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          repositories: |
            coral
            skills

      - name: Check out skills distribution
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: withcoral/skills
          path: skills-dist
          token: ${{ steps.github-app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Export skills
        run: |
          set -euo pipefail
          cd skills-dist
          git fetch origin sync/coral-skills:refs/remotes/origin/sync/coral-skills || true
          git checkout -B sync/coral-skills
          cd ..
          cargo run --locked -p xtask -- export-skills --dest skills-dist

      - name: Commit and push changes
        id: commit
        run: |
          set -euo pipefail
          cd skills-dist
          if [ -z "$(git status --short)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "coral-skills-sync[bot]"
          git config user.email "coral-skills-sync[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "chore: sync skills from coral" \
            -m "Source: withcoral/coral@${GITHUB_SHA}"
          git push --force-with-lease origin HEAD:sync/coral-skills
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          set -euo pipefail
          cd skills-dist
          title="chore: sync skills from coral"
          body="$(cat <<EOF
          Sync installable skills from withcoral/coral.

          Source commit: withcoral/coral@${GITHUB_SHA}

          This PR is generated by the Coral skills distribution sync workflow.
          EOF
          )"

          if gh pr view sync/coral-skills --repo withcoral/skills >/dev/null 2>&1; then
            gh pr edit sync/coral-skills \
              --repo withcoral/skills \
              --title "$title" \
              --body "$body"
          else
            gh pr create \
              --repo withcoral/skills \
              --base main \
              --head sync/coral-skills \
              --title "$title" \
              --body "$body"
          fi
