[package]
name = "coral-v8"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Test-only counts of this process's compilers. Dev-dependencies enable this;
# production crates never do.
test-support = []

[dependencies]
coral-telemetry.workspace = true
coral-value.workspace = true
deno_core_icudata.workspace = true
serde.workspace = true
serde_json.workspace = true
sourcemap.workspace = true
thiserror.workspace = true
tracing.workspace = true
v8.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
coral-telemetry = { workspace = true, features = ["test-support"] }
coral-test-support.workspace = true
