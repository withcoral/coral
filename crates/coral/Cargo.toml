[package]
name = "coral"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "coral"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

coral-app.workspace = true
coral-mcp.workspace = true
coral-run-executor.workspace = true
coral-embed-spike = { path = "../coral-embed-spike", optional = true }

[features]
# SPIKE (coral#2867), throwaway: the hidden `embed-spike` argument.
embed-spike = ["dep:coral-embed-spike"]

[dev-dependencies]
coral-run-executor = { workspace = true, features = ["test-support"] }
reqwest.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true
