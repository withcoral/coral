[package]
name = "coral-run-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# A scripted Coral that serves the pull stream and the Run streams, for tests
# of the Run Executor.
test-support = []

[dependencies]
coral-credentials.workspace = true
coral-db.workspace = true
coral-telemetry.workspace = true
coral-v8.workspace = true
coral-value.workspace = true
prost.workspace = true
ring.workspace = true
sea-query.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-prost.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
coral-telemetry = { workspace = true, features = ["test-support"] }
coral-test-support.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true
