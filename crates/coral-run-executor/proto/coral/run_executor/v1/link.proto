syntax = "proto3";

package coral.run_executor.v1;

// The link between a Run Executor and Coral. Coral serves it, and the Run
// Executor dials it; the Run Executor serves nothing.
service LinkService {
  // The pull stream: one per Run Executor, the first stream on every
  // connection. The Run Executor opens it with Hello.
  rpc Pull(stream PullRequest) returns (stream PullResponse);
  // A Run stream: one per Run the Run Executor holds, on its current
  // connection. The Run Executor opens it with Open.
  rpc Run(stream RunRequest) returns (stream RunResponse);
}

// A message the Run Executor sends on its pull stream.
message PullRequest {
  // The message.
  oneof message {
    // The first message on every pull stream.
    Hello hello = 1;
    // A new count of free room.
    Room room = 2;
    // The answer to one Compile.
    Compiled compiled = 3;
  }
}

// A message Coral sends on a pull stream.
message PullResponse {
  // The message.
  oneof message {
    // The answer to Hello.
    Welcome welcome = 1;
    // Runs taken for this Run Executor.
    Taken taken = 2;
    // One compile, which holds one unit of room until Compiled answers it.
    Compile compile = 3;
  }
}

// What a Run Executor declares when it opens its pull stream.
message Hello {
  // A random UUID generated at each start, for operators only. Coral refuses
  // a pull stream whose id is not a UUID.
  string run_executor_id = 1;
  // The Run Executor's protocol level.
  uint32 protocol_level = 2;
  // The units of room free: Runs and compiles it is willing to hold.
  uint32 free = 3;
  // The limits it applies to each Run.
  Limits limits = 4;
}

// The limits a Run Executor applies to each Run it holds.
message Limits {
  // The longest a Run may run here, in seconds.
  uint32 max_run_duration_seconds = 1;
  // Limits it cannot lower below Coral's own. Unset: none.
  FixedLimits fixed = 2;
}

// Per-Run limits a runtime keeps whatever Coral asks.
message FixedLimits {
  // The heap each Run has, in bytes.
  uint64 heap_bytes = 1;
}

// Coral's answer to Hello.
message Welcome {
  // Coral's protocol level.
  uint32 protocol_level = 1;
  // The id of the Coral Instance that holds this pull stream.
  string coral_instance_id = 2;
}

// The Run Executor's count of free units, which replaces the last one.
message Room {
  // The units of room free.
  uint32 free = 1;
}

// Runs a Coral Instance claimed for this Run Executor, one unit each.
message Taken {
  // The Runs taken.
  repeated TakenRun runs = 1;
}

// One Run taken for this Run Executor.
message TakenRun {
  // The Run's id.
  string run_id = 1;
  // The execution claim the Run's stream presents.
  string claim_id = 2;
}

// One compile call. Coral sends none yet: each call's input comes with the
// compiler that serves it.
message Compile {
  // This call's number on this pull stream, which Compiled repeats.
  uint64 number = 1;
  // The time left until the caller's compilation deadline, in milliseconds.
  uint32 time_left_ms = 2;
}

// The answer to one Compile. The package and the typed error come with the
// compiler.
message Compiled {
  // The number of the Compile it answers.
  uint64 number = 1;
}

// A message the Run Executor sends on a Run stream.
message RunRequest {
  // The message.
  oneof message {
    // The first message on every Run stream.
    Open open = 1;
    // The package is loaded into a fresh isolate.
    Loaded loaded = 2;
    // One of the Program's requests.
    Request request = 3;
  }
}

// A message Coral sends on a Run stream.
message RunResponse {
  // The message.
  oneof message {
    // The Run's package, the answer to Open for a held Run not started.
    Package package = 1;
    // The Run started: the Program may run.
    Started started = 2;
    // The highest request number committed.
    Committed committed = 3;
    // The answer to one Invoke.
    ToolResult tool_result = 4;
    // A recorded termination: stop the Program.
    Terminate terminate = 5;
    // Coral's last message on the stream.
    Ended ended = 6;
  }
}

// Opens a Run stream for one taken Run.
message Open {
  // The Run's id.
  string run_id = 1;
  // The execution claim it was taken with.
  string claim_id = 2;
  // The Run Executor's protocol level.
  uint32 protocol_level = 3;
}

// What a Run Executor needs to load and run one Program.
message Package {
  // The emitted JavaScript.
  string script = 1;
  // The authored source map of the script.
  string source_map = 2;
  // The SHA-256 digest of the script and the source map, as
  // `coral_run_executor::package_digest` computes it.
  bytes sha256 = 3;
  // The Run's value limits.
  ValueLimits value_limits = 4;
  // The Saved Function snapshots linked into the script.
  repeated LinkedSnapshot linked_snapshots = 5;
  // Coral's protocol level.
  uint32 protocol_level = 6;
  // The Run's W3C `traceparent`. Empty: none.
  string traceparent = 7;
}

// The value limits a Run accepted, in bytes.
message ValueLimits {
  // The most decoded bytes per Binary Value.
  uint64 binary_bytes = 1;
  // The most encoded JSON bytes at a host crossing.
  uint64 host_bytes = 2;
  // The most bytes per upstream request or result.
  uint64 upstream_bytes = 3;
  // The Run Output Budget.
  uint64 run_output_bytes = 4;
}

// One Saved Function snapshot linked into a package.
message LinkedSnapshot {
  // Its path relative to `coral.functions`, such as `debug.fetch`.
  string path = 1;
  // The snapshot's id, which names it in a source location.
  string saved_function_id = 2;
}

// The package is loaded; the Run Executor waits for Started.
message Loaded {}

// The Run started.
message Started {
  // The time until the Run's deadline, in milliseconds, counted from this
  // message.
  uint64 deadline_ms = 1;
  // The Run CPU Budget, in milliseconds. Unset: none.
  optional uint64 cpu_budget_ms = 2;
}

// The committed watermark.
message Committed {
  // The highest request number committed.
  uint64 request_number = 1;
}

// One of the Program's requests, numbered from one per Run in the
// Program's order.
message Request {
  // The request's number.
  uint64 number = 1;
  // What the Program asks.
  oneof kind {
    // A Tool Invocation, which ToolResult answers.
    Invoke invoke = 2;
    // A Program Emission.
    Emit emit = 3;
    // A Program Log.
    Log log = 4;
    // The Program's end, the last request.
    Finish finish = 5;
  }
}

// One Tool Invocation.
message Invoke {
  // The Tool's complete Call Path.
  string call_path = 1;
  // The arguments, as native JSON.
  string arguments_json = 2;
  // The authored call site. Unset: none.
  Location location = 3;
}

// One Program Emission.
message Emit {
  // The value, as native JSON.
  string value_json = 1;
  // The authored call site. Unset: none.
  Location location = 2;
}

// One Program Log.
message Log {
  // Its level.
  LogLevel level = 1;
  // Its message.
  string message = 2;
  // The authored call site. Unset: none.
  Location location = 3;
}

// A Program Log's level.
enum LogLevel {
  // Not set; breaks the protocol.
  LOG_LEVEL_UNSPECIFIED = 0;
  // `console.debug`.
  LOG_LEVEL_DEBUG = 1;
  // `console.info` or `console.log`.
  LOG_LEVEL_INFO = 2;
  // `console.warn`.
  LOG_LEVEL_WARN = 3;
  // `console.error`.
  LOG_LEVEL_ERROR = 4;
}

// An authored source location.
message Location {
  // The Saved Function snapshot that holds it. Empty: the Program body.
  string saved_function_id = 1;
  // The one-based line.
  uint32 line = 2;
  // The one-based column, in UTF-16 code units.
  uint32 column = 3;
}

// How the Program ended.
message Finish {
  // The completion.
  oneof completion {
    // The Final Value, as native JSON.
    string value_json = 1;
    // A failure.
    Failure failure = 2;
    // An end that carries nothing more.
    FinishEnd end = 3;
  }
}

// A Program failure.
message Failure {
  // The Run failure code, such as `program_rejected`.
  string code = 1;
  // Its safe message.
  string message = 2;
  // The Program error, as JSON. Empty: none.
  string error_json = 3;
}

// An end of a Program that carries nothing more.
enum FinishEnd {
  // Not set; breaks the protocol.
  FINISH_END_UNSPECIFIED = 0;
  // The Program returned `undefined`: an absent Final Value.
  FINISH_END_ABSENT = 1;
  // The host stopped the Program.
  FINISH_END_HOST_TERMINATED = 2;
  // The isolate reached its heap limit.
  FINISH_END_MEMORY_LIMIT = 3;
  // The Program used its Run CPU Budget.
  FINISH_END_CPU_BUDGET = 4;
  // The Program's output exceeded the Run Output Budget.
  FINISH_END_OUTPUT_BUDGET = 5;
  // The Run Executor ended the Program at the Run's deadline.
  FINISH_END_DEADLINE_REACHED = 6;
}

// The answer to one Invoke, at Applied.
message ToolResult {
  // The Invoke's request number.
  uint64 number = 1;
  // The Run Output Budget bytes Coral counted for the result.
  uint64 bytes = 2;
  // The outcome.
  oneof outcome {
    // The Tool Result, as native JSON.
    string result_json = 3;
    // A Coral Failure.
    Rejection rejection = 4;
    // A complete upstream outcome that is not a declared success.
    UpstreamError upstream_error = 5;
    // A host failure: the Program stops without a catchable result.
    Fatal fatal = 6;
  }
}

// A Coral Failure the Program catches as a `ToolError`.
message Rejection {
  // Its stable code.
  string code = 1;
  // Its safe message.
  string message = 2;
  // The lowercase W3C trace id it names. Empty: none.
  string trace_id = 3;
  // Call Paths near the one named, nearest first.
  repeated string suggestions = 4;
}

// An upstream outcome the Program catches as a `ToolError`.
message UpstreamError {
  // Its stable code.
  string code = 1;
  // Its safe message.
  string message = 2;
  // The encoded Tool Result the Program does not receive.
  string outcome_json = 3;
}

// A host failure.
message Fatal {}

// A recorded termination.
message Terminate {
  // Why the Run ends.
  TerminateReason reason = 1;
}

// Why a recorded termination ends a Run.
enum TerminateReason {
  // Not set.
  TERMINATE_REASON_UNSPECIFIED = 0;
  // A cancellation won.
  TERMINATE_REASON_CANCELED = 1;
  // The Run's deadline won.
  TERMINATE_REASON_TIMED_OUT = 2;
  // The Run was interrupted.
  TERMINATE_REASON_INTERRUPTED = 3;
}

// How the Run ended, or that the Run Executor does not hold it.
message Ended {
  // The end.
  RunEnd end = 1;
}

// A Run's end on a Run stream.
enum RunEnd {
  // Not set.
  RUN_END_UNSPECIFIED = 0;
  // The Run succeeded.
  RUN_END_SUCCEEDED = 1;
  // The Run failed.
  RUN_END_FAILED = 2;
  // The Run was canceled.
  RUN_END_CANCELED = 3;
  // The Run timed out.
  RUN_END_TIMED_OUT = 4;
  // The Run was interrupted.
  RUN_END_INTERRUPTED = 5;
  // The claim does not match: the Run Executor does not hold the Run.
  RUN_END_NOT_HELD = 6;
}
