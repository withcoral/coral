syntax = "proto3";

package coral.run_executor.v1;

// The link between a Run Executor and Coral. Coral serves it, and the Run
// Executor dials it; the Run Executor serves nothing.
service LinkService {
  // The pull stream: one per Run Executor, the first stream on every
  // connection. The Run Executor opens it with Hello.
  rpc Pull(stream PullRequest) returns (stream PullResponse);
  // A Run stream: one per Run the Run Executor holds, on its current
  // connection. The Run Executor opens it with Open.
  rpc Run(stream RunRequest) returns (stream RunResponse);
}

// A message the Run Executor sends on its pull stream.
message PullRequest {
  // The message.
  oneof message {
    // The first message on every pull stream.
    Hello hello = 1;
    // A new count of free room.
    Room room = 2;
    // The answer to one Compile.
    Compiled compiled = 3;
  }
}

// A message Coral sends on a pull stream.
message PullResponse {
  // The message.
  oneof message {
    // The answer to Hello.
    Welcome welcome = 1;
    // Runs taken for this Run Executor.
    Taken taken = 2;
    // One compile, which holds one unit of room until Compiled answers it.
    Compile compile = 3;
  }
}

// What a Run Executor declares when it opens its pull stream.
message Hello {
  // A random UUID generated at each start, for operators only. Coral refuses
  // a pull stream whose id is not a UUID.
  string run_executor_id = 1;
  // The Run Executor's protocol level.
  uint32 protocol_level = 2;
  // The units of room free: Runs and compiles it is willing to hold.
  uint32 free = 3;
  // The limits it applies to each Run.
  Limits limits = 4;
}

// The limits a Run Executor applies to each Run it holds.
message Limits {
  // The longest a Run may run here, in seconds.
  uint32 max_run_duration_seconds = 1;
  // Limits it cannot lower below Coral's own. Unset: none.
  FixedLimits fixed = 2;
}

// Per-Run limits a runtime keeps whatever Coral asks.
message FixedLimits {
  // The heap each Run has, in bytes.
  uint64 heap_bytes = 1;
}

// Coral's answer to Hello.
message Welcome {
  // Coral's protocol level.
  uint32 protocol_level = 1;
  // The id of the Coral Instance that holds this pull stream.
  string coral_instance_id = 2;
}

// The Run Executor's count of free units, which replaces the last one.
message Room {
  // The units of room free.
  uint32 free = 1;
}

// Runs a Coral Instance claimed for this Run Executor, one unit each.
message Taken {
  // The Runs taken.
  repeated TakenRun runs = 1;
}

// One Run taken for this Run Executor.
message TakenRun {
  // The Run's id.
  string run_id = 1;
  // The execution claim the Run's stream presents.
  string claim_id = 2;
}

// One compile call, which holds one unit of room until Compiled answers it.
// It carries source and no Workspace, Principal or credential.
message Compile {
  // This call's number on this pull stream, which Compiled repeats.
  uint64 number = 1;
  // The time left until the caller's compilation deadline, in milliseconds.
  uint32 time_left_ms = 2;
  // Which compiler call this is. Compiled answers each kind with its own
  // result.
  oneof call {
    // Find the Private and Shared Tools each source calls and the Tool Call
    // Paths it names, so Coral can load and check them before it compiles.
    // Answered with Analyzed.
    Analyze analyze = 3;
    // Compile a Program body, with the Private and Shared Tools it links,
    // into the JavaScript a Run executes. Answered with Package.
    ProgramSource compile = 4;
    // Check an Authored Tool's source when it is saved or published, and
    // produce its type declaration and diagnostics. Answered with Prepared.
    AuthoredToolSource prepare = 5;
  }
}

// The answer to one Compile.
message Compiled {
  // The number of the Compile it answers.
  uint64 number = 1;
  // The result for the kind of call, or why the call has none.
  oneof answer {
    // The result of an analyze call.
    Analyzed analyzed = 2;
    // The result of a compile call.
    Package package = 3;
    // The result of a prepare call.
    Prepared prepared = 4;
    // Why a compile or prepare call has no result.
    CompileFailure failure = 5;
    // Why an analyze call has no result, and which source it stopped at.
    AnalysisFailure analysis_failure = 6;
  }
}

// The sources to analyze, in order.
message Analyze {
  // The sources.
  repeated AnalyzedSource sources = 1;
}

// One source to analyze.
message AnalyzedSource {
  // The source, and whether it is a Program body or an Authored Tool.
  oneof source {
    // A Program body.
    string program = 1;
    // An Authored Tool module: a Private or a Shared Tool.
    string authored_tool = 2;
  }
}

// What each source names, in the order of the sources.
message Analyzed {
  // One per source.
  repeated SourceReferences sources = 1;
}

// The Private and Shared Tools one source calls, and the Tool Call Paths it
// names. Analysis resolves no Tool.
message SourceReferences {
  // The coral.private references, in path order.
  repeated Reference private_tools = 1;
  // Every prefix of a literal Tool chain under coral that could be a Tool
  // Call Path.
  repeated string tool_call_paths = 2;
  // The coral.shared references, in path order.
  repeated Reference shared_tools = 3;
}

// Why analyze stopped.
message AnalysisFailure {
  // The index of the source it stopped at.
  uint64 index = 1;
  // Why that source returned no result.
  CompileFailure failure = 2;
}

// A Program body, the Private and Shared Tools it links, and the Tools it may
// call.
message ProgramSource {
  // The Program body.
  string source = 1;
  // The linked Private and Shared Tools, in the order they initialize.
  repeated LinkedTool linked_tools = 2;
  // The Call Paths the caller can call. Unset: the calls are not checked.
  Callable callable = 3;
  // The Tool Keys of the Built-in Tools the Program calls on coral.
  repeated string builtin_tools = 4;
}

// One Private or Shared Tool source linked into a Program.
message LinkedTool {
  // Its path under its root.
  repeated string path_segments = 1;
  // Its module source.
  string source = 2;
  // The member of coral that holds it.
  LinkedToolRoot root = 3;
}

// The member of coral that holds a linked Tool.
enum LinkedToolRoot {
  // Never sent.
  LINKED_TOOL_ROOT_UNSPECIFIED = 0;
  // coral.private: the caller's own Private Tools.
  LINKED_TOOL_ROOT_PRIVATE = 1;
  // coral.shared: the Workspace's Shared Tools.
  LINKED_TOOL_ROOT_SHARED = 2;
}

// The complete Call Paths the caller can call.
message Callable {
  // The Call Paths.
  repeated string call_paths = 1;
}

// One Authored Tool module to prepare.
message AuthoredToolSource {
  // The module source.
  string source = 1;
  // What types the coral namespace. Unset: it stays untyped.
  Declarations declarations = 2;
  // The Tool Keys of the Built-in Tools on coral.
  repeated string builtin_tools = 3;
}

// The declarations that type the coral namespace for one save.
message Declarations {
  // Above this size, a typed declaration is saved untyped.
  uint64 declaration_max_bytes = 1;
  // Types coral.providers and the Built-in Tools on coral. Unset: they stay
  // untyped.
  CallableDeclarations tools = 2;
  // Types coral.private. Unset: it stays untyped.
  CallableDeclarations private_tools = 3;
  // Types coral.shared. Unset: it stays untyped.
  CallableDeclarations shared_tools = 4;
}

// The declarations that type one part of the coral namespace.
message CallableDeclarations {
  // One declaration per Call Path.
  repeated CallableDeclaration declarations = 1;
}

// The declaration that types one Call Path.
message CallableDeclaration {
  // The path, relative to coral for a Tool, to coral.private for a Private
  // Tool and to coral.shared for a Shared Tool.
  repeated string path_segments = 1;
  // Self-contained TypeScript with one default export.
  string declaration = 2;
}

// One statically named Private or Shared Tool reference.
message Reference {
  // The dotted path relative to its root.
  string path = 1;
  // The one-based authored line.
  uint64 line = 2;
  // The one-based authored column.
  uint64 column = 3;
}

// The called chains of one source that name no Tool the caller can call.
message UnknownToolCalls {
  // The chains, in source order.
  repeated UnknownToolCall calls = 1;
  // The source: the index of the linked Tool among those compiled with the
  // Program. Unset: the Program body.
  optional uint64 linked = 2;
}

// One called chain that names no Tool the caller can call.
message UnknownToolCall {
  // The complete chain as written.
  string call_path = 1;
  // The one-based authored line.
  uint64 line = 2;
  // The one-based authored column.
  uint64 column = 3;
}

// A Program package.
message Package {
  // The JavaScript V8 runs.
  string script = 1;
  // The source map emitted with it.
  string source_map = 2;
  // The SHA-256 of the script's UTF-8 byte length as eight big-endian
  // bytes, then the script's UTF-8 bytes, then the source map's. A digest
  // that does not match breaks the protocol.
  bytes sha256 = 3;
  // Non-blocking diagnostics.
  repeated Diagnostic diagnostics = 4;
}

// One prepared Authored Tool.
message Prepared {
  // The self-contained emitted declaration.
  string declaration = 1;
  // The callable-rooted fields of the declaration, or why there are none.
  oneof projection {
    // The fields.
    DeclarationFields fields = 2;
    // The private reason the fields could not be prepared.
    string fault = 3;
  }
  // Advisory diagnostics.
  repeated Diagnostic diagnostics = 4;
  // The Private Tool references the module names, in path order.
  repeated Reference references = 5;
  // The Shared Tool references the module names, in path order.
  repeated Reference shared_references = 6;
  // The literal Tool chains under coral the module names.
  repeated ToolChain tool_chains = 7;
  // Where the declaration's arguments or result hold something other than
  // data. Unset: they are all data.
  optional string not_data = 8;
}

// One literal Tool chain under coral that a module names.
message ToolChain {
  // The segments relative to coral.
  repeated string segments = 1;
  // Whether the module calls it.
  bool called = 2;
  // Whether it was cut before a computed segment.
  bool computed = 3;
}

// The callable-rooted fields of one declaration.
message DeclarationFields {
  // The fields.
  repeated DeclarationField fields = 1;
}

// One callable-rooted field of a declaration.
message DeclarationField {
  // The path rooted at input or result.
  string path = 1;
  // Its names, documentation and type.
  string text = 2;
}

// One TypeScript compiler diagnostic.
message Diagnostic {
  // Its category.
  DiagnosticCategory category = 1;
  // The official TypeScript diagnostic code.
  uint64 code = 2;
  // The flattened message.
  string message = 3;
  // The one-based line, when known.
  optional uint64 line = 4;
  // The one-based column, when known.
  optional uint64 column = 5;
}

// A TypeScript diagnostic category.
enum DiagnosticCategory {
  // Never sent.
  DIAGNOSTIC_CATEGORY_UNSPECIFIED = 0;
  // An informational message.
  DIAGNOSTIC_CATEGORY_MESSAGE = 1;
  // A non-blocking warning.
  DIAGNOSTIC_CATEGORY_WARNING = 2;
  // A blocking error.
  DIAGNOSTIC_CATEGORY_ERROR = 3;
  // A non-blocking suggestion.
  DIAGNOSTIC_CATEGORY_SUGGESTION = 4;
}

// Why a call returned no result.
message CompileFailure {
  // The failure.
  oneof failure {
    // The call's time ran out while it waited or compiled.
    bool timed_out = 1;
    // The compiler rejected the source.
    Rejection rejected = 2;
    // A coral.private or coral.shared access names no supported Tool path.
    ReferenceRejection reference = 3;
    // Compiling passed the compiler's heap limit.
    bool memory_limit = 4;
    // The compiler had no room for the call: its queue of waiting calls was
    // full.
    bool busy = 5;
    // The compiler stopped before it answered.
    bool stopped = 6;
    // The compiler failed for a reason the source did not cause: the
    // failure's kind, without its text.
    string failed = 7;
    // Called literal Tool chains that name no Tool the caller can call. Only
    // a compile with callable Call Paths fails this way.
    UnknownToolCalls unknown_tools = 8;
  }
}

// A rejected source.
message Rejection {
  // The rejection's stable kind, such as compilation.
  string kind = 1;
  // The safe message for the source's author.
  string message = 2;
}

// A coral.private or coral.shared access that names no supported Tool path.
message ReferenceRejection {
  // The safe reason.
  string message = 1;
  // The one-based authored line.
  uint64 line = 2;
  // The one-based authored column.
  uint64 column = 3;
}

// A message the Run Executor sends on a Run stream.
message RunRequest {
  // The message.
  oneof message {
    // The first message on every Run stream.
    Open open = 1;
    // The package is loaded into a fresh isolate.
    Loaded loaded = 2;
    // One of the Program's requests.
    Request request = 3;
  }
}

// A message Coral sends on a Run stream.
message RunResponse {
  // The message.
  oneof message {
    // The Run's package, the answer to Open for a held Run not started. A Run
    // Executor that loaded it on an earlier stream names it by its digest
    // and sends Loaded again.
    RunPackage package = 1;
    // The Run started: the Program may run.
    Started started = 2;
    // The highest request number committed, also the answer to Open for a
    // started Run: the Run Executor resends every request above it, in order.
    Committed committed = 3;
    // The answer to one Invoke.
    InvocationResult invocation_result = 4;
    // A recorded termination: stop the Program.
    Terminate terminate = 5;
    // Coral's last message on the stream.
    Ended ended = 6;
  }
}

// Opens a Run stream for one taken Run. A stream that ends without Ended
// reopens with the same Open: at once after a clean end that followed
// Coral's answer to Open, otherwise after the connection's back-off.
message Open {
  // The Run's id.
  string run_id = 1;
  // The execution claim it was taken with.
  string claim_id = 2;
  // The Run Executor's protocol level.
  uint32 protocol_level = 3;
}

// What a Run Executor needs to load and run one Program.
message RunPackage {
  // The emitted JavaScript.
  string script = 1;
  // The authored source map of the script.
  string source_map = 2;
  // The SHA-256 digest of the script and the source map, as `Package`
  // carries it.
  bytes sha256 = 3;
  // The Run's value limits.
  ValueLimits value_limits = 4;
  // The Private and Shared Tool snapshots linked into the script.
  repeated LinkedSnapshot linked_snapshots = 5;
  // Coral's protocol level.
  uint32 protocol_level = 6;
  // The Run's W3C `traceparent`. Empty: none.
  string traceparent = 7;
}

// The value limits a Run accepted, in bytes.
message ValueLimits {
  // The most decoded bytes per Binary Value.
  uint64 binary_bytes = 1;
  // The most encoded JSON bytes at a host crossing.
  uint64 host_bytes = 2;
  // The most bytes per upstream request or result.
  uint64 upstream_bytes = 3;
  // The Run Output Budget.
  uint64 run_output_bytes = 4;
}

// One Private or Shared Tool snapshot linked into a package.
message LinkedSnapshot {
  // Its path under its root, such as `debug.fetch`.
  string path = 1;
  // The Tool's id, which names it in a source location.
  string tool_id = 2;
  // The member of coral that holds it.
  LinkedToolRoot root = 3;
}

// The package is loaded; the Run Executor waits for Started. A script the
// isolate cannot load gets Finish as request 1 in place of Loaded, and a
// Terminate before Started gets Finish as request 1: the Program never ran.
// A package that breaks the protocol closes the stream instead.
message Loaded {}

// The Run started.
message Started {
  // The time until the Run's deadline, in milliseconds, counted from this
  // message.
  uint64 deadline_ms = 1;
  // The Run CPU Budget, in milliseconds. Unset: none.
  optional uint64 cpu_budget_ms = 2;
}

// The committed watermark.
message Committed {
  // The highest request number committed.
  uint64 request_number = 1;
}

// One of the Program's requests, numbered from one per Run in the
// Program's order.
message Request {
  // The request's number.
  uint64 number = 1;
  // What the Program asks.
  oneof kind {
    // A Tool Invocation, which InvocationResult answers.
    Invoke invoke = 2;
    // A Program Emission.
    Emit emit = 3;
    // A Program Log.
    Log log = 4;
    // The Program's end, the last request.
    Finish finish = 5;
    // A call to a Private or Shared Tool, which InvocationResult answers.
    Perform perform = 6;
    // How the body of a permitted Perform ended, which InvocationResult
    // answers.
    Complete complete = 7;
  }
}

// One Tool Invocation.
message Invoke {
  // The Tool's complete Call Path.
  string call_path = 1;
  // The arguments, as native JSON.
  string arguments_json = 2;
  // The authored call site. Unset: none.
  Location location = 3;
  // The number of the permitted Perform whose body makes the call: its
  // parent Invocation. Unset: the Program's own call, or one a module's
  // top-level initialization makes.
  optional uint64 parent = 4;
}

// One call to a Private or Shared Tool, which Coral performs by running its
// body in the Program: ADR 0027's code-performed Invoke. Its InvocationResult
// comes once admission, approval and enforcement decide the call, not at
// Applied: `permitted` when the body may run, or a rejection, which settles
// the call before the body runs. A permitted Perform with no Complete before
// Finish was abandoned: the Program ended while its body still ran.
message Perform {
  // The Tool's complete Call Path, under coral.private or coral.shared.
  string call_path = 1;
  // The one object it was called with, as native JSON.
  string arguments_json = 2;
  // The authored call site. Unset: none.
  Location location = 3;
  // The number of the permitted Perform whose body makes the call. Unset:
  // the Program's own call, or one a module's top-level initialization
  // makes.
  optional uint64 parent = 4;
}

// How the body of one permitted Perform ended. Its InvocationResult, at
// Applied, carries the value the call's caller receives, or a rejection. A body that threw a
// Tool Error rejects its caller with that error whatever rejection answers.
message Complete {
  // The Perform's request number.
  uint64 perform = 1;
  // How the body ended.
  oneof outcome {
    // It returned this value, as native JSON. `undefined` is `null`.
    string returned_json = 2;
    // It returned a value that is not data.
    NotData not_data = 3;
    // It threw.
    Threw threw = 4;
  }
}

// A body's return value that is not data.
message NotData {
  // Where the value is, as a path from `result`.
  string field = 1;
  // Why it is not data. Empty: no reason given.
  string reason = 2;
}

// A body that threw.
message Threw {
  // The thrown Error's message, or the thrown value as text.
  string message = 1;
  // The code of the Tool Error the body threw. Unset: it threw no Tool Error.
  optional string tool_error = 2;
}

// One Program Emission.
message Emit {
  // The value, as native JSON.
  string value_json = 1;
  // The authored call site. Unset: none.
  Location location = 2;
}

// One Program Log.
message Log {
  // Its level.
  LogLevel level = 1;
  // Its message.
  string message = 2;
  // The authored call site. Unset: none.
  Location location = 3;
}

// A Program Log's level.
enum LogLevel {
  // Not set; breaks the protocol.
  LOG_LEVEL_UNSPECIFIED = 0;
  // `console.debug`.
  LOG_LEVEL_DEBUG = 1;
  // `console.info` or `console.log`.
  LOG_LEVEL_INFO = 2;
  // `console.warn`.
  LOG_LEVEL_WARN = 3;
  // `console.error`.
  LOG_LEVEL_ERROR = 4;
}

// An authored source location.
message Location {
  // The id of the linked Tool that holds it, as its LinkedSnapshot names it.
  // Empty: the Program body.
  string tool_id = 1;
  // The one-based line.
  uint32 line = 2;
  // The one-based column, in UTF-16 code units.
  uint32 column = 3;
}

// How the Program ended.
message Finish {
  // The completion.
  oneof completion {
    // The Final Value, as native JSON.
    string value_json = 1;
    // A failure.
    Failure failure = 2;
    // An end that carries nothing more.
    FinishEnd end = 3;
  }
}

// A Run failure.
message Failure {
  // The Run failure code, such as `program_rejected`.
  string code = 1;
  // Its safe message.
  string message = 2;
  // The Program error, as JSON. Empty: none.
  string error_json = 3;
}

// An end of a Program that carries nothing more.
enum FinishEnd {
  // Not set; breaks the protocol.
  FINISH_END_UNSPECIFIED = 0;
  // The Program returned `undefined`: an absent Final Value.
  FINISH_END_ABSENT = 1;
  // The host stopped the Program.
  FINISH_END_HOST_TERMINATED = 2;
  // The isolate reached its heap limit.
  FINISH_END_MEMORY_LIMIT = 3;
  // The Program used its Run CPU Budget.
  FINISH_END_CPU_BUDGET = 4;
  // The Program's output exceeded the Run Output Budget.
  FINISH_END_OUTPUT_BUDGET = 5;
  // The Run Executor ended the Program at the Run's deadline.
  FINISH_END_DEADLINE_REACHED = 6;
}

// The answer to one Invoke or Complete, at Applied, or to one Perform, once
// the call is decided. An Invoke and a Complete get `result_json`,
// `coral_failure`, `upstream_outcome` or `fatal`. A Perform gets `permitted`,
// `coral_failure` or `fatal`. Any other outcome breaks the protocol. A
// second answer to a resent request, still above the watermark, repeats the
// first and changes nothing.
message InvocationResult {
  // The request number it answers.
  uint64 number = 1;
  // The Run Output Budget bytes Coral counted for the result.
  uint64 bytes = 2;
  // The outcome.
  oneof outcome {
    // The Tool Result, as native JSON.
    string result_json = 3;
    // A Coral Failure.
    CoralFailure coral_failure = 4;
    // An Upstream Outcome that is not a Declared Success.
    UpstreamOutcome upstream_outcome = 5;
    // A host failure: the Program stops without a catchable result.
    Fatal fatal = 6;
    // The Perform is permitted, and its body runs. Only a Perform gets it.
    Permitted permitted = 7;
  }
}

// A Perform's body may run.
message Permitted {}

// A Coral Failure the Program catches as a `ToolError`.
message CoralFailure {
  // Its stable code.
  string code = 1;
  // Its safe message.
  string message = 2;
  // The lowercase W3C trace id it names. Empty: none.
  string trace_id = 3;
  // Call Paths near the one named, nearest first.
  repeated string suggestions = 4;
}

// An Upstream Outcome the Program catches as a `ToolError`.
message UpstreamOutcome {
  // Its stable code.
  string code = 1;
  // Its safe message.
  string message = 2;
  // The encoded Tool Result the Program does not receive.
  string outcome_json = 3;
}

// A host failure.
message Fatal {}

// A recorded termination.
message Terminate {
  // Why the Run ends.
  TerminateReason reason = 1;
}

// Why a recorded termination ends a Run.
enum TerminateReason {
  // Not set.
  TERMINATE_REASON_UNSPECIFIED = 0;
  // A cancellation won.
  TERMINATE_REASON_CANCELED = 1;
  // The Run's deadline won.
  TERMINATE_REASON_TIMED_OUT = 2;
  // The Run was interrupted.
  TERMINATE_REASON_INTERRUPTED = 3;
}

// How the Run ended, or that the Run Executor does not hold it.
message Ended {
  // The end.
  RunEnd end = 1;
}

// A Run's end on a Run stream.
enum RunEnd {
  // Not set.
  RUN_END_UNSPECIFIED = 0;
  // The Run succeeded.
  RUN_END_SUCCEEDED = 1;
  // The Run failed.
  RUN_END_FAILED = 2;
  // The Run was canceled.
  RUN_END_CANCELED = 3;
  // The Run timed out.
  RUN_END_TIMED_OUT = 4;
  // The Run was interrupted.
  RUN_END_INTERRUPTED = 5;
  // The claim does not match: the Run Executor does not hold the Run.
  RUN_END_NOT_HELD = 6;
}
