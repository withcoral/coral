# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
    - COMMENT_ENUM
    - COMMENT_ENUM_VALUE
    - COMMENT_FIELD
    - COMMENT_MESSAGE
    - COMMENT_ONEOF
    - COMMENT_RPC
    - COMMENT_SERVICE
  # This vendored protocol must retain the canonical grpc.health.v1 names and
  # enum values that Coral's tonic-health server exposes.
  ignore:
    - proto/grpc/health/v1/health.proto
breaking:
  use:
    - FILE
