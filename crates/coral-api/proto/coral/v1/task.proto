syntax = "proto3";

package coral.v1;

import "coral/v1/resources.proto";

// Task lifecycle for intent-bearing units of work.
service TaskService {
  // Starts one task.
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  // Ends one task.
  rpc EndTask(EndTaskRequest) returns (EndTaskResponse);
}

// Starts a task.
message StartTaskRequest {
  // Workspace that scopes the task.
  Workspace workspace = 1;
  // Natural-language description of the work this task groups.
  string intent = 2;
}

// Returns the started task.
message StartTaskResponse {
  // Started task resource.
  Task task = 1;
}

// Ends a task.
message EndTaskRequest {
  // Workspace that scopes the task.
  Workspace workspace = 1;
  // Task id to end.
  string task_id = 2;
  // Final task status.
  TaskStatus task_status = 3;
}

// Returns the task end event.
message EndTaskResponse {
  // Persisted task end event.
  TaskEnd task_end = 1;
}

// An intent-bearing unit of work.
message Task {
  // Server-minted, opaque task id.
  string task_id = 1;
  // Exact-intent trajectory suggestions available when the task starts.
  repeated SuggestedPath suggested_paths = 2;
}

// One advisory path distilled from successful prior tasks.
message SuggestedPath {
  // Stable structural path identifier.
  string path_id = 1;
  // Number of matching successful distilled paths supporting this selection.
  uint64 support_count = 2;
  // Relations touched across the whole path.
  repeated string relations = 3;
  // Ordered, parameterized SQL templates to re-run against live data.
  repeated SuggestedPathStep steps = 4;
}

// One ordered SQL step within a suggested path.
message SuggestedPathStep {
  // Parameterized SQL template; placeholders must be rebound for the live task.
  string sql_template = 1;
  // Relations touched by this step.
  repeated string relations = 2;
}

// A task end event.
message TaskEnd {
  // Ended task id.
  string task_id = 1;
  // Final task status.
  TaskStatus task_status = 2;
}

// Final task status.
enum TaskStatus {
  // Unspecified task status; rejected by EndTask.
  TASK_STATUS_UNSPECIFIED = 0;
  // Task succeeded.
  TASK_STATUS_SUCCESS = 1;
  // Task failed.
  TASK_STATUS_FAILURE = 2;
}
