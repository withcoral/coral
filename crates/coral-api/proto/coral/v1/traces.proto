syntax = "proto3";

package coral.v1;

import "coral/v1/resources.proto";

// Query status derived from locally captured spans.
enum TraceStatus {
  // Status was not recorded or could not be inferred.
  TRACE_STATUS_UNSPECIFIED = 0;
  // The traced operation completed successfully.
  TRACE_STATUS_OK = 1;
  // The traced operation recorded an error.
  TRACE_STATUS_ERROR = 2;
}

// Server-side projection used when listing locally captured traces.
enum TraceView {
  // Returns one summary per distributed trace for diagnostic callers.
  TRACE_VIEW_UNSPECIFIED = 0;
  // Returns one summary per completed user-visible operation for Query Stream.
  // A completed operation beneath a local parent is not projected until its
  // owning local ancestry has also completed and been exported.
  TRACE_VIEW_QUERY_STREAM = 1;
}

// Semantic operation represented by a Query Stream summary.
enum TraceOperationKind {
  // The operation kind was not recorded or could not be inferred.
  TRACE_OPERATION_KIND_UNSPECIFIED = 0;
  // A direct SQL query operation.
  TRACE_OPERATION_KIND_QUERY = 1;
  // A direct Search operation.
  TRACE_OPERATION_KIND_SEARCH = 2;
  // An MCP tool invocation.
  TRACE_OPERATION_KIND_TOOL = 3;
  // Another explicitly marked user-visible operation.
  TRACE_OPERATION_KIND_OTHER = 4;
}

// Compact trace row for list views.
message TraceSummary {
  // W3C trace identifier.
  string trace_id = 1;
  // Span used as the display root. In Query Stream this identifies the
  // selected operation within a distributed trace.
  string root_span_id = 2;
  // Display name of the trace primary span, or the operation span in Query
  // Stream.
  string name = 3;
  // SQL text for a trace or Query operation, or locally retained Search text
  // for a Query Stream Search operation.
  string query = 4;
  // Derived trace status, or selected operation status in Query Stream.
  TraceStatus status = 5;
  // Earliest trace span start time, or operation start time in Query Stream,
  // in Unix nanoseconds.
  int64 start_time_unix_nanos = 6 [jstype = JS_STRING];
  // Latest trace span end time, or operation end time in Query Stream, in Unix
  // nanoseconds.
  int64 end_time_unix_nanos = 7 [jstype = JS_STRING];
  // Trace wall-clock duration, or selected operation duration in Query Stream.
  int64 duration_nanos = 8 [jstype = JS_STRING];
  // Number of spans captured for this trace, or spans owned by the selected
  // operation in Query Stream.
  uint32 span_count = 9;
  // Query row count when the trace or selected operation includes a completed
  // Coral query span.
  uint64 row_count = 10 [jstype = JS_STRING];
  // Whether `row_count` was recorded. This distinguishes an unknown count from
  // a valid zero-row query.
  bool row_count_recorded = 11;
  // Semantic operation kind for Query Stream entries.
  TraceOperationKind operation_kind = 12;
  // Privacy-safe operation label, such as `sql`, `search`, or an MCP tool name.
  string operation_name = 13;
}

// Lists locally captured traces.
message ListTracesRequest {
  // Maximum number of traces to return. The server applies a default and cap.
  int32 page_size = 1;
  // Opaque token returned by a previous list response.
  string page_token = 2;
  // Optional workspace that scopes returned traces. Omit to list all local
  // traces visible to the local server.
  Workspace workspace = 3;
  // Projection to return. The default preserves one-summary-per-trace behavior.
  TraceView view = 4;
}

// Page of locally captured traces.
message ListTracesResponse {
  // Trace summaries ordered by latest activity descending.
  repeated TraceSummary traces = 1;
  // Token for the next page, or empty when there are no more results.
  string next_page_token = 2;
}

// Fetches one locally captured trace.
message GetTraceRequest {
  // W3C trace identifier.
  string trace_id = 1;
  // Optional workspace that the trace must belong to. Omit for the global
  // trace lookup.
  Workspace workspace = 2;
  // Optional operation span selected from a multi-operation distributed trace.
  // When set, the response is scoped to that Query Stream operation and the
  // descendant spans it owns.
  string root_span_id = 3;
}

// One stored trace span.
message TraceSpan {
  // W3C trace identifier.
  string trace_id = 1;
  // W3C span identifier.
  string span_id = 2;
  // Parent span identifier, when known.
  string parent_span_id = 3;
  // Whether the parent span came from a remote context.
  bool parent_span_is_remote = 4;
  // Span display name.
  string name = 5;
  // Span kind, rendered as lowercase text.
  string kind = 6;
  // Span status.
  TraceStatus status = 7;
  // Optional status message for error spans.
  string status_message = 8;
  // Span start time in Unix nanoseconds.
  int64 start_time_unix_nanos = 9 [jstype = JS_STRING];
  // Span end time in Unix nanoseconds.
  int64 end_time_unix_nanos = 10 [jstype = JS_STRING];
  // Span duration in nanoseconds.
  int64 duration_nanos = 11 [jstype = JS_STRING];
  // JSON object of span attributes.
  string attributes_json = 12;
  // JSON payload of span events.
  string events_json = 13;
  // JSON payload of span links.
  string links_json = 14;
  // JSON object of process resource attributes.
  string resource_json = 15;
  // Instrumentation scope name.
  string scope_name = 16;
  // Instrumentation scope version.
  string scope_version = 17;
  // Instrumentation scope schema URL.
  string scope_schema_url = 18;
  // JSON object of instrumentation scope attributes.
  string scope_attributes_json = 19;
  // W3C trace flags.
  int32 trace_flags = 20;
  // W3C trace state header value.
  string trace_state = 21;
  // Whether this span context was remote.
  bool is_remote = 22;
}

// Trace detail for timeline and diagnostic views.
message GetTraceResponse {
  // Summary for the trace.
  TraceSummary summary = 1;
  // Spans ordered by start time.
  repeated TraceSpan spans = 2;
}

// Local trace inspection APIs.
service TraceService {
  // Lists locally captured traces for the trace stream.
  rpc ListTraces(ListTracesRequest) returns (ListTracesResponse);
  // Fetches one trace and its spans for timeline/detail views.
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
}
