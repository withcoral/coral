syntax = "proto3";

package coral.v1;

import "coral/v1/resources.proto";

// Episode lifecycle for trajectory memory (experimental; gated by the `episodes`
// feature). An *episode* is one task-attempt — its queries grouped under one
// intent. `OpenEpisode` registers the intent (and optional parent) against a
// client-minted episode id; every subsequent Coral call then carries only the
// opaque `coral-episode-id` metadata key, so intent never rides tool calls.
service EpisodeService {
  // Registers an episode: records `{ episode_id -> intent, parent }` once, into
  // the per-workspace episode store. Idempotent for an identical
  // `{ episode_id, intent, parent_episode_id }`; the same `episode_id` with a
  // different intent/parent is an error.
  rpc OpenEpisode(OpenEpisodeRequest) returns (OpenEpisodeResponse);
  // Rebuilds the local exact-intent trajectory index and returns the strongest
  // matching golden path for one intent. Experimental and intended for local
  // benchmark validation; returns procedure steps only, never result rows.
  rpc SearchTrajectory(SearchTrajectoryRequest) returns (SearchTrajectoryResponse);
}

// Registers an episode: its intent (and optional parent) keyed by a
// client-minted id. See `EpisodeService.OpenEpisode`.
message OpenEpisodeRequest {
  // Workspace that scopes the episode (per-tenant isolation).
  Workspace workspace = 1;
  // Client-minted, opaque episode id (e.g. a UUID or ULID). Carried on every
  // subsequent call as the `coral-episode-id` gRPC metadata value, so it must be
  // a valid ASCII metadata value: graphic ASCII only (0x21–0x7E — no spaces,
  // control bytes, or non-ASCII) and at most 128 bytes. The server validates and
  // rejects ids outside this contract with `INVALID_ARGUMENT`.
  string episode_id = 2;
  // Natural-language task description — the retrieval handle. Possibly PII;
  // persisted only in the episode store, never on spans, headers, or logs.
  // Required and non-empty, bounded in length; not carried as metadata.
  string intent = 3;
  // Set for a child episode (a sub-task); links to the open parent episode.
  // Empty when there is no parent (a root episode); otherwise the same format
  // contract as `episode_id`.
  string parent_episode_id = 4;
}

// Acknowledgement; intentionally empty for v1.
message OpenEpisodeResponse {}

// Exact-intent trajectory lookup request.
message SearchTrajectoryRequest {
  // Workspace that scopes episode, trace, and trajectory-memory state.
  Workspace workspace = 1;
  // Natural-language task intent to match exactly.
  string intent = 2;
  // Minimum number of episodes that must agree on at least one query shape and
  // on the exact ordered path. Defaults to the server's conservative threshold
  // when unset/zero.
  uint32 min_query_consensus = 3;
}

// One golden-path SQL step. This is a procedure step, not cached output.
message TrajectoryStep {
  // One read-only SQL statement previously observed for this intent.
  string sql = 1;
}

// Golden path distilled from prior episodes with the same exact intent.
message TrajectoryPath {
  // Workspace that scoped the indexed episodes and traces.
  string workspace = 1;
  // Exact natural-language intent for this golden path.
  string intent = 2;
  // Stable hash for the ordered exact-key path.
  string path_key = 3;
  // Ordered SQL procedure steps to rerun.
  repeated TrajectoryStep steps = 4;
  // SQL relations referenced by the golden path.
  repeated string relations = 5;
  // Number of episodes agreeing on at least one query shape for this intent.
  uint32 query_consensus = 6;
  // Number of episodes agreeing on this exact ordered path.
  uint32 path_consensus = 7;
  // Number of episodes indexed for this exact intent.
  uint32 episode_count = 8;
}

// Exact-intent trajectory lookup response.
message SearchTrajectoryResponse {
  // True when `path` passed the consensus gate.
  bool matched = 1;
  // Present only when `matched` is true.
  TrajectoryPath path = 2;
}
