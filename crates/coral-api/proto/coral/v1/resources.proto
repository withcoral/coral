syntax = "proto3";

package coral.v1;

// Workspace resource managed by the local Coral app.
message Workspace {
  // Bare workspace name, such as `default`.
  string name = 1;
}

// Safe metadata returned after credential retrieval completes.
message CredentialMetadata {
  // Metadata key.
  string key = 1;
  // Metadata value.
  string value = 2;
}
