syntax = "proto3";

package coral.v1;

import "coral/v1/catalog.proto";
import "coral/v1/resources.proto";

// Universal Search request for clue routing over Coral metadata and local memory.
message SearchRequest {
  // Workspace whose current search context should be inspected.
  Workspace workspace = 1;
  // User or agent clue to route to likely Coral surfaces. The server trims
  // surrounding whitespace, rejects empty queries, and rejects queries longer
  // than 512 bytes.
  string query = 2;
  // Optional maximum results. Zero applies the API default of 10. Non-zero
  // values must be between 1 and 50 inclusive; larger values are rejected
  // rather than clamped.
  uint32 limit = 3;
}

// Universal Search response with typed, bounded results.
message SearchResponse {
  // Ordered search results.
  repeated SearchResult results = 1;
  // Provider coverage and error disclosure.
  repeated SearchProviderStatus provider_statuses = 2;
  // Result truncation metadata.
  SearchResultTruncation truncation = 3;
}

// Request for effective Universal Search capabilities in one workspace.
message GetSearchCapabilitiesRequest {
  // Workspace whose visible, source-authorised search routes should be inspected.
  Workspace workspace = 1;
}

// Effective Universal Search behavior and a bounded passive route inventory.
message GetSearchCapabilitiesResponse {
  // Whether the process-local provider-fanout feature is effective. Source
  // routes remain inert when this is false.
  bool provider_fanout_enabled = 1;
  // Sorted eligible provider routes that Search may call. At most 16 are returned.
  repeated SearchRouteIdentity eligible_routes = 2;
  // Whether eligible routes were omitted after the response cap.
  bool truncated = 3;
  // Number of eligible routes omitted after the response cap.
  uint32 omitted_route_count = 4;
}

// Safe identity of one resolved, source-authorised Universal Search route.
message SearchRouteIdentity {
  // Installed source that owns the route.
  string installed_source_name = 1;
  // Query-visible schema that owns the resolved function.
  string schema_name = 2;
  // Query-visible function authorised for Universal Search.
  string function_name = 3;
  // Authored route identifier when the source declared an explicit route.
  optional string authored_route_id = 4;
}

// Request to rebuild one or all app-owned local search indexes.
message RebuildSearchIndexRequest {
  // Workspace whose local search data should be rebuilt.
  Workspace workspace = 1;
  // Force a rebuild even when the persisted fingerprint says the projection is current.
  bool force = 2;
  // Provider to rebuild. Unspecified rebuilds all providers.
  SearchIndexProvider provider = 3;
}

// Search index maintenance response.
message RebuildSearchIndexResponse {
  // Maintenance results for rebuilt providers.
  repeated SearchMaintenanceResult results = 1;
}

// Search queue drain request.
message DrainSearchQueueRequest {
  // Workspace whose local search queue should be drained.
  Workspace workspace = 1;
  // Optional per-request drain budget in milliseconds. Zero applies the server
  // default; values above 60000 are rejected.
  uint32 budget_ms = 2;
}

// Search queue drain response.
message DrainSearchQueueResponse {
  // Per-provider maintenance results.
  repeated SearchMaintenanceResult results = 1;
}

// Search data removal request.
message ClearSearchDataRequest {
  // Workspace whose local search data should be removed.
  Workspace workspace = 1;
  // Data scope to remove.
  SearchDataScope scope = 2;
  // Removal target.
  SearchClearTarget target = 3;
}

// Search data removal response.
message ClearSearchDataResponse {
  // Maintenance results for the affected providers.
  repeated SearchMaintenanceResult results = 1;
  // Best-effort local storage cleanup after data removal.
  SearchStorageCleanupResult storage_cleanup = 2;
}

// Search index provider selection for maintenance.
enum SearchIndexProvider {
  // Unknown index provider.
  SEARCH_INDEX_PROVIDER_UNSPECIFIED = 0;
  // Catalog metadata provider.
  SEARCH_INDEX_PROVIDER_CATALOG = 1;
  // Observed-value provider.
  SEARCH_INDEX_PROVIDER_OBSERVED_VALUES = 2;
  // All search-index providers.
  SEARCH_INDEX_PROVIDER_ALL = 3;
}

// Search data scope for destructive maintenance.
enum SearchDataScope {
  // Unknown data scope.
  SEARCH_DATA_SCOPE_UNSPECIFIED = 0;
  // Observed-value search data.
  SEARCH_DATA_SCOPE_OBSERVED_VALUES = 1;
  // All local search data for the target.
  SEARCH_DATA_SCOPE_ALL = 2;
}

// Target for destructive search-data maintenance.
message SearchClearTarget {
  // Workspace target selected for the clear operation.
  oneof target {
    // Clear the selected scope for the whole workspace.
    bool workspace = 1;
    // Clear the selected local search-data scope for one source.
    string source_name = 2;
  }
}

// Outcome of one provider maintenance step.
message SearchMaintenanceResult {
  // Provider that handled this maintenance step.
  SearchProvider provider = 1;
  // Outcome of the maintenance step.
  SearchMaintenanceState state = 2;
  // Human-readable note.
  string note = 3;
  // Provider-specific maintenance detail.
  oneof detail {
    // Catalog rebuild detail.
    CatalogRebuildResult catalog_rebuild = 10;
    // Catalog clear detail.
    CatalogClearResult catalog_clear = 11;
    // Observed-value queue drain detail.
    ObservedDrainResult observed_drain = 12;
    // Observed-value FTS rebuild detail.
    ObservedRebuildResult observed_rebuild = 13;
    // Observed-value clear detail.
    ObservedClearResult observed_clear = 14;
  }
}

// State of one maintenance step.
enum SearchMaintenanceState {
  // Unknown maintenance state.
  SEARCH_MAINTENANCE_STATE_UNSPECIFIED = 0;
  // The requested maintenance work completed.
  SEARCH_MAINTENANCE_STATE_COMPLETED = 1;
  // No work was needed because the maintained state was already current.
  SEARCH_MAINTENANCE_STATE_NOOP = 2;
  // The maintenance step was intentionally skipped.
  SEARCH_MAINTENANCE_STATE_SKIPPED = 3;
  // Only part of the requested maintenance work completed.
  SEARCH_MAINTENANCE_STATE_PARTIAL = 4;
  // The maintenance step failed without failing the enclosing request.
  SEARCH_MAINTENANCE_STATE_FAILED = 5;
}

// Catalog rebuild detail.
message CatalogRebuildResult {
  // Document rows present before rebuild.
  uint32 old_document_count = 1;
  // Document rows present after rebuild.
  uint32 new_document_count = 2;
  // Whether the catalog fingerprint differed from the snapshot being rebuilt.
  bool projection_changed = 3;
  // Whether a delete-and-reinsert rebuild was performed.
  bool rebuild_performed = 4;
}

// Catalog clear detail.
message CatalogClearResult {
  // Catalog document rows deleted from the workspace projection.
  uint32 deleted_document_count = 1;
}

// Observed-value queue drain detail.
message ObservedDrainResult {
  // Queue jobs successfully projected.
  uint32 queue_jobs_processed = 1;
  // Queue jobs skipped because a newer workspace or source generation
  // superseded them.
  uint32 stale_jobs_skipped = 2;
  // Queue jobs whose projection failed during this drain pass; they may be
  // retried or dead-lettered if the retry cap was reached.
  uint32 failed_jobs = 3;
  // Canonical observed-value rows inserted or updated.
  uint32 canonical_rows_upserted = 4;
  // FTS rows written for observed-value search.
  uint32 fts_rows_written = 5;
  // Queue jobs still pending after this drain pass.
  uint32 remaining_queue_depth = 6;
  // Whether the drain stopped because its budget expired.
  bool budget_exhausted = 7;
  // Canonical observed-value rows removed by ordinary retention maintenance.
  uint32 stale_rows_purged = 8;
  // Oldest canonical observed-value rows evicted to enforce the storage ceiling.
  uint32 evicted_rows = 9;
  // Whether observed-value storage remains above its configured ceiling.
  bool storage_limit_reached = 10;
  // Queue jobs omitted because projecting them would exceed the storage ceiling.
  uint32 storage_jobs_dropped = 11;
}

// Observed-value FTS rebuild detail.
message ObservedRebuildResult {
  // Canonical observed-value rows scanned.
  uint32 canonical_rows_scanned = 1;
  // FTS rows rebuilt.
  uint32 fts_rows_rebuilt = 2;
  // Queue drainage and storage-governance work completed before the rebuild.
  ObservedDrainResult drain = 3;
}

// Observed-value clear detail.
message ObservedClearResult {
  // Canonical observed-value rows deleted.
  uint32 deleted_value_count = 1;
  // Observed-value FTS rows deleted.
  uint32 deleted_fts_count = 2;
  // Observed-value queue jobs deleted.
  uint32 deleted_queue_job_count = 3;
}

// Best-effort local storage cleanup after destructive maintenance.
message SearchStorageCleanupResult {
  // Outcome of the cleanup step.
  SearchMaintenanceState state = 1;
  // Human-readable cleanup note.
  string note = 2;
}

// Result truncation metadata.
message SearchResultTruncation {
  // Whether more results were available than returned.
  bool truncated = 1;
  // Number of results returned in this response.
  uint32 returned_count = 2;
  // Applied maximum result count.
  uint32 max_results = 3;
  // Human-readable truncation note.
  string note = 4;
}

// Backing provider status for a search response.
message SearchProviderStatus {
  // Provider name.
  SearchProvider provider = 1;
  // Provider state for this request.
  SearchProviderState state = 2;
  // Short coverage or error note.
  string note = 3;
  // Structured provider-local coverage for this request. Absent when the provider is not enabled or skipped.
  SearchProviderCoverage coverage = 4;
  // Bounded per-function or route-resolution diagnostics for native fanout.
  repeated NativeSearchDiagnostic diagnostics = 5;
  // Whether native fanout diagnostics were truncated.
  bool diagnostics_truncated = 6;
  // Number of native fanout diagnostics omitted after the diagnostic cap.
  uint32 omitted_diagnostic_count = 7;
}

// One bounded native fanout diagnostic.
message NativeSearchDiagnostic {
  // Source that owns the route and its query-visible function.
  string source_name = 1;
  reserved 2;
  reserved "installed_source_name", "schema_name";
  // Query-visible function when the route resolved to a runtime function.
  optional string function_name = 3;
  // Source-authored route identifier when the source declared one.
  optional string authored_route_id = 4;
  // Outcome state for this function or unresolved route.
  NativeSearchDiagnosticState state = 5;
  // Stable, provider-independent reason category.
  NativeSearchDiagnosticReason reason = 6;
  // Elapsed execution time in milliseconds.
  uint64 elapsed_ms = 7;
  // Safe display candidates produced by this function.
  uint32 safe_candidate_count = 8;
  // Whether upstream continuation or total metadata explicitly reported more results.
  bool has_more = 9;
}

// Outcome state for one native fanout function or unresolved route.
enum NativeSearchDiagnosticState {
  // Unknown diagnostic state.
  NATIVE_SEARCH_DIAGNOSTIC_STATE_UNSPECIFIED = 0;
  // The function returned one or more safe display candidates.
  NATIVE_SEARCH_DIAGNOSTIC_STATE_RESULTS_FOUND = 1;
  // The function completed without a safe display candidate.
  NATIVE_SEARCH_DIAGNOSTIC_STATE_EMPTY = 2;
  // The route was not attempted.
  NATIVE_SEARCH_DIAGNOSTIC_STATE_SKIPPED = 3;
  // The function reached its deadline.
  NATIVE_SEARCH_DIAGNOSTIC_STATE_TIMED_OUT = 4;
  // The function was cancelled.
  NATIVE_SEARCH_DIAGNOSTIC_STATE_CANCELLED = 5;
  // The route or function failed.
  NATIVE_SEARCH_DIAGNOSTIC_STATE_ERROR = 6;
}

// Stable reason category for one native fanout diagnostic.
enum NativeSearchDiagnosticReason {
  // Unknown diagnostic reason.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_UNSPECIFIED = 0;
  // The source did not authorize this route.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_NOT_AUTHORIZED = 1;
  // More than one route matched where exactly one was required.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_AMBIGUOUS_ROUTE = 2;
  // The route's search limits were missing or invalid.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_INVALID_SEARCH_LIMITS = 3;
  // The query could not be mapped to the selected input.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_QUERY_INPUT_UNMAPPABLE = 4;
  // A required non-query argument had no valid default.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_MISSING_ARGUMENT_DEFAULT = 5;
  // The resolved route no longer matched current installed source state.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_ROUTE_STALE = 6;
  // The selected operation was not proven retrieval-only and idempotent.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_UNSAFE_OPERATION = 7;
  // Returned rows contained no safe display fields.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_NO_SAFE_DISPLAY_FIELDS = 8;
  // The route was omitted by the per-request fanout cap.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_FANOUT_LIMIT_REACHED = 9;
  // Too little request budget remained to start the function.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_INSUFFICIENT_BUDGET = 10;
  // The absolute native fanout budget expired.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_GLOBAL_BUDGET_EXHAUSTED = 11;
  // The function reached its per-call timeout.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_CALL_TIMEOUT = 12;
  // The function was cancelled before completion.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_CANCELLED = 13;
  // The upstream provider rate-limited the call.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_RATE_LIMITED = 14;
  // Authentication or permission checks rejected the call.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_AUTH_OR_PERMISSION_FAILED = 15;
  // The upstream provider was unavailable.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_UPSTREAM_UNAVAILABLE = 16;
  // The upstream response could not be decoded under the source contract.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_INVALID_RESPONSE = 17;
  // The selected function failed during execution.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_EXECUTION_FAILED = 18;
  // The backend could not satisfy the required cancellation contract.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_UNSUPPORTED_CANCELLATION = 19;
  // Coral encountered an internal native fanout failure.
  NATIVE_SEARCH_DIAGNOSTIC_REASON_INTERNAL_ERROR = 20;
}

// Structured provider-local coverage for one request.
message SearchProviderCoverage {
  // Units the provider considered eligible for this request.
  uint32 eligible_units = 1;
  // Units the provider actually searched for this request.
  uint32 searched_units = 2;
  // Units that failed while this provider ran.
  uint32 failed_units = 3;
  // Candidates returned by the provider before global fusion/truncation.
  uint32 returned_count = 4;
  // Whether the provider had more candidates than its local retrieval window.
  bool has_more = 5;
  // Whether the provider stopped because its maintenance/search budget expired.
  bool budget_exhausted = 6;
  // Whether the provider timed out.
  bool timed_out = 7;
  // Whether the provider served from stale or partially refreshed local state.
  bool stale_index = 8;
}

// Universal Search backing providers.
enum SearchProvider {
  // Unknown provider.
  SEARCH_PROVIDER_UNSPECIFIED = 0;
  // Catalog metadata provider.
  SEARCH_PROVIDER_CATALOG_METADATA = 1;
  // Local observed-value provider.
  SEARCH_PROVIDER_OBSERVED_VALUES = 2;
  // Active provider-native fanout provider.
  SEARCH_PROVIDER_NATIVE_FANOUT = 3;
}

// Provider state for one request.
enum SearchProviderState {
  // Unknown provider state.
  SEARCH_PROVIDER_STATE_UNSPECIFIED = 0;
  // Provider returned one or more results.
  SEARCH_PROVIDER_STATE_RESULTS_FOUND = 1;
  // Provider ran and returned no results.
  SEARCH_PROVIDER_STATE_EMPTY = 2;
  // Provider is not enabled.
  SEARCH_PROVIDER_STATE_NOT_ENABLED = 3;
  // Provider was skipped for this request.
  SEARCH_PROVIDER_STATE_SKIPPED = 4;
  // Provider returned partial results.
  SEARCH_PROVIDER_STATE_PARTIAL = 5;
  // Provider failed for this request.
  SEARCH_PROVIDER_STATE_ERROR = 6;
}

// One typed Universal Search result.
message SearchResult {
  // Provider that produced this result.
  SearchProvider provider = 1;
  // Typed result payload.
  oneof payload {
    // Table or table-function metadata hit with search context.
    CatalogMetadata catalog_metadata = 10;
    // Column, filter, argument, or result-column hint.
    ColumnHint column_hint = 11;
    // Local observed-value hit. Reserved for the observed-value provider.
    ObservedValue observed_value = 12;
    // Compact provider-native result preview.
    NativeSearchResult native_result = 13;
  }
}

// Compact provider-native result preview.
message NativeSearchResult {
  // Query-visible source schema.
  string schema_name = 1;
  // Query-visible table-function name.
  string function_name = 2;
  // Zero-based provider result order.
  uint32 row_ordinal = 3;
  // Source-authored entity type when available.
  optional string entity_type = 4;
  // Safe provider identifier when available.
  optional string provider_id = 5;
  // Compact display title when available.
  optional string title = 6;
  // Sanitized absolute HTTP or HTTPS URL when available.
  optional string url = 7;
  // Compact display text when available.
  optional string snippet = 8;
  // Bounded source-authored display attributes.
  repeated NativeSearchAttribute attributes = 9;
  // Safe selected attributes omitted by count or size limits.
  uint32 omitted_attribute_count = 10;
  // Whether safe display content was truncated or omitted by count or size limits.
  bool content_truncated = 11;
}

// One bounded provider-native display attribute.
message NativeSearchAttribute {
  // Safe display name.
  string name = 1;
  // Safe display value.
  string display_value = 2;
}

// Table or table-function metadata hit with search-specific context.
message CatalogMetadata {
  // Matched catalog item.
  CatalogItem item = 1;
  // Metadata fields that matched the query.
  repeated string matched_fields = 2;
  // Compact table column hints for ordinary table hits.
  SearchTableColumnPreview table_column_preview = 3;
}

// Compact column hints for an ordinary table metadata hit.
message SearchTableColumnPreview {
  // Total column count for the table before preview capping.
  uint32 column_count = 1;
  // Capped columns selected for query-writing orientation.
  repeated SearchTableColumnPreviewColumn columns = 2;
  // Number of table columns not included in the capped preview.
  uint32 omitted_column_count = 3;
}

// One compact column hint in a table metadata hit preview.
message SearchTableColumnPreviewColumn {
  // Column name as exposed by the query engine.
  string name = 1;
  // The DataFusion/Arrow data type rendered as text.
  string data_type = 2;
  // Whether the column must be constrained before querying the table.
  bool is_required_filter = 3;
  // Human-readable column description.
  string description = 4;
  // Column metadata fields that matched the query.
  repeated string matched_fields = 5;
}

// Surface kind for a column-style hint.
enum SearchSurfaceKind {
  // Unknown surface kind.
  SEARCH_SURFACE_KIND_UNSPECIFIED = 0;
  // Table surface.
  SEARCH_SURFACE_KIND_TABLE = 1;
  // Table-function surface.
  SEARCH_SURFACE_KIND_TABLE_FUNCTION = 2;
}

// Role of a field-style hint on its owning surface.
enum SearchFieldRole {
  // Unknown field role.
  SEARCH_FIELD_ROLE_UNSPECIFIED = 0;
  // Ordinary table column.
  SEARCH_FIELD_ROLE_TABLE_COLUMN = 1;
  // Required or optional table filter.
  SEARCH_FIELD_ROLE_TABLE_FILTER = 2;
  // Table-function argument.
  SEARCH_FIELD_ROLE_TABLE_FUNCTION_ARGUMENT = 3;
  // Table-function result column.
  SEARCH_FIELD_ROLE_TABLE_FUNCTION_RESULT_COLUMN = 4;
}

// A field-level hint that may hold or accept the query clue.
message ColumnHint {
  // Source schema that owns the surface.
  string schema_name = 1;
  // Table or table-function name.
  string surface_name = 2;
  // Whether the owning surface is a table or table function.
  SearchSurfaceKind surface_kind = 3;
  // Column, required filter, argument, or result-column name.
  string name = 4;
  // Data type when known.
  string data_type = 5;
  // Whether this field must be supplied or constrained.
  bool required = 6;
  // Human-readable field description.
  string description = 7;
  // Metadata fields that matched the query.
  repeated string matched_fields = 8;
  // How the field should be used when querying the owning surface.
  SearchFieldRole field_role = 9;
}

// Local observed-value result.
message ObservedValue {
  // Matched observed value.
  string value = 1;
  // Source schema where the value was observed.
  string schema_name = 2;
  // Table or function where the value was observed.
  string surface_name = 3;
  // Column that produced the value.
  string column_name = 4;
  // Whether the owning surface is a table or table function.
  SearchSurfaceKind surface_kind = 5;
  // Field path where the value was observed.
  string field_path = 6;
  // Number of times this field/value pair has been observed.
  uint64 observed_count = 7;
  // RFC3339 timestamp when this field/value pair was most recently observed.
  string last_observed_at = 8;
}


// Universal Search APIs.
service SearchService {
  // Routes a clue to typed Coral search hints.
  rpc Search(SearchRequest) returns (SearchResponse);
  // Returns effective feature state and a bounded passive route inventory.
  rpc GetSearchCapabilities(GetSearchCapabilitiesRequest) returns (GetSearchCapabilitiesResponse);
  // Rebuilds app-owned local search index projections.
  rpc RebuildSearchIndex(RebuildSearchIndexRequest) returns (RebuildSearchIndexResponse);
  // Drains app-owned local search queues into queryable projections.
  rpc DrainSearchQueue(DrainSearchQueueRequest) returns (DrainSearchQueueResponse);
  // Clears app-owned local search data for a workspace-scoped target.
  rpc ClearSearchData(ClearSearchDataRequest) returns (ClearSearchDataResponse);
}
