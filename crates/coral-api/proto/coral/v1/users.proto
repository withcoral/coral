syntax = "proto3";

package coral.v1;

// A user known to this Coral server.
message User {
  // Stable internal user identifier.
  string user_id = 1;
  // Configured display name, or empty when unavailable.
  string display_name = 2;
}

// Lists users known to this Coral server.
message ListUsersRequest {}

// Returns users known to this Coral server.
message ListUsersResponse {
  // Known users.
  repeated User users = 1;
}

// Gets the authenticated user.
message GetCurrentUserRequest {}

// Returns the authenticated user's identity.
message GetCurrentUserResponse {
  reserved 2;
  reserved "default_workspace";

  // Authenticated user.
  User user = 1;
}

// User directory and current-user APIs.
service UserService {
  // Lists users known to this Coral server.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Gets the authenticated user's identity.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
}
