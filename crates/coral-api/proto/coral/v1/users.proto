syntax = "proto3";

package coral.v1;

import "coral/v1/resources.proto";

// A user known to this Coral server.
message User {
  // Stable internal user identifier.
  string user_id = 1;
  // Configured display name, or empty when unavailable.
  string display_name = 2;
}

// Lists users known to this Coral server.
message ListUsersRequest {}

// Returns users known to this Coral server.
message ListUsersResponse {
  // Known users.
  repeated User users = 1;
}

// Gets the authenticated user.
message GetCurrentUserRequest {}

// Returns the authenticated user and their personal default workspace.
message GetCurrentUserResponse {
  // Authenticated user.
  User user = 1;
  // Personal default workspace derived by Coral.
  Workspace default_workspace = 2;
}

// User directory and current-user APIs.
service UserService {
  // Lists users known to this Coral server.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Gets the authenticated user and their personal default workspace.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
}
