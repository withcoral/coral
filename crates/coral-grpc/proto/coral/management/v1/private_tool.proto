syntax = "proto3";
package coral.management.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Inspection and deletion of the calling User's own current Private Tools.
//
// A Private Tool Path names a definition only for its owning Principal in
// one Workspace, so requests carry the Workspace and path rather than a
// resource name. Another Principal's Private Tool and an absent path return the
// same NOT_FOUND. Workspace-owned Agent Private Tools never appear.
service PrivateToolService {
  // Lists one page of the caller's own Private Tools in path order, without source or diagnostics.
  rpc ListPrivateTools(ListPrivateToolsRequest) returns (ListPrivateToolsResponse);
  // Returns one of the caller's own Private Tools with its source and saved diagnostics.
  rpc GetPrivateTool(GetPrivateToolRequest) returns (PrivateTool);
  // Deletes one of the caller's own Private Tools and records its lifecycle Event.
  // Coral keeps no reverse references: Programs that call the path fail at admission.
  rpc DeletePrivateTool(DeletePrivateToolRequest) returns (google.protobuf.Empty);
}

// Lists the caller's own current Private Tools in one Workspace.
message ListPrivateToolsRequest {
  // workspaces/{workspace}.
  string parent = 1;
  // Maximum results, bounded to 100; zero selects the default.
  int32 page_size = 2;
  // Opaque continuation from the preceding page in this scope.
  string page_token = 3;
}

// One scoped page of source-free Private Tool summaries in path order.
message ListPrivateToolsResponse {
  // The caller's own Private Tools on this page.
  repeated PrivateToolSummary private_tools = 1;
  // Empty when no further page remains.
  string next_page_token = 2;
  // The Workspace's Private Provider, workspaces/{workspace}/providers/{provider}.
  // ToolPolicyService lists and sets the policy of these Private Tools under it.
  string private_provider = 3;
}

// Source-free summary of one current Private Tool.
message PrivateToolSummary {
  // Private Tool Path relative to coral.private.
  string path = 1;
  // Exact authored description.
  string description = 2;
  // Occurrence time of the latest accepted save.
  google.protobuf.Timestamp update_time = 3;
}

// Reads one of the caller's own current Private Tools.
message GetPrivateToolRequest {
  // workspaces/{workspace}.
  string parent = 1;
  // Private Tool Path relative to coral.private.
  string path = 2;
}

// Deletes one of the caller's own current Private Tools.
message DeletePrivateToolRequest {
  // workspaces/{workspace}.
  string parent = 1;
  // Private Tool Path relative to coral.private.
  string path = 2;
}

// One current Private Tool with its authoring material.
message PrivateTool {
  // Private Tool Path relative to coral.private.
  string path = 1;
  // Exact authored description.
  string description = 2;
  // Self-contained TypeScript declaration emitted from the source.
  string declaration = 3;
  // Exact authored TypeScript source.
  string source = 4;
  // Advisory diagnostics retained from the latest accepted save.
  repeated PrivateToolDiagnostic diagnostics = 5;
  // True when Coral omitted diagnostics beyond its retention bound.
  bool diagnostics_truncated = 6;
  // Occurrence time of the latest accepted save.
  google.protobuf.Timestamp update_time = 7;
}

// Category of one advisory TypeScript diagnostic.
enum PrivateToolDiagnosticCategory {
  // Not supplied or not recognized by this client.
  PRIVATE_TOOL_DIAGNOSTIC_CATEGORY_UNSPECIFIED = 0;
  // Informational compiler message.
  PRIVATE_TOOL_DIAGNOSTIC_CATEGORY_MESSAGE = 1;
  // Non-blocking warning.
  PRIVATE_TOOL_DIAGNOSTIC_CATEGORY_WARNING = 2;
  // Strict semantic error retained without rejecting the save.
  PRIVATE_TOOL_DIAGNOSTIC_CATEGORY_ERROR = 3;
  // Non-blocking authoring suggestion.
  PRIVATE_TOOL_DIAGNOSTIC_CATEGORY_SUGGESTION = 4;
}

// One bounded advisory diagnostic retained with an accepted save.
message PrivateToolDiagnostic {
  // Diagnostic category.
  PrivateToolDiagnosticCategory category = 1;
  // Official TypeScript diagnostic code.
  uint64 code = 2;
  // Bounded compiler message.
  string message = 3;
  // One-based source line, when known.
  optional uint64 line = 4;
  // One-based source column, when known.
  optional uint64 column = 5;
}
