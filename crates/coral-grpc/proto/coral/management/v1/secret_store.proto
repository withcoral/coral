syntax = "proto3";
package coral.management.v1;

import "coral/management/v1/workspace.proto";

// The Secret Stores the operator defined in deployment config, and their grants
// to Workspaces. A grant shows an Organization Owner nothing inside a Workspace.
service SecretStoreService {
  // Lists every defined store, ordered by name, for an Organization Owner.
  rpc ListSecretStores(ListSecretStoresRequest) returns (ListSecretStoresResponse);
  // Lists every grant in the Organization, ordered by store, for an Organization Owner.
  rpc ListSecretStoreGrants(ListSecretStoreGrantsRequest) returns (ListSecretStoreGrantsResponse);
  // Lists the stores granted to one Workspace, ordered by name, for its Owner.
  rpc ListWorkspaceSecretStores(ListWorkspaceSecretStoresRequest) returns (ListWorkspaceSecretStoresResponse);
  // Grants a defined store to an active Workspace, for an Organization Owner.
  rpc GrantSecretStore(GrantSecretStoreRequest) returns (GrantSecretStoreResponse);
  // Revokes a grant in an active Workspace, for an Organization Owner.
  rpc RevokeSecretStore(RevokeSecretStoreRequest) returns (RevokeSecretStoreResponse);
}

// Owner-only request. Config bounds the list, so it has no pages.
message ListSecretStoresRequest {}

// Every defined store.
message ListSecretStoresResponse {
  // Ordered by name.
  repeated SecretStore secret_stores = 1;
}

// One defined store: what it is called, never how Coral reaches it.
message SecretStore {
  // Canonical immutable name: secretStores/{store}.
  string name = 1;
  // Which secrets system it connects to.
  SecretStoreKind kind = 2;
}

// Owner-only request. Config and the Workspace count bound the list, so it has no pages.
message ListSecretStoreGrantsRequest {}

// Every grant in the Organization.
message ListSecretStoreGrantsResponse {
  // Ordered by store, then Workspace.
  repeated SecretStoreGrant grants = 1;
}

// One store granted to one Workspace: what governance may already see of it.
message SecretStoreGrant {
  // Canonical Workspace name: workspaces/{workspace}.
  string workspace = 1;
  // Mutable human label.
  string workspace_display_name = 2;
  // Current lifecycle state. Only an active Workspace takes a change.
  WorkspaceState workspace_state = 3;
  // The store the grant names.
  GrantedSecretStore secret_store = 4;
}

// A store a grant names, as deployment config defines it now.
message GrantedSecretStore {
  // Canonical immutable name: secretStores/{store}.
  string name = 1;
  // Which secrets system it connects to. Unspecified while it is unavailable.
  SecretStoreKind kind = 2;
  // False when config does not define the store: the grant is kept, and gives nothing.
  bool available = 3;
}

// Workspace Owner request. Config bounds the list, so it has no pages.
message ListWorkspaceSecretStoresRequest {
  // Canonical Workspace name.
  string parent = 1;
}

// The stores granted to one Workspace.
message ListWorkspaceSecretStoresResponse {
  // Ordered by name.
  repeated GrantedSecretStore secret_stores = 1;
}

// Grant one store. Granting a store again changes nothing.
message GrantSecretStoreRequest {
  // Canonical Workspace name. The Workspace must be active.
  string workspace = 1;
  // secretStores/{store}. Config must define it.
  string secret_store = 2;
  // First-party UUID. Reuse cannot grant again after a revocation.
  string request_id = 3;
}

// An accepted grant.
message GrantSecretStoreResponse {}

// Revoke one grant, even when config no longer defines its store. Revoking a
// store with no grant changes nothing.
message RevokeSecretStoreRequest {
  // Canonical Workspace name. The Workspace must be active.
  string workspace = 1;
  // secretStores/{store}.
  string secret_store = 2;
  // First-party UUID. Reuse cannot revoke again after a new grant.
  string request_id = 3;
}

// An accepted revocation.
message RevokeSecretStoreResponse {}

// Which secrets system a store connects to.
enum SecretStoreKind {
  // Unknown to this client.
  SECRET_STORE_KIND_UNSPECIFIED = 0;
  // HashiCorp Vault or OpenBao KV version 2.
  SECRET_STORE_KIND_KV_V2 = 1;
}
