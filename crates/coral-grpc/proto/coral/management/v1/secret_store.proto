syntax = "proto3";
package coral.management.v1;

// The Secret Stores the operator defined in deployment config.
service SecretStoreService {
  // Lists every defined store, ordered by name, for an Organization Owner.
  rpc ListSecretStores(ListSecretStoresRequest) returns (ListSecretStoresResponse);
}

// Owner-only request. Config bounds the list, so it has no pages.
message ListSecretStoresRequest {}

// Every defined store.
message ListSecretStoresResponse {
  // Ordered by name.
  repeated SecretStore secret_stores = 1;
}

// One defined store: what it is called, never how Coral reaches it.
message SecretStore {
  // Canonical immutable name: secretStores/{store}.
  string name = 1;
  // Which secrets system it connects to.
  SecretStoreKind kind = 2;
}

// Which secrets system a store connects to.
enum SecretStoreKind {
  // Unknown to this client.
  SECRET_STORE_KIND_UNSPECIFIED = 0;
  // HashiCorp Vault or OpenBao KV version 2.
  SECRET_STORE_KIND_KV_V2 = 1;
}
