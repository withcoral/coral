syntax = "proto3";
package coral.management.v1;

// The Secret Stores the operator defined in deployment config.
service SecretStoreService {
  // Lists every defined store, ordered by name, for an Organization Owner.
  rpc ListSecretStores(ListSecretStoresRequest) returns (ListSecretStoresResponse);
}

// Owner-only request. Config bounds the list, so it has no pages.
message ListSecretStoresRequest {}

// Every defined store.
message ListSecretStoresResponse {
  // Ordered by name.
  repeated SecretStore secret_stores = 1;
}

// One defined store: what it is called, never how Coral reaches it.
message SecretStore {
  // Canonical immutable name: secretStores/{store}.
  string name = 1;
  // The kind's token in deployment config, such as `kv-v2`.
  string kind = 2;
  // What people call the kind, such as "Vault KV v2". A kind this build
  // lacks shows its token.
  string kind_label = 3;
  // Whether Coral can read from the store right now.
  SecretStoreState state = 4;
}

// Whether Coral can read from a store right now. Reads still decide.
enum SecretStoreState {
  // Unknown to this client.
  SECRET_STORE_STATE_UNSPECIFIED = 0;
  // Reads go to the store.
  SECRET_STORE_STATE_AVAILABLE = 1;
  // The kind is an Enterprise Feature and the Edition is Community.
  SECRET_STORE_STATE_NEEDS_ENTERPRISE = 2;
  // This build cannot read this kind of store.
  SECRET_STORE_STATE_KIND_MISSING = 3;
}
