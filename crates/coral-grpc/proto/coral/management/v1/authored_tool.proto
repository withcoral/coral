syntax = "proto3";

package coral.management.v1;

// What Private Tools and Shared Tools share: both are Tools that Coral
// performs from authored TypeScript source.

// Category of one advisory TypeScript diagnostic.
enum AuthoredToolDiagnosticCategory {
  // Not supplied or not recognized by this client.
  AUTHORED_TOOL_DIAGNOSTIC_CATEGORY_UNSPECIFIED = 0;
  // Informational compiler message.
  AUTHORED_TOOL_DIAGNOSTIC_CATEGORY_MESSAGE = 1;
  // Non-blocking warning.
  AUTHORED_TOOL_DIAGNOSTIC_CATEGORY_WARNING = 2;
  // Strict semantic error retained without rejecting the save or publish.
  AUTHORED_TOOL_DIAGNOSTIC_CATEGORY_ERROR = 3;
  // Non-blocking authoring suggestion.
  AUTHORED_TOOL_DIAGNOSTIC_CATEGORY_SUGGESTION = 4;
}

// One bounded advisory diagnostic retained with an accepted Private Tool
// save or Shared Tool Publish.
message AuthoredToolDiagnostic {
  // Diagnostic category.
  AuthoredToolDiagnosticCategory category = 1;
  // Official TypeScript diagnostic code.
  uint64 code = 2;
  // Bounded compiler message.
  string message = 3;
  // One-based source line, when known.
  optional uint64 line = 4;
  // One-based source column, when known.
  optional uint64 column = 5;
}
