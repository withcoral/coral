[package]
name = "coral-sign-in"
description = "The sign-in mode: how a build adds a way to sign people in."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# The test mode, for tests of the contract and of core. Only dev-dependencies
# enable it.
test-support = ["dep:tracing"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
coral-db.workspace = true
coral-edition.workspace = true
serde.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
