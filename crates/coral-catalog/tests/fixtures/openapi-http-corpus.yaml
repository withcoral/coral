openapi: 3.1.0
info:
  title: Coral HTTP architecture corpus
  version: "1"
servers:
  - url: https://api.example.test/v1
paths:
  /repos/{owner}/{repo}/issues:
    get:
      operationId: issues/list-for-repo
      summary: List repository issues
      parameters:
        - $ref: "#/components/parameters/Owner"
        - $ref: "#/components/parameters/Repo"
        - name: labels
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Issues
          headers:
            Link:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
        "422":
          $ref: "#/components/responses/ValidationFailure"
  /customers:
    get:
      operationId: customers/list
      parameters:
        - name: created
          in: query
          style: deepObject
          explode: true
          schema:
            oneOf:
              - type: integer
              - type: object
                properties:
                  gt:
                    type: integer
                  lt:
                    type: integer
        - name: expand
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: starting_after
          in: query
          schema:
            type: string
        - name: ending_before
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
    post:
      operationId: customers/create
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
            encoding:
              metadata:
                style: deepObject
                explode: true
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailure"
  /repos/{owner}/{repo}/contents/{path}:
    get:
      operationId: repos/get-content
      parameters:
        - $ref: "#/components/parameters/Owner"
        - $ref: "#/components/parameters/Repo"
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Content
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContentFile"
                  - type: array
                    items:
                      $ref: "#/components/schemas/ContentFile"
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to content
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "304":
          description: Not modified
  /markdown/raw:
    post:
      operationId: markdown/render-raw
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          text/x-markdown:
            schema:
              type: string
      responses:
        "200":
          description: Rendered HTML
          headers:
            X-CommonMarker-Version:
              schema:
                type: string
          content:
            text/html; charset=utf-8:
              schema:
                type: string
  /releases/assets:
    post:
      operationId: repos/upload-release-asset
      servers:
        - url: https://uploads.example.test
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "502":
          description: Upstream upload failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /user/avatar:
    put:
      operationId: users/update-avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                note:
                  type: string
            encoding:
              avatar:
                contentType: image/png, image/jpeg
                headers:
                  X-Part-Name:
                    schema:
                      type: string
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /drives/{drive}/items/{item}/content:
    get:
      operationId: drives/get-item-content
      parameters:
        - name: drive
          in: path
          required: true
          schema:
            type: string
        - name: item
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Content bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Preauthenticated download
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
    delete:
      operationId: drives/delete-item-content
      parameters:
        - name: drive
          in: path
          required: true
          schema:
            type: string
        - name: item
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          schema:
            type: string
      responses:
        "204":
          description: Content deleted
        "412":
          description: Condition failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /code-scanning/sarifs:
    post:
      operationId: code-scanning/upload-sarif
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SarifUpload"
      responses:
        "202":
          description: Accepted receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SarifReceipt"
        "400":
          $ref: "#/components/responses/ValidationFailure"
        "413":
          description: Too large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /code-scanning/sarifs/{sarif_id}:
    get:
      operationId: code-scanning/get-sarif
      parameters:
        - name: sarif_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Processing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SarifStatus"
  /unsupported:
    get:
      operationId: unsupported/serialization
      parameters:
        - name: matrix-query
          in: query
          style: matrix
          schema:
            type: object
      responses:
        "200":
          description: Structurally unsupported
components:
  parameters:
    Owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationFailure:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Issue:
      type: object
      required: [id, state]
      properties:
        id:
          type: integer
          minimum: 1
          format: int64
        state:
          enum: [open, closed]
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/User"
        parent:
          anyOf:
            - $ref: "#/components/schemas/Issue"
            - type: "null"
    User:
      type: object
      required: [id, login]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
          pattern: "^[A-Za-z0-9-]+$"
        write_token:
          type: string
          writeOnly: true
    Customer:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [email]
          properties:
            email:
              type: [string, "null"]
              format: email
            secret:
              type: string
              writeOnly: true
    CustomerList:
      type: object
      required: [data, has_more, object, url]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        has_more:
          type: boolean
        object:
          const: list
        url:
          type: string
    CustomerCreate:
      type: object
      properties:
        email:
          type: string
        server_id:
          type: string
          readOnly: true
        metadata:
          type: object
          patternProperties:
            "^[A-Za-z0-9_]+$":
              type: string
          additionalProperties: false
        expand:
          type: array
          items:
            type: string
    ContentFile:
      type: object
      required: [type, name]
      properties:
        type:
          const: file
        name:
          type: string
        content:
          type: [string, "null"]
        coordinates:
          prefixItems:
            - type: number
            - type: number
          items: false
          type: array
    Asset:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        digest:
          type: [string, "null"]
    Problem:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 1024
        details:
          type: object
          additionalProperties: true
    SarifUpload:
      type: object
      required: [commit_sha, sarif]
      properties:
        commit_sha:
          type: string
        sarif:
          type: string
        tool_name:
          type: string
          default: coral
    SarifReceipt:
      type: object
      required: [id]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
    SarifStatus:
      type: object
      required: [processing_status, errors]
      properties:
        processing_status:
          enum: [pending, complete, failed]
        analyses_url:
          type: [string, "null"]
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
