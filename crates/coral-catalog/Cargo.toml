[package]
name = "coral-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Test-only Built-in catalogs with Operations this Coral version does not
# perform. Dev-dependencies enable this; production crates never do.
test-fixtures = []

[dependencies]
coral-outbound.workspace = true
coral-db.workspace = true
flate2.workspace = true
jsonschema.workspace = true
mime.workspace = true
sea-query.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
unicode-id-start.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# Integration tests build this library without `cfg(test)`.
coral-catalog = { workspace = true, features = ["test-fixtures"] }
coral-test-support.workspace = true
coral-v8.workspace = true
tokio.workspace = true
# PROTOTYPE (#2538 entry size spike): counts live heap bytes.
cap = "=0.1.2"
