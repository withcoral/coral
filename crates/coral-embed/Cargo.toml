[package]
name = "coral-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The build downloads ONNX Runtime 1.31.0, built by pyke, and links it
# statically. `tracing` sends ONNX Runtime's log to Coral's.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "download-binaries", "tls-rustls", "tracing"] }
sha2.workspace = true
thiserror.workspace = true
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
