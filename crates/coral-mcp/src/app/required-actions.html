<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coral needs you</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--color-background-primary, Canvas);
        --bg-2: var(--color-background-secondary, color-mix(in srgb, Canvas 92%, CanvasText));
        --fg: var(--color-text-primary, CanvasText);
        --fg-2: var(--color-text-secondary, color-mix(in srgb, CanvasText 65%, Canvas));
        --line: var(--color-border-primary, color-mix(in srgb, CanvasText 18%, Canvas));
        --accent: var(--color-background-inverse, CanvasText);
        --accent-fg: var(--color-text-inverse, Canvas);
        --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
        --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      }
      html,
      body {
        margin: 0;
        background: transparent;
        color: var(--fg);
        font: 14px/20px var(--font);
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        padding: 2px;
      }
      main[hidden] {
        display: none;
      }
      article {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        column-gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
      }
      .icon {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--bg-2);
        color: var(--fg);
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .text {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 2px;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        letter-spacing: -0.005em;
        overflow-wrap: anywhere;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 6px;
        margin: 0;
        font-size: 12px;
        line-height: 16px;
        color: var(--fg-2);
      }
      /* The separator ends the previous item, so a wrapped line never starts with it. */
      .meta > :not(:last-child)::after {
        content: "·";
        margin-left: 6px;
        font-family: var(--font);
      }
      /* A Call Path wraps after a dot, so the separator stays on its last line.
         A segment wider than the line breaks inside it rather than overflow. */
      code {
        min-width: 0;
        font: 12px/16px var(--mono);
        overflow-wrap: break-word;
      }
      time {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
        font: 500 13px/1 var(--font);
        white-space: nowrap;
        cursor: pointer;
      }
      button:hover {
        background: var(--bg-2);
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
      button:disabled {
        cursor: progress;
      }
      button svg {
        width: 14px;
        height: 14px;
        color: var(--fg-2);
      }
      button[aria-busy="true"] svg {
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button[aria-busy="true"] svg {
          animation: none;
        }
      }
      .address {
        grid-column: 1 / -1;
        margin: 12px 0 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--bg-2);
        font-size: 12px;
        line-height: 16px;
        color: var(--fg-2);
      }
      .address a {
        display: block;
        margin-top: 2px;
        font: 12px/16px var(--mono);
        color: var(--fg);
        text-decoration-color: var(--line);
        text-underline-offset: 2px;
        overflow-wrap: anywhere;
        user-select: all;
      }
      @media (max-width: 400px) {
        article {
          grid-template-columns: auto minmax(0, 1fr);
          row-gap: 12px;
        }
        button {
          grid-column: 1 / -1;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main id="root" hidden></main>
    <script>
      const PROTOCOL = "2026-01-26";
      const root = document.getElementById("root");
      const pending = new Map();
      let nextId = 1;

      function post(message) {
        window.parent.postMessage(message, "*");
      }
      function request(method, params, timeoutMs) {
        const id = nextId++;
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          post({ jsonrpc: "2.0", id, method, params });
          if (timeoutMs) {
            setTimeout(() => {
              if (!pending.delete(id)) return;
              reject(new Error(`${method} timed out`));
            }, timeoutMs);
          }
        });
      }
      function notify(method, params) {
        post({ jsonrpc: "2.0", method, params });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined && message.method === undefined) {
          const waiting = pending.get(message.id);
          if (!waiting) return;
          pending.delete(message.id);
          if (message.error) waiting.reject(message.error);
          else waiting.resolve(message.result);
          return;
        }
        switch (message.method) {
          case "ui/notifications/tool-result":
            render(message.params);
            break;
          case "ui/notifications/tool-cancelled":
            render(null);
            break;
          case "ui/notifications/host-context-changed":
            applyContext(message.params);
            break;
          case "ui/resource-teardown":
            if (message.id !== undefined) post({ jsonrpc: "2.0", id: message.id, result: {} });
            break;
          default:
            break;
        }
      });

      function applyContext(context) {
        if (!context) return;
        const variables = context.styles && context.styles.variables;
        if (variables) {
          for (const [name, value] of Object.entries(variables)) {
            if (value) document.documentElement.style.setProperty(name, value);
          }
        }
        if (context.theme) document.documentElement.dataset.theme = context.theme;
      }

      const SVG_NS = "http://www.w3.org/2000/svg";
      const ICONS = {
        approval: ["M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z", "M9 12l2 2 4-4"],
        connection: [
          "M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5",
          "M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5",
        ],
        open: ["M14 4h6v6", "M20 4l-9 9", "M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"],
        busy: ["M12 3a9 9 0 1 0 9 9"],
      };

      function icon(name) {
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        for (const d of ICONS[name]) {
          const path = document.createElementNS(SVG_NS, "path");
          path.setAttribute("d", d);
          svg.append(path);
        }
        return svg;
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      // The time alone on the same day, with the date otherwise.
      function clock(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return "";
        const time = date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        if (date.toDateString() === new Date().toDateString()) return time;
        return `${date.toLocaleDateString([], { month: "short", day: "numeric" })}, ${time}`;
      }

      // The Call Path without the prefix that every Tool shares, with a
      // break opportunity after each dot.
      function toolPath(path) {
        const code = element("code");
        code.title = path;
        const segments = path.replace(/^coral\.providers\./, "").split(".");
        segments.forEach((segment, index) => {
          if (index > 0) code.append(".", document.createElement("wbr"));
          code.append(segment);
        });
        return code;
      }

      function render(result) {
        root.replaceChildren();
        const update = result && result.structuredContent;
        const actions = ((update && update.required_actions) || []).filter(
          (action) => action.required_actor === "invoking_user",
        );
        root.hidden = actions.length === 0;
        for (const action of actions) {
          const connection = action.kind === "account_connection";
          const provider = action.provider;
          const card = element("article");

          // The icon shape and the title both name the kind of request.
          const badge = element("span", "icon");
          badge.append(icon(connection ? "connection" : "approval"));

          const text = element("div", "text");
          const title = connection
            ? provider
              ? `Connect your ${provider} account`
              : "Connect your account"
            : provider
              ? `Approve a ${provider} call`
              : "Approve a tool call";
          text.append(element("h1", "", title));

          // Each card names the waiting Tool where one Tool waits.
          const meta = element("p", "meta");
          if (action.tool) {
            meta.append(toolPath(action.tool));
          }
          const by = clock(action.deadline_at);
          if (by) {
            const deadline = element("span", "", "Respond by ");
            const time = element("time", "", by);
            time.dateTime = action.deadline_at;
            deadline.append(time);
            meta.append(deadline);
          }
          if (meta.childElementCount) text.append(meta);

          const open = element("button");
          open.type = "button";
          open.append("Open in Coral", icon("open"));
          open.addEventListener("click", () => openLink(action.url, open));

          card.append(badge, text, open);
          root.append(card);
        }
        reportSize();
      }

      function setBusy(button, busy) {
        button.disabled = busy;
        button.setAttribute("aria-busy", String(busy));
        button.lastChild.replaceWith(icon(busy ? "busy" : "open"));
      }

      // The host opens the page in the person's browser. When it declines or
      // never answers, the card shows the address itself, to open or copy.
      async function openLink(url, button) {
        setBusy(button, true);
        try {
          const result = await request("ui/open-link", { url }, 2000);
          console.info("ui/open-link answered", result);
          if (!(result && result.isError)) return;
        } catch (error) {
          console.warn("ui/open-link failed", error);
        } finally {
          setBusy(button, false);
        }
        let opened = null;
        try {
          // With "noopener" the browser returns no window, so the opener is cleared here.
          opened = window.open(url, "_blank");
          if (opened) opened.opener = null;
        } catch (error) {
          console.warn("window.open failed", error);
        }
        if (opened) return;
        const card = button.closest("article");
        if (card.querySelector(".address")) return;
        const address = element("p", "address", "Open this address in your browser:");
        const link = element("a", "", url);
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener";
        address.append(link);
        card.append(address);
        reportSize();
      }

      function reportSize() {
        // The body's height follows the cards; the document's never drops below the frame's.
        const height = root.hidden ? 0 : document.body.scrollHeight;
        notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height });
      }
      new ResizeObserver(() => reportSize()).observe(document.body);

      (async () => {
        try {
          const result = await request("ui/initialize", {
            protocolVersion: PROTOCOL,
            appCapabilities: { availableDisplayModes: ["inline"] },
            appInfo: { name: "Coral required actions", version: "1" },
          });
          applyContext(result && result.hostContext);
          notify("ui/notifications/initialized", {});
        } catch (error) {
          console.warn("ui/initialize failed", error);
        }
      })();
    </script>
  </body>
</html>
