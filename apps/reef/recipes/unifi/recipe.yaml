# yaml-language-server: $schema=../schema.json
schema_version: 1
id: unifi
display_name: UniFi Site Manager
description: Hosts, sites, devices, ISP metrics and SD-WAN configurations from UniFi Site Manager.
icons:
  light: ubiquiti.svg

# Ubiquiti publishes its OpenAPI documents only inside the pages of
# developer.ui.com. This third-party repository copies them from there every
# day without changes. The Site Manager API has one version, so this path is
# stable.
source:
  openapi:
    url: https://raw.githubusercontent.com/opastorello/unifi-api-docs/main/site-manager/v1.0.0/openapi.json

authentication:
  options:
    api_key:
      method: header_credentials
      label: Paste an API key
      description: Create an API key in UniFi Site Manager.
      documentation_url: https://developer.ui.com/site-manager/v1.0.0/gettingstarted
      fields:
        api_key:
          label: API key
      headers:
        x-api-key: { field: api_key }
