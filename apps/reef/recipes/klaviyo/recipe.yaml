# accounts:read: read access to accounts.
# campaigns:read: read access to campaigns.
# campaigns:write: write access to campaigns.
# catalogs:read: read access to catalogs.
# catalogs:write: write access to catalogs.
# conversations:read: read access to conversations.
# conversations:write: write access to conversations.
# coupon-codes:read: read access to coupon-codes.
# coupon-codes:write: write access to coupon-codes.
# coupons:read: read access to coupons.
# coupons:write: write access to coupons.
# custom-objects:read: read access to custom-objects.
# custom-objects:write: write access to custom-objects.
# data-privacy:write: write access to data-privacy.
# events:read: read access to events.
# events:write: write access to events.
# flows:read: read access to flows.
# flows:write: write access to flows.
# forms:read: read access to forms.
# forms:write: write access to forms.
# images:read: read access to images.
# images:write: write access to images.
# lists:read: read access to lists.
# lists:write: write access to lists.
# metrics:read: read access to metrics.
# metrics:write: write access to metrics.
# profiles:read: read access to profiles.
# profiles:write: write access to profiles.
