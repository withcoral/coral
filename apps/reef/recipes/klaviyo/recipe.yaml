schema_version: 1
id: klaviyo
display_name: Klaviyo
description: Profiles, lists, segments, campaigns and marketing analytics from Klaviyo.
source:
  openapi:
    url: https://raw.githubusercontent.com/klaviyo/openapi/main/openapi/stable.json
authentication:
  options:
    api_key:
      method: header_credentials
      label: Private API key
      documentation_url: https://developers.klaviyo.com/en/docs/authenticate_
      fields:
        api_key:
          label: Private API key
      headers:
        authorization:
          field: api_key
          prefix: 'Klaviyo-API-Key '
    oauth:
      method: oauth_authorization_code
      label: Sign in
      description: Create an OAuth app. Register the callback URL shown during setup.
      documentation_url: https://developers.klaviyo.com/en/docs/set_up_oauth
      authorization_url: https://www.klaviyo.com/oauth/authorize
      token_url: https://a.klaviyo.com/oauth/token
      client:
        authentication: client_secret_basic
      pkce: required
      scopes:
        - accounts:read
        - campaigns:read
        - campaigns:write
        - catalogs:read
        - catalogs:write
        - conversations:read
        - conversations:write
        - coupon-codes:read
        - coupon-codes:write
        - coupons:read
        - coupons:write
        - custom-objects:read
        - custom-objects:write
        - data-privacy:write
        - events:read
        - events:write
        - flows:read
        - flows:write
        - forms:read
        - forms:write
        - images:read
        - images:write
        - lists:read
        - lists:write
        - metrics:read
        - metrics:write
        - profiles:read
        - profiles:write
        - push-tokens:read
        - push-tokens:write
        - reviews:read
        - reviews:write
        - segments:read
        - segments:write
        - subscriptions:read
        - subscriptions:write
        - tags:read
        - tags:write
        - templates:read
        - templates:write
        - tracking-settings:read
        - tracking-settings:write
        - web-feeds:read
        - web-feeds:write
        - webhooks:read
        - webhooks:write
    access_token:
      method: bearer
      label: OAuth access token
      documentation_url: https://developers.klaviyo.com/en/docs/set_up_oauth
  default: api_key
request_headers:
  revision: 2026-07-15
icons:
  light: logo.png
  dark: logo-dark.png
