# yaml-language-server: $schema=../schema.json
# Official provider documentation: https://docs.slack.dev/ai/slack-mcp-server/
# OAuth scope choices come from discovered provider metadata or app settings.
schema_version: 1
id: slack
display_name: Slack
description: Messages, files, channels, conversations and people from Slack.
source:
  mcp:
    url: https://mcp.slack.com/mcp
authentication:
  options:
    oauth:
      method: oauth_discovery
      label: Sign in
      documentation_url: https://docs.slack.dev/ai/slack-mcp-server/
      description: Create an internal or Marketplace Slack app. Enable MCP and register the callback URL.
      flow: authorization_code
      client:
        authentication: client_secret_post
icons:
  light: logo.svg
