# yaml-language-server: $schema=../schema.json
schema_version: 1
id: sentry
display_name: Sentry
description: Issues, events, releases, projects and teams from Sentry.
icons:
  light: logo.svg
  dark: logo-dark.svg

inputs:
  region:
    type: hostname
    label: Sentry region
    default: us
    enum: [us, de]

source:
  openapi:
    url: https://raw.githubusercontent.com/getsentry/sentry-api-schema/refs/heads/main/openapi-derefed.json

authentication:
  default: oauth
  options:
    oauth:
      method: oauth_device_code
      label: Sign in with Sentry
      description: Configure your Sentry OAuth application before you sign in.
      documentation_url: https://docs.sentry.io/api/auth/
      device_authorization_url: https://sentry.io/oauth/device/code/
      token_url: https://sentry.io/oauth/token/
      # No client id: Sentry has no public Coral application, so the owner
      # configures one.
      client:
        authentication: none
      scopes: [org:read, event:read, member:read, project:read, project:releases, team:read]
    auth_token:
      method: bearer
      label: Paste an auth token
      description: Use a token with the permissions required by your Operations.
      documentation_url: https://docs.sentry.io/api/auth/

servers:
  '#/servers':
    declared_url: https://{region}.sentry.io
    variables:
      region: '{{input.region}}'
  '#/paths/~1api~10~1seer~1models~1/get/servers':
    # This declaration omits its variable definition, so it is configured explicitly.
    base_url: https://{{input.region}}.sentry.io
