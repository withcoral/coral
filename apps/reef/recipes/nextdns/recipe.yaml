# yaml-language-server: $schema=../schema.json
# Official API documentation: https://nextdns.github.io/api/
schema_version: 1
id: nextdns
display_name: NextDNS
description: Profiles, analytics, logs, allowlists and denylists from NextDNS.
icons:
  light: nextdns.svg

# NextDNS publishes no OpenAPI document, so this is a community document from
# the nextdns-mcp project (MIT). It covers every documented endpoint except
# analytics/domains;series. The URL pins a commit from 2026-10-19, so the
# document changes only when a reviewed change bumps it. NextDNS labels its API
# as beta.
# logs/stream sends server-sent events, and logs/download redirects to a
# temporary CSV file.
source:
  openapi:
    url: https://raw.githubusercontent.com/dmeiser/nextdns-mcp/4ede4974257a2a2d9a4e15f33d0ed540dcf8ae5a/src/nextdns_mcp/nextdns-openapi.yaml

authentication:
  default: api_key
  options:
    api_key:
      # NextDNS documents no OAuth.
      method: header_credentials
      label: Paste an API key
      description: Find your API key at the bottom of your NextDNS account page.
      documentation_url: https://nextdns.github.io/api/#authentication
      fields:
        api_key:
          label: API key
      headers:
        x-api-key:
          field: api_key
