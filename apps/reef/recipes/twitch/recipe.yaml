# yaml-language-server: $schema=../schema.json
# Official provider documentation: https://dev.twitch.tv/docs/api/reference/
schema_version: 1
id: twitch
display_name: Twitch
description: Streams, channels, videos, clips, chat and moderation from Twitch.
# Twitch publishes no OpenAPI document, so this is a community document from
# the twitch-api-swagger project. The URL pins a commit from 2026-08-13, so the
# document changes only when a reviewed change bumps it.
source:
  openapi:
    url: https://raw.githubusercontent.com/DmitryScaletta/twitch-api-swagger/0ae1eacb5e7a65fe3502a1f6bf42195b728b28ba/openapi.json
authentication:
  options:
    access_token:
      method: header_credentials
      label: OAuth access token
      documentation_url: https://dev.twitch.tv/docs/authentication/getting-tokens-oauth/
      fields:
        access_token:
          label: Access token
        client_id:
          label: Client ID
          sensitive: false
      headers:
        authorization:
          field: access_token
          prefix: 'Bearer '
        client-id:
          field: client_id
icons:
  light: logo.svg
