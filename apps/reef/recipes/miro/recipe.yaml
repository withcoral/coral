# yaml-language-server: $schema=../schema.json
# Official provider documentation: https://developers.miro.com/docs/miro-mcp
# OAuth scopes come from server discovery; the Recipe names none.
schema_version: 1
id: miro
display_name: Miro
description: Boards, diagrams and collaboration content from Miro.
icons:
  light: logo.svg
source:
  mcp:
    url: https://mcp.miro.com/
authentication:
  options:
    oauth:
      method: oauth_discovery
      label: Sign in with Miro
      documentation_url: https://developers.miro.com/docs/miro-mcp
      flow: authorization_code
  default: oauth
