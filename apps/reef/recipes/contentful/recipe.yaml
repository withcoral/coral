# yaml-language-server: $schema=../schema.json
# Official provider documentation: https://www.contentful.com/developers/docs/tools/mcp-server/
# OAuth scopes come from server discovery; the Recipe names none.
schema_version: 1
id: contentful
display_name: Contentful
description: Content, spaces and environments from Contentful.
icons:
  light: logo.svg
source:
  mcp:
    url: '{{input.endpoint}}'
authentication:
  options:
    oauth:
      method: oauth_discovery
      label: Sign in with Contentful
      documentation_url: https://www.contentful.com/developers/docs/tools/mcp-server/
      flow: authorization_code
  default: oauth
inputs:
  endpoint:
    type: url
    label: MCP region
    default: https://mcp.contentful.com/mcp
    enum:
      - https://mcp.contentful.com/mcp
      - https://mcp.eu.contentful.com/mcp
    documentation_url: https://www.contentful.com/developers/docs/tools/mcp-server/
