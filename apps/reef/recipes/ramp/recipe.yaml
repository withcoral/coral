# yaml-language-server: $schema=../schema.json
# Official provider documentation: https://docs.ramp.com/llms-guides/authorization.txt
schema_version: 1
id: ramp
display_name: Ramp
description: Transactions, cards, reimbursements, bills, users and vendors from Ramp.
source:
  openapi:
    url: https://docs.ramp.com/openapi/developer-api.json
authentication:
  default: access_token
  options:
    access_token:
      method: bearer
      label: Access token
      documentation_url: https://docs.ramp.com/llms-guides/authorization.txt
    oauth:
      method: oauth_authorization_code
      label: Sign in
      description: Create a developer app. Enable the required scopes and callback URL.
      documentation_url: https://docs.ramp.com/llms-guides/authorization.txt
      authorization_url: https://api.ramp.com/v1/authorize
      token_url: https://api.ramp.com/developer/v1/token
      client:
        authentication: client_secret_basic
      pkce: disabled
      scopes:
        - accounting:read
        - accounting:write
        - ai_spend:read
        - ai_usage:write
        - applications:read
        - applications:write
        - approval_chains:write
        - approvals:read
        - approvals:write
        - attendee_types:read
        - attendee_types:write
        - audit_logs:read
        - bank_accounts:read
        - bank_accounts:write
        - bank_feeds:read
        - bills:read
        - bills:write
        - blank_canvas:write
        - budgets:read
        - business:read
        - cards:read
        - cards:read_vault
        - cards:write
        - cashbacks:read
        - comments:write
        - custom_forms:read
        - custom_records:read
        - custom_records:write
        - departments:read
        - departments:write
        - embedded_cards:write
        - entities:read
        - external_attendees:read
        - external_attendees:write
        - funds:read
        - funds:write
        - incorporation:read
        - incorporation:write
        - item_receipts:read
        - item_receipts:write
        - limits:read
        - limits:write
        - locations:read
        - locations:write
        - memos:read
        - memos:write
        - merchants:read
        - offline_access
        - openid
        - purchase_orders:read
        - purchase_orders:write
        - receipt_integrations:read
        - receipt_integrations:write
        - receipts:read
        - receipts:write
        - reimbursements:read
        - reimbursements:write
        - repayments:read
        - scim:write
        - sourcing:read
        - sourcing:write
        - spend_programs:read
        - spend_programs:write
        - spend_requests:read
        - spend_requests:write
        - statements:read
        - tasks:read
        - transactions:read
        - transactions:write
        - transfers:read
        - treasury:read
        - trips:read
        - unified_requests:read
        - unified_requests:write
        - users:read
        - users:write
        - vendors:read
        - vendors:write
        - workflows:read
        - x402:write
        - x402_provisioning:write
icons:
  light: logo.svg
  dark: logo-dark.svg

# accounting:read: Grant read access to accounting
# accounting:write: Grant write access to accounting
# ai_spend:read: Grant read access to ai_spend
# ai_usage:write: Grant write access to ai_usage
