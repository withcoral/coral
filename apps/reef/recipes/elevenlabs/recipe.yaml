# yaml-language-server: $schema=../schema.json
# Official provider documentation: https://elevenlabs.io/docs/eleven-agents/operate/hosted-mcp
# Global account endpoint; EU, India and Singapore residency use separate endpoints and accounts.
# Scopes are advertised by OAuth issuer metadata; Coral discovers them.
# Use the canonical resource URL advertised by provider metadata to avoid cross-host ResourceMismatch.
schema_version: 1
id: elevenlabs
display_name: ElevenLabs
description: Voices, speech and agents from ElevenLabs.
source:
  mcp:
    url: https://api.us.elevenlabs.io/v1/mcp
authentication:
  options:
    oauth:
      method: oauth_discovery
      label: Sign in
      documentation_url: https://elevenlabs.io/docs/eleven-agents/operate/hosted-mcp
      flow: authorization_code
  default: oauth
icons:
  light: logo.svg
  dark: logo-dark.svg
