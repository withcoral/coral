# yaml-language-server: $schema=../schema.json
# Official provider documentation: https://www.braze.com/docs/user_guide/brazeai/mcp_server
# Official logo: https://avatars.githubusercontent.com/u/32844289?v=4
# Either region reaches all Braze clusters. Custom client domains may need Braze approval.
# OAuth scopes come from server discovery; the Recipe names none.
schema_version: 1
id: braze
display_name: Braze
description: Campaigns, engagement data and workspace insights from Braze.
icons:
  light: braze.png
source:
  mcp:
    url: '{{input.endpoint}}'
authentication:
  options:
    oauth:
      method: oauth_discovery
      label: Sign in with Braze
      documentation_url: https://www.braze.com/docs/user_guide/brazeai/mcp_server
      flow: authorization_code
  default: oauth
inputs:
  endpoint:
    type: url
    label: MCP region
    default: https://mcp.braze.com/mcp
    enum:
      - https://mcp.braze.com/mcp
      - https://mcp.braze.eu/mcp
    documentation_url: https://www.braze.com/docs/user_guide/brazeai/mcp_server
