# Hand-written corrections to the extracted Slack model.
#
# This is the only file here a human edits. Everything else under apis/slack is
# fetched or generated, so regenerating never discards what is written below.
#
# Every entry must still match something. An override that applies to nothing
# fails the build rather than being ignored: the reason an override exists is
# that upstream was wrong, and once upstream is fixed or renamed, a dead
# correction is indistinguishable from a live one.

# Applied wherever the parameter appears.
parameters:
  limit:
    type: integer
    reason: >-
      Slack's argument tables type `limit` as `number`, but it is an item count
      and Slack rejects a fractional value. The docs contradict themselves on
      this — `search.messages` types the equivalent `count` and `page` as
      `integer` — so `number` here means "numeric", not "may be fractional".
      Left uncorrected it becomes a Float64 column, and a page size expressed
      as a float is wrong for every caller.

operations:
  team.externalTeams.list:
    scopeRelation: all
    reason: >-
      Slack lists a method's scopes without saying how they relate, and the
      relationship differs. The four `channels`/`groups`/`im`/`mpim` scopes on
      the conversations methods are alternatives — one per conversation type,
      any of which is sufficient — so `any` is the right default. This method is
      the exception in scope: `team:read` and `conversations.connect:manage`
      are unrelated scope families that a caller needs both of. Nothing in the
      page distinguishes the two cases, so it is declared here.

  files.info:
    response:
      dropProperties:
        - comments
      reason: >-
        files.info returns `{ok, file, comments, paging}`. Coral's row-path
        inference reads `paging` as evidence of a page envelope and `comments`
        as the sole array, so it makes the comments the rows and discards the
        file the operation is named after — a `files_info` relation that
        returns comments rather than file metadata. Leaving `comments`
        undescribed keeps the file as the row. Nothing is misdescribed: an
        OpenAPI schema is a description rather than an inventory, and comments
        are still reachable through files.list.
