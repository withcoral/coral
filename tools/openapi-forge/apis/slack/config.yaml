api: slack
title: Slack Web API
description: >-
  Read-only coverage of the Slack Web API, generated from Slack's published
  reference documentation and the response samples recorded in
  slackapi/java-slack-sdk. Slack publishes no OpenAPI 3.0 description of its
  own: the official slackapi/slack-api-specs is Swagger 2.0, was last updated in
  August 2020, and the repository was archived in March 2024.
serverUrl: https://slack.com/api
# Written by `forge build`, relative to this file.
output: ../../../../sources/v4/slack/openapi.yaml

security:
  # Slack issues two classes of token with different scope sets, and a method
  # may accept only one of them — reminders.list is user-only, while
  # team.externalTeams.list is bot-only. One scheme each is what lets an
  # operation say which it takes.
  #
  # The endpoints are declared here rather than extracted: Slack documents them
  # in prose at /authentication/installing-with-oauth, not in a form worth
  # scraping. Both pairs are taken from that page.
  schemes:
    - name: slackBotToken
      tokenClass: bot
      description: >-
        A bot token (xoxb-), issued to the app itself. Reads what the bot user
        can see, which is the channels it has been added to.
      authorizationUrl: https://slack.com/oauth/v2/authorize
      tokenUrl: https://slack.com/api/oauth.v2.access
    - name: slackUserToken
      tokenClass: user
      description: >-
        A user token (xoxp-), issued on behalf of the authorizing user. Reads
        what that user can see, and is the only class Slack grants search:read.
      authorizationUrl: https://slack.com/oauth/v2_user/authorize
      tokenUrl: https://slack.com/api/oauth.v2.user.access

scope:
  # The read-only core of the Web API. Selected by two filters over the
  # thirteen non-admin families (bots, conversations, dnd, emoji, files, pins,
  # reactions, reminders, search, stars, team, usergroups, users):
  #
  # 1. Slack must document the method as GET. Coral hides every non-GET
  #    operation, so anything else generates a relation nobody can query.
  #    `forge build` warns if one slips in.
  #
  # 2. The method must actually read. GET is not a safety filter here: Slack
  #    documents `auth.revoke`, `users.deletePhoto`,
  #    `conversations.declineSharedInvite` and `files.remote.share` as GET, and
  #    every one of them mutates. They are excluded deliberately — a read-only
  #    SQL surface must not be able to revoke a token or delete a photo.
  #
  # admin.* is out of scope entirely: 106 methods that need Enterprise Grid and
  # admin scopes, almost all of them writes.
  #
  # Names are matched case-insensitively against Slack's own casing.
  methods:
    - bots.info
    - conversations.history
    - conversations.info
    - conversations.list
    - conversations.members
    - conversations.replies
    - dnd.info
    - dnd.teamInfo
    - emoji.list
    - files.info
    - files.list
    - files.remote.info
    - files.remote.list
    - pins.list
    - reactions.get
    - reactions.list
    - reminders.info
    - reminders.list
    - search.all
    - search.files
    - search.messages
    - stars.list
    - team.accessLogs
    - team.billableInfo
    - team.externalTeams.list
    - team.info
    - team.integrationLogs
    - team.profile.get
    - usergroups.list
    - usergroups.users.list
    - users.conversations
    - users.getPresence
    - users.identity
    - users.info
    - users.list
    - users.lookupByEmail
    - users.profile.get
