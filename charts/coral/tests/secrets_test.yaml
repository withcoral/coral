suite: secrets
release:
  name: coral-test
values:
  - ../ci/default-values.yaml
templates:
  - templates/configmap.yaml
  - templates/coral.yaml
  - templates/web.yaml
  - templates/run-executor.yaml
tests:
  - it: renders no Secret, even with every secret set
    set:
      secrets.license.enabled: true
      runExecutors.previousToken.key: CORAL_RUN_EXECUTOR_PREVIOUS_TOKEN
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
        not: true

  - it: reads every secret from <release>-coral by default
    template: templates/coral.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORAL_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: coral-test-coral
                key: CORAL_DATABASE_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORAL_RUN_EXECUTOR_TOKEN
            valueFrom:
              secretKeyRef:
                name: coral-test-coral
                key: CORAL_RUN_EXECUTOR_TOKEN

  - it: reads a secret from the Secret and key it names
    template: templates/web.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      secrets.webSessionSecret:
        secretName: ui
        key: SESSION
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORAL_WEB_SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: ui
                key: SESSION

  - it: reads no License by default
    template: templates/coral.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CORAL_LICENSE
            valueFrom:
              secretKeyRef:
                name: coral-test-coral
                key: CORAL_LICENSE

  - it: fails without the database URL
    template: templates/coral.yaml
    set:
      secrets.databaseUrl.key: ""
    asserts:
      - failedTemplate:
          errorPattern: secrets.databaseUrl.key is required

  - it: fails without the credentials key
    template: templates/coral.yaml
    set:
      secrets.credentialsKey.key: ""
    asserts:
      - failedTemplate:
          errorPattern: secrets.credentialsKey.key is required

  - it: fails without the session signing key
    template: templates/coral.yaml
    set:
      secrets.sessionSigningKey.key: ""
    asserts:
      - failedTemplate:
          errorPattern: secrets.sessionSigningKey.key is required

  - it: fails without the OIDC client secret
    template: templates/coral.yaml
    set:
      secrets.oidcClientSecret.key: ""
    asserts:
      - failedTemplate:
          errorPattern: secrets.oidcClientSecret.key is required

  - it: fails without the web session secret
    template: templates/web.yaml
    set:
      secrets.webSessionSecret.key: ""
    asserts:
      - failedTemplate:
          errorPattern: secrets.webSessionSecret.key is required

  - it: fails without the Run Executor token
    template: templates/run-executor.yaml
    set:
      runExecutors.token.key: ""
    asserts:
      - failedTemplate:
          errorPattern: runExecutors.token.key is required

  - it: fails without the License's key when the License is on
    template: templates/coral.yaml
    set:
      secrets.license.enabled: true
      secrets.license.key: ""
    asserts:
      - failedTemplate:
          errorPattern: secrets.license.key is required
