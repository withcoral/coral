suite: coral
release:
  name: prod
values:
  - ../ci/default-values.yaml
templates:
  - templates/coral.yaml
tests:
  - it: rolls with no downtime
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 0
              maxSurge: 1
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$

  - it: gives migrations 15 minutes to start by default
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            grpc:
              port: 14555
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.grpc.service
          value: coral.readiness
