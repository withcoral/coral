# Values for the Coral chart. values.schema.json rejects any key not listed
# here. Set any other Coral setting under `config`.

# Required. The UI's host name, such as coral.example.com. Coral serves the UI
# on https://<host>, sign-in on https://<hosts.auth> and MCP on
# https://<hosts.mcp>.
host: ""

hosts:
  # Defaults to auth.<host>.
  auth: ""
  # Defaults to mcp.<host>.
  mcp: ""

# Routing to the three hosts, for your own ingress controller or Gateway. Both
# are off by default: route the Services yourself, or turn one on. Neither
# routes coral's gRPC, which stays on the cluster network. "Routing" in the
# Kubernetes docs lists the streaming settings your controller needs.
ingress:
  enabled: false
  # Your IngressClass, such as nginx or alb. Empty means the cluster's default.
  className: ""
  # Passed through as written, such as cert-manager.io/cluster-issuer.
  annotations: {}
  tls:
    # An existing TLS Secret that covers the three hosts. Empty means TLS ends
    # at your load balancer.
    secretName: ""

# A Gateway API HTTPRoute for each host. Your Gateway's listeners hold the TLS
# certificates.
httpRoute:
  enabled: false
  annotations: {}
  # Required when enabled. The Gateways to attach to, such as
  # [{name: eg, namespace: envoy-gateway-system}].
  parentRefs: []

global:
  # Replaces the registry host of every image, and keeps each repository path.
  imageRegistry: ""

imagePullSecrets: []

# Each secret is a key in a Secret you create. The chart never creates one.
# An empty secretName means a Secret named after the release.
secrets:
  databaseUrl:
    secretName: ""
    key: CORAL_DATABASE_URL
  credentialsKey:
    secretName: ""
    key: CORAL_CREDENTIALS_KEY
  sessionSigningKey:
    secretName: ""
    key: CORAL_SESSION_SIGNING_KEY
  oidcClientSecret:
    secretName: ""
    key: CORAL_OIDC_CLIENT_SECRET
  webSessionSecret:
    secretName: ""
    key: CORAL_WEB_SESSION_SECRET
  # Without a License, Coral runs as the Community Edition.
  license:
    enabled: false
    secretName: ""
    key: CORAL_LICENSE

database:
  tls:
    # A CA to verify the database server's certificate with, for
    # sslmode=verify-full against a private CA. Name a ConfigMap or a Secret,
    # and the key that holds the PEM bundle. An empty key uses the image's
    # roots.
    caBundle:
      configMapName: ""
      secretName: ""
      key: ""

tls:
  # A CA that coral and coral-web trust on top of their images' roots, when
  # they call HTTPS hosts. Set it when the Install's own hosts serve a
  # certificate from a private CA: both call them from inside the cluster to
  # sign users in. Name a ConfigMap or a Secret, and the key that holds the
  # PEM bundle. Restart the pods after the CA changes.
  extraCABundle:
    configMapName: ""
    secretName: ""
    key: ""

usageReports:
  # Off stops Coral sending Usage Reports.
  enabled: true

# Coral's config.toml, merged on top of the settings the chart writes. The
# render fails if this sets a key the chart owns. Set at least
# auth.provider.issuer and auth.provider.client_id.
config: {}

coral:
  image:
    registry: ghcr.io
    repository: withcoral/coral
    # Defaults to the chart's appVersion.
    tag: ""
    # When set, the image is pulled by digest, such as sha256:...
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi
  probes:
    # Coral listens only after its migrations finish: this allows 15 minutes.
    startup:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 90
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

  # Annotations on the pods.
  podAnnotations: {}
  # The pods run as their own ServiceAccount, named <release>. Its annotations
  # can give the pods cloud access, such as eks.amazonaws.com/role-arn for
  # IRSA. EKS Pod Identity binds to the ServiceAccount's name.
  serviceAccount:
    annotations: {}
  # More env vars, envFrom sources, volumes and volume mounts for the
  # coral container, as Kubernetes writes them.
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

web:
  image:
    registry: ghcr.io
    repository: withcoral/coral-web
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 2
  # MCP clients that may have a Coral plugin, such as [claude, chatgpt]. See
  # "Offering a Coral plugin" in the Kubernetes docs.
  agentsWithAvailablePlugins: []
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 768Mi
  probes:
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

  # An Envoy sidecar that spreads each of coral-web's gRPC requests across
  # every coral pod, found through a headless Service. Without it, coral-web
  # keeps one connection to coral's Service, and so one coral pod takes all of
  # one coral-web pod's load. Turn it off when your service mesh spreads
  # requests: coral-web then calls coral's Service directly.
  envoy:
    enabled: true
    image:
      registry: docker.io
      repository: envoyproxy/envoy
      tag: distroless-v1.40.2
      digest: sha256:09ca6f2140a61ad8df11779a4a30d52b48433d444466328494f9188c9c35eded
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 64Mi

  # Annotations on the pods.
  podAnnotations: {}
  # The pods run as their own ServiceAccount, named <release>-web. Its annotations
  # can give the pods cloud access, such as eks.amazonaws.com/role-arn for
  # IRSA. EKS Pod Identity binds to the ServiceAccount's name.
  serviceAccount:
    annotations: {}
  # More env vars, envFrom sources, volumes and volume mounts for the
  # coral-web container, as Kubernetes writes them.
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

# Run Executors run programs in their own pods, from the coral image. Their
# pods are always locked down, and no value loosens them.
runExecutors:
  replicas: 2
  # The most Runs one Run Executor holds at once.
  maxRunsHeld: 8
  # Time a stopping Run Executor has to finish the Runs it holds.
  terminationGracePeriodSeconds: 300
  # More env vars, as {name, value} only: a Run Executor reads no Secret but
  # its token's, and has no volumes. Don't put a secret in a value. There is
  # no annotation hook, since an annotation can make a webhook inject a secret
  # or a volume.
  extraEnv: []
  # Required. At least 32 characters. Coral and every Run Executor read it.
  token:
    secretName: ""
    key: CORAL_RUN_EXECUTOR_TOKEN
  # During a rotation, Coral also accepts this token. Set a key to turn it on.
  previousToken:
    secretName: ""
    key: ""
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      memory: 2Gi
  probes:
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
