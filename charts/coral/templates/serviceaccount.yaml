{{- $fullname := include "coral.fullname" . -}}
{{- /*
Each component runs as its own ServiceAccount, so that cloud access (IRSA
annotations, EKS Pod Identity associations) reaches only the component it is
for. Run Executors' has no annotations: they run customer programs. None
mounts a Kubernetes API token: the chart needs none.
*/ -}}
{{- range $component := list
  (dict "name" $fullname "component" "coral" "annotations" $.Values.coral.serviceAccount.annotations)
  (dict "name" (printf "%s-web" $fullname) "component" "web" "annotations" $.Values.web.serviceAccount.annotations)
  (dict "name" (printf "%s-run-executor" $fullname) "component" "run-executor" "annotations" dict) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $component.name }}
  labels:
    {{- include "coral.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.component }}
  {{- with $component.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
