{{- $fullname := include "coral.fullname" . -}}
{{- /*
coral and coral-web each run as their own ServiceAccount, so that cloud access
(IRSA annotations, EKS Pod Identity associations) reaches only the component
it is for. Neither mounts a Kubernetes API token: the chart needs none.
*/ -}}
{{- range $component := list (dict "name" $fullname "component" "coral" "values" $.Values.coral) (dict "name" (printf "%s-web" $fullname) "component" "web" "values" $.Values.web) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $component.name }}
  labels:
    {{- include "coral.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.component }}
  {{- with $component.values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
