{{- $fullname := include "coral.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "coral.labels" . | nindent 4 }}
    app.kubernetes.io/component: coral
spec:
  replicas: {{ .Values.coral.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "coral.selectorLabels" (list . "coral") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coral.labels" . | nindent 8 }}
        app.kubernetes.io/component: coral
      annotations:
        # A values change that changes config.toml rolls the pods.
        checksum/config: {{ include "coral.configToml" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coral
          image: {{ include "coral.image" (list . .Values.coral.image) }}
          imagePullPolicy: {{ .Values.coral.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ include "coral.port.grpc" . }}
            - name: mcp
              containerPort: {{ include "coral.port.mcp" . }}
            - name: auth
              containerPort: {{ include "coral.port.auth" . }}
            - name: run-executor
              containerPort: {{ include "coral.port.runExecutor" . }}
          env:
            - name: CORAL_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullname }}
                  key: config.toml
            {{- include "coral.secretEnv" (list . "CORAL_DATABASE_URL" "secrets.databaseUrl" .Values.secrets.databaseUrl) | nindent 12 }}
            {{- include "coral.secretEnv" (list . "CORAL_CREDENTIALS_KEY" "secrets.credentialsKey" .Values.secrets.credentialsKey) | nindent 12 }}
            {{- include "coral.secretEnv" (list . "CORAL_SESSION_SIGNING_KEY" "secrets.sessionSigningKey" .Values.secrets.sessionSigningKey) | nindent 12 }}
            {{- include "coral.secretEnv" (list . "CORAL_OIDC_CLIENT_SECRET" "secrets.oidcClientSecret" .Values.secrets.oidcClientSecret) | nindent 12 }}
            {{- include "coral.secretEnv" (list . "CORAL_RUN_EXECUTOR_TOKEN" "runExecutors.token" .Values.runExecutors.token) | nindent 12 }}
            {{- if .Values.runExecutors.previousToken.key }}
            {{- include "coral.secretEnv" (list . "CORAL_RUN_EXECUTOR_PREVIOUS_TOKEN" "runExecutors.previousToken" .Values.runExecutors.previousToken) | nindent 12 }}
            {{- end }}
            {{- if .Values.secrets.license.enabled }}
            {{- include "coral.secretEnv" (list . "CORAL_LICENSE" "secrets.license" .Values.secrets.license) | nindent 12 }}
            {{- end }}
          volumeMounts:
            # The image writes config.toml here from CORAL_CONFIG.
            - name: state
              mountPath: /var/lib/coral
          startupProbe:
            grpc:
              port: {{ include "coral.port.grpc" . }}
            {{- include "coral.probeTimings" .Values.coral.probes.startup | nindent 12 }}
          readinessProbe:
            grpc:
              port: {{ include "coral.port.grpc" . }}
              service: coral.readiness
            {{- include "coral.probeTimings" .Values.coral.probes.readiness | nindent 12 }}
          livenessProbe:
            grpc:
              port: {{ include "coral.port.grpc" . }}
            {{- include "coral.probeTimings" .Values.coral.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.coral.resources | nindent 12 }}
          securityContext:
            {{- include "coral.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: state
          emptyDir: {}
---
# gRPC for coral-web and the Run Executor link. Never exposed outside the
# cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "coral.labels" . | nindent 4 }}
    app.kubernetes.io/component: coral
spec:
  type: ClusterIP
  selector:
    {{- include "coral.selectorLabels" (list . "coral") | nindent 4 }}
  ports:
    - name: grpc
      port: {{ include "coral.port.grpc" . }}
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: run-executor
      port: {{ include "coral.port.runExecutor" . }}
      targetPort: run-executor
      appProtocol: kubernetes.io/h2c
---
# Sign-in, for your routing to https://<hosts.auth>.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-auth
  labels:
    {{- include "coral.labels" . | nindent 4 }}
    app.kubernetes.io/component: coral
spec:
  type: ClusterIP
  selector:
    {{- include "coral.selectorLabels" (list . "coral") | nindent 4 }}
  ports:
    - name: http
      port: {{ include "coral.port.auth" . }}
      targetPort: auth
---
# MCP, for your routing to https://<hosts.mcp>.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mcp
  labels:
    {{- include "coral.labels" . | nindent 4 }}
    app.kubernetes.io/component: coral
spec:
  type: ClusterIP
  selector:
    {{- include "coral.selectorLabels" (list . "coral") | nindent 4 }}
  ports:
    - name: http
      port: {{ include "coral.port.mcp" . }}
      targetPort: mcp
