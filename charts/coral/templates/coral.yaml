{{- $fullname := include "coral.fullname" . -}}
{{- include "coral.checkCABundle" (list "tls.extraCABundle" .Values.tls.extraCABundle) -}}
{{- include "coral.checkExtraEnv" (list "coral.extraEnv" .Values.coral.extraEnv (list "CORAL_CONFIG" "CORAL_DATABASE_URL" "CORAL_CREDENTIALS_KEY" "CORAL_SESSION_SIGNING_KEY" "CORAL_OIDC_CLIENT_SECRET" "CORAL_RUN_EXECUTOR_TOKEN" "CORAL_RUN_EXECUTOR_PREVIOUS_TOKEN" "CORAL_LICENSE" "CORAL_DISABLE_USAGE_DATA" "PGSSLROOTCERT" "SSL_CERT_FILE" "SSL_CERT_DIR")) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "coral.labels" . | nindent 4 }}
    app.kubernetes.io/component: coral
spec:
  replicas: {{ .Values.coral.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "coral.selectorLabels" (list . "coral") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coral.labels" . | nindent 8 }}
        app.kubernetes.io/component: coral
      annotations:
        # A values change that changes config.toml rolls the pods.
        checksum/config: {{ include "coral.configToml" . | sha256sum }}
        # A new annotation, such as an IRSA role, reaches only new pods.
        checksum/serviceaccount: {{ toYaml .Values.coral.serviceAccount.annotations | sha256sum }}
        {{- with .Values.coral.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coral
          image: {{ include "coral.image" (list . .Values.coral.image) }}
          imagePullPolicy: {{ .Values.coral.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ include "coral.port.grpc" . }}
            - name: mcp
              containerPort: {{ include "coral.port.mcp" . }}
            - name: auth
              containerPort: {{ include "coral.port.auth" . }}
            - name: run-executor
              containerPort: {{ include "coral.port.runExecutor" . }}
          env:
            - name: CORAL_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ $fullname }}
                  key: config.toml
            {{- include "coral.secretEnv" (list . "CORAL_DATABASE_URL" "secrets.databaseUrl" .Values.secrets.databaseUrl) | nindent 12 }}
            {{- include "coral.secretEnv" (list . "CORAL_CREDENTIALS_KEY" "secrets.credentialsKey" .Values.secrets.credentialsKey) | nindent 12 }}
            {{- include "coral.secretEnv" (list . "CORAL_SESSION_SIGNING_KEY" "secrets.sessionSigningKey" .Values.secrets.sessionSigningKey) | nindent 12 }}
            {{- include "coral.secretEnv" (list . "CORAL_OIDC_CLIENT_SECRET" "secrets.oidcClientSecret" .Values.secrets.oidcClientSecret) | nindent 12 }}
            {{- include "coral.secretEnv" (list . "CORAL_RUN_EXECUTOR_TOKEN" "runExecutors.token" .Values.runExecutors.token) | nindent 12 }}
            {{- if .Values.runExecutors.previousToken.key }}
            {{- include "coral.secretEnv" (list . "CORAL_RUN_EXECUTOR_PREVIOUS_TOKEN" "runExecutors.previousToken" .Values.runExecutors.previousToken) | nindent 12 }}
            {{- end }}
            {{- if .Values.tls.extraCABundle.key }}
            # coral's TLS loads both: the image's own bundle, and every file
            # in the directory. Either one alone would replace the image's
            # roots.
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_DIR
              value: /etc/coral/extra-ca
            {{- end }}
            {{- if .Values.database.tls.caBundle.key }}
            - name: PGSSLROOTCERT
              value: /etc/coral/database-ca/ca.crt
            {{- end }}
            {{- if not .Values.usageReports.enabled }}
            - name: CORAL_DISABLE_USAGE_DATA
              value: "1"
            {{- end }}
            {{- if .Values.secrets.license.enabled }}
            {{- include "coral.secretEnv" (list . "CORAL_LICENSE" "secrets.license" .Values.secrets.license) | nindent 12 }}
            {{- end }}
            {{- with .Values.coral.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.coral.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The image writes config.toml here from CORAL_CONFIG.
            - name: state
              mountPath: /var/lib/coral
            {{- if .Values.database.tls.caBundle.key }}
            - name: database-ca
              mountPath: /etc/coral/database-ca
              readOnly: true
            {{- end }}
            {{- if .Values.tls.extraCABundle.key }}
            - name: extra-ca
              mountPath: /etc/coral/extra-ca
              readOnly: true
            {{- end }}
            {{- with .Values.coral.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            grpc:
              port: {{ include "coral.port.grpc" . }}
            {{- include "coral.probeTimings" .Values.coral.probes.startup | nindent 12 }}
          readinessProbe:
            grpc:
              port: {{ include "coral.port.grpc" . }}
              service: coral.readiness
            {{- include "coral.probeTimings" .Values.coral.probes.readiness | nindent 12 }}
          livenessProbe:
            grpc:
              port: {{ include "coral.port.grpc" . }}
            {{- include "coral.probeTimings" .Values.coral.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.coral.resources | nindent 12 }}
          securityContext:
            {{- include "coral.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: state
          emptyDir: {}
        {{- include "coral.caBundleVolume" (list "database.tls.caBundle" .Values.database.tls.caBundle "database-ca") | nindent 8 }}
        {{- if .Values.tls.extraCABundle.key }}
        {{- include "coral.caBundleVolume" (list "tls.extraCABundle" .Values.tls.extraCABundle "extra-ca") | nindent 8 }}
        {{- end }}
        {{- with .Values.coral.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
# gRPC for coral-web and the Run Executor link. Never exposed outside the
# cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "coral.labels" . | nindent 4 }}
    app.kubernetes.io/component: coral
spec:
  type: ClusterIP
  selector:
    {{- include "coral.selectorLabels" (list . "coral") | nindent 4 }}
  ports:
    - name: grpc
      port: {{ include "coral.port.grpc" . }}
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
    - name: run-executor
      port: {{ include "coral.port.runExecutor" . }}
      targetPort: run-executor
      appProtocol: kubernetes.io/h2c
---
# Sign-in, for your routing to https://<hosts.auth>.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-auth
  labels:
    {{- include "coral.labels" . | nindent 4 }}
    app.kubernetes.io/component: coral
spec:
  type: ClusterIP
  selector:
    {{- include "coral.selectorLabels" (list . "coral") | nindent 4 }}
  ports:
    - name: http
      port: {{ include "coral.port.auth" . }}
      targetPort: auth
---
# MCP, for your routing to https://<hosts.mcp>.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mcp
  labels:
    {{- include "coral.labels" . | nindent 4 }}
    app.kubernetes.io/component: coral
spec:
  type: ClusterIP
  selector:
    {{- include "coral.selectorLabels" (list . "coral") | nindent 4 }}
  ports:
    - name: http
      port: {{ include "coral.port.mcp" . }}
      targetPort: mcp
