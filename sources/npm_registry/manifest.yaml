name: npm_registry
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query npm package metadata, package versions, and package-dependent
  search results from the public npm registry APIs.
base_url: https://registry.npmjs.org
test_queries:
  - SELECT * FROM npm_registry.packages LIMIT 1
tables:
  - name: packages
    description: Public npm packages from npm search
    guide: |
      Uses the npm search API. Optional `query` defaults to `react`
      so `LIMIT 1` smoke tests stay cheap and deterministic.
    filters:
      - name: query
        required: false
    request:
      method: GET
      path: /-/v1/search
      query:
        - name: text
          from: filter
          key: query
          default: react
    response:
      rows_path:
        - objects
    pagination:
      mode: offset
      offset_param: from
      offset_start: 0
      page_size:
        default: 20
        max: 250
        query_param: size
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: npm package name
        expr:
          kind: path
          path:
            - package
            - name
      - name: version
        type: Utf8
        nullable: true
        description: Latest package version
        expr:
          kind: path
          path:
            - package
            - version
      - name: description
        type: Utf8
        nullable: true
        description: Package description
        expr:
          kind: path
          path:
            - package
            - description
      - name: author
        type: Utf8
        nullable: true
        description: Package author metadata
        expr:
          kind: path
          path:
            - package
            - author
            - name
      - name: license
        type: Utf8
        nullable: true
        description: Declared package license
        expr:
          kind: path
          path:
            - package
            - license
      - name: homepage
        type: Utf8
        nullable: true
        description: Package homepage URL
        expr:
          kind: path
          path:
            - package
            - links
            - homepage
      - name: repository
        type: Utf8
        nullable: true
        description: Package repository URL
        expr:
          kind: path
          path:
            - package
            - links
            - repository
      - name: keywords
        type: Json
        nullable: true
        description: Package keyword array
        expr:
          kind: path
          path:
            - package
            - keywords
      - name: downloads_weekly
        type: Int64
        nullable: true
        description: Weekly download count when available in upstream payload
        expr:
          kind: path
          path:
            - downloads
            - weekly
      - name: downloads_monthly
        type: Int64
        nullable: true
        description: Monthly download count when available in upstream payload
        expr:
          kind: path
          path:
            - downloads
            - monthly
      - name: created_at
        type: Timestamp
        nullable: true
        description: Package creation timestamp
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - package
              - date
      - name: updated_at
        type: Timestamp
        nullable: true
        description: Last package update timestamp
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - package
              - date
      - name: query
        type: Utf8
        nullable: true
        virtual: true
        description: Optional npm search query
        expr:
          kind: from_filter
          key: query
  - name: versions
    description: Versions published for a specific npm package
    guide: |
      Requires `package_name`. Uses dictionary-entry row extraction over
      the package's `versions` map.
    filters:
      - name: package_name
        required: true
    request:
      method: GET
      path: /{{filter.package_name}}
    response:
      rows_path:
        - versions
      row_strategy: dict_entries
      allow_404_empty: true
    pagination:
      mode: none
    columns:
      - name: package_name
        type: Utf8
        nullable: false
        description: npm package name filter
        expr:
          kind: from_filter
          key: package_name
      - name: version
        type: Utf8
        nullable: false
        description: Version string
        expr:
          kind: path
          path:
            - _key
      - name: published_at
        type: Timestamp
        nullable: true
        description: Published timestamp for the version when available
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - time
              - _key
      - name: publisher
        type: Utf8
        nullable: true
        description: Publisher username
        expr:
          kind: path
          path:
            - _npmUser
            - name
      - name: dist_tarball
        type: Utf8
        nullable: true
        description: Tarball URL for this version
        expr:
          kind: path
          path:
            - dist
            - tarball
      - name: dist_shasum
        type: Utf8
        nullable: true
        description: Dist shasum
        expr:
          kind: path
          path:
            - dist
            - shasum
  - name: dependents
    description: Packages that depend on an npm package (search-based)
    guide: |
      Requires `package_name`. Uses npm search for dependency matches and
      returns matching package/version rows.
    filters:
      - name: package_name
        required: true
    request:
      method: GET
      path: /-/v1/search
      query:
        - name: text
          from: template
          template: dependencies:{{filter.package_name}}
    response:
      rows_path:
        - objects
    pagination:
      mode: offset
      offset_param: from
      offset_start: 0
      page_size:
        default: 20
        max: 250
        query_param: size
    columns:
      - name: package_name
        type: Utf8
        nullable: false
        description: Dependency package name filter
        expr:
          kind: from_filter
          key: package_name
      - name: dependent_name
        type: Utf8
        nullable: false
        description: Package depending on the filter package
        expr:
          kind: path
          path:
            - package
            - name
      - name: dependent_version
        type: Utf8
        nullable: true
        description: Latest version of the dependent package
        expr:
          kind: path
          path:
            - package
            - version
