name: github_v4
version: 0.1.0
dsl_version: 4
description: >-
  Preview DSL v4 source for exercising generated projections against a
  bundled GitHub OpenAPI slice and the live GitHub REST API endpoint.
surfaces:
  - id: rest
    type: openapi
    file: openapi.yaml
    sha256: 6884ab37f1bbccf6e9240473e710147d02594bb94f702d342ba56a3670dd40fa
    inputs:
      GITHUB_TOKEN:
        kind: secret
        hint: |
          GitHub personal access token used as a bearer token for the live
          GitHub REST API. Set GITHUB_TOKEN when installing this preview
          source.
    base_url: https://api.github.com
    auth:
      type: HeaderAuth
      headers:
        - name: Authorization
          from: template
          template: Bearer {{input.GITHUB_TOKEN}}
    request_headers:
      - name: Accept
        from: literal
        value: application/vnd.github+json
      - name: X-GitHub-Api-Version
        from: literal
        value: "2022-11-28"
      - name: User-Agent
        from: literal
        value: coral-dsl-v4
test_queries:
  - SELECT id, number, title, state FROM github_v4.issues WHERE owner = 'octocat' AND repo = 'Hello-World' LIMIT 5
  - SELECT id, number, title FROM github_v4.get_issue(owner => 'octocat', repo => 'Hello-World', issue_number => 1)
  - SELECT id, number, title FROM github_v4.search_issues(q => 'repo:octocat/Hello-World is:issue') LIMIT 5
