name: x_v4
dsl_version: 4
description: Query posts, users, search results, timelines, mentions, and engagement from X (formerly Twitter).
surfaces:
  - id: rest
    type: openapi
    url: https://api.x.com/2/openapi.json
    inputs:
      X_ACCESS_TOKEN:
        kind: secret
        hint: |
          X API token sent as an Authorization bearer token for X API v2
          requests. Use an OAuth 2.0 user-context access token for endpoints
          that require user authentication, or an app-only bearer token for
          public endpoints that support application-only auth. Many search and
          timeline endpoints require paid X API access.
    auth:
      type: HeaderAuth
      headers:
        - name: Authorization
          from: bearer
          key: X_ACCESS_TOKEN
    request_headers:
      - name: User-Agent
        from: literal
        value: coral-dsl-v4
    rate_limit:
      remaining_header: x-rate-limit-remaining
      reset_header: x-rate-limit-reset

test_queries:
  - >-
    SELECT id, text, author_id, username, created_at, public_metrics
    FROM x_v4.tweets_searchpostsrecent(
      query => 'from:XDevelopers',
      tweet_fields => 'author_id,created_at,conversation_id,public_metrics,referenced_tweets,in_reply_to_user_id',
      expansions => 'author_id',
      user_fields => 'username,name,public_metrics,verified,verified_type,description'
    )
    LIMIT 5
  - >-
    SELECT id, username, name, public_metrics
    FROM x_v4.users_getusersbyusernames(
      usernames => 'XDevelopers',
      user_fields => 'username,name,public_metrics,verified,verified_type,description'
    )
    LIMIT 5
