        - name: per_page
          in: query
          description: "Number of items per page (default: 25, max: 100)"
          required: false
          example: 25
          schema:
            type: integer
        - name: created_after
          in: query
          format: date-time
          description: Filter services created after this timestamp (ISO 8601 format)
          required: false
          example: 2025-09-01T00:00:00Z
          schema:
            type: string
      responses:
        "200":
          description: services filtered by created_after
          content:
