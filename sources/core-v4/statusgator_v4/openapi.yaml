        started_at:
          description: Event start time (UTC)
          type: string
          example: 2025-09-12T12:00:00Z
        ended_at:
          description: Event end time (UTC)
          type: string
          nullable: true
          example: 2025-09-12T13:00:00Z
        duration:
          description: Event duration in minutes
