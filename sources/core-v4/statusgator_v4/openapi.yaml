    Incident:
      type: object
      properties:
        id:
          description: Unique public ID of the incident
          type: string
          example: abc123def
        name:
          description: Name of the incident
          type: string
          example: Database outage
        details:
          description: Detailed information about the incident
          type: string
          nullable: true
          example: We are currently experiencing a database outage affecting all services.
        started_at:
          description: ISO 8601 timestamp of when the incident started
          type: string
          format: datetime
          nullable: true
          example: 2023-10-01T12:00:00Z
        resolved_at:
          description: ISO 8601 timestamp of when the incident was resolved
          type: string
          format: datetime
          nullable: true
          example: 2023-10-01T14:30:00Z
        phase:
          description: Current phase of the incident
          type: string
          example: investigating
          enum:
            - investigating
            - identified
            - monitoring
            - resolved
            - in_progress
            - verifying
            - completed
            - scheduled
        severity:
          description: Severity level of the incident
          type: string
          example: major
          enum:
            - minor
            - major
            - maintenance
        will_start_at:
          description: ISO 8601 timestamp of when scheduled maintenance will start
          type: string
          format: datetime
          nullable: true
          example: 2023-10-02T02:00:00Z
        will_end_at:
          description: ISO 8601 timestamp of when scheduled maintenance will end
          type: string
          format: datetime
          nullable: true
          example: 2023-10-02T04:00:00Z
        auto_complete_maintenance:
          description: Whether maintenance should be auto-completed
          type: boolean
          nullable: true
          example: false
        board_id:
          description: Public ID of the board this incident belongs to
          type: string
          example: lh16iGAYKI
        duration:
          description: Duration of the incident in minutes
          type: number
          nullable: true
          example: 150.5
        maintenance_duration:
          description: Duration of scheduled maintenance in minutes
          type: number
          nullable: true
          example: 120
        scheduled_maintenance:
          description: Whether this is a scheduled maintenance
          type: boolean
          example: false
        resolved_or_completed:
          description: Whether the incident is resolved or completed
          type: boolean
          example: false
        created_at:
          description: ISO 8601 timestamp of when the incident was created
          type: string
          format: datetime
          example: 2023-10-01T11:45:00Z
        updated_at:
          description: ISO 8601 timestamp of when the incident was last updated
          type: string
          format: datetime
          example: 2023-10-01T12:15:00Z
