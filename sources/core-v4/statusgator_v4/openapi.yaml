          type: string
          example: up
          enum:
            - up
            - down
            - warn
            - unknown
        last_checked_at:
          description: ISO 8601 timestamp of when the monitor was last checked
          type: string
          example: 2025-09-19T10:30:00Z
          nullable: true
        created_at:
          description: ISO 8601 timestamp of when the monitor was created
