openapi: 3.0.1
info:
  title: StatusGator API
  version: v3
  description: >
    # StatusGator API V3


    ## Introduction


    The StatusGator REST API V3 allows programatic access to your

    StatusGator dashboard and monitors. You can use the API to retrieve

    your entire dashboard, manage monitors, and access service

    information.


    ## Authentication


    All API requests require authentication using a Bearer token. Include

    your API token in the Authorization header:


    ```

    Authorization: Bearer YOUR_API_TOKEN

    ```


    Do not forget to add the "Bearer " prefix before your token in the

    header value.


    ## Token Generation


    You can generate API tokens from your StatusGator dashboard by clicking

    on the API menu on the left sidebar. This option is available only

    to organization admins.


    ## Token Permissions


    API tokens can be created with one of two permission levels:


    - **Full access** — Can perform all API operations (GET, POST, PATCH,
    DELETE)

    - **Read-only** — Limited to GET requests only. Any write operation (POST,
    PATCH, DELETE) will return a `403 Forbidden` response.


    ## Help and Support


    If you need help or have more questions, visit the

    [StatusGator Documentation](https://statusgator.com/docs).
paths:
  /boards/{board_id}/history:
    get:
      summary: Get board history
      tags:
        - Boards
      description: Returns a list of historical events affecting monitors on a board
        over a date range.
      operationId: getBoardHistory
      parameters:
        - name: board_id
          in: path
          description: Board public ID
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
        - name: start_date
          in: query
          description: Start date (inclusive) in YYYY-MM-DD. Defaults to 30 days ago if
            not provided.
          required: false
          example: 2025-09-01
          schema:
            type: string
        - name: end_date
          in: query
          description: End date (exclusive) in YYYY-MM-DD. Defaults to tomorrow (includes
            all of today) if not provided.
          required: false
          example: 2025-10-01
          schema:
            type: string
        - name: monitor_id
          in: query
          description: Optional filter to a specific monitor ID
          required: false
          example: A6das1igzR
          schema:
            type: string
      responses:
        "200":
          description: defaults to last 30 days when dates not provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoardRow"
        "401":
          description: unauthorized
        "404":
          description: board not found
        "422":
          description: invalid date format
  /boards:
    get:
      summary: List boards
      tags:
        - Boards
      description: >-
        Retrieve all boards belonging to your organization. Boards
                are like projects that display the status of selected services you depend
                on. Each board allows you to organize and monitor specific groups of
                services relevant to your operations. Results are paginated for efficient
                data retrieval.
      operationId: listBoards
      parameters:
        - name: page
          in: query
          description: "Page number for pagination (default: 1)"
          required: false
          example: 1
          schema:
            type: integer
        - name: per_page
          in: query
          description: "Number of items per page (default: 25, max: 100)"
          required: false
          example: 25
          schema:
            type: integer
      responses:
        "200":
          description: boards found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Board"
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
        "401":
          description: unauthorized
  /boards/{id}:
    get:
      summary: Get board details
      tags:
        - Boards
      description: Get details for a specific board
      operationId: getBoard
      parameters:
        - name: id
          in: path
          description: Board public ID
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
      responses:
        "200":
          description: board found
          content:
            application/json:
              schema:
                type: object
                additional_properties: true
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Board"
        "401":
          description: unauthorized
        "404":
          description: board not found
  /services/{service_id}/components:
    get:
      summary: List service components
      tags:
        - Services
      description: Retrieve all active components for a specific service. Components
        represent individual parts or subsystems of a service that are monitored
        separately (like API, Dashboard, Database, etc.).
      operationId: listServiceComponents
      parameters:
        - name: service_id
          in: path
          description: Public ID of the service
          required: true
          example: k2x9m7nPqR
          schema:
            type: string
        - name: page
          in: query
          description: "Page number for pagination (default: 1)"
          required: false
          example: 1
          schema:
            type: integer
        - name: per_page
          in: query
          description: "Number of items per page (default: 25, max: 100)"
          required: false
          example: 25
          schema:
            type: integer
      responses:
        "200":
          description: components with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Component"
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
        "401":
          description: unauthorized
        "404":
          description: service not found
  /boards/{board_id}/custom_monitors:
    post:
      summary: Create custom monitor
      tags:
        - Custom Monitors
      description: >-
        Create a new custom monitor for the specified board. Custom monitors
                allow you to add manually managed services to your status page. You can update
                their status manually as needed.
      operationId: createCustomMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
      responses:
        "201":
          description: custom monitor created with monitor group
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CustomMonitor"
        "401":
          description: unauthorized
        "422":
          description: validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the monitor
                  example: My Custom Service
                description:
                  type: string
                  description: Description for the monitor
                  example: Internal service we manually update
                monitor_group_id:
                  type: string
                  description: ID of the monitor group to assign this monitor to
                  example: x5y2m8nQrS
                  nullable: true
              required:
                - name
  /boards/{board_id}/custom_monitors/{id}:
    patch:
      summary: Update custom monitor
      tags:
        - Custom Monitors
      description: Update an existing custom monitor
      operationId: updateCustomMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
        - name: id
          in: path
          description: Unique ID of the custom monitor
          required: true
          example: x5y2m8nQrS
          schema:
            type: string
      responses:
        "200":
          description: custom monitor removed from group
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CustomMonitor"
        "401":
          description: unauthorized
        "404":
          description: custom monitor not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the monitor
                  example: Updated Custom Service
                description:
                  type: string
                  description: Description for the monitor
                  example: Updated description
                monitor_group_id:
                  type: string
                  description: ID of the monitor group to assign this monitor to (set to null to
                    remove from group)
                  example: x5y2m8nQrS
                  nullable: true
    delete:
      summary: Delete custom monitor
      tags:
        - Custom Monitors
      description: Delete a custom monitor from the board.
      operationId: deleteCustomMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
        - name: id
          in: path
          description: Unique ID of the custom monitor
          required: true
          example: x5y2m8nQrS
          schema:
            type: string
      responses:
        "200":
          description: custom monitor deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: unauthorized
        "404":
          description: custom monitor not found
  /boards/{board_id}/incidents/{incident_id}/incident_updates:
    post:
      summary: Create an incident update
      tags:
        - Incident Updates
      description: Create a new update for an existing incident. This allows you to
        provide status updates as you work to resolve the incident.
      operationId: createIncidentUpdate
      parameters:
        - name: board_id
          in: path
          description: Board public ID
          required: true
          example: lh16iGAYKI
          schema:
            type: string
        - name: incident_id
          in: path
          required: true
          description: The public id of the incident to update
          example: abc123def
          schema:
            type: string
      responses:
        "201":
          description: incident update resolved sets status to up
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/IncidentUpdate"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "404":
          description: incident not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "422":
          description: invalid monitor status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                details:
                  type: string
                  description: Details of the incident update
                  example: We have identified the root cause and are working on a fix.
                phase:
                  type: string
                  description: The current phase of the incident. For maintenance, use
                    "in_progress", "verifying", or "completed".
                  example: investigating
                  enum:
                    - investigating
                    - identified
                    - monitoring
                    - resolved
                    - in_progress
                    - verifying
                    - completed
                severity:
                  type: string
                  description: Severity level of the incident update
                  example: major
                  enum:
                    - minor
                    - major
                    - maintenance
                posted_at:
                  type: string
                  description: The time when the update was posted in ISO 8601 format
                  example: 2023-10-01T12:30:00Z
                notify_subscribers:
                  type: boolean
                  description: Whether to notify subscribers about this update
                  example: true
                monitors:
                  type: array
                  description: Array of monitor objects with id and status
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Subscription public ID
                      status:
                        type: string
                        enum:
                          - up
                          - down
                          - warn
                          - maintenance
                        description: Status to set for this monitor
                    required:
                      - id
                      - status
                  example:
                    - id: sadfkfefw
                      status: down
                    - id: dfeweqes
                      status: warn
              required:
                - phase
                - severity
  /boards/{board_id}/incidents:
    get:
      summary: List incidents for a board
      tags:
        - Incidents
      description: Get all incidents for a specific board
      operationId: listIncidents
      parameters:
        - name: board_id
          in: path
          description: Board public ID
          required: true
          example: lh16iGAYKI
          schema:
            type: string
        - name: page
          in: query
          description: "Page number for pagination (default: 1)"
          required: false
          example: 1
          schema:
            type: integer
        - name: per_page
          in: query
          description: "Number of items per page (default: 25, max: 100)"
          required: false
          example: 25
          schema:
            type: integer
        - name: phase
          in: query
          description: "Filter by phase (comma-separated). Valid: investigating,
            identified, monitoring, resolved, in_progress, verifying, completed,
            scheduled"
          required: false
          schema:
            type: string
        - name: severity
          in: query
          description: "Filter by severity (comma-separated). Valid: major, minor,
            maintenance"
          required: false
          schema:
            type: string
      responses:
        "200":
          description: incidents with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "404":
          description: board not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
    post:
      summary: Create an incident
      tags:
        - Incidents
      description: "

        \        Create a new incident or maintenance window to inform your

        \        users about service disruptions. For operational incidents

        \        use started_at and ended_at. For future maintenance use

        \        will_start_at and will_end_at.

        \      "
      operationId: createIncident
      parameters:
        - name: board_id
          in: path
          description: Board public ID
          required: true
          example: lh16iGAYKI
          schema:
            type: string
      responses:
        "201":
          description: future maintenance created with will_start_at and will_end_at
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Incident"
        "422":
          description: invalid monitor status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                incident:
                  type: object
                  properties:
                    name:
                      type: string
                      description: A short, descriptive name for the incident
                      example: Database outage
                    details:
                      type: string
                      description: Detailed information about the incident
                      example: We are currently experiencing a database outage affecting all services.
                        Our team is actively working to resolve the issue. We
                        will provide updates as soon as possible.
                    started_at:
                      type: string
                      description: The start time of the incident in ISO 8601 format
                      example: 2023-10-01T12:00:00Z
                    ended_at:
                      type: string
                      description: The end time of the incident in ISO 8601 format
                      example: 2023-10-01T14:00:00Z
                    will_start_at:
                      type: string
                      description: The scheduled start time for future maintenance in ISO 8601 format
                      example: 2023-10-05T01:00:00Z
                    will_end_at:
                      type: string
                      description: The scheduled end time for future maintenance in ISO 8601 format
                      example: 2023-10-05T03:00:00Z
                    phase:
                      type: string
                      description: The current phase of the incident. For operational incidents use
                        "investigating", "identified", "monitoring", or
                        "resolved". For maintenance use "in_progress",
                        "verifying", or "completed". For future scheduled
                        maintenance use "scheduled".
                      example: investigating
                      enum:
                        - investigating
                        - identified
                        - monitoring
                        - resolved
                        - in_progress
                        - verifying
                        - completed
                        - scheduled
                    severity:
                      type: string
                      description: The severity level of the incident
                      example: major
                      enum:
                        - minor
                        - major
                        - maintenance
                    notify_subscribers:
                      type: boolean
                      description: Whether to notify subscribers about the incident
                      example: true
                    monitors:
                      type: array
                      description: Array of monitor objects with id and status
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Subscription public ID
                          status:
                            type: string
                            enum:
                              - up
                              - down
                              - warn
                              - maintenance
                            description: Status to set for this monitor
                        required:
                          - id
                          - status
                      example:
                        - id: sadfkfefw
                          status: down
                        - id: dfeweqes
                          status: down
                  required:
                    - name
                    - phase
                    - severity
              required:
                - incident
  /boards/{board_id}/monitors/{monitor_id}/components:
    get:
      summary: List monitor components
      tags:
        - Boards
      description: >
        Retrieve active components for a specific monitor with status
        information.


        **Behavior:**

        - **StatusPageService monitors with no component filters:** Returns all
        components from the service (monitoring all components)

        - **StatusPageService monitors with component filters:** Returns only
        the filtered/subscribed components

        - **Non-StatusPageService monitors (WebsiteMonitor, PingMonitor,
        etc.):** Returns empty array


        Components include current status.
      operationId: listMonitorComponents
      parameters:
        - name: board_id
          in: path
          description: Public ID of the board
          required: true
          example: k2x9m7nPqR
          schema:
            type: string
        - name: monitor_id
          in: path
          description: Public ID of the monitor
          required: true
          example: k2x9m7nPqR
          schema:
            type: string
        - name: page
          in: query
          description: "Page number for pagination (default: 1)"
          required: false
          example: 1
          schema:
            type: integer
        - name: per_page
          in: query
          description: "Number of items per page (default: 25, max: 100)"
          required: false
          example: 25
          schema:
            type: integer
        - name: status
          in: query
          description: 'Filter components by status. Use "affected" to get all non-up
            components, or specify status values (comma-separated for multiple:
            "down,warn")'
          required: false
          example: affected
          schema:
            type: string
      responses:
        "200":
          description: monitor components found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MonitorComponent"
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
        "400":
          description: invalid status value
        "401":
          description: unauthorized
        "404":
          description: monitor not found
  /boards/{board_id}/monitor_groups:
    get:
      summary: List monitor groups for a board
      tags:
        - Monitor Groups
      description: Get all monitor groups for a board. Monitor groups allow you to
        organize monitors into logical categories for better organization and
        display on status pages.
      operationId: listMonitorGroups
      parameters:
        - name: board_id
          in: path
          description: Board ID
          required: true
          example: lh16iGAYKI
          schema:
            type: string
        - name: page
          in: query
          description: "Page number for pagination (default: 1)"
          required: false
          example: 1
          schema:
            type: integer
        - name: per_page
          in: query
          description: "Number of items per page (default: 25, max: 100)"
          required: false
          example: 25
          schema:
            type: integer
      responses:
        "200":
          description: monitor groups found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MonitorGroup"
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "404":
          description: board not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
    post:
      summary: Create a monitor group
      tags:
        - Monitor Groups
      description: Create a new monitor group for organizing monitors on a board.
      operationId: createMonitorGroup
      parameters:
        - name: board_id
          in: path
          description: Board ID
          required: true
          example: lh16iGAYKI
          schema:
            type: string
      responses:
        "201":
          description: monitor group created without position
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/MonitorGroup"
        "400":
          description: missing required parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "404":
          description: board not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                monitor_group:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the monitor group
                      example: Production Services
                    position:
                      type: integer
                      description: Display position of the group (lower numbers appear first)
                      example: 1
                  required:
                    - name
              required:
                - monitor_group
  /boards/{board_id}/monitor_groups/{id}:
    get:
      summary: Get a monitor group
      tags:
        - Monitor Groups
      description: Get details for a specific monitor group.
      operationId: getMonitorGroup
      parameters:
        - name: board_id
          in: path
          description: Board ID
          required: true
          example: lh16iGAYKI
          schema:
            type: string
        - name: id
          in: path
          description: Monitor group ID
          required: true
          example: x5y2m8nQrS
          schema:
            type: string
      responses:
        "200":
          description: monitor group found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/MonitorGroup"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "404":
          description: monitor group not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
