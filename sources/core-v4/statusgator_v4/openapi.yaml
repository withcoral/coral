                      description: Skip email confirmation and immediately confirm the subscription
                      example: false
                    monitor_ids:
                      type: array
                      description: Array of monitor IDs to subscribe to. Leave empty or omit to
                        subscribe to all monitors.
                      items:
                        type: string
                      example:
                        - m2z5x3nOJa
                        - k9p8q7rStU
                  required:
                    - email
              required:
                - subscriber
    delete:
      summary: Remove a status page subscriber
      tags:
        - Status Page Subscribers
      description: Remove a subscriber from the board's status page by providing
        either id or email in the request body
      operationId: deleteStatusPageSubscriber
      parameters:
        - name: board_id
          in: path
          description: Board ID
          required: true
          example: lh16iGAYKI
          schema:
            type: string
      responses:
        "200":
          description: subscriber deleted by email case insensitive
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "404":
          description: subscriber not found by email
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "422":
          description: missing id or email parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Subscriber ID (provide either id or email, not both)
                  example: m2z5x3nOJa
                email:
                  type: string
                  description: Subscriber email address (case insensitive, provide either id or
                    email, not both)
                  example: user@example.com
  /users:
    get:
      summary: List users
      tags:
        - Users
      description: >-
        Retrieve all users belonging to your organization. Users are
              members of your organization who can access StatusGator dashboards,
              configure monitoring settings, and receive notifications. Users can have
              either the role of org_admin or editor.
      operationId: listUsers
      responses:
        "200":
          description: users found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          description: unauthorized
  /boards/{board_id}/website_monitors:
    post:
      summary: Create website monitor
      tags:
        - Website Monitors
      description: >-
        Create a new website monitor for the specified board. Website monitors
                allow you to monitor the uptime and performance of websites and APIs. You can
                configure various monitoring options including check intervals, content monitoring,
                HTTP methods, and notification preferences.
      operationId: createWebsiteMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
      responses:
        "201":
          description: website monitor created with monitor group
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/WebsiteMonitor"
        "401":
          description: unauthorized
        "403":
          description: monitor limit reached
        "422":
          description: validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the monitor
                  example: My Website Monitor
                url:
                  type: string
                  description: Website URL to monitor
                  example: https://example.com
                description:
                  type: string
                  description: Optional description for the monitor
                  example: Production API monitoring
                check_interval:
                  type: integer
                  description: Check interval in minutes (1-5)
                  example: 5
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                check_content:
                  type: boolean
                  description: Monitor content vs uptime
                  example: false
                content:
                  type: string
                  description: Text content to search for (required if check_content=true)
                  example: "API Status: OK"
                alert_content_found:
                  type: boolean
                  description: Alert if content found vs not found
                  example: false
                check_regions:
                  type: array
                  items:
                    type: string
                  description: Monitoring regions
                  example:
                    - us-east
                    - us-west
                alert_any_location:
                  type: boolean
                  description: Alert if any location down vs all locations down
                  example: false
                http_method:
                  type: string
                  description: HTTP method to use
                  example: GET
                  enum:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                response_codes:
                  type: string
                  description: Expected HTTP response code
                  example: "200"
                follow_redirects:
                  type: boolean
                  description: Follow HTTP redirects
                  example: true
                timeout:
                  type: integer
                  description: Request timeout in seconds
                  example: 30
                  enum:
                    - 5
                    - 15
                    - 30
                    - 60
                retry_count:
                  type: integer
                  description: Number of retries before alerting
                  example: 0
                  enum:
                    - 0
                    - 1
                    - 2
                    - 3
                request_body:
                  type: string
                  description: Request body for POST/PUT requests
                  example: '{"test": true}'
                request_headers:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        example: Authorization
                      value:
                        type: string
                        example: Bearer token
                  description: HTTP headers to include with requests
                http_auth_username:
                  type: string
                  description: Basic authentication username
                  example: username
                http_auth_password:
                  type: string
                  description: Basic authentication password
                  example: password
                monitor_group_id:
                  type: string
                  description: ID of the monitor group to assign this monitor to
                  example: x5y2m8nQrS
                  nullable: true
              required:
                - name
                - url
  /boards/{board_id}/website_monitors/{id}:
    patch:
      summary: Update website monitor
      tags:
        - Website Monitors
      description: >-
        Update an existing website monitor. You can modify any of the
                monitoring configuration options including check intervals, content monitoring,
                HTTP methods, and notification preferences.
      operationId: updateWebsiteMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
        - name: id
          in: path
          description: Unique ID of the website monitor
          required: true
          example: x5y2m8nQrS
          schema:
            type: string
      responses:
        "200":
          description: update with monitor group
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/WebsiteMonitor"
        "401":
          description: unauthorized
        "404":
          description: website monitor not found
        "422":
          description: validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the monitor (cannot be empty if provided)
                  example: Updated Website Monitor
                  minLength: 1
                url:
                  type: string
                  description: Website URL to monitor (cannot be empty if provided)
                  example: https://updated-example.com
                  minLength: 1
                description:
                  type: string
                  description: Optional description for the monitor
                  example: Updated production API monitoring
                check_interval:
                  type: integer
                  description: Check interval in minutes (1-5)
                  example: 3
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                check_content:
                  type: boolean
                  description: Monitor content vs uptime
                  example: true
                content:
                  type: string
                  description: Text content to search for
                  example: Service Healthy
                alert_content_found:
                  type: boolean
                  description: Alert if content found vs not found
                  example: true
                check_regions:
                  type: array
                  items:
                    type: string
                  description: Monitoring regions
                  example:
                    - us-east
                    - eu-west
                alert_any_location:
                  type: boolean
                  description: Alert if any location down vs all locations down
                  example: true
                http_method:
                  type: string
                  description: HTTP method to use
                  example: POST
                  enum:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                response_codes:
                  type: string
                  description: Expected HTTP response code
                  example: "201"
                follow_redirects:
                  type: boolean
                  description: Follow HTTP redirects
                  example: false
                timeout:
                  type: integer
                  description: Request timeout in seconds
                  example: 60
                  enum:
                    - 5
                    - 15
                    - 30
                    - 60
                retry_count:
                  type: integer
                  description: Number of retries before alerting
                  example: 2
                  enum:
                    - 0
                    - 1
                    - 2
                    - 3
                request_body:
                  type: string
                  description: Request body for POST/PUT requests
                  example: '{"updated": true}'
                request_headers:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        example: X-API-Key
                      value:
                        type: string
                        example: secret123
                  description: HTTP headers to include with requests
                http_auth_username:
                  type: string
                  description: Basic authentication username
                  example: newusername
                http_auth_password:
                  type: string
                  description: Basic authentication password
                  example: newpassword
                monitor_group_id:
                  type: string
                  description: ID of the monitor group to assign this monitor to (set to null to
                    remove from group)
                  example: x5y2m8nQrS
                  nullable: true
    delete:
      summary: Delete website monitor
      tags:
        - Website Monitors
      description: Delete a website monitor from the board.
      operationId: deleteWebsiteMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
        - name: id
          in: path
          description: Unique ID of the website monitor
          required: true
          example: x5y2m8nQrS
          schema:
            type: string
      responses:
        "200":
          description: website monitor deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: unauthorized
        "404":
          description: monitor not found
  /boards/{board_id}/website_monitors/{id}/pause:
    post:
      summary: Pause website monitor
      tags:
        - Website Monitors
      description: Pause an active website monitor. When paused, the monitor will not
        be checked.
      operationId: pauseWebsiteMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
        - name: id
          in: path
          description: Unique ID of the website monitor
          required: true
          example: x5y2m8nQrS
          schema:
            type: string
      responses:
        "200":
          description: monitor paused successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/WebsiteMonitor"
        "401":
          description: unauthorized
        "404":
          description: monitor not found
  /boards/{board_id}/website_monitors/{id}/unpause:
    post:
      summary: Unpause website monitor
      tags:
        - Website Monitors
      description: Resume a paused website monitor. The monitor will begin checking again.
      operationId: unpauseWebsiteMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
        - name: id
          in: path
          description: Unique ID of the website monitor
          required: true
          example: x5y2m8nQrS
          schema:
            type: string
      responses:
        "200":
          description: monitor unpaused successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/WebsiteMonitor"
        "401":
          description: unauthorized
        "404":
          description: monitor not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    MonitoringRegion:
      type: object
      properties:
        region_id:
          description: Unique ID of the monitoring region
          type: string
          example: us-east
        dns_name:
          description: DNS name of the monitoring region
          type: string
          example: monitor-us-east.statusgator.com
        ip_address:
          description: IP address of the monitoring region
          type: string
          example: 52.1.2.3
        provider:
          description: Cloud provider of the monitoring region
          type: string
          example: AWS
        code:
          description: Code of the monitoring region
          type: string
          example: us-east-1
        name:
          description: Name of the monitoring region
          type: string
          example: US East
        desc:
          description: Description of the monitoring region
          type: string
          example: US East (N. Virginia)
        icon_url:
          description: Icon URL of the monitoring region
          type: string
          example: https://statusgator.com/assets/external_logos/aws.png
        color:
          description: Color associated with the monitoring region
          type: string
          example: "#1a5db2"
    Board:
      type: object
      properties:
        id:
          description: Unique ID for the board
          type: string
          example: m2z5x3nOJa
        name:
          description: Name of board
          type: string
          example: Cloud Services
        public_token:
          description: Public token for the board
          type: string
          example: abc123def456
        created_at:
          description: ISO 8601 timestamp of when the board was created
          type: string
          example: 2025-09-12T12:35:54Z
        updated_at:
          description: ISO 8601 timestamp of when the board was last updated
          type: string
          example: 2025-09-12T12:40:54Z
    Monitor:
      type: object
      properties:
        id:
          description: Unique ID for the monitor
          type: string
          example: uVLl2YK1rn
        checked_at:
          description: Last time the service status was checked
          type: string
          format: date_time
          example: 2025-09-05T23:05:23.463Z
        created_at:
          description: When this monitor was created
          type: string
          format: date_time
          example: 2023-07-06T14:18:35.607Z
        updated_at:
          description: When this monitor was last edited
          type: string
          format: date_time
          example: 2023-07-06T14:18:35.607Z
        filtered_status:
          description: The status of the monitor after filtering through component filters
          type: string
          enum:
            - up
            - down
            - warn
            - maintenance
          example: warn
        description:
          description: An optional description you provide for the monitor when creating
          type: string
          nullable: true
          example: null
        unfiltered_status:
          description: The original status of the monitor before applying any filters
          type: string
          enum:
            - up
            - down
            - warn
            - maintenance
          example: warn
        last_message:
          description: The last incident message or summary we collected, not always present
          type: string
          nullable: true
          example: CGK (Jakarta) on 2025-09-05
        last_details:
          description: The last incident description we collected, not always present
          type: string
          nullable: true
          example: In progress - Scheduled maintenance is currently in progress. We will
            provide updates as necessary. Sep 05, 2025 - 22:00 UTC
        overridden_message:
          description: If you have manually overridden the status of the monitor, the
            message you specified
          type: string
          nullable: true
          example: null
        overridden_status:
          description: Manually overridden status
          type: string
          enum:
            - up
            - down
            - warn
            - maintenance
          nullable: true
          example: null
        overrides_locked_at:
          description: If you locked the override, when you did so
          type: string
          format: date_time
          nullable: true
          example: null
        paused_at:
          description: If the monitor is paused (applies only to ping/website monitor)
          type: string
          format: date_time
          nullable: true
          example: null
        filter_count:
          description: If you have components filtered here, how many components you monitor
          type: integer
          example: 0
        icon_url:
          description: A URL to the icon, either the original icon or one you've uploaded
            to customize
          type: string
          example: https://favicons-dev.statusgator.com/FiM8Ile0FV3wLjxF.jpg
        position:
          description: If you have manually ordered your monitors, a numerical order
          type: integer
          example: 3
        monitor_type:
          description: The kind of monitor it is
          type: string
          enum:
            - ServiceMonitor
            - WebsiteMonitor
            - PingMonitor
            - CustomMonitor
          example: ServiceMonitor
        early_warning_signal:
          description: If we have detected an ongoing, unacknowledged outage
          type: boolean
          example: false
        display_name:
          description: The name of the monitor, either the default or your custom name
          type: string
          example: Cloudflare
        service:
          description: This section only shown for type ServiceMonitor
          type: object
          properties:
            id:
              description: Unique ID of the service
              type: string
              example: PQNMcnNFWw
            name:
              description: Name of the service
              type: string
              example: Cloudflare
            slug:
              description: URL friendly short name
              type: string
              example: cloudflare
            home_page_url:
              description: Home page URL
              type: string
              example: http://www.cloudflare.com
            status_page_url:
              description: Official status page URL, if applicable
