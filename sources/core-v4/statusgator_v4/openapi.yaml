        name:
          description: Monitor name
          type: string
          example: Zoom
        icon_url:
          description: Icon URL
          type: string
          example: zoom.png
        status:
          description: Status during the event
          type: string
          enum:
            - up
            - down
            - maintenance
            - unknown
            - warn
