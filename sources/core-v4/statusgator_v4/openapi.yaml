                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                      next_page:
                        type: integer
                        nullable: true
                      prev_page:
                        type: integer
                        nullable: true
        "400":
          description: bad request - invalid created_after format
        "401":
          description: unauthorized
        "403":
