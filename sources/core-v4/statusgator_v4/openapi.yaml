  /boards/{board_id}/ping_monitors:
    post:
      summary: Create ping monitor
      tags:
        - Ping Monitors
      description: >-
        Create a new ping monitor for the specified board. Ping monitors
                allow you to monitor the uptime and connectivity of hosts by sending ICMP ping
                requests. You can configure various monitoring options including check intervals,
                timeout settings, and notification preferences.
      operationId: createPingMonitor
      parameters:
        - name: board_id
          in: path
          description: Unique ID of the board
          required: true
          example: m2z5x3nOJa
          schema:
            type: string
      responses:
        "201":
          description: ping monitor created with monitor group
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PingMonitor"
        "401":
          description: unauthorized
        "403":
          description: monitor limit reached
        "422":
          description: validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the monitor
                  example: My Ping Monitor
                url:
                  type: string
                  description: Hostname or IP address to monitor
                  example: example.com
                description:
                  type: string
                  description: Optional description for the monitor
                  example: Production server monitoring
                check_interval:
                  type: integer
                  description: Check interval in minutes (1-5)
                  example: 5
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                check_regions:
                  type: array
                  items:
                    type: string
                  description: Monitoring regions
                  example:
                    - us-east
                    - us-west
                alert_any_location:
                  type: boolean
                  description: Alert if any location down vs all locations down
                  example: false
                timeout:
                  type: integer
                  description: Request timeout in seconds
                  example: 30
                  enum:
                    - 5
                    - 15
                    - 30
                    - 60
                retry_count:
                  type: integer
                  description: Number of retries before alerting
                  example: 0
                  enum:
                    - 0
                    - 1
                    - 2
                    - 3
                monitor_group_id:
                  type: string
                  description: ID of the monitor group to assign this monitor to
                  example: x5y2m8nQrS
                  nullable: true
              required:
                - name
                - url
