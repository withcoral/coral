name: statusgator_v4
version: 0.1.0
dsl_version: 4
surfaces:
  - id: rest
    type: openapi
    file: openapi.yaml
    sha256: 77c5b4ddcd8d6ae23f0a76c51f11bc4ae7fe55a8c19be5a07b52a0829406799d
    inputs:
      STATUSGATOR_API_TOKEN:
        kind: secret
    auth:
      type: HeaderAuth
      headers:
        - name: Authorization
          from: template
          template: Bearer {{input.STATUSGATOR_API_TOKEN}}
    request_headers:
      - name: Accept
        from: literal
        value: application/json
test_queries:
  - SELECT * FROM statusgator_v4.boards LIMIT 1
