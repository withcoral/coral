name: vercel
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Vercel projects, deployments, domains, environment variables,
  and teams from the Vercel REST API.
inputs:
  API_TOKEN:
    kind: secret
    hint: Vercel API bearer token.
  TEAM_ID:
    kind: variable
    hint: Optional Vercel team ID for team-scoped endpoints.
base_url: https://api.vercel.com
auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.API_TOKEN}}
request_headers:
  - name: Accept
    from: literal
    value: application/json
test_queries:
  - SELECT * FROM vercel.projects LIMIT 1
  - SELECT * FROM vercel.teams LIMIT 1
tables:
  - name: projects
    description: Vercel projects
    request:
      method: GET
      path: /v9/projects
      query:
        - name: teamId
          from: input
          key: TEAM_ID
    response:
      rows_path:
        - projects
    pagination:
      mode: cursor_query
      cursor_param: until
      response_cursor_path:
        - pagination
        - next
      page_size:
        default: 20
        max: 100
        query_param: limit
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Project ID
        expr:
          kind: path
          path:
            - id
      - name: name
        type: Utf8
        nullable: false
        description: Project name
        expr:
          kind: path
          path:
            - name
      - name: framework
        type: Utf8
        nullable: true
        description: Configured framework preset
        expr:
          kind: path
          path:
            - framework
      - name: node_version
        type: Utf8
        nullable: true
        description: Configured Node version
        expr:
          kind: path
          path:
            - nodeVersion
      - name: created_at
        type: Timestamp
        nullable: true
        description: Project creation timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - createdAt
      - name: updated_at
        type: Timestamp
        nullable: true
        description: Last project update timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - updatedAt
      - name: link__repo
        type: Utf8
        nullable: true
        description: Linked repository name
        expr:
          kind: path
          path:
            - link
            - repo
      - name: link__type
        type: Utf8
        nullable: true
        description: Linked integration type
        expr:
          kind: path
          path:
            - link
            - type
  - name: deployments
    description: Vercel deployments
    filters:
      - name: project_id
        required: false
    request:
      method: GET
      path: /v6/deployments
      query:
        - name: teamId
          from: input
          key: TEAM_ID
        - name: projectId
          from: filter
          key: project_id
    response:
      rows_path:
        - deployments
    pagination:
      mode: cursor_query
      cursor_param: until
      response_cursor_path:
        - pagination
        - next
      page_size:
        default: 20
        max: 100
        query_param: limit
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Deployment ID
        expr:
          kind: path
          path:
            - uid
      - name: project_id
        type: Utf8
        nullable: true
        description: Project ID owning the deployment
        expr:
          kind: path
          path:
            - projectId
      - name: url
        type: Utf8
        nullable: true
        description: Deployment URL
        expr:
          kind: path
          path:
            - url
      - name: state
        type: Utf8
        nullable: true
        description: Deployment state
        expr:
          kind: path
          path:
            - state
      - name: created_at
        type: Timestamp
        nullable: true
        description: Deployment creation timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - createdAt
      - name: ready_at
        type: Timestamp
        nullable: true
        description: Deployment readiness timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - readyStateAt
      - name: error_message
        type: Utf8
        nullable: true
        description: Error message for failed deployments
        expr:
          kind: path
          path:
            - errorMessage
      - name: source
        type: Utf8
        nullable: true
        description: Deployment source
        expr:
          kind: path
          path:
            - source
      - name: creator__email
        type: Utf8
        nullable: true
        description: Deployment creator email
        expr:
          kind: path
          path:
            - creator
            - email
  - name: domains
    description: Domains configured for a project
    guide: Requires `project_id`.
    filters:
      - name: project_id
        required: true
    request:
      method: GET
      path: /v9/projects/{{filter.project_id}}/domains
      query:
        - name: teamId
          from: input
          key: TEAM_ID
    response:
      rows_path:
        - domains
      allow_404_empty: true
    pagination:
      mode: cursor_query
      cursor_param: until
      response_cursor_path:
        - pagination
        - next
      page_size:
        default: 20
        max: 100
        query_param: limit
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Domain name
        expr:
          kind: path
          path:
            - name
      - name: project_id
        type: Utf8
        nullable: false
        description: Project ID filter
        expr:
          kind: from_filter
          key: project_id
      - name: verified
        type: Boolean
        nullable: true
        description: Whether the domain is verified
        expr:
          kind: path
          path:
            - verified
      - name: created_at
        type: Timestamp
        nullable: true
        description: Domain creation timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - createdAt
      - name: expires_at
        type: Timestamp
        nullable: true
        description: Domain expiration timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - expiresAt
      - name: cdn_enabled
        type: Boolean
        nullable: true
        description: Whether Vercel CDN is enabled
        expr:
          kind: path
          path:
            - cdnEnabled
  - name: env_vars
    description: Environment variables for a project
    guide: Requires `project_id`.
    filters:
      - name: project_id
        required: true
    request:
      method: GET
      path: /v10/projects/{{filter.project_id}}/env
      query:
        - name: teamId
          from: input
          key: TEAM_ID
    response:
      rows_path:
        - envs
      allow_404_empty: true
    pagination:
      mode: cursor_query
      cursor_param: until
      response_cursor_path:
        - pagination
        - next
      page_size:
        default: 20
        max: 100
        query_param: limit
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Environment variable ID
        expr:
          kind: path
          path:
            - id
      - name: project_id
        type: Utf8
        nullable: false
        description: Project ID filter
        expr:
          kind: from_filter
          key: project_id
      - name: key
        type: Utf8
        nullable: true
        description: Environment variable key
        expr:
          kind: path
          path:
            - key
      - name: target
        type: Json
        nullable: true
        description: Environment variable target environments
        expr:
          kind: path
          path:
            - target
      - name: created_at
        type: Timestamp
        nullable: true
        description: Creation timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - createdAt
      - name: updated_at
        type: Timestamp
        nullable: true
        description: Last update timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - updatedAt
  - name: teams
    description: Vercel teams available to the token
    request:
      method: GET
      path: /v2/teams
    response:
      rows_path:
        - teams
    pagination:
      mode: cursor_query
      cursor_param: until
      response_cursor_path:
        - pagination
        - next
      page_size:
        default: 20
        max: 100
        query_param: limit
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Team ID
        expr:
          kind: path
          path:
            - id
      - name: name
        type: Utf8
        nullable: true
        description: Team name
        expr:
          kind: path
          path:
            - name
      - name: slug
        type: Utf8
        nullable: true
        description: Team slug
        expr:
          kind: path
          path:
            - slug
      - name: created_at
        type: Timestamp
        nullable: true
        description: Team creation timestamp
        expr:
          kind: format_timestamp
          input: milliseconds
          expr:
            kind: path
            path:
              - createdAt
      - name: member_count
        type: Int64
        nullable: true
        description: Team member count
        expr:
          kind: path
          path:
            - membership
            - count
