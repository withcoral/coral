name: x_v4
dsl_version: 4
description: Query posts, users, search results, timelines, mentions, and engagement from X (formerly Twitter).
inputs:
  X_ACCESS_TOKEN:
    kind: secret
    hint: |
      X API token sent as an Authorization bearer token for X API v2
      requests. Use an OAuth 2.0 user-context access token for endpoints
      that require user authentication, or an app-only bearer token for
      public endpoints that support application-only auth. Many search and
      timeline endpoints require paid X API access.
surface:
  type: openapi
  url: https://api.x.com/2/openapi.json
  auth:
    type: HeaderAuth
    headers:
      - name: Authorization
        from: bearer
        key: X_ACCESS_TOKEN
  request_headers:
    - name: User-Agent
      from: literal
      value: coral-dsl-v4
  rate_limit:
    remaining_header: x-rate-limit-remaining
    reset_header: x-rate-limit-reset

test_queries:
  - SELECT id, text FROM x_v4.posts.search_recents(query => 'from:XDevelopers', max_results => 10) LIMIT 5
