  /files.list:
    get:
      operationId: files/list
      tags:
        - files
      summary: List files for a team, in a channel, or from a user with applied filters.
      description: "List files for a team, in a channel, or from a user with applied filters. Requires one of the scopes: files:read. Rate limit: Tier 3: 50+ per minute. See https://docs.slack.dev/reference/methods/files.list."
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            type: string
            default: "100"
          description: Filter files appearing in a specific channel, indicated by its ID.
        - name: show_files_hidden_by_limit
          in: query
          required: false
          schema:
            type: boolean
          description: Show truncated file info for files hidden due to being too old, and the team who owns the file being over the file limit.
          example: true
        - name: team_id
          in: query
          required: false
          schema:
            type: string
          description: encoded team id to list files in, required if org token is used
        - name: ts_from
          in: query
          required: false
          schema:
            type: string
          description: Filter files created after this timestamp (inclusive).
          example: "123456789"
        - name: ts_to
          in: query
          required: false
          schema:
            type: string
          description: Filter files created before this timestamp (inclusive).
          example: "123456789"
        - name: types
          in: query
          required: false
          schema:
            type: string
            default: all
          description: Filter files by type (see below). You can pass multiple values in the types argument, like `types=spaces,snippets`.The default value is `all`, which does not filter the list.
          example: images
        - name: user
          in: query
          required: false
          schema:
            type: string
          description: Filter files created by a single user.
      responses:
        "200":
          description: "Response envelope. Slack reports failures here with `ok: false`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
                  needed:
                    type: string
                  ok:
                    type: boolean
                  paging:
                    type: object
                    properties:
                      count:
                        type: integer
                      page:
                        type: integer
                      pages:
                        type: integer
                      total:
                        type: integer
                  provided:
                    type: string
