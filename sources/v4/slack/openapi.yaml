  /files.remote.list:
    get:
      operationId: files/remote_list
      tags:
        - files
      summary: Retrieve information about a remote file added to Slack
      description: "Retrieve information about a remote file added to Slack Requires one of the scopes: remote_files:read. Rate limit: Tier 2: 20+ per minute. See https://docs.slack.dev/reference/methods/files.remote.list."
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            type: string
          description: Filter files appearing in a specific channel, indicated by its ID.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Paginate through collections of data by setting the `cursor` parameter to a `next_cursor` attribute returned by a previous request's `response_metadata`. Default value fetches the first "page" of the collection. See pagination for more detail.
          example: dXNlcjpVMDYxTkZUVDI=
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: The maximum number of items to return.
          example: 20
        - name: ts_from
          in: query
          required: false
          schema:
            type: string
            default: "0"
          description: Filter files created after this timestamp (inclusive).
          example: "123456789"
        - name: ts_to
          in: query
          required: false
          schema:
            type: string
            default: now
          description: Filter files created before this timestamp (inclusive).
          example: "123456789"
      responses:
        "200":
          description: "Response envelope. Slack reports failures here with `ok: false`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
                  needed:
                    type: string
                  ok:
                    type: boolean
                  provided:
                    type: string
                  response_metadata:
                    type: object
                    properties:
                      next_cursor:
                        type: string
