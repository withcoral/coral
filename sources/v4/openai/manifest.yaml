name: openai_v4
dsl_version: 4
inputs:
  OPENAI_API_KEY:
    kind: secret
surface:
  type: openapi
  url: https://raw.githubusercontent.com/openai/openai-openapi/refs/heads/main/openapi.yaml
  auth:
    type: HeaderAuth
    headers:
      - name: Authorization
        from: template
        template: Bearer {{input.OPENAI_API_KEY}}
