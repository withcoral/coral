name: hubspot
version: 0.2.0
dsl_version: 3
backend: http
description: >-
  Query HubSpot CRM contacts, companies, deals, tickets, owners, calls, emails, meetings, notes, tasks, products, line_items, quotes, and pipelines from
  HubSpot (Cloud). Join with bundled Stripe, Intercom, and Linear sources
  on email and company domain.
inputs:
  HUBSPOT_ACCESS_TOKEN:
    kind: secret
    required: true
    hint: |
      Private app access token (Bearer). Create a private app under
      Settings > Integrations > Private Apps with read scopes for CRM
      objects you plan to query (e.g. crm.objects.contacts.read, crm.objects.companies.read, crm.objects.deals.read, crm.objects.line_items.read, crm.objects.products.read, crm.objects.quotes.read, crm.objects.owners.read, crm.objects.pipelines.read, and activity scopes). See
      [HubSpot private apps](https://developers.hubspot.com/docs/apps/legacy-apps/private-apps/overview).
base_url: https://api.hubapi.com
auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.HUBSPOT_ACCESS_TOKEN}}
request_headers:
  - name: Accept
    from: literal
    value: application/json
test_queries:
  - SELECT id, email, firstname, lastname FROM hubspot.contacts LIMIT 5
  - SELECT id, email FROM hubspot.owners LIMIT 5
tables:
  - name: contacts
    description: HubSpot CRM contacts (people).
    guide: |
      Start here for customer identity. Join `email` to `stripe.customers`,
      `intercom.contacts`, and `linear.users`. Use `hubspot_owner_id` with
      `hubspot.owners`. Prefer `search_contacts` when you know the email.
      Always use `LIMIT` on large portals; respect HubSpot rate limits.
    fetch_limit_default: 100
    request:
      method: GET
      path: /crm/v3/objects/contacts
      query:
        - name: properties
          from: literal
          value: >-
            email,firstname,lastname,jobtitle,company,phone,lifecyclestage,
            hubspot_owner_id,createdate,lastmodifieddate
        - name: archived
          from: literal
          value: "false"
    response:
      rows_path:
        - results
      allow_404_empty: false
      row_strategy: direct
    pagination:
      mode: cursor_query
      cursor_param: after
      response_cursor_path:
        - paging
        - next
        - after
      page_size:
        default: 100
        max: 100
        query_param: limit
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: HubSpot contact record ID.
        expr:
          kind: path
          path:
            - id
      - name: email
        type: Utf8
        nullable: true
        description: Primary email address (join key for Stripe, Intercom, Linear).
        expr:
          kind: path
          path:
            - properties
            - email
      - name: firstname
        type: Utf8
        nullable: true
        description: First name.
        expr:
          kind: path
          path:
            - properties
            - firstname
      - name: lastname
        type: Utf8
        nullable: true
        description: Last name.
        expr:
          kind: path
          path:
            - properties
            - lastname
      - name: jobtitle
        type: Utf8
        nullable: true
        description: Job title.
        expr:
          kind: path
          path:
            - properties
            - jobtitle
      - name: company
        type: Utf8
        nullable: true
        description: Associated company name on the contact record.
        expr:
          kind: path
          path:
            - properties
            - company
      - name: phone
        type: Utf8
        nullable: true
        description: Phone number.
        expr:
          kind: path
          path:
            - properties
            - phone
      - name: lifecyclestage
        type: Utf8
        nullable: true
        description: Lifecycle stage (for example subscriber, lead, customer).
        expr:
          kind: path
          path:
            - properties
            - lifecyclestage
      - name: hubspot_owner_id
        type: Utf8
        nullable: true
        description: Owner ID; join to `hubspot.owners.id`.
        expr:
          kind: path
          path:
            - properties
            - hubspot_owner_id
      - name: created_at
        type: Timestamp
        nullable: true
        description: Record creation time.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - createdAt
      - name: updated_at
        type: Timestamp
        nullable: true
        description: Record last modified time.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - updatedAt
