    guide: |
      Requires `email`. Use instead of scanning `contacts` when you know the
      address. Subject to HubSpot Search API rate limits (~4 req/s per token).
    fetch_limit_default: 50
    filters:
      - name: email
        required: true
    request:
      method: POST
      path: /crm/v3/objects/contacts/search
      body:
        - path:
            - filterGroups
            - "0"
            - filters
            - "0"
            - propertyName
          from: literal
          value: email
        - path:
            - filterGroups
            - "0"
            - filters
            - "0"
            - operator
          from: literal
          value: EQ
        - path:
            - filterGroups
            - "0"
            - filters
            - "0"
            - value
          from: filter
          key: email
        - path:
            - properties
          from: literal
          value:
            - email
            - firstname
            - lastname
            - jobtitle
            - company
            - lifecyclestage
            - hubspot_owner_id
