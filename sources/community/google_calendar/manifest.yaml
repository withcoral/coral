name: google_calendar
version: 0.1.0
dsl_version: 3
description: >
  Query Google Calendar events, calendars, and settings using SQL.
  Supports listing calendars, fetching events with time filters,
  and reading account-level settings such as timezone.
backend: http

inputs:
  GOOGLE_CALENDAR_ACCESS_TOKEN:
    kind: secret
     hint: >
      Google OAuth2 access token with the
      https://www.googleapis.com/auth/calendar.readonly scope.
      Obtain a token via Google OAuth Playground:
      https://developers.google.com/oauthplayground
      Select the Calendar API v3 readonly scope, authorize,
      and copy the access token.

base_url: "https://www.googleapis.com/calendar/v3"

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      template: "Bearer {{input.GOOGLE_CALENDAR_ACCESS_TOKEN}}"

tables:

  - name: calendar_list
    request:
      method: GET
      path: /users/me/calendarList
    response:
      rows_path:
        - items
    pagination:
      mode: cursor_query
      cursor_path:
        - nextPageToken
      cursor_param: pageToken
      max_pages: 50
    filters:
      - name: min_access_role
        param: minAccessRole
        description: >
          Filter by minimum access role.
          One of: freeBusyReader, reader, writer, owner.
    columns:
      - name: id
        type: Utf8
        description: The calendar unique ID.
      - name: summary
        type: Utf8
        description: Title of the calendar.
      - name: description
        type: Utf8
        description: Optional description of the calendar.
      - name: time_zone
        type: Utf8
        expr:
          kind: path
          path: timeZone
        description: Timezone the calendar uses, e.g. Asia/Kolkata.
      - name: access_role
        type: Utf8
        expr:
          kind: path
          path: accessRole
        description: Your access level - freeBusyReader, reader, writer, or owner.
      - name: primary
        type: Boolean
        description: True if this is your primary calendar.
      - name: selected
        type: Boolean
        description: True if this calendar is shown in the Google Calendar UI.
      - name: background_color
        type: Utf8
        expr:
          kind: path
          path: backgroundColor
        description: Hex color code for this calendar.
      - name: foreground_color
        type: Utf8
        expr:
          kind: path
          path: foregroundColor
        description: Hex color code for text on this calendar.
      - name: color_id
        type: Utf8
        expr:
          kind: path
          path: colorId
        description: Google color ID string for this calendar.

  - name: events
    request:
      method: GET
      path: /calendars/{{filter.calendarId}}/events
    response:
      rows_path:
        - items
    pagination:
      mode: cursor_query
      cursor_path:
        - nextPageToken
      cursor_param: pageToken
      max_pages: 100
    filters:
      - name: calendarId
        param: calendarId
        default: "primary"
        description: The calendar to fetch events from. Use primary for main calendar.
      - name: time_min
        param: timeMin
        description: Lower bound for event start times. RFC3339 format.
      - name: time_max
        param: timeMax
        description: Upper bound for event start times. RFC3339 format.
      - name: q
        param: q
        description: Free-text search across event fields.
      - name: single_events
        param: singleEvents
        default: "true"
        description: Expand recurring events into individual instances.
      - name: order_by
        param: orderBy
        default: "startTime"
        description: Sort order - startTime or updated.
      - name: max_results
        param: maxResults
        default: "250"
        description: Maximum events returned per page.
    columns:
      - name: id
        type: Utf8
        description: Unique event ID.
      - name: summary
        type: Utf8
        description: Event title.
      - name: description
        type: Utf8
        description: Event description or notes.
      - name: location
        type: Utf8
        description: Location string.
      - name: status
        type: Utf8
        description: confirmed, tentative, or cancelled.
      - name: html_link
        type: Utf8
        expr:
          kind: path
          path: htmlLink
        description: Direct URL to open this event in Google Calendar.
      - name: created
        type: Utf8
        description: RFC3339 timestamp when the event was created.
      - name: updated
        type: Utf8
        description: RFC3339 timestamp when the event was last modified.
      - name: start__date_time
        type: Utf8
        expr:
          kind: path
          path: start.dateTime
        description: RFC3339 start timestamp for timed events.
      - name: start__date
        type: Utf8
        expr:
          kind: path
          path: start.date
        description: Date-only start for all-day events.
      - name: start__time_zone
        type: Utf8
        expr:
          kind: path
          path: start.timeZone
        description: Timezone for the start time.
      - name: end__date_time
        type: Utf8
        expr:
          kind: path
          path: end.dateTime
        description: RFC3339 end timestamp for timed events.
      - name: end__date
        type: Utf8
        expr:
          kind: path
          path: end.date
        description: Date-only end for all-day events.
      - name: end__time_zone
        type: Utf8
        expr:
          kind: path
          path: end.timeZone
        description: Timezone for the end time.
      - name: organizer__email
        type: Utf8
        expr:
          kind: path
          path: organizer.email
        description: Email of whoever organized the event.
      - name: organizer__display_name
        type: Utf8
        expr:
          kind: path
          path: organizer.displayName
        description: Display name of the organizer.
      - name: organizer__self
        type: Boolean
        expr:
          kind: path
          path: organizer.self
        description: True if you are the organizer.
      - name: creator__email
        type: Utf8
        expr:
          kind: path
          path: creator.email
        description: Email of the person who created the event.
      - name: creator__display_name
        type: Utf8
        expr:
          kind: path
          path: creator.displayName
        description: Display name of the creator.
      - name: color_id
        type: Utf8
        expr:
          kind: path
          path: colorId
        description: Color assigned to this event.
      - name: transparency
        type: Utf8
        description: opaque blocks time, transparent does not.
      - name: visibility
        type: Utf8
        description: default, public, private, or confidential.
      - name: i_cal_uid
        type: Utf8
        expr:
          kind: path
          path: iCalUID
        description: Globally unique iCalendar UID.
      - name: sequence
        type: Int64
        description: Version counter, increments on each modification.
      - name: recurring_event_id
        type: Utf8
        expr:
          kind: path
          path: recurringEventId
        description: ID of the parent recurring event if this is an instance.

  - name: settings
    request:
      method: GET
      path: /users/me/settings
    response:
      rows_path:
        - items
    pagination:
      mode: cursor_query
      cursor_path:
        - nextPageToken
      cursor_param: pageToken
      max_pages: 10
    columns:
      - name: id
        type: Utf8
        description: Setting name e.g. timezone, dateFieldOrder, timeMode.
      - name: value
        type: Utf8
        description: The current value of this setting.
      - name: kind
        type: Utf8
        description: Always calendar#setting.