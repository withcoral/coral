name: zoho_books
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Zoho Books API v3 financial and operations data including contacts,
  invoices, bills, expenses, payments, items, chart of accounts, journals,
  and projects with OAuth authentication and paginated fetch support.

base_url: "{{input.ZOHO_API_DOMAIN}}/books/v3"

# ---------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------
inputs:
  ZOHO_API_DOMAIN:
    kind: variable
    default: https://www.zohoapis.com
    hint: >-
      Zoho API domain for your data center. US: https://www.zohoapis.com,
      EU: https://www.zohoapis.eu, IN: https://www.zohoapis.in,
      AU: https://www.zohoapis.com.au, JP: https://www.zohoapis.jp,
      CA: https://www.zohoapis.ca, CN: https://www.zohoapis.com.cn,
      SA: https://www.zohoapis.sa

  ZOHO_ORGANIZATION_ID:
    kind: variable
    hint: >-
      Your Zoho Books organization_id. Look it up with
      GET {ZOHO_API_DOMAIN}/books/v3/organizations or copy it from the
      Zoho Books URL after signing in. Required on every API call.

  ZOHO_OAUTH_TOKEN:
    kind: secret
    hint: >-
      Zoho Books OAuth access token. Generate this from Zoho API Console
      or your OAuth flow and provide it as a secret during source install.

# ---------------------------------------------------------------------------
# Auth — Zoho uses `Zoho-oauthtoken <token>`, not `Bearer <token>`
# ---------------------------------------------------------------------------
auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: "Zoho-oauthtoken {{input.ZOHO_OAUTH_TOKEN}}"

# Non-auth request headers applied to every request.
request_headers:
  - name: Accept
    from: literal
    value: application/json

# Zoho Books rate limit: 100 requests/minute/organization. 429 on exceed.
rate_limit:
  extra_statuses: [429]
  retry_after_header: Retry-After

# ---------------------------------------------------------------------------
# Shared pagination + organization_id pattern
# ---------------------------------------------------------------------------
# Each table:
#   - sends organization_id as a query param on every request
#   - paginates via ?page=N&per_page=M, starting at page 1
#   - reads rows from the resource-specific top-level key (contacts, invoices, …)
# Zoho signals end-of-data via response.page_context.has_more_page=false;
# Coral's page mode stops automatically when a page returns zero rows, which
# Zoho does once has_more_page becomes false on the next page.

tables:

  # -------------------------------------------------------------------------
  # organizations — does NOT require organization_id; useful for discovery
  # -------------------------------------------------------------------------
  - name: organizations
    description: Zoho Books organizations the authenticated user can access.
    request:
      method: GET
      path: /organizations
    response:
      rows_path: [organizations]
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: organization_id
        type: Utf8
      - name: name
        type: Utf8
      - name: contact_name
        type: Utf8
      - name: company_id_label
        type: Utf8
      - name: company_id_value
        type: Utf8
      - name: currency_code
        type: Utf8
      - name: currency_symbol
        type: Utf8
      - name: time_zone
        type: Utf8
      - name: date_format
        type: Utf8
      - name: country
        type: Utf8
      - name: state
        type: Utf8
      - name: industry_type
        type: Utf8
      - name: is_default_org
        type: Boolean
      - name: fiscal_year_start_month
        type: Utf8

  # -------------------------------------------------------------------------
  # contacts — both customers and vendors
  # -------------------------------------------------------------------------
  - name: contacts
    description: Customers and vendors in Zoho Books.
    fetch_limit_default: 100
    filters:
      - name: contact_type
      - name: filter_by
      - name: search_text
    request:
      method: GET
      path: /contacts
      query:
        - name: organization_id
          from: template
          template: "{{input.ZOHO_ORGANIZATION_ID}}"
        - name: contact_type
          from: filter
          key: contact_type
        - name: filter_by
          from: filter
          key: filter_by
        - name: search_text
          from: filter
          key: search_text
    response:
      rows_path: [contacts]
      row_strategy: direct
    pagination:
      mode: page
      page_param: page
      page_start: 1
      page_size:
        default: 200
        max: 200
        query_param: per_page
    columns:
      - name: contact_id
        type: Utf8
      - name: contact_name
        type: Utf8
      - name: company_name
        type: Utf8
      - name: contact_type
        type: Utf8
        description: customer | vendor
      - name: status
        type: Utf8
      - name: payment_terms
        type: Int64
      - name: payment_terms_label
        type: Utf8
      - name: currency_id
        type: Utf8
      - name: currency_code
        type: Utf8
      - name: outstanding_receivable_amount
        type: Float64
      - name: outstanding_payable_amount
        type: Float64
      - name: unused_credits_receivable_amount
        type: Float64
      - name: unused_credits_payable_amount
        type: Float64
      - name: first_name
        type: Utf8
      - name: last_name
        type: Utf8
      - name: email
        type: Utf8
      - name: phone
        type: Utf8
      - name: mobile
        type: Utf8
      - name: created_time
        type: Utf8
      - name: last_modified_time
