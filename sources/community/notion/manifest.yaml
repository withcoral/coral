name: notion
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Notion pages, databases (data_sources), search results, blocks,
  and users. Designed for read-only discovery of pages, database rows,
  and block children using a Notion integration token.
base_url: https://api.notion.com/v1

inputs:
  NOTION_API_KEY:
    kind: secret
    hint: >-
      Notion integration token or internal integration API key.
      Supply the full token string (the manifest will send it as a
      `Bearer` token in the `Authorization` header).

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.NOTION_API_KEY}}
    - name: Notion-Version
      from: literal
      value: "2026-03-11"

test_queries:
  - SELECT id, object, url FROM notion.search LIMIT 5

tables:
  - name: search
    description: >-
      Search pages and data_sources shared with the connection. Returns
      matching pages and data_sources; use `query` filter to search by
      title/text. See Notion `/v1/search`.
    guide: >-
      `SELECT id, object, url FROM notion.search WHERE query = 'meeting notes'`.
    filters:
      - name: query
        required: false
      - name: object
        required: false
        hint: "Set to 'page' or 'data_source' to restrict results."
      - name: page_size
        required: false
    request:
      method: POST
      path: /search
      body:
        - path:
            - query
          from: filter
          key: query
        - path:
            - filter
          from: filter
          key: object
        - path:
            - page_size
          from: filter
          key: page_size
        - path:
            - start_cursor
          from: filter
          key: start_cursor
    response:
      rows_path:
        - results
      row_strategy: direct
    pagination:
      mode: cursor_body
      cursor_body_path:
        - start_cursor
      response_cursor_path:
        - next_cursor
      max_pages: 50
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Notion object ID.
        expr:
          kind: path
          path:
            - id
      - name: object
        type: Utf8
        nullable: false
        description: Object type (page, data_source, etc.).
        expr:
          kind: path
          path:
            - object
      - name: url
        type: Utf8
        nullable: true
        description: Public or workspace URL for the object.
        expr:
          kind: path
          path:
            - url
      - name: created_time
        type: Timestamp
        nullable: true
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - created_time
      - name: last_edited_time
        type: Timestamp
        nullable: true
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - last_edited_time
      - name: is_archived
        type: Boolean
        nullable: true
        expr:
          kind: path
          path:
            - in_trash
      - name: raw
        type: Json
        nullable: false
        description: Full raw object for downstream parsing.
        expr:
          kind: current_row

  - name: database_rows
    description: >-
      Query rows for a specific database (data_source). Requires
      `database_id` filter. Maps to POST `/v1/databases/{database_id}/query`.
    guide: >-
      `SELECT id, properties, url FROM notion.database_rows WHERE database_id = '<id>' LIMIT 10`.
    filters:
      - name: database_id
        required: true
      - name: page_size
        required: false
      - name: start_cursor
        required: false
    request:
      method: POST
      path: /databases/{{filter.database_id}}/query
      body:
        - path:
            - page_size
          from: filter
          key: page_size
        - path:
            - start_cursor
          from: filter
          key: start_cursor
    response:
      rows_path:
        - results
      row_strategy: direct
    pagination:
      mode: cursor_body
      cursor_body_path:
        - start_cursor
      response_cursor_path:
        - next_cursor
      max_pages: 200
    columns:
      - name: id
        type: Utf8
        nullable: false
        expr:
          kind: path
          path:
            - id
      - name: url
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - url
      - name: properties
        type: Json
        nullable: true
        expr:
          kind: path
          path:
            - properties
      - name: created_time
        type: Timestamp
        nullable: true
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - created_time
      - name: last_edited_time
        type: Timestamp
        nullable: true
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - last_edited_time
      - name: raw
        type: Json
        nullable: false
        expr:
          kind: current_row

  - name: pages
    description: >-
      Retrieve a single page by `page_id`. Maps to GET `/v1/pages/{page_id}`.
    filters:
      - name: page_id
        required: true
    request:
      method: GET
      path: /pages/{{filter.page_id}}
    response:
      rows_path:
        - (root)
      row_strategy: single
    columns:
      - name: id
        type: Utf8
        nullable: false
        expr:
          kind: path
          path:
            - id
      - name: url
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - url
      - name: properties
        type: Json
        nullable: true
        expr:
          kind: path
          path:
            - properties
      - name: created_time
        type: Timestamp
        nullable: true
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - created_time
      - name: last_edited_time
        type: Timestamp
        nullable: true
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - last_edited_time
      - name: raw
        type: Json
        nullable: false
        expr:
          kind: current_row

  - name: block_children
    description: >-
      List children blocks for a block or page. Maps to GET
      `/v1/blocks/{block_id}/children`.
    filters:
      - name: block_id
        required: true
      - name: page_size
        required: false
      - name: start_cursor
        required: false
    request:
      method: GET
      path: /blocks/{{filter.block_id}}/children
      query:
        - name: page_size
          from: filter
          key: page_size
        - name: start_cursor
          from: filter
          key: start_cursor
    response:
      rows_path:
        - results
      row_strategy: direct
    pagination:
      mode: cursor_query
      cursor_param: start_cursor
      response_cursor_path:
        - next_cursor
      max_pages: 200
    columns:
      - name: id
        type: Utf8
        nullable: false
        expr:
          kind: path
          path:
            - id
      - name: type
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - type
      - name: raw
        type: Json
        nullable: false
        expr:
          kind: current_row
