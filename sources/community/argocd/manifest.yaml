version: "3"

source:
  id: argocd
  name: Argo CD
  description: Query Argo CD applications, projects, clusters, and repositories through the Argo CD REST API.
  backend: http

inputs:
  ARGOCD_BASE_URL:
    type: string
    description: Argo CD base URL without trailing slash and without /api/v1

  ARGOCD_AUTH_TOKEN:
    type: secret
    description: Argo CD authentication token (JWT token)

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.ARGOCD_AUTH_TOKEN}}

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT name, namespace FROM argocd.applications LIMIT 1

tables:
  - name: applications
    description: Deployed GitOps applications managed by Argo CD.

    endpoint:
      path: /api/v1/applications
      method: GET

      response:
        row_strategy: direct
        root_key: items

      query:
        - name: project
          from: filter
          key: project

    filters:
      - name: project
        type: Utf8
        operators: [eq]
        required: false

    columns:
      - name: name
        type: Utf8
        nullable: false
        expr:
          kind: path
          path: [metadata, name]

      - name: namespace
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, destination, namespace]

      - name: project
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, project]

      - name: repo_url
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, source, repoURL]

      - name: target_revision
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, source, targetRevision]

      - name: path
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, source, path]

      - name: sync_status
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [status, sync, status]

      - name: health_status
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [status, health, status]

      - name: destination_server
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, destination, server]

      - name: created_at
        type: Timestamp
        nullable: true
        expr:
          kind: path
          path: [metadata, creationTimestamp]

  - name: projects
    description: Argo CD AppProjects organizing deployment boundaries and policies.

    endpoint:
      path: /api/v1/projects
      method: GET

      response:
        row_strategy: direct
        root_key: items

    columns:
      - name: name
        type: Utf8
        nullable: false
        expr:
          kind: path
          path: [metadata, name]

      - name: description
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, description]

      - name: source_repos
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, sourceRepos]

      - name: destinations
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [spec, destinations]

      - name: created_at
        type: Timestamp
        nullable: true
        expr:
          kind: path
          path: [metadata, creationTimestamp]

  - name: clusters
    description: Connected Kubernetes clusters managed by Argo CD.

    endpoint:
      path: /api/v1/clusters
      method: GET

      response:
        row_strategy: direct

    columns:
      - name: name
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [name]

      - name: server
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [server]

      - name: connection_status
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [connectionState, status]

      - name: version
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [serverVersion]

  - name: repositories
    description: Configured Git and Helm repositories connected to Argo CD.

    endpoint:
      path: /api/v1/repositories
      method: GET

      response:
        row_strategy: direct

    columns:
      - name: repo_url
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [repo]

      - name: name
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [name]

      - name: type
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [type]

      - name: insecure
        type: Boolean
        nullable: true
        expr:
          kind: path
          path: [insecure]

      - name: enable_lfs
        type: Boolean
        nullable: true
        expr:
          kind: path
          path: [enableLfs]

      - name: connection_status
        type: Utf8
        nullable: true
        expr:
          kind: path
          path: [connectionState, status]
          