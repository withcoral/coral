        type: Utf8
        description: >
          Search term (minimum 2 characters). Matched against name, email,
          phone, and notes.
        required: true
        query_param: term
      - name: exact_match
        type: Boolean
        description: When true, only exact full-string matches are returned.
        required: false
        query_param: exact_match
      - name: org_id
        type: Int64
        description: Limit results to persons belonging to this organization ID.
        required: false
        query_param: org_id
    columns:
      - name: result_score
        type: Float64
        description: Provider relevance score
      - name: item__id
        type: Int64
        description: Person ID
      - name: item__name
        type: Utf8
        description: Full name
      - name: item__organization__id
        type: Int64
        description: Organization ID
      - name: item__organization__name
        type: Utf8
        description: Organization name
      - name: item__owner__name
        type: Utf8
        description: Owner name

  - name: search_organizations
    description: >
      Search organizations by name, address, or notes.
