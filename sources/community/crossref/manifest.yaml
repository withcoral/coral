name: crossref
version: 0.2.1
dsl_version: 3
backend: http
description: >
  Query the Crossref REST API with SQL. Covers scholarly works, journals,
  publishers, funders, licences, and work types across 150M+ registered DOIs.
  No authentication required.

inputs:
  CROSSREF_EMAIL:
    kind: variable
    default: ""
    hint: >
      Your contact email address. Crossref routes requests with a contact
      email into the "polite pool" (more stable, higher rate limits).
      Strongly recommended. Example: you@yourorg.org

base_url: "https://api.crossref.org"

request_headers:
  - name: User-Agent
    from: template
    template: "CoralSource/0.1 (https://github.com/withcoral/coral; mailto:{{input.CROSSREF_EMAIL}})"

rate_limit:
  retry_after_header: Retry-After
  remaining_header: X-RateLimit-Remaining
  reset_header: X-RateLimit-Reset

test_queries:
  - SELECT doi, title, type FROM crossref.works LIMIT 1
  - SELECT id, primary_name FROM crossref.members LIMIT 1
  - SELECT issn, title, publisher FROM crossref.journals LIMIT 1
  - SELECT id, name FROM crossref.funders LIMIT 1
  - SELECT id, label FROM crossref.types LIMIT 1
  - SELECT url, work_count FROM crossref.licenses LIMIT 1

tables:
  # ---------------------------------------------------------------------------
  # crossref.works
  # ---------------------------------------------------------------------------
  - name: works
    description: >
      Scholarly works registered with Crossref (journal articles, books, etc.).
      Uses offset pagination. Crossref caps offset-based /works scans at
      10,000 results. Use the filter parameter to narrow large result sets,
      e.g. filter = 'from-pub-date:2024-01'.
    request:
      method: GET
      path: /works
      query:
        - name: query
          from: filter
          key: query
        - name: filter
          from: filter
          key: filter
        - name: sort
          from: filter
          key: sort
        - name: order
          from: filter
          key: order
    response:
      rows_path: [message, items]
    pagination:
      mode: offset
      page_size:
        default: 20
        max: 1000
        query_param: rows
      offset_param: offset
    filters:
      - name: query
        type: Utf8
      - name: filter
        type: Utf8
      - name: sort
        type: Utf8
      - name: order
        type: Utf8
    columns:
      - name: doi
        type: Utf8
        expr: { kind: path, path: [DOI] }
      - name: title
        type: Utf8
        expr:
          kind: join_array_path
          path: [title]
          item_path: []
          separator: ""
      - name: type
        type: Utf8
        expr: { kind: path, path: [type] }
      - name: created_date_parts
        type: Utf8
        description: >
          Deposit date as a date-parts string, e.g. "2024;3;15".
        expr:
          kind: join_array_path
          path: [created, date-parts]
          item_path: []
          separator: ";"
      - name: indexed_date_parts
        type: Utf8
        description: >
          Last-indexed date as a date-parts string, e.g. "2024;3;15".
        expr:
          kind: join_array_path
          path: [indexed, date-parts]
          item_path: []
          separator: ";"
      - name: is_referenced_by_count
        type: Int64
        expr: { kind: path, path: [is-referenced-by-count] }
      - name: publisher
        type: Utf8
        expr: { kind: path, path: [publisher] }
      - name: container_title
        type: Utf8
        expr:
          kind: join_array_path
          path: [container-title]
          item_path: []
          separator: ""
      - name: issn
        type: Utf8
        expr:
          kind: join_array_path
          path: [ISSN]
          item_path: []
          separator: ","
      - name: subject
        type: Utf8
        expr:
          kind: join_array_path
          path: [subject]
          item_path: []
          separator: ","
      - name: score
        type: Float64
        expr: { kind: path, path: [score] }
      - name: url
        type: Utf8
        expr: { kind: path, path: [URL] }

  # ---------------------------------------------------------------------------
  # crossref.members
  # ---------------------------------------------------------------------------
  - name: members
    description: Crossref member organisations (publishers, repositories).
    request:
      method: GET
      path: /members
      query:
        - name: query
          from: filter
          key: query
    response:
      rows_path: [message, items]
    pagination:
      mode: offset
      page_size:
        default: 20
        max: 1000
        query_param: rows
      offset_param: offset
    filters:
      - name: query
        type: Utf8
    columns:
      - name: id
        type: Int64
        expr: { kind: path, path: [id] }
      - name: primary_name
        type: Utf8
        expr: { kind: path, path: [primary-name] }
      - name: location
        type: Utf8
        expr: { kind: path, path: [location] }
      - name: total_dois
        type: Int64
        expr: { kind: path, path: [counts, total-dois] }

  # ---------------------------------------------------------------------------
  # crossref.journals
  # ---------------------------------------------------------------------------
  - name: journals
    description: Journals registered with Crossref.
    request:
      method: GET
      path: /journals
      query:
        - name: query
          from: filter
          key: query
    response:
      rows_path: [message, items]
    pagination:
      mode: offset
      page_size:
        default: 20
        max: 1000
        query_param: rows
      offset_param: offset
    filters:
      - name: query
        type: Utf8
    columns:
      - name: issn
        type: Utf8
        expr:
          kind: join_array_path
          path: [ISSN]
          item_path: []
          separator: ","
      - name: title
        type: Utf8
        expr: { kind: path, path: [title] }
      - name: publisher
        type: Utf8
        expr: { kind: path, path: [publisher] }

  # ---------------------------------------------------------------------------
  # crossref.funders
  # ---------------------------------------------------------------------------
  - name: funders
    description: >
      Research funding bodies from the Crossref Funder Registry.
      The /funders list endpoint does not return work_count;
      use search_funders() for richer per-funder data.
    request:
      method: GET
      path: /funders
      query:
        - name: query
          from: filter
          key: query
    response:
      rows_path: [message, items]
    pagination:
      mode: offset
      page_size:
        default: 20
        max: 1000
        query_param: rows
      offset_param: offset
    filters:
      - name: query
        type: Utf8
    columns:
      - name: id
        type: Utf8
        expr: { kind: path, path: [id] }
      - name: name
        type: Utf8
        expr: { kind: path, path: [name] }
      - name: location
        type: Utf8
        expr: { kind: path, path: [location] }
      - name: uri
        type: Utf8
        expr: { kind: path, path: [uri] }

  # ---------------------------------------------------------------------------
  # crossref.types
  # ---------------------------------------------------------------------------
  - name: types
    description: Controlled vocabulary of work types.
    request:
      method: GET
      path: /types
    response:
      rows_path: [message, items]
    columns:
      - name: id
        type: Utf8
        expr: { kind: path, path: [id] }
      - name: label
        type: Utf8
        expr: { kind: path, path: [label] }

  # ---------------------------------------------------------------------------
  # crossref.licenses
  # ---------------------------------------------------------------------------
  - name: licenses
    description: >
      Content licences declared on Crossref works.
      Each row is one distinct licence URL with an aggregate work count.
      content_version and delay_in_days are per-work sub-fields and are
      not available at this aggregate endpoint.
    request:
      method: GET
      path: /licenses
      query:
        - name: query
          from: filter
          key: query
    response:
      rows_path: [message, items]
    pagination:
      mode: offset
      page_size:
        default: 20
        max: 1000
        query_param: rows
      offset_param: offset
    filters:
      - name: query
        type: Utf8
    columns:
      - name: url
        type: Utf8
        expr: { kind: path, path: [URL] }
      - name: work_count
        type: Int64
        expr: { kind: path, path: [work-count] }

functions:
  - name: search_works
    kind: search
    description: Full-text search across all Crossref works.
    search_limits:
      default_top_k: 20
      max_top_k: 100
      max_calls_per_query: 1
    args:
      - name: q
        required: true
        bind: { arg: q }
    request:
      method: GET
      path: /works
      query:
        - name: query
          from: arg
          key: q
    response:
      rows_path: [message, items]
    pagination:
      mode: offset
      page_size:
        default: 20
        max: 100
        query_param: rows
      offset_param: offset
    columns:
      - name: doi
        type: Utf8
        expr: { kind: path, path: [DOI] }
      - name: title
        type: Utf8
        expr:
          kind: join_array_path
          path: [title]
          item_path: []
          separator: ""
      - name: score
        type: Float64
        expr: { kind: path, path: [score] }
      - name: publisher
        type: Utf8
        expr: { kind: path, path: [publisher] }
      - name: is_referenced_by_count
        type: Int64
        expr: { kind: path, path: [is-referenced-by-count] }

  - name: search_funders
    kind: search
    description: Search the Crossref Funder Registry by funder name.
    search_limits:
      default_top_k: 20
      max_top_k: 100
      max_calls_per_query: 1
    args:
      - name: q
        required: true
        bind: { arg: q }
    request:
      method: GET
      path: /funders
      query:
        - name: query
          from: arg
          key: q
    response:
      rows_path: [message, items]
    pagination:
      mode: offset
      page_size:
        default: 20
        max: 100
        query_param: rows
      offset_param: offset
    columns:
      - name: id
        type: Utf8
        expr: { kind: path, path: [id] }
      - name: name
        type: Utf8
        expr: { kind: path, path: [name] }
      - name: location
        type: Utf8
        expr: { kind: path, path: [location] }
      - name: uri
        type: Utf8
        expr: { kind: path, path: [uri] }