name: neynar
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Neynar Farcaster API for searching casts. Uses API key authentication.
  Returns provider-ranked results with cast content, author info, and engagement metrics.
inputs:
  NEYNAR_API_KEY:
    kind: secret
    hint: Neynar API key from neynar.com
base_url: https://api.neynar.com/v2/farcaster
auth:
  type: HeaderAuth
  headers:
    - name: x-api-key
      from: input
      key: NEYNAR_API_KEY
test_queries:
  - SELECT hash, text, author__username FROM neynar.search_casts(q => 'optimism') LIMIT 1
functions:
  - name: search_casts
    kind: search
    description: >-
      Search Farcaster casts by keyword. Returns provider-ranked results
      with cast content, author info, and engagement metrics.
    search_limits:
      default_top_k: 25
      max_top_k: 100
      max_calls_per_query: 1
    args:
      - name: q
        required: true
        bind:
          arg: q
    request:
      method: GET
      path: /cast/search
      query:
        - name: q
          from: arg
          key: q
        - name: author_fid
          from: filter_int
          key: author_fid
        - name: channel_id
          from: filter
          key: channel_id
        - name: mode
          from: filter
          key: mode
    response:
      rows_path:
        - result
        - casts
      row_strategy: direct
    pagination:
      mode: cursor_query
      cursor_param: cursor
      response_cursor_path:
        - result
        - next
        - cursor
      page_size:
        default: 25
        max: 100
        query_param: limit
    filters:
      - name: author_fid
        type: Int64
        description: FID of the user whose casts to search.
      - name: channel_id
        type: Utf8
        description: Filter by channel ID.
      - name: mode
        type: Utf8
        description: Search mode: literal (default), semantic, or hybrid.
    columns:
      - name: hash
        type: Utf8
        description: Cast hash identifier.
      - name: text
        type: Utf8
        description: Cast text content.
      - name: author__username
        type: Utf8
        description: Author's Farcaster username.
        expr:
          kind: path
          path:
            - author
            - username
      - name: author__fid
        type: Int64
        description: Author's Farcaster ID.
        expr:
          kind: path
          path:
            - author
            - fid
      - name: author__display_name
        type: Utf8
        description: Author's display name.
        expr:
          kind: path
          path:
            - author
            - display_name
      - name: reactions__likes_count
        type: Int64
        description: Number of likes.
        expr:
          kind: path
          path:
            - reactions
            - likes_count
      - name: reactions__recasts_count
        type: Int64
        description: Number of recasts.
        expr:
          kind: path
          path:
            - reactions
            - recasts_count
      - name: replies__count
        type: Int64
        description: Number of replies.
        expr:
          kind: path
          path:
            - replies
            - count
      - name: timestamp
        type: Utf8
        description: Cast timestamp.
      - name: embeds
        type: Json
        description: Embedded content (URLs, casts, etc.).
