name: knock
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Knock notification infrastructure data, including messages, users,
  tenants, message events, delivery logs, and activities.
base_url: https://api.knock.app/v1

inputs:
  KNOCK_API_KEY:
    kind: secret
    hint: |
      Knock secret API key with read access. Paste only the key value, without
      a `Bearer` prefix.

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.KNOCK_API_KEY}}

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT id, source__key, status FROM knock.messages LIMIT 1
  - SELECT id, name FROM knock.users LIMIT 1

tables:
  - name: messages
    description: Notification messages generated by Knock workflows.
    guide: |
      Use this table to debug delivery state by recipient, channel, workflow,
      and timestamp.
    fetch_limit_default: 100
    filters:
      - name: status
      - name: engagement_status
      - name: channel_id
      - name: tenant
      - name: source
      - name: workflow_run_id
      - name: workflow_recipient_run_id
      - name: inserted_at_gte
      - name: inserted_at_lte
    request:
      method: GET
      path: /messages
      query:
        - name: status[]
          from: filter
          key: status
        - name: engagement_status[]
          from: filter
          key: engagement_status
        - name: channel_id
          from: filter
          key: channel_id
        - name: tenant
          from: filter
          key: tenant
        - name: source
          from: filter
          key: source
        - name: workflow_run_id
          from: filter
          key: workflow_run_id
        - name: workflow_recipient_run_id
          from: filter
          key: workflow_recipient_run_id
        - name: inserted_at.gte
          from: filter
          key: inserted_at_gte
        - name: inserted_at.lte
          from: filter
          key: inserted_at_lte
    response:
      rows_path: [items]
    pagination:
      mode: cursor_query
      cursor_param: after
      response_cursor_path: [page_info, after]
      page_size:
        default: 50
        max: 50
        query_param: page_size
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Message ID.
      - name: source__key
        type: Utf8
        nullable: true
        description: Workflow, broadcast, or guide key that produced the message.
        expr: {kind: path, path: [source, key]}
      - name: source__type
        type: Utf8
        nullable: true
        description: Source type that produced the message.
        expr: {kind: path, path: [source, type]}
      - name: status
        type: Utf8
        nullable: true
        description: Message delivery status.
      - name: channel_id
        type: Utf8
        nullable: true
        description: Deprecated channel ID returned by Knock.
      - name: channel__id
        type: Utf8
        nullable: true
        description: Channel ID.
        expr: {kind: path, path: [channel, id]}
      - name: channel__key
        type: Utf8
        nullable: true
        description: Channel key.
        expr: {kind: path, path: [channel, key]}
      - name: channel__type
        type: Utf8
        nullable: true
        description: Channel type.
        expr: {kind: path, path: [channel, type]}
      - name: workflow
        type: Utf8
        nullable: true
        description: Workflow key returned by Knock.
      - name: tenant
        type: Utf8
        nullable: true
        description: Tenant ID associated with the message.
      - name: workflow_run_id
        type: Utf8
        nullable: true
        description: Top-level workflow run ID.
      - name: workflow_recipient_run_id
        type: Utf8
        nullable: true
        description: Recipient workflow run ID.
      - name: inserted_at
        type: Timestamp
        nullable: true
        description: Message creation timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [inserted_at]}
      - name: updated_at
        type: Timestamp
        nullable: true
        description: Message update timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [updated_at]}
      - name: seen_at
        type: Timestamp
        nullable: true
        description: When the message was seen.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [seen_at]}
      - name: read_at
        type: Timestamp
        nullable: true
        description: When the message was read.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [read_at]}
      - name: archived_at
        type: Timestamp
        nullable: true
        description: When the message was archived.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [archived_at]}
      - name: data_json
        type: Json
        nullable: true
        description: Workflow trigger data associated with the message.
        expr: {kind: path, path: [data]}
      - name: metadata_json
        type: Json
        nullable: true
        description: Message metadata.
        expr: {kind: path, path: [metadata]}
      - name: raw_json
        type: Json
        nullable: true
        description: Raw message object for provider-specific fields.
        expr: {kind: path, path: []}

  - name: users
    description: Knock users.
    fetch_limit_default: 100
    request:
      method: GET
      path: /users
    response:
      rows_path: [entries]
    pagination:
      mode: cursor_query
      cursor_param: after
      response_cursor_path: [page_info, after]
      page_size:
        default: 50
        max: 50
        query_param: page_size
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: User ID.
      - name: name
        type: Utf8
        nullable: true
        description: User display name.
      - name: email
        type: Utf8
        nullable: true
        description: User email.
      - name: created_at
        type: Timestamp
        nullable: true
        description: Creation timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [created_at]}
      - name: updated_at
        type: Timestamp
        nullable: true
        description: Update timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [updated_at]}
      - name: timezone
        type: Utf8
        nullable: true
        description: User timezone.
      - name: raw_json
        type: Json
        nullable: true
        description: Raw user object for custom properties.
        expr: {kind: path, path: []}

  - name: tenants
    description: Knock tenants.
    filters:
      - name: tenant_id
      - name: name
    request:
      method: GET
      path: /tenants
      query:
        - name: tenant_id
          from: filter
          key: tenant_id
        - name: name
          from: filter
          key: name
    response:
      rows_path: [entries]
    pagination:
      mode: cursor_query
      cursor_param: after
      response_cursor_path: [page_info, after]
      page_size:
        default: 50
        max: 50
        query_param: page_size
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: Tenant ID.
      - name: name
        type: Utf8
        nullable: true
        description: Tenant name.
      - name: settings_json
        type: Json
        nullable: true
        description: Tenant settings.
        expr: {kind: path, path: [settings]}
      - name: raw_json
        type: Json
        nullable: true
        description: Raw tenant object for custom properties.
        expr: {kind: path, path: []}

  - name: message_events
    description: Events for a Knock message.
    guide: |
      Requires `message_id`, usually from `knock.messages.id`.
    filters:
      - name: message_id
        required: true
    request:
      method: GET
      path: /messages/{{filter.message_id}}/events
    response:
      rows_path: [items]
    pagination:
      mode: cursor_query
      cursor_param: after
      response_cursor_path: [page_info, after]
      page_size:
        default: 50
        max: 50
        query_param: page_size
    columns:
      - name: message_id
        type: Utf8
        nullable: false
        virtual: true
        description: Message ID supplied as a filter.
        expr:
          kind: from_filter
          key: message_id
      - name: id
        type: Utf8
        nullable: false
        description: Event ID.
      - name: type
        type: Utf8
        nullable: true
        description: Event type.
      - name: inserted_at
        type: Timestamp
        nullable: true
        description: Event timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [inserted_at]}
      - name: data_json
        type: Json
        nullable: true
        description: Event data.
        expr: {kind: path, path: [data]}
      - name: raw_json
        type: Json
        nullable: true
        description: Raw event object.
        expr: {kind: path, path: []}

  - name: message_delivery_logs
    description: Downstream provider delivery logs for a Knock message.
    guide: |
      Requires `message_id`, usually from `knock.messages.id`.
    filters:
      - name: message_id
        required: true
    request:
      method: GET
      path: /messages/{{filter.message_id}}/delivery_logs
    response:
      rows_path: [items]
    pagination:
      mode: cursor_query
      cursor_param: after
      response_cursor_path: [page_info, after]
      page_size:
        default: 50
        max: 50
        query_param: page_size
    columns:
      - name: message_id
        type: Utf8
        nullable: false
        virtual: true
        description: Message ID supplied as a filter.
        expr:
          kind: from_filter
          key: message_id
      - name: id
        type: Utf8
        nullable: false
        description: Delivery log ID.
      - name: service_name
        type: Utf8
        nullable: true
        description: Downstream service name.
      - name: response__status
        type: Int64
        nullable: true
        description: Downstream response status code.
        expr: {kind: path, path: [response, status]}
      - name: request__method
        type: Utf8
        nullable: true
        description: Downstream request method.
        expr: {kind: path, path: [request, method]}
      - name: request__host
        type: Utf8
        nullable: true
        description: Downstream request host.
        expr: {kind: path, path: [request, host]}
      - name: inserted_at
        type: Timestamp
        nullable: true
        description: Delivery log timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [inserted_at]}
      - name: raw_json
        type: Json
        nullable: true
        description: Raw delivery log object.
        expr: {kind: path, path: []}

  - name: message_activities
    description: Trigger activities associated with a Knock message.
    guide: |
      Requires `message_id`, usually from `knock.messages.id`.
    filters:
      - name: message_id
        required: true
      - name: trigger_data
    request:
      method: GET
      path: /messages/{{filter.message_id}}/activities
      query:
        - name: trigger_data
          from: filter
          key: trigger_data
    response:
      rows_path: [items]
    pagination:
      mode: cursor_query
      cursor_param: after
      response_cursor_path: [page_info, after]
      page_size:
        default: 50
        max: 50
        query_param: page_size
    columns:
      - name: message_id
        type: Utf8
        nullable: false
        virtual: true
        description: Message ID supplied as a filter.
        expr:
          kind: from_filter
          key: message_id
      - name: id
        type: Utf8
        nullable: false
        description: Activity ID.
      - name: inserted_at
        type: Timestamp
        nullable: true
        description: Activity creation timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [inserted_at]}
      - name: updated_at
        type: Timestamp
        nullable: true
        description: Activity update timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [updated_at]}
      - name: data_json
        type: Json
        nullable: true
        description: Trigger data for the activity.
        expr: {kind: path, path: [data]}
      - name: raw_json
        type: Json
        nullable: true
        description: Raw activity object.
        expr: {kind: path, path: []}
