functions:
  - name: search_employees
    kind: search
    description: Search employees with Airtable filterByFormula.
    fetch_limit_default: 25
    search_limits: &search_limits
      default_top_k: 25
      max_top_k: 100
      max_calls_per_query: 1
    args: &search_args
      - name: formula
        required: true
        bind:
          arg: formula
      - name: view
        required: false
        bind:
          arg: view
    request:
      method: GET
      path: /{{input.AIRTABLE_BASE_ID}}/{{input.AIRTABLE_EMPLOYEES_TABLE}}
      query: &search_query
        - name: filterByFormula
          from: arg
          key: formula
        - name: view
          from: arg
          key: view
    response: *record_response
    pagination: *airtable_pagination
    columns: *record_columns

  - name: search_assets
