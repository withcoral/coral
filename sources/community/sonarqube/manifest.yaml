version: 2.0.0
dsl_version: 3
name: sonarqube
description: Query projects, issues, measures, and pull requests from SonarQube
  (Cloud or self-hosted).
test_queries:
  - SELECT * FROM sonarqube.metrics_catalog LIMIT 5
backend: http
base_url: "{{ input.SONARQUBE_API_BASE }}"
inputs:
  SONARQUBE_API_BASE:
    kind: variable
    default: https://sonarcloud.io/api
    hint: Base URL for the SonarQube API. Keep the default for SonarCloud, or use
      your self-hosted URL like `https://sonarqube.example.com/api`.
  SONARQUBE_API_KEY:
    kind: secret
    hint: >
      A SonarQube User Token. Basic read access (Browse) works for most tables.
      Administer System is required for projects (self-hosted), user groups, and full user details.
auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{ input.SONARQUBE_API_KEY }}
tables:
  - name: project_measures
    description: Live source code quality metrics, security vulnerabilities, and bug counts
    filters:
      - name: component
        required: true
      - name: metric_keys
        required: true
    request:
      path: /measures/component
      method: GET
      headers:
        - name: Content-Type
          from: template
          template: application/json
      query:
        - name: component
          from: filter
          key: component
        - name: metricKeys
          from: filter
          key: metric_keys
    response:
      rows_path:
        - component
        - measures
    columns:
      - name: component
        type: Utf8
        expr:
          kind: from_filter
          key: component
      - name: metric_keys
        type: Utf8
        expr:
          kind: from_filter
          key: metric_keys
      - name: metric
        type: Utf8
      - name: value
        type: Utf8
      - name: best_value
        type: Boolean
        expr:
          kind: path
          path:
            - bestValue
  - name: projects
    description: Search projects
    guide: |
      SonarCloud requires an `organization` filter. Self-hosted SonarQube instances do not use this parameter and you should omit it.
      On self-hosted instances, querying this table requires `Administer System` permission.
    filters:
      - name: organization
        required: false
    request:
      path: /projects/search
      method: GET
      query:
        - name: organization
          from: filter
          key: organization
    response:
      rows_path:
        - components
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: organization
        type: Utf8
        expr:
          kind: from_filter
          key: organization
      - name: key
        type: Utf8
      - name: name
        type: Utf8
      - name: qualifier
        type: Utf8
      - name: visibility
        type: Utf8
      - name: last_analysis_date
        type: Utf8
        expr:
          kind: path
          path:
            - lastAnalysisDate
      - name: revision
        type: Utf8
  - name: issues
    description: Search issues for a project
    guide: |
      SonarCloud users should filter by `component_keys`.
      Self-hosted SonarQube users should filter by `components`.
    filters:
      - name: components
      - name: component_keys
    request:
      path: /issues/search
      method: GET
      query:
        - name: components
          from: filter
          key: components
        - name: componentKeys
          from: filter
          key: component_keys
    response:
      rows_path:
        - issues
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: components
        type: Utf8
        expr:
          kind: from_filter
          key: components
      - name: component_keys
        type: Utf8
        expr:
          kind: from_filter
          key: component_keys
      - name: key
        type: Utf8
      - name: component
        type: Utf8
      - name: project
        type: Utf8
      - name: rule
        type: Utf8
      - name: status
        type: Utf8
      - name: message
        type: Utf8
      - name: severity
        type: Utf8
      - name: type
        type: Utf8
      - name: author
        type: Utf8
      - name: creation_date
        type: Utf8
        expr:
          kind: path
          path:
            - creationDate
      - name: effort
        type: Utf8
  - name: qualitygates_status
    description: Quality gate status of a project
    filters:
      - name: project_key
        required: true
    request:
      path: /qualitygates/project_status
      method: GET
      query:
        - name: projectKey
          from: filter
          key: project_key
    response:
      rows_path:
        - projectStatus
    columns:
      - name: project_key
        type: Utf8
        expr:
          kind: from_filter
          key: project_key
      - name: status
        type: Utf8
      - name: conditions
        type: Json
  - name: hotspots_cloud
    description: Search security hotspots (SonarCloud)
    filters:
      - name: project_key
        required: true
    request:
      path: /hotspots/search
      method: GET
      query:
        - name: projectKey
          from: filter
          key: project_key
    response:
      rows_path:
        - hotspots
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: project_key
        type: Utf8
        expr:
          kind: from_filter
          key: project_key
      - name: key
        type: Utf8
      - name: vulnerability_probability
        type: Utf8
        expr:
          kind: path
          path:
            - vulnerabilityProbability
      - name: status
        type: Utf8
      - name: message
        type: Utf8
      - name: author
        type: Utf8
      - name: creation_date
        type: Utf8
        expr:
          kind: path
          path:
            - creationDate
  - name: hotspots_server
    description: Search security hotspots (SonarQube Server)
    filters:
      - name: project
        required: true
    request:
      path: /hotspots/search
      method: GET
      query:
        - name: project
          from: filter
          key: project
    response:
      rows_path:
        - hotspots
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: project
        type: Utf8
        expr:
          kind: from_filter
          key: project
      - name: key
        type: Utf8
      - name: vulnerability_probability
        type: Utf8
        expr:
          kind: path
          path:
            - vulnerabilityProbability
      - name: status
        type: Utf8
      - name: message
        type: Utf8
      - name: author
        type: Utf8
      - name: creation_date
        type: Utf8
        expr:
          kind: path
          path:
            - creationDate
  - name: component_tree
    description: File level measures
    filters:
      - name: component
        required: true
      - name: metric_keys
        required: true
    request:
      path: /measures/component_tree
      method: GET
      query:
        - name: component
          from: filter
          key: component
        - name: metricKeys
          from: filter
          key: metric_keys
    response:
      rows_path:
        - components
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: component
        type: Utf8
        expr:
          kind: from_filter
          key: component
      - name: metric_keys
        type: Utf8
        expr:
          kind: from_filter
          key: metric_keys
      - name: key
        type: Utf8
      - name: name
        type: Utf8
      - name: qualifier
        type: Utf8
      - name: path
        type: Utf8
      - name: language
        type: Utf8
      - name: measures
        type: Json
  - name: project_branches
    description: List branches of a project
    filters:
      - name: project
        required: true
    request:
      path: /project_branches/list
      method: GET
      query:
        - name: project
          from: filter
          key: project
    response:
      rows_path:
        - branches
    columns:
      - name: project
        type: Utf8
        expr:
          kind: from_filter
          key: project
      - name: name
        type: Utf8
      - name: is_main
        type: Boolean
        expr:
          kind: path
          path:
            - isMain
      - name: type
        type: Utf8
      - name: status
        type: Utf8
      - name: analysis_date
        type: Utf8
        expr:
          kind: path
          path:
            - analysisDate
  - name: metrics_catalog
    description: List of all available metrics
    request:
      path: /metrics/search
      method: GET
    response:
      rows_path:
        - metrics
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: key
        type: Utf8
      - name: name
        type: Utf8
      - name: description
        type: Utf8
      - name: domain
        type: Utf8
      - name: type
        type: Utf8
  - name: users
    description: Search users (Self-hosted only)
    guide: |
      This table is only supported on self-hosted SonarQube instances. SonarCloud does not expose the `/users/search` endpoint.
    request:
      path: /users/search
      method: GET
    response:
      rows_path:
        - users
      allow_404_empty: true
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: login
        type: Utf8
      - name: name
        type: Utf8
      - name: email
        type: Utf8
      - name: active
        type: Boolean
  - name: rules
    description: Search coding rules
    guide: |
      SonarCloud requires an `organization` filter. Self-hosted SonarQube instances do not use this parameter and you should omit it.
    filters:
      - name: organization
    request:
      path: /rules/search
      method: GET
      query:
        - name: organization
          from: filter
          key: organization
    response:
      rows_path:
        - rules
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: organization
        type: Utf8
        expr:
          kind: from_filter
          key: organization
      - name: key
        type: Utf8
      - name: name
        type: Utf8
      - name: lang
        type: Utf8
      - name: type
        type: Utf8
      - name: severity
        type: Utf8
      - name: status
        type: Utf8
  - name: project_pull_requests
    description: List pull requests of a project
    filters:
      - name: project
        required: true
    request:
      path: /project_pull_requests/list
      method: GET
      query:
        - name: project
          from: filter
          key: project
    response:
      rows_path:
        - pullRequests
    columns:
      - name: project
        type: Utf8
        expr:
          kind: from_filter
          key: project
      - name: key
        type: Utf8
      - name: title
        type: Utf8
      - name: branch
        type: Utf8
      - name: base
        type: Utf8
      - name: status
        type: Utf8
      - name: analysis_date
        type: Utf8
        expr:
          kind: path
          path:
            - analysisDate
  - name: qualityprofiles
    description: Search quality profiles
    guide: |
      SonarCloud requires an `organization` filter. Self-hosted SonarQube instances do not use this parameter and you should omit it.
    filters:
      - name: organization
    request:
      path: /qualityprofiles/search
      method: GET
      query:
        - name: organization
          from: filter
          key: organization
    response:
      rows_path:
        - profiles
    columns:
      - name: organization
        type: Utf8
        expr:
          kind: from_filter
          key: organization
      - name: key
        type: Utf8
      - name: name
        type: Utf8
      - name: language
        type: Utf8
      - name: is_default
        type: Boolean
        expr:
          kind: path
          path:
            - isDefault
      - name: active_rule_count
        type: Utf8
        expr:
          kind: path
          path:
            - activeRuleCount
  - name: user_groups
    description: Search user groups
    guide: |
      SonarCloud requires an `organization` filter. Self-hosted SonarQube instances do not use this parameter and you should omit it.
    filters:
      - name: organization
    request:
      path: /user_groups/search
      method: GET
      query:
        - name: organization
          from: filter
          key: organization
    response:
      rows_path:
        - groups
    pagination:
      mode: page
      page_param: p
      page_start: 1
      page_size:
        default: 100
        max: 500
        query_param: ps
    columns:
      - name: organization
        type: Utf8
        expr:
          kind: from_filter
          key: organization
      - name: name
        type: Utf8
      - name: description
        type: Utf8
      - name: members_count
        type: Utf8
        expr:
          kind: path
          path:
            - membersCount
