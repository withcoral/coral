name: backstage
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query software catalog entities, components, and service metadata from Backstage.
base_url: "{{input.BACKSTAGE_URL}}/api/catalog"

inputs:
  BACKSTAGE_URL:
    kind: variable
    hint: |
      Backstage base URL without trailing slash and without /api/catalog,
      for example `http://localhost:7007` or `https://backstage.infra.local`.
  BACKSTAGE_TOKEN:
    kind: secret
    hint: |
      Backstage Auth Service Bearer Token or Identity Token.

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.BACKSTAGE_TOKEN}}

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT name, kind FROM backstage.entities LIMIT 1

tables:
  - name: entities
    description: Software ecosystem objects tracked inside the Backstage software catalog.
    request:
      method: GET
      path: /entities
      query:
        - name: fields
          from: query
          key: fields
    response:
      row_strategy: direct
      rows_path: []
    pagination:
      mode: none
    columns:
      - name: uid
        type: Utf8
        nullable: false
        description: Globally unique ID assigned by Backstage.
        expr: {kind: path, path: [metadata, uid]}
      - name: name
        type: Utf8
        nullable: false
        description: Technical name of the entity.
        expr: {kind: path, path: [metadata, name]}
      - name: namespace
        type: Utf8
        nullable: true
        description: Isolation namespace grouping the entity (defaults to 'default').
        expr: {kind: path, path: [metadata, namespace]}
      - name: kind
        type: Utf8
        nullable: false
        description: High-level category of the entity (e.g., Component, API, User).
        expr: {kind: path, path: [kind]}
      - name: type
        type: Utf8
        nullable: true
        description: Sub-categorization type defined within the specific entity kind.
        expr: {kind: path, path: [spec, type]}
      - name: lifecycle
        type: Utf8
        nullable: true
        description: Operational maturity phase of the software (e.g., production).
        expr: {kind: path, path: [spec, lifecycle]}
      - name: owner
        type: Utf8
        nullable: true
        description: Group or User entity reference declaring responsibility for the object.
        expr: {kind: path, path: [spec, owner]}
      - name: title
        type: Utf8
        nullable: true
        description: Display title shown in Backstage interfaces.
        expr: {kind: path, path: [metadata, title]}
      - name: description
        type: Utf8
        nullable: true
        description: Description associated with the catalog entity.
        expr: {kind: path, path: [metadata, description]}
