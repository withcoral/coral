name: backstage
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query software catalog entities, components, and service metadata from Backstage.
base_url: "{{input.BACKSTAGE_URL}}/api/catalog"

inputs:
  BACKSTAGE_URL:
    kind: variable
    hint: |
      Backstage base URL without trailing slash and without /api/catalog,
      for example `http://localhost:7007` or `https://backstage.infra.local`.
  BACKSTAGE_TOKEN:
    kind: secret
    hint: |
      Backstage Auth Service Bearer Token or Identity Token.

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.BACKSTAGE_TOKEN}}

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT name, kind FROM backstage.entities LIMIT 1

tables:
  - name: entities
    description: Software catalog entities tracked inside Backstage, from the paginated by-query endpoint.
    guide: |
      Each row is one Backstage catalog entity from `GET /entities/by-query`.
      Rows are read from `items` and pages are followed via
      `pageInfo.nextCursor`. For advanced server-side filtering, set
      `catalog_filter` to a Backstage filter string, e.g.
      `WHERE catalog_filter = 'kind=component,spec.type=service'`.
    filters:
      - name: catalog_filter
        required: false
        description: Raw Backstage filter string passed through to the `filter` query parameter.
    request:
      method: GET
      path: /entities/by-query
      query:
        - name: fields
          from: literal
          value: >-
            kind,metadata.uid,metadata.name,metadata.namespace,metadata.title,metadata.description,spec.type,spec.lifecycle,spec.owner,relations
        - name: filter
          from: filter
          key: catalog_filter
    response:
      row_strategy: direct
      rows_path: [items]
    pagination:
      mode: cursor_query
      cursor_param: cursor
      response_cursor_path: [pageInfo, nextCursor]
      page_size:
        query_param: limit
        default: 100
        max: 500
    columns:
      - name: entity_ref
        type: Utf8
        nullable: false
        description: >-
          Durable Backstage entity reference (kind:namespace/name), derived from
          the entity's immutable kind, namespace, and name. Prefer this over
          `uid` for joins and external references.
        expr:
          kind: template
          template: "{{expr.kind}}:{{expr.ns}}/{{expr.name}}"
          values:
            kind: {kind: path, path: [kind]}
            ns:
              kind: coalesce
              exprs:
                - {kind: path, path: [metadata, namespace]}
                - {kind: literal, value: default}
            name: {kind: path, path: [metadata, name]}
      - name: catalog_filter
        type: Utf8
        nullable: true
        virtual: true
        description: Raw Backstage filter string pushdown (e.g., kind=component).
        expr: {kind: from_filter, key: catalog_filter}
      - name: uid
        type: Utf8
        nullable: true
        description: >-
          Backstage-assigned UID. Output-only and not stable for external
          references; use `entity_ref` for durable identification.
        expr: {kind: path, path: [metadata, uid]}
      - name: name
        type: Utf8
        nullable: false
        description: Technical name of the entity.
        expr: {kind: path, path: [metadata, name]}
      - name: namespace
        type: Utf8
        nullable: true
        description: Namespace grouping the entity (defaults to 'default' when omitted).
        expr: {kind: path, path: [metadata, namespace]}
      - name: kind
        type: Utf8
        nullable: false
        description: High-level category of the entity (e.g., Component, API, User).
        expr: {kind: path, path: [kind]}
      - name: type
        type: Utf8
        nullable: true
        description: Sub-categorization type defined within the entity kind.
        expr: {kind: path, path: [spec, type]}
      - name: lifecycle
        type: Utf8
        nullable: true
        description: Operational maturity phase of the software (e.g., production).
        expr: {kind: path, path: [spec, lifecycle]}
      - name: owner
        type: Utf8
        nullable: true
        description: Declared owner from `spec.owner` (the raw spec value before processing).
        expr: {kind: path, path: [spec, owner]}
      - name: owned_by
        type: Utf8
        nullable: true
        description: >-
          Processed ownership from the catalog `relations` graph: target refs of
          `ownedBy` relations, joined with ", ". Reflects Backstage's resolved
          ownership, which can differ from the raw `spec.owner`.
        expr:
          kind: join_tag_values
          path: [relations]
          key: ownedBy
          key_field: type
          value_field: targetRef
          separator: ", "
      - name: relation_types
        type: Utf8
        nullable: true
        description: Distinct relation types present on the entity (e.g., ownedBy, dependsOn), joined with ", ".
        expr:
          kind: join_array_path
          path: [relations]
          item_path: [type]
          separator: ", "
      - name: relation_targets
        type: Utf8
        nullable: true
        description: All related entity refs from the `relations` graph, joined with ", ".
        expr:
          kind: join_array_path
          path: [relations]
          item_path: [targetRef]
          separator: ", "
      - name: title
        type: Utf8
        nullable: true
        description: Display title shown in Backstage interfaces.
        expr: {kind: path, path: [metadata, title]}
      - name: description
        type: Utf8
        nullable: true
        description: Description associated with the catalog entity.
        expr: {kind: path, path: [metadata, description]}
