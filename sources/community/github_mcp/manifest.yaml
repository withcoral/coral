  - name: search_issues
    tool: search_issues
    description: Search issues using GitHub issue search syntax.
    args:
      - name: query
        required: true
        bind:
          arg: query
      - name: owner
        bind:
          arg: owner
      - name: repo
        bind:
          arg: repo
      - name: sort
        bind:
          arg: sort
      - name: order
        values: [asc, desc]
        bind:
          arg: order
      - name: page
        bind:
          arg: page
      - name: per_page
        bind:
          arg: perPage
    response:
      rows_path: [items]
    columns:
      - name: number
