        description: Displayed liquidity in dollars.
        expr:
          kind: path
          path:
              - liquidity_dollars
      - name: notional_value_dollars
        type: Utf8
        nullable: true
        description: Notional value in dollars.
        expr:
          kind: path
          path:
              - notional_value_dollars
      - name: volume_fp
        type: Utf8
        nullable: true
        description: Lifetime volume (fixed-point contracts).
        expr:
          kind: path
          path:
              - volume_fp
      - name: volume_24h_fp
        type: Utf8
        nullable: true
        description: 24h volume (fixed-point contracts).
        expr:
          kind: path
          path:
              - volume_24h_fp
      - name: open_interest_fp
        type: Utf8
        nullable: true
        description: Open interest (fixed-point contracts).
        expr:
          kind: path
          path:
              - open_interest_fp
      - name: yes_bid_size_fp
        type: Utf8
        nullable: true
        description: YES bid size (fixed-point contracts).
        expr:
          kind: path
          path:
              - yes_bid_size_fp
      - name: yes_ask_size_fp
        type: Utf8
        nullable: true
        description: YES ask size (fixed-point contracts).
        expr:
          kind: path
          path:
              - yes_ask_size_fp
      - name: price_level_structure
        type: Utf8
        nullable: true
        description: Price level structure.
        expr:
          kind: path
          path:
              - price_level_structure
      - name: can_close_early
        type: Boolean
        nullable: true
        description: Whether the market can close early.
        expr:
          kind: path
          path:
              - can_close_early
      - name: is_provisional
        type: Boolean
        nullable: true
        description: Whether the market is provisional.
        expr:
          kind: path
          path:
              - is_provisional
      - name: exchange_index
        type: Int64
        nullable: true
