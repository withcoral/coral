      - name: rules_primary
        type: Utf8
        nullable: true
        description: Primary settlement rules.
        expr:
          kind: path
          path:
              - rules_primary
      - name: rules_secondary
        type: Utf8
        nullable: true
        description: Secondary settlement rules.
        expr:
          kind: path
          path:
              - rules_secondary
      - name: expiration_value
        type: Utf8
        nullable: true
        description: Expiration value string.
        expr:
          kind: path
          path:
              - expiration_value
      - name: mve_collection_ticker
        type: Utf8
        nullable: true
        description: Multivariate collection ticker if any.
        expr:
          kind: path
          path:
              - mve_collection_ticker
      - name: custom_strike
        type: Json
        nullable: true
        description: Custom strike object.
        expr:
          kind: path
          path:
              - custom_strike
      - name: price_ranges
        type: Json
        nullable: true
        description: Price range objects.
        expr:
          kind: path
          path:
              - price_ranges
      - name: mve_selected_legs
        type: Json
        nullable: true
        description: Selected multivariate legs.
