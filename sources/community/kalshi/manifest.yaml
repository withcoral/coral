        expr:
          kind: path
          path:
              - last_price_dollars
      - name: previous_price_dollars
        type: Utf8
        nullable: true
        description: Previous last price in dollars.
        expr:
          kind: path
          path:
              - previous_price_dollars
      - name: liquidity_dollars
        type: Utf8
