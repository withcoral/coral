name: kalshi
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Kalshi public Trade API reads: series, events, markets, trades,
  order books, candlesticks, milestones, and exchange metadata.
base_url: https://external-api.kalshi.com/trade-api/v2
request_headers:
  - name: Accept
    from: literal
    value: application/json
test_queries:
  - >-
    SELECT ticker, title, status, yes_bid_dollars
    FROM kalshi.markets
    WHERE status = 'open'
    LIMIT 5
  - SELECT event_ticker, title, category FROM kalshi.events LIMIT 5
  - SELECT ticker, title, category FROM kalshi.series WHERE ticker = 'KXELONMARS'
  - SELECT trade_id, ticker, yes_price_dollars FROM kalshi.trades LIMIT 5
  - >-
    SELECT ticker, yes_dollars, no_dollars
    FROM kalshi.orderbook
    WHERE ticker = 'KXELONMARS-99'
    LIMIT 1
  - SELECT id, title, category FROM kalshi.milestones LIMIT 5
  - >-
    SELECT ticker, end_period_ts, volume_fp
    FROM kalshi.candlesticks
    WHERE series_ticker = 'KXELONMARS'
      AND ticker = 'KXELONMARS-99'
      AND start_ts = '1787702400'
      AND end_ts = '1788393600'
      AND period_interval = '1440'
    LIMIT 5

tables:
  - name: series
    description: >-
      One Kalshi series by ticker. The list endpoint ignores limit and returns
      a multi-megabyte payload, so this table is a path lookup.
    guide: >-
      Requires `ticker`. Example:
      `SELECT ticker, title, category FROM kalshi.series WHERE ticker = 'KXELONMARS'`.
    filters:
      - name: ticker
        required: true
        description: Series ticker.
    request:
      method: GET
      path: /series/{{filter.ticker}}
    response:
      rows_path:
        - series
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: ticker
        type: Utf8
        nullable: false
        description: Series ticker.
        expr:
          kind: path
          path:
              - ticker
      - name: title
        type: Utf8
        nullable: true
        description: Series title.
        expr:
          kind: path
          path:
              - title
      - name: category
        type: Utf8
        nullable: true
        description: Series category.
        expr:
          kind: path
          path:
              - category
      - name: frequency
        type: Utf8
        nullable: true
        description: Recurrence such as custom or one_off.
        expr:
          kind: path
          path:
              - frequency
      - name: fee_type
        type: Utf8
        nullable: true
        description: Fee type such as quadratic.
        expr:
          kind: path
          path:
              - fee_type
      - name: fee_multiplier
        type: Float64
        nullable: true
        description: Fee multiplier.
        expr:
          kind: path
          path:
              - fee_multiplier
      - name: exchange_index
        type: Int64
        nullable: true
        description: Exchange shard index.
        expr:
          kind: path
          path:
              - exchange_index
      - name: contract_url
        type: Utf8
        nullable: true
        description: Product certification URL.
        expr:
          kind: path
          path:
              - contract_url
      - name: contract_terms_url
        type: Utf8
        nullable: true
        description: Contract terms PDF URL.
        expr:
          kind: path
          path:
              - contract_terms_url
      - name: last_updated_ts
        type: Timestamp
        nullable: true
        description: Last series update.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - last_updated_ts
      - name: tags
        type: Json
        nullable: true
        description: Series tags.
        expr:
          kind: path
          path:
              - tags
      - name: settlement_sources
        type: Json
        nullable: true
        description: Settlement source objects.
        expr:
          kind: path
          path:
              - settlement_sources
      - name: additional_prohibitions
        type: Json
        nullable: true
        description: Additional trading prohibitions.
        expr:
          kind: path
          path:
              - additional_prohibitions
      - name: product_metadata
        type: Json
        nullable: true
        description: Product metadata object.
        expr:
          kind: path
          path:
              - product_metadata

  - name: events
    description: >-
      Kalshi events excluding multivariate combos. Use multivariate_events for
      those. Nested markets are omitted unless nested_markets is true.
    guide: >-
      `SELECT event_ticker, title, category FROM kalshi.events LIMIT 20`.
      Filter with `status = 'open'` or `series_ticker`.
    fetch_limit_default: 50
    filters:
      - name: series_ticker
        required: false
        description: Parent series ticker.
      - name: status
        required: false
        description: Event status (unopened, open, closed, settled).
      - name: nested_markets
        required: false
        description: If true, include nested markets on each event.
    request:
      method: GET
      path: /events
      query:
        - name: series_ticker
          from: filter
          key: series_ticker
        - name: status
          from: filter
          key: status
        - name: with_nested_markets
          from: filter
          key: nested_markets
    response:
      rows_path:
        - events
      row_strategy: direct
    pagination:
      mode: cursor_query
      cursor_param: cursor
      response_cursor_path:
        - cursor
      page_size:
        default: 50
        max: 1000
        query_param: limit
    columns:
      - name: event_ticker
        type: Utf8
        nullable: false
        description: Event ticker.
        expr:
          kind: path
          path:
              - event_ticker
      - name: series_ticker
        type: Utf8
        nullable: true
        description: Parent series ticker.
        expr:
          kind: path
          path:
              - series_ticker
      - name: title
        type: Utf8
        nullable: true
        description: Event title.
        expr:
          kind: path
          path:
              - title
      - name: sub_title
        type: Utf8
        nullable: true
        description: Event subtitle.
        expr:
          kind: path
          path:
              - sub_title
      - name: category
        type: Utf8
        nullable: true
        description: Event category.
        expr:
          kind: path
          path:
              - category
      - name: mutually_exclusive
        type: Boolean
        nullable: true
        description: Whether outcomes are mutually exclusive.
        expr:
          kind: path
          path:
              - mutually_exclusive
      - name: available_on_brokers
        type: Boolean
        nullable: true
        description: Whether brokers can offer the event.
        expr:
          kind: path
          path:
              - available_on_brokers
      - name: exchange_index
        type: Int64
        nullable: true
        description: Exchange shard index.
        expr:
          kind: path
          path:
              - exchange_index
      - name: collateral_return_type
        type: Utf8
        nullable: true
        description: Collateral return type.
        expr:
          kind: path
          path:
              - collateral_return_type
      - name: strike_period
        type: Utf8
        nullable: true
        description: Strike period label.
        expr:
          kind: path
          path:
              - strike_period
      - name: last_updated_ts
        type: Timestamp
        nullable: true
        description: Last metadata update.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - last_updated_ts
      - name: settlement_sources
        type: Json
        nullable: true
        description: Settlement source objects.
        expr:
          kind: path
          path:
              - settlement_sources
      - name: markets
        type: Json
        nullable: true
        description: Nested market objects when the endpoint returns them.
        expr:
          kind: path
          path:
              - markets
      - name: nested_markets
        type: Utf8
        nullable: true
        virtual: true
        description: Requested with_nested_markets query.
        expr:
          kind: from_filter
          key: nested_markets
      - name: status
        type: Utf8
        nullable: true
        virtual: true
        description: Requested event status query.
        expr:
          kind: from_filter
          key: status

  - name: multivariate_events
    description: Multivariate (combo) events created from collections.
    guide: >-
      `SELECT event_ticker, title, series_ticker FROM kalshi.multivariate_events
      LIMIT 20`.
    fetch_limit_default: 50
    filters:
      - name: series_ticker
        required: false
        description: Parent series or collection ticker.
    request:
      method: GET
      path: /events/multivariate
      query:
        - name: series_ticker
          from: filter
          key: series_ticker
    response:
      rows_path:
        - events
      row_strategy: direct
    pagination:
      mode: cursor_query
      cursor_param: cursor
      response_cursor_path:
        - cursor
      page_size:
        default: 50
        max: 1000
        query_param: limit
    columns:
      - name: event_ticker
        type: Utf8
        nullable: false
        description: Event ticker.
        expr:
          kind: path
          path:
              - event_ticker
      - name: series_ticker
        type: Utf8
        nullable: true
        description: Parent series ticker.
        expr:
          kind: path
          path:
              - series_ticker
      - name: title
        type: Utf8
        nullable: true
        description: Event title.
        expr:
          kind: path
          path:
              - title
      - name: sub_title
        type: Utf8
        nullable: true
        description: Event subtitle.
        expr:
          kind: path
          path:
              - sub_title
      - name: category
        type: Utf8
        nullable: true
        description: Event category.
        expr:
          kind: path
          path:
              - category
      - name: mutually_exclusive
        type: Boolean
        nullable: true
        description: Whether outcomes are mutually exclusive.
        expr:
          kind: path
          path:
              - mutually_exclusive
      - name: available_on_brokers
        type: Boolean
        nullable: true
        description: Whether brokers can offer the event.
        expr:
          kind: path
          path:
              - available_on_brokers
      - name: exchange_index
        type: Int64
        nullable: true
        description: Exchange shard index.
        expr:
          kind: path
          path:
              - exchange_index
      - name: collateral_return_type
        type: Utf8
        nullable: true
        description: Collateral return type.
        expr:
          kind: path
          path:
              - collateral_return_type
      - name: strike_period
        type: Utf8
        nullable: true
        description: Strike period label.
        expr:
          kind: path
          path:
              - strike_period
      - name: last_updated_ts
        type: Timestamp
        nullable: true
        description: Last metadata update.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - last_updated_ts
      - name: settlement_sources
        type: Json
        nullable: true
        description: Settlement source objects.
        expr:
          kind: path
          path:
              - settlement_sources
      - name: markets
        type: Json
        nullable: true
        description: Nested market objects when the endpoint returns them.
        expr:
          kind: path
          path:
              - markets

  - name: event
    description: One event by ticker, including nested markets.
    guide: >-
      Requires `event_ticker`. Example:
      `SELECT title, category FROM kalshi.event WHERE event_ticker = 'KXELONMARS-99'`.
    filters:
      - name: event_ticker
        required: true
        description: Event ticker.
    request:
      method: GET
      path: /events/{{filter.event_ticker}}
      query:
        - name: with_nested_markets
          from: literal
          value: "true"
    response:
      rows_path:
        - event
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: event_ticker
        type: Utf8
        nullable: false
        description: Event ticker.
        expr:
          kind: path
          path:
              - event_ticker
      - name: series_ticker
        type: Utf8
        nullable: true
        description: Parent series ticker.
        expr:
          kind: path
          path:
              - series_ticker
      - name: title
        type: Utf8
        nullable: true
        description: Event title.
        expr:
          kind: path
          path:
              - title
      - name: sub_title
        type: Utf8
        nullable: true
        description: Event subtitle.
        expr:
          kind: path
          path:
              - sub_title
      - name: category
        type: Utf8
        nullable: true
        description: Event category.
        expr:
          kind: path
          path:
              - category
      - name: mutually_exclusive
        type: Boolean
        nullable: true
        description: Whether outcomes are mutually exclusive.
        expr:
          kind: path
          path:
              - mutually_exclusive
      - name: available_on_brokers
        type: Boolean
        nullable: true
        description: Whether brokers can offer the event.
        expr:
          kind: path
          path:
              - available_on_brokers
      - name: exchange_index
        type: Int64
        nullable: true
        description: Exchange shard index.
        expr:
          kind: path
          path:
              - exchange_index
      - name: collateral_return_type
        type: Utf8
        nullable: true
        description: Collateral return type.
        expr:
          kind: path
          path:
              - collateral_return_type
      - name: strike_period
        type: Utf8
        nullable: true
        description: Strike period label.
        expr:
          kind: path
          path:
              - strike_period
      - name: last_updated_ts
        type: Timestamp
        nullable: true
        description: Last metadata update.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - last_updated_ts
      - name: settlement_sources
        type: Json
        nullable: true
        description: Settlement source objects.
        expr:
          kind: path
          path:
              - settlement_sources
      - name: markets
        type: Json
        nullable: true
        description: Nested market objects when the endpoint returns them.
        expr:
          kind: path
          path:
              - markets

  - name: event_metadata
    description: Image and market-detail metadata for one event.
    guide: >-
      Requires `event_ticker`. Example:
      `SELECT image_url, market_details FROM kalshi.event_metadata
      WHERE event_ticker = 'KXELONMARS-99'`.
    filters:
      - name: event_ticker
        required: true
        description: Event ticker.
    request:
      method: GET
      path: /events/{{filter.event_ticker}}/metadata
    response:
      rows_path: []
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: event_ticker
        type: Utf8
        nullable: false
        virtual: true
        description: Requested event ticker.
        expr:
          kind: from_filter
          key: event_ticker
      - name: image_url
        type: Utf8
        nullable: true
        description: Event image URL.
        expr:
          kind: path
          path:
              - image_url
      - name: featured_image_url
        type: Utf8
        nullable: true
        description: Featured market image URL.
        expr:
          kind: path
          path:
              - featured_image_url
      - name: market_details
        type: Json
        nullable: true
        description: Per-market image and color metadata.
        expr:
          kind: path
          path:
              - market_details
      - name: settlement_sources
        type: Json
        nullable: true
        description: Settlement source objects.
        expr:
          kind: path
          path:
              - settlement_sources

  - name: markets
    description: >-
      Binary markets with prices, volume, and lifecycle times. Settled markets
      older than the historical cutoff live in historical_markets.
    guide: >-
      `SELECT ticker, title, yes_bid_dollars, status FROM kalshi.markets
      WHERE status = 'open' LIMIT 20`.
    fetch_limit_default: 50
    filters:
      - name: status
        required: false
        description: Market status (unopened, open, closed, settled).
      - name: series_ticker
        required: false
        description: Parent series ticker.
      - name: event_ticker
        required: false
        description: Parent event ticker.
      - name: tickers
        required: false
        description: Comma-separated market tickers.
    request:
      method: GET
      path: /markets
      query:
        - name: status
          from: filter
          key: status
        - name: series_ticker
          from: filter
          key: series_ticker
        - name: event_ticker
          from: filter
          key: event_ticker
        - name: tickers
          from: filter
          key: tickers
    response:
      rows_path:
        - markets
      row_strategy: direct
    pagination:
      mode: cursor_query
      cursor_param: cursor
      response_cursor_path:
        - cursor
      page_size:
        default: 50
        max: 1000
        query_param: limit
    columns:
      - name: ticker
        type: Utf8
        nullable: false
        description: Market ticker.
        expr:
          kind: path
          path:
              - ticker
      - name: event_ticker
        type: Utf8
        nullable: true
        description: Parent event ticker.
        expr:
          kind: path
          path:
              - event_ticker
      - name: title
        type: Utf8
        nullable: true
        description: Market title.
        expr:
          kind: path
          path:
              - title
      - name: yes_sub_title
        type: Utf8
        nullable: true
        description: YES outcome label.
        expr:
          kind: path
          path:
              - yes_sub_title
      - name: no_sub_title
        type: Utf8
        nullable: true
        description: NO outcome label.
        expr:
          kind: path
          path:
              - no_sub_title
      - name: status
        type: Utf8
        nullable: true
        description: Market status (unopened, open, closed, settled).
        expr:
          kind: path
          path:
              - status
      - name: market_type
        type: Utf8
        nullable: true
        description: Market type such as binary.
        expr:
          kind: path
          path:
              - market_type
      - name: strike_type
        type: Utf8
        nullable: true
        description: Strike type.
        expr:
          kind: path
          path:
              - strike_type
      - name: result
        type: Utf8
        nullable: true
        description: Settled result if any.
        expr:
          kind: path
          path:
              - result
      - name: yes_bid_dollars
        type: Utf8
        nullable: true
        description: YES bid in dollars (fixed-point string).
        expr:
          kind: path
          path:
              - yes_bid_dollars
      - name: yes_ask_dollars
        type: Utf8
        nullable: true
        description: YES ask in dollars (fixed-point string).
        expr:
          kind: path
          path:
              - yes_ask_dollars
      - name: no_bid_dollars
        type: Utf8
        nullable: true
        description: NO bid in dollars (fixed-point string).
        expr:
          kind: path
          path:
              - no_bid_dollars
      - name: no_ask_dollars
        type: Utf8
        nullable: true
        description: NO ask in dollars (fixed-point string).
        expr:
          kind: path
          path:
              - no_ask_dollars
      - name: last_price_dollars
        type: Utf8
        nullable: true
