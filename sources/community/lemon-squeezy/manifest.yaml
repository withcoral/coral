name: lemon_squeezy
version: 0.1.0
dsl_version: 3
description: >
  Query your Lemon Squeezy store data. Covers orders, subscriptions, customers,
  products, variants, license keys, discount codes, and subscription invoices.
  Supports both test-mode and live-mode API keys; the two modes access completely
  separate datasets.
backend: http
inputs:
  LEMON_SQUEEZY_API_KEY:
    kind: secret
    hint: >
      Your Lemon Squeezy API key. Create one at
      https://app.lemonsqueezy.com/settings/api.
      Use a test-mode key while developing; switch to a live-mode key for
      production data.

base_url: https://api.lemonsqueezy.com

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: "Bearer {{input.LEMON_SQUEEZY_API_KEY}}"

request_headers:
  - name: Accept
    from: literal
    value: application/vnd.api+json
  - name: Content-Type
    from: literal
    value: application/vnd.api+json

rate_limit:
  retry_after_header: Retry-After

test_queries:
  - SELECT * FROM lemon_squeezy.stores LIMIT 1
  - SELECT * FROM lemon_squeezy.products LIMIT 1
  - SELECT * FROM lemon_squeezy.prices LIMIT 1
  - SELECT * FROM lemon_squeezy.orders LIMIT 1
  - SELECT * FROM lemon_squeezy.order_items LIMIT 1
  - SELECT * FROM lemon_squeezy.subscriptions LIMIT 1
  - SELECT * FROM lemon_squeezy.subscription_invoices LIMIT 1
  - SELECT * FROM lemon_squeezy.customers LIMIT 1
  - SELECT * FROM lemon_squeezy.discounts LIMIT 1
  - SELECT * FROM lemon_squeezy.discount_redemptions LIMIT 1
  - SELECT * FROM lemon_squeezy.license_keys LIMIT 1
  - SELECT * FROM lemon_squeezy.variants LIMIT 1

tables:
  # ---------------------------------------------------------------------------
  # stores
  # ---------------------------------------------------------------------------
  - name: stores
    description: >
      Lemon Squeezy stores owned by the authenticated account. Each store is a
      distinct storefront with its own products, orders, and currency settings.
      Aggregate revenue and 30-day sales figures are included per store.
    request:
      method: GET
      path: /v1/stores
    response:
      rows_path:
        - data
      row_strategy: direct
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    columns:
      - name: id
        type: Utf8
        description: Unique store ID.
      - name: name
        type: Utf8
        description: Store display name.
        expr:
          kind: path
          path: [attributes, name]
      - name: slug
        type: Utf8
        description: URL slug for the store.
        expr:
          kind: path
          path: [attributes, slug]
      - name: domain
        type: Utf8
        description: "Domain of the store either {slug}.lemonsqueezy.com by default, or a custom domain if one has been configured."
        expr:
          kind: path
          path: [attributes, domain]
      - name: url
        type: Utf8
        description: Full storefront URL.
        expr:
          kind: path
          path: [attributes, url]
      - name: avatar_url
        type: Utf8
        nullable: true
        description: URL of the store avatar image.
        expr:
          kind: path
          path: [attributes, avatar_url]
      - name: plan
        type: Utf8
        description: "Lemon Squeezy billing plan name (e.g. fresh, sweet)."
        expr:
          kind: path
          path: [attributes, plan]
      - name: country
        type: Utf8
        description: Two-letter ISO 3166-1 alpha-2 country code of the store.
        expr:
          kind: path
          path: [attributes, country]
      - name: country_nicename
        type: Utf8
        description: Human-readable country name.
        expr:
          kind: path
          path: [attributes, country_nicename]
      - name: currency
        type: Utf8
        description: Three-letter ISO 4217 currency code used by the store.
        expr:
          kind: path
          path: [attributes, currency]
      - name: total_sales
        type: Int64
        description: Total number of paid orders across all time.
        expr:
          kind: path
          path: [attributes, total_sales]
      - name: total_revenue
        type: Int64
        description: Total revenue in USD cents across all time.
        expr:
          kind: path
          path: [attributes, total_revenue]
      - name: thirty_day_sales
        type: Int64
        description: Number of paid orders in the last 30 days.
        expr:
          kind: path
          path: [attributes, thirty_day_sales]
      - name: thirty_day_revenue
        type: Int64
        description: Revenue in USD cents in the last 30 days.
        expr:
          kind: path
          path: [attributes, thirty_day_revenue]
      - name: created_at
        type: Timestamp
        description: When the store was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When the store was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

  # ---------------------------------------------------------------------------
  # products
  # ---------------------------------------------------------------------------
  - name: products
    description: >
      Products listed in Lemon Squeezy stores. Each product can have multiple
      variants with distinct prices, licensing rules, and subscription billing
      intervals. Filter by store_id to scope to a specific store.
    request:
      method: GET
      path: /v1/products
      query:
        - name: "filter[store_id]"
          from: filter_int
          key: store_id
    response:
      rows_path:
        - data
      row_strategy: direct
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: store_id
        type: Int64
        description: Filter products to a specific store.
    columns:
      - name: id
        type: Utf8
        description: Unique product ID.
      - name: store_id
        type: Int64
        description: ID of the store this product belongs to.
        expr:
          kind: path
          path: [attributes, store_id]
      - name: name
        type: Utf8
        description: Product name.
        expr:
          kind: path
          path: [attributes, name]
      - name: slug
        type: Utf8
        description: URL slug for the product.
        expr:
          kind: path
          path: [attributes, slug]
      - name: description
        type: Utf8
        description: The description of the product in HTML.
        expr:
          kind: path
          path: [attributes, description]
      - name: status
        type: Utf8
        description: "Product status: draft or published."
        expr:
          kind: path
          path: [attributes, status]
      - name: status_formatted
        type: Utf8
        description: The formatted status of the product.
        expr:
          kind: path
          path: [attributes, status_formatted]
      - name: buy_now_url
        type: Utf8
        nullable: true
        description: Direct buy-now checkout URL.
        expr:
          kind: path
          path: [attributes, buy_now_url]
      - name: price
        type: Int64
        description: Base price in store-currency cents.
        expr:
          kind: path
          path: [attributes, price]
      - name: price_formatted
        type: Utf8
        description: Human-readable formatted price string (e.g. "$9.99").
        expr:
          kind: path
          path: [attributes, price_formatted]
      - name: from_price
        type: Int64
        nullable: true
        description: Lowest variant price in cents (when multiple variants exist).
        expr:
          kind: path
          path: [attributes, from_price]
      - name: from_price_formatted
        type: Utf8
        nullable: true
        description: Human-readable price of the cheapest variant (when multiple variants exist).
        expr:
          kind: path
          path: [attributes, from_price_formatted]
      - name: to_price
        type: Int64
        nullable: true
        description: Highest variant price in cents (when multiple variants exist).
        expr:
          kind: path
          path: [attributes, to_price]
      - name: to_price_formatted
        type: Utf8
        nullable: true
        description: Human-readable price of the most expensive variant (when multiple variants exist).
        expr:
          kind: path
          path: [attributes, to_price_formatted]
      - name: pay_what_you_want
        type: Boolean
        description: Whether the product uses pay-what-you-want pricing.
        expr:
          kind: path
          path: [attributes, pay_what_you_want]
      - name: thumb_url
        type: Utf8
        nullable: true
        description: URL of the product thumbnail image.
        expr:
          kind: path
          path: [attributes, thumb_url]
      - name: large_thumb_url
        type: Utf8
        nullable: true
        description: URL of the product large thumbnail image.
        expr:
          kind: path
          path: [attributes, large_thumb_url]
      - name: created_at
        type: Timestamp
        description: When the product was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When the product was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

  # ---------------------------------------------------------------------------
  # variants
  # ---------------------------------------------------------------------------
  - name: variants
    description: >
      Legacy variant metadata for Lemon Squeezy products. Variants still carry
      back-compat pricing and billing defaults, but current price records live
      in the prices table. Filter by product_id to scope to a specific product.
    request:
      method: GET
      path: /v1/variants
      query:
        - name: "filter[product_id]"
          from: filter_int
          key: product_id
        - name: "filter[status]"
          from: filter
          key: status
    response:
      rows_path:
        - data
      row_strategy: direct
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: product_id
        type: Int64
        description: Filter variants to a specific product.
      - name: status
        type: Utf8
        description: "Filter variants by status: pending, draft, or published."
    columns:
      - name: id
        type: Utf8
        description: Unique variant ID.
      - name: product_id
        type: Int64
        description: ID of the product this variant belongs to.
        expr:
          kind: path
          path: [attributes, product_id]
      - name: name
        type: Utf8
        description: Variant name.
        expr:
          kind: path
          path: [attributes, name]
      - name: slug
        type: Utf8
        description: URL slug for the variant.
        expr:
          kind: path
          path: [attributes, slug]
      - name: description
        type: Utf8
        nullable: true
        description: Variant description (may contain HTML).
        expr:
          kind: path
          path: [attributes, description]
      - name: price
        type: Int64
        description: Price in store-currency cents.
        expr:
          kind: path
          path: [attributes, price]
      - name: pay_what_you_want
        type: Boolean
        description: Whether this variant uses pay-what-you-want pricing.
        expr:
          kind: path
          path: [attributes, pay_what_you_want]
      - name: min_price
        type: Int64
        nullable: true
        description: Minimum price in cents when pay_what_you_want is true.
        expr:
          kind: path
          path: [attributes, min_price]
      - name: suggested_price
        type: Int64
        nullable: true
        description: Suggested price in cents when pay_what_you_want is true.
        expr:
          kind: path
          path: [attributes, suggested_price]
      - name: status
        type: Utf8
        description: "Variant status: pending, draft, or published."
        expr:
          kind: path
          path: [attributes, status]
      - name: status_formatted
        type: Utf8
        description: Human-readable status label.
        expr:
          kind: path
          path: [attributes, status_formatted]
      - name: sort
        type: Int64
        description: Display sort order of this variant within the product.
        expr:
          kind: path
          path: [attributes, sort]
      - name: has_license_keys
        type: Boolean
        description: Whether this variant generates license keys on purchase.
        expr:
          kind: path
          path: [attributes, has_license_keys]
      - name: license_activation_limit
        type: Int64
        nullable: true
        description: Maximum number of license activations allowed. Null when unlimited.
        expr:
          kind: path
          path: [attributes, license_activation_limit]
      - name: is_license_limit_unlimited
        type: Boolean
        description: Whether the license activation limit is unlimited.
        expr:
          kind: path
          path: [attributes, is_license_limit_unlimited]
      - name: license_length_value
        type: Int64
        nullable: true
        description: Numeric duration of the license validity period.
        expr:
          kind: path
          path: [attributes, license_length_value]
      - name: license_length_unit
        type: Utf8
        nullable: true
        description: "Unit of the license validity period: days, months, or years."
        expr:
          kind: path
          path: [attributes, license_length_unit]
      - name: is_license_length_unlimited
        type: Boolean
        description: Whether the license key never expires.
        expr:
          kind: path
          path: [attributes, is_license_length_unlimited]
      - name: has_free_trial
        type: Boolean
        description: Whether this variant includes a free trial period.
        expr:
          kind: path
          path: [attributes, has_free_trial]
      - name: trial_interval
        type: Utf8
        nullable: true
        description: "Trial period unit: day, week, month, or year."
        expr:
          kind: path
          path: [attributes, trial_interval]
      - name: trial_interval_count
        type: Int64
        nullable: true
        description: Number of trial period units.
        expr:
          kind: path
          path: [attributes, trial_interval_count]
      - name: is_subscription
        type: Boolean
        description: Whether this variant is sold as a subscription.
        expr:
          kind: path
          path: [attributes, is_subscription]
      - name: interval
        type: Utf8
        nullable: true
        description: "Subscription billing interval: day, week, month, or year."
        expr:
          kind: path
          path: [attributes, interval]
      - name: interval_count
        type: Int64
        nullable: true
        description: Number of interval units between each billing cycle.
        expr:
          kind: path
          path: [attributes, interval_count]
      - name: created_at
        type: Timestamp
        description: When the variant was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When the variant was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

  # ---------------------------------------------------------------------------
  # prices
  # ---------------------------------------------------------------------------
  - name: prices
    description: >
      Current Lemon Squeezy price records for variants. Use this table for
      authoritative price, setup fee, package, tier, usage aggregation,
      subscription interval, trial, and price history data. Filter by
      variant_id to scope to a specific variant.
    request:
      method: GET
      path: /v1/prices
      query:
        - name: "filter[variant_id]"
          from: filter_int
          key: variant_id
    response:
      rows_path:
        - data
      row_strategy: direct
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: variant_id
        type: Int64
        description: Filter prices to a specific variant.
    columns:
      - name: id
        type: Utf8
        description: Unique price ID.
      - name: variant_id
        type: Int64
        description: ID of the variant this price belongs to.
        expr:
          kind: path
          path: [attributes, variant_id]
      - name: category
        type: Utf8
        description: "Price category: one_time, subscription, lead_magnet, or pwyw."
        expr:
          kind: path
          path: [attributes, category]
      - name: scheme
        type: Utf8
        description: "Pricing scheme: standard, package, graduated, or volume."
        expr:
          kind: path
          path: [attributes, scheme]
      - name: usage_aggregation
        type: Utf8
        nullable: true
        description: "Usage aggregation mode when usage-based billing is enabled: sum, last_during_period, last_ever, or max."
        expr:
          kind: path
          path: [attributes, usage_aggregation]
      - name: unit_price
        type: Int64
        nullable: true
        description: "Price in cents. For volume/graduated pricing use tier data. If usage aggregation is enabled, use unit_price_decimal."
        expr:
          kind: path
          path: [attributes, unit_price]
      - name: unit_price_decimal
        type: Utf8
        nullable: true
        description: >-
          Cents as a decimal string ("999.0"=$9.99).
          Null unless usage_aggregation is set; authoritative price when unit_price is null.
          Cast to DECIMAL and divide by 100.
        expr:
          kind: path
          path: [attributes, unit_price_decimal]
      - name: setup_fee_enabled
        type: Boolean
        nullable: true
        description: Whether this price has a setup fee. Will be null for non-subscription pricing.
        expr:
          kind: path
          path: [attributes, setup_fee_enabled]
      - name: setup_fee
        type: Int64
        nullable: true
        description: Setup fee in store-currency cents.
        expr:
          kind: path
          path: [attributes, setup_fee]
      - name: package_size
        type: Int64
        description: Number of units per package for package pricing. Defaults to 1 for non-package schemes.
        expr:
          kind: path
          path: [attributes, package_size]
      - name: tiers
        type: Json
        nullable: true
        description: "Tier data for volume/graduated pricing, including limits, prices, and fixed fees. Null for standard/package pricing."
        expr:
          kind: path
          path: [attributes, tiers]
      - name: renewal_interval_unit
        type: Utf8
        nullable: true
        description: "Subscription billing interval unit: day, week, month, or year."
        expr:
          kind: path
          path: [attributes, renewal_interval_unit]
      - name: renewal_interval_quantity
        type: Int64
        nullable: true
        description: Number of interval units between subscription billings.
        expr:
          kind: path
          path: [attributes, renewal_interval_quantity]
      - name: trial_interval_unit
        type: Utf8
        nullable: true
        description: "Free-trial interval unit: day, week, month, or year."
        expr:
          kind: path
          path: [attributes, trial_interval_unit]
      - name: trial_interval_quantity
        type: Int64
        nullable: true
        description: Number of interval units in the free trial.
        expr:
          kind: path
          path: [attributes, trial_interval_quantity]
      - name: min_price
        type: Int64
        nullable: true
        description: Minimum price in cents for pay-what-you-want pricing.
        expr:
          kind: path
          path: [attributes, min_price]
      - name: suggested_price
        type: Int64
        nullable: true
        description: Suggested price in cents for pay-what-you-want pricing.
        expr:
          kind: path
          path: [attributes, suggested_price]
      - name: tax_code
        type: Utf8
        nullable: true
        description: "Tax category for the underlying product: eservice, ebook, or saas."
        expr:
          kind: path
          path: [attributes, tax_code]
      - name: created_at
        type: Timestamp
        description: When the price was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When the price was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

  # ---------------------------------------------------------------------------
  # customers
  # ---------------------------------------------------------------------------
  - name: customers
    description: >
      Customers who have made purchases from Lemon Squeezy stores. Includes
      cumulative revenue and monthly recurring revenue (MRR) per customer.
      Filter by store_id or email to narrow results.
    request:
      method: GET
      path: /v1/customers
      query:
        - name: "filter[store_id]"
          from: filter_int
          key: store_id
        - name: "filter[email]"
          from: filter
          key: email
    response:
      rows_path:
        - data
      row_strategy: direct
    fetch_limit_default: 500
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: store_id
        type: Int64
        description: Filter customers to a specific store.
      - name: email
        type: Utf8
        description: Filter by exact customer email address.
    columns:
      - name: id
        type: Utf8
        description: Unique customer ID.
      - name: store_id
        type: Int64
        description: ID of the store this customer belongs to.
        expr:
          kind: path
          path: [attributes, store_id]
      - name: name
        type: Utf8
        description: Full name of the customer.
        expr:
          kind: path
          path: [attributes, name]
      - name: email
        type: Utf8
        description: Email address of the customer.
        expr:
          kind: path
          path: [attributes, email]
      - name: status
        type: Utf8
        description: "Email marketing status of the customer: subscribed, unsubscribed, archived, requires_verification, invalid_email, or bounced."
        expr:
          kind: path
          path: [attributes, status]
      - name: status_formatted
        type: Utf8
        description: Human-readable status label.
        expr:
          kind: path
          path: [attributes, status_formatted]
      - name: city
        type: Utf8
        nullable: true
        description: Customer's city.
        expr:
          kind: path
          path: [attributes, city]
      - name: region
        type: Utf8
        nullable: true
        description: Customer's region or state.
        expr:
          kind: path
          path: [attributes, region]
      - name: country
        type: Utf8
        nullable: true
        description: Two-letter ISO 3166-1 alpha-2 country code of the customer.
        expr:
          kind: path
          path: [attributes, country]
      - name: country_formatted
        type: Utf8
        nullable: true
        description: Human-readable country name of the customer (e.g. "United States").
        expr:
          kind: path
          path: [attributes, country_formatted]
      - name: total_revenue_currency
        type: Int64
        description: Total revenue from this customer in USD cents.
        expr:
          kind: path
          path: [attributes, total_revenue_currency]
      - name: total_revenue_currency_formatted
        type: Utf8
        description: Human-readable total revenue from this customer (e.g. "$843.32").
        expr:
          kind: path
          path: [attributes, total_revenue_currency_formatted]
      - name: mrr
        type: Int64
        description: Monthly recurring revenue from this customer in USD cents.
        expr:
          kind: path
          path: [attributes, mrr]
      - name: mrr_formatted
        type: Utf8
        description: Human-readable monthly recurring revenue from this customer (e.g. "$19.99").
        expr:
          kind: path
          path: [attributes, mrr_formatted]
      - name: urls__customer_portal
        type: Utf8
        nullable: true
        description: Customer Portal URL for subscription and billing management. Valid for 24 hours. Null if no subscription exists.
        expr:
          kind: path
          path: [attributes, urls, customer_portal]
      - name: created_at
        type: Timestamp
        description: When the customer record was first created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When the customer record was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

  # ---------------------------------------------------------------------------
  # orders
  # ---------------------------------------------------------------------------
  - name: orders
    description: >
      Orders placed across Lemon Squeezy stores. Each row captures the full
      transaction including pricing breakdowns in both order currency and USD,
      tax details, and refund status. Filter by store_id or user_email.
    request:
      method: GET
      path: /v1/orders
      query:
        - name: "filter[store_id]"
          from: filter_int
          key: store_id
        - name: "filter[user_email]"
          from: filter
          key: user_email
        - name: "filter[order_number]"
          from: filter_int
          key: order_number
    response:
      rows_path:
        - data
      row_strategy: direct
    fetch_limit_default: 500
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: store_id
        type: Int64
        description: Filter orders to a specific store.
      - name: user_email
        type: Utf8
        description: Filter orders by exact customer email address.
      - name: order_number
