  # ---------------------------------------------------------------------------
  # order_items
  # ---------------------------------------------------------------------------
  - name: order_items
    description: >
      Line items within Lemon Squeezy orders. Each row represents a single
      product variant purchased in a given order, recording the price paid and
      product/variant names at time of purchase. Filter by order_id,
      product_id, or variant_id to narrow results.
    request:
      method: GET
      path: /v1/order-items
      query:
        - name: "filter[order_id]"
          from: filter_int
          key: order_id
        - name: "filter[product_id]"
          from: filter_int
          key: product_id
        - name: "filter[variant_id]"
          from: filter_int
          key: variant_id
    response:
      rows_path:
        - data
      row_strategy: direct
    fetch_limit_default: 500
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: order_id
        type: Int64
        description: Filter order items to a specific order.
      - name: product_id
        type: Int64
        description: Filter order items to a specific product.
      - name: variant_id
        type: Int64
        description: Filter order items to a specific variant.
    columns:
      - name: id
        type: Utf8
        description: Unique order item ID.
      - name: order_id
        type: Int64
        description: ID of the order this item belongs to.
        expr:
          kind: path
          path: [attributes, order_id]
      - name: product_id
        type: Int64
        description: ID of the product purchased.
        expr:
          kind: path
          path: [attributes, product_id]
      - name: variant_id
        type: Int64
        description: ID of the variant purchased.
        expr:
          kind: path
          path: [attributes, variant_id]
      - name: product_name
        type: Utf8
        description: Name of the product at time of purchase.
        expr:
          kind: path
          path: [attributes, product_name]
      - name: variant_name
        type: Utf8
        description: Name of the variant at time of purchase.
        expr:
          kind: path
          path: [attributes, variant_name]
      - name: price
        type: Int64
        description: Price paid in the order currency stored as cents.Join to orders via order_id to obtain the currency code
        expr:
          kind: path
          path: [attributes, price]
      - name: quantity
        type: Int64
        description: Quantity purchased for this line item.
        expr:
          kind: path
          path: [attributes, quantity]
      - name: created_at
        type: Timestamp
        description: When this order item was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When this order item was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

  # ---------------------------------------------------------------------------
  # subscriptions
  # ---------------------------------------------------------------------------
  - name: subscriptions
    description: >
      Active and historical subscriptions in Lemon Squeezy stores. Each row
      tracks billing status, trial period, cancellation, renewal date, and the
      payment method used. Filter by store_id, product_id, variant_id,
      user_email, or status to narrow results.
    request:
      method: GET
      path: /v1/subscriptions
      query:
        - name: "filter[store_id]"
          from: filter_int
          key: store_id
        - name: "filter[order_id]"
          from: filter_int
          key: order_id
        - name: "filter[order_item_id]"
          from: filter_int
          key: order_item_id
        - name: "filter[product_id]"
          from: filter_int
          key: product_id
        - name: "filter[variant_id]"
          from: filter_int
          key: variant_id
        - name: "filter[user_email]"
          from: filter
          key: user_email
        - name: "filter[status]"
          from: filter
          key: status
    response:
      rows_path:
        - data
      row_strategy: direct
    fetch_limit_default: 500
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: store_id
        type: Int64
        description: Filter subscriptions to a specific store.
      - name: order_id
        type: Int64
        description: Filter subscriptions to a specific originating order.
      - name: order_item_id
        type: Int64
        description: Filter subscriptions to a specific originating order item.
      - name: product_id
        type: Int64
        description: Filter subscriptions to a specific product.
      - name: variant_id
        type: Int64
        description: Filter subscriptions to a specific variant.
      - name: user_email
        type: Utf8
        description: Filter by exact subscriber email address.
      - name: status
        type: Utf8
        description: "Filter by status: on_trial, active, paused, past_due, unpaid, cancelled, expired."
    columns:
      - name: id
        type: Utf8
        description: Unique subscription ID.
      - name: store_id
        type: Int64
        description: ID of the store this subscription belongs to.
