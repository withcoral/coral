          kind: path
          path: [attributes, store_id]
      - name: customer_id
        type: Int64
        description: ID of the customer holding this subscription.
        expr:
          kind: path
          path: [attributes, customer_id]
      - name: order_id
        type: Int64
        description: ID of the order that created this subscription.
        expr:
          kind: path
          path: [attributes, order_id]
      - name: order_item_id
        type: Int64
        description: ID of the order item that created this subscription.
        expr:
          kind: path
          path: [attributes, order_item_id]
      - name: product_id
        type: Int64
        description: ID of the subscribed product.
        expr:
          kind: path
          path: [attributes, product_id]
      - name: variant_id
        type: Int64
        description: ID of the subscribed variant.
        expr:
          kind: path
          path: [attributes, variant_id]
      - name: product_name
        type: Utf8
        description: Name of the subscribed product.
        expr:
          kind: path
          path: [attributes, product_name]
      - name: variant_name
        type: Utf8
        description: Name of the subscribed variant.
        expr:
          kind: path
          path: [attributes, variant_name]
      - name: user_name
        type: Utf8
        description: Full name of the subscriber.
        expr:
          kind: path
          path: [attributes, user_name]
      - name: user_email
        type: Utf8
        description: Email address of the subscriber.
        expr:
          kind: path
          path: [attributes, user_email]
      - name: status
        type: Utf8
        description: "Subscription status: on_trial, active, paused, past_due, unpaid, cancelled, expired."
        expr:
          kind: path
          path: [attributes, status]
      - name: status_formatted
        type: Utf8
        description: Human-readable status label.
        expr:
          kind: path
          path: [attributes, status_formatted]
      - name: card_brand
        type: Utf8
        nullable: true
        description: Payment card brand (e.g. visa, mastercard). Null for PayPal.
        expr:
          kind: path
          path: [attributes, card_brand]
      - name: card_last_four
        type: Utf8
        nullable: true
        description: Last four digits of the payment card. Null for PayPal.
        expr:
          kind: path
          path: [attributes, card_last_four]
      - name: payment_processor
        type: Utf8
        nullable: true
        description: Payment processor (stripe or paypal). Null for older subscriptions or free subscriptions without a payment method
        expr:
          kind: path
          path: [attributes, payment_processor]
      - name: cancelled
        type: Boolean
        description: Whether the subscription has been cancelled.
        expr:
          kind: path
          path: [attributes, cancelled]
      - name: trial_ends_at
        type: Timestamp
        nullable: true
        description: When the free trial period ends, if applicable.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, trial_ends_at]
      - name: billing_anchor
        type: Int64
        nullable: true
        description: Day of the month used as the billing anchor date.
        expr:
          kind: path
          path: [attributes, billing_anchor]
      - name: renews_at
        type: Timestamp
        nullable: true
        description: Next scheduled renewal date.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, renews_at]
      - name: ends_at
        type: Timestamp
        nullable: true
        description: When the subscription ends or ended (grace-period end for cancelled subscriptions).
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, ends_at]
      - name: created_at
        type: Timestamp
        description: When the subscription was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When the subscription was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

