  # ---------------------------------------------------------------------------
  # discounts
  # ---------------------------------------------------------------------------
  - name: discounts
    description: >
      Discount codes configured in Lemon Squeezy stores. Covers both
      percentage and fixed-amount codes, redemption limits, validity windows,
      and subscription discount duration settings. Use discount_redemptions to
      count actual redemptions. Filter by store_id.
    request:
      method: GET
      path: /v1/discounts
      query:
        - name: "filter[store_id]"
          from: filter_int
          key: store_id
    response:
      rows_path:
        - data
      row_strategy: direct
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: store_id
        type: Int64
        description: Filter discounts to a specific store.
    columns:
      - name: id
        type: Utf8
        description: Unique discount ID.
      - name: store_id
        type: Int64
        description: ID of the store this discount belongs to.
        expr:
          kind: path
          path: [attributes, store_id]
      - name: name
        type: Utf8
        description: Internal display name of the discount.
        expr:
          kind: path
          path: [attributes, name]
      - name: code
        type: Utf8
        description: Coupon code customers enter at checkout.
        expr:
          kind: path
          path: [attributes, code]
      - name: amount
        type: Int64
        description: Discount amount - cents for fixed type, integer percentage for percent type.
        expr:
          kind: path
          path: [attributes, amount]
      - name: amount_type
        type: Utf8
        description: "Discount calculation type: percent or fixed."
        expr:
          kind: path
          path: [attributes, amount_type]
      - name: is_limited_to_products
        type: Boolean
        description: >
          True if this discount can only be applied to certain products or
          variants. When true, the specific products/variants are available
          via the `variants` relationship on the discount object in the
          Lemon Squeezy API.
        expr:
          kind: path
          path: [attributes, is_limited_to_products]
      - name: is_limited_redemptions
        type: Boolean
        description: >
          True if this discount can only be redeemed a limited number of times.
          Check this flag before using max_redemptions when false,
          max_redemptions is 0 (not null) and carries no meaning.
        expr:
          kind: path
          path: [attributes, is_limited_redemptions]
      - name: max_redemptions
        type: Int64
        description: >
          Maximum number of times this discount can be redeemed.
          Only meaningful when is_limited_redemptions is true; the API returns
          0 (not null) when there is no redemption limit, so always gate on
          is_limited_redemptions rather than testing this field for null or zero.
        expr:
          kind: path
          path: [attributes, max_redemptions]
      - name: starts_at
        type: Timestamp
        nullable: true
        description: When the discount becomes active. Null if active immediately.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, starts_at]
      - name: expires_at
        type: Timestamp
        nullable: true
        description: When the discount expires. Null if it never expires.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, expires_at]
      - name: duration
        type: Utf8
        description: "For subscription discounts - duration: once, repeating, or forever."
        expr:
          kind: path
          path: [attributes, duration]
      - name: duration_in_months
        type: Int64
        nullable: true
        description: Number of months the discount applies when duration is repeating.
        expr:
          kind: path
          path: [attributes, duration_in_months]
      - name: status
        type: Utf8
        description: "Discount status: draft or published."
        expr:
          kind: path
          path: [attributes, status]
      - name: status_formatted
        type: Utf8
        description: Human-readable status label.
        expr:
          kind: path
          path: [attributes, status_formatted]
      - name: created_at
        type: Timestamp
        description: When the discount was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When the discount was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

  # ---------------------------------------------------------------------------
  # license_keys
  # ---------------------------------------------------------------------------
  - name: license_keys
    description: >
      License keys issued with Lemon Squeezy product purchases. Tracks each
      key's activation limit, current activation count (instances_count),
      expiry, and disabled status. Useful for auditing software license usage.
      Filter by store_id, order_id, product_id, or status.
    request:
      method: GET
      path: /v1/license-keys
      query:
        - name: "filter[store_id]"
          from: filter_int
          key: store_id
        - name: "filter[order_id]"
          from: filter_int
          key: order_id
        - name: "filter[order_item_id]"
          from: filter_int
          key: order_item_id
        - name: "filter[product_id]"
          from: filter_int
          key: product_id
        - name: "filter[status]"
          from: filter
          key: status
    response:
      rows_path:
        - data
      row_strategy: direct
    fetch_limit_default: 500
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: store_id
        type: Int64
        description: Filter license keys to a specific store.
      - name: order_id
        type: Int64
        description: Filter license keys issued with a specific order.
      - name: order_item_id
        type: Int64
        description: Filter license keys issued with a specific order item.
      - name: product_id
        type: Int64
        description: Filter license keys for a specific product.
      - name: status
        type: Utf8
        description: "Filter by key status: inactive, active, disabled, or expired."
    columns:
      - name: id
        type: Utf8
        description: Unique license key ID.
      - name: store_id
        type: Int64
        description: ID of the store this license key belongs to.
        expr:
          kind: path
          path: [attributes, store_id]
      - name: customer_id
        type: Int64
        description: ID of the customer who received this license key.
        expr:
          kind: path
          path: [attributes, customer_id]
      - name: order_id
        type: Int64
        description: ID of the order this license key was issued with.
        expr:
          kind: path
          path: [attributes, order_id]
      - name: order_item_id
        type: Int64
        description: ID of the order item this license key was issued with.
        expr:
          kind: path
          path: [attributes, order_item_id]
      - name: product_id
        type: Int64
        description: ID of the product this license key is for.
        expr:
          kind: path
          path: [attributes, product_id]
      - name: user_name
        type: Utf8
        description: Full name of the customer who received this key.
        expr:
          kind: path
          path: [attributes, user_name]
      - name: user_email
        type: Utf8
        description: Email address of the customer who received this key.
        expr:
          kind: path
          path: [attributes, user_email]
      - name: key
        type: Utf8
        description: The full license key string.
        expr:
          kind: path
          path: [attributes, key]
      - name: key_short
        type: Utf8
        description: Truncated license key for display (last characters only).
        expr:
          kind: path
          path: [attributes, key_short]
      - name: activation_limit
        type: Int64
        nullable: true
        description: Maximum number of activations allowed. Null when unlimited.
        expr:
          kind: path
          path: [attributes, activation_limit]
      - name: instances_count
        type: Int64
        description: Number of times this key has been activated so far.
        expr:
          kind: path
          path: [attributes, instances_count]
      - name: disabled
        type: Boolean
        description: Whether this license key has been manually disabled.
        expr:
          kind: path
          path: [attributes, disabled]
      - name: status
        type: Utf8
        description: "Key status: inactive, active, disabled, or expired."
        expr:
          kind: path
          path: [attributes, status]
      - name: status_formatted
        type: Utf8
        description: Human-readable status label.
        expr:
          kind: path
          path: [attributes, status_formatted]
      - name: expires_at
        type: Timestamp
        nullable: true
        description: When this license key expires. Null when the key does not expire.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, expires_at]
      - name: created_at
        type: Timestamp
        description: When the license key was issued.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When the license key was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]

  # ---------------------------------------------------------------------------
  # discount_redemptions
  # ---------------------------------------------------------------------------
  - name: discount_redemptions
    description: >
      Individual redemption records for Lemon Squeezy discount codes. Each row
      represents one application of a discount to an order, recording the amount
      saved and the order it was applied to. Use this table to count how many
      times a discount has been redeemed the parent discounts table does not
      expose a redemption count field. Filter by discount_id or order_id.
    request:
      method: GET
      path: /v1/discount-redemptions
      query:
        - name: "filter[discount_id]"
          from: filter_int
          key: discount_id
        - name: "filter[order_id]"
          from: filter_int
          key: order_id
    response:
      rows_path:
        - data
      row_strategy: direct
    fetch_limit_default: 500
    pagination:
      mode: page
      page_param: "page[number]"
      page_start: 1
      page_size:
        default: 100
        max: 100
        query_param: "page[size]"
    filters:
      - name: discount_id
        type: Int64
        description: Filter redemptions to a specific discount.
      - name: order_id
        type: Int64
        description: Filter redemptions to a specific order.
    columns:
      - name: id
        type: Utf8
        description: Unique discount redemption ID.
      - name: discount_id
        type: Int64
        description: ID of the discount that was applied.
        expr:
          kind: path
          path: [attributes, discount_id]
      - name: order_id
        type: Int64
        description: ID of the order this discount was applied to.
        expr:
          kind: path
          path: [attributes, order_id]
      - name: discount_name
        type: Utf8
        description: Name of the discount at time of redemption.
        expr:
          kind: path
          path: [attributes, discount_name]
      - name: discount_code
        type: Utf8
        description: Coupon code that was entered at checkout.
        expr:
          kind: path
          path: [attributes, discount_code]
      - name: discount_amount
        type: Int64
        description: Discount value cents for fixed type, integer percentage for percent type.
        expr:
          kind: path
          path: [attributes, discount_amount]
      - name: discount_amount_type
        type: Utf8
        description: "Discount calculation type at time of redemption: percent or fixed."
        expr:
          kind: path
          path: [attributes, discount_amount_type]
      - name: amount
        type: Int64
        description: Actual amount saved on the order for this redemption, expressed in the order currency and stored as cents.
        expr:
          kind: path
          path: [attributes, amount]
      - name: created_at
        type: Timestamp
        description: When this redemption occurred.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, created_at]
      - name: updated_at
        type: Timestamp
        description: When this redemption record was last updated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path: [attributes, updated_at]
