  - name: comments
    description: Replies to a YouTube comment thread
    guide: |
      Returns all replies to a specific comment thread. `parent_id` is
      required and must be a thread `id` from `youtube.comment_threads`.
      Unlike the `replies` preview embedded in comment_threads rows, this
      table returns the complete paginated list of replies.

      Typical workflow:
        1. Query `youtube.comment_threads WHERE video_id = '<id>'` to find
           threads and their `id` values.
        2. Query `youtube.comments WHERE parent_id = '<thread_id>'` to read
           all replies for a thread with replies.
    filters:
      - name: parent_id
        required: true
    request:
      method: GET
      path: /comments
      query:
        - name: part
          from: literal
          value: snippet
        - name: parentId
          from: filter
          key: parent_id
    response:
      rows_path:
        - items
      allow_404_empty: false
      row_strategy: direct
    pagination:
      mode: cursor_query
      page_size:
        default: 100
        max: 100
        query_param: maxResults
      cursor_param: pageToken
      response_cursor_path:
        - nextPageToken
    columns:
      - name: parent_id
        type: Utf8
        nullable: true
        description: Thread ID filter used to look up replies
        expr:
          kind: from_filter
          key: parent_id
      - name: id
        type: Utf8
        nullable: false
        description: Reply comment ID
        expr:
          kind: path
          path:
            - id
      - name: snippet__text_display
        type: Utf8
        nullable: true
        description: Display text of the reply
        expr:
          kind: path
          path:
            - snippet
            - textDisplay
      - name: snippet__author_display_name
        type: Utf8
        nullable: true
        description: Display name of the reply author
        expr:
          kind: path
          path:
            - snippet
            - authorDisplayName
      - name: snippet__author_channel_url
        type: Utf8
        nullable: true
        description: YouTube channel URL of the reply author
        expr:
          kind: path
          path:
            - snippet
            - authorChannelUrl
      - name: snippet__author_channel_id
        type: Utf8
        nullable: true
        description: Channel ID of the reply author
        expr:
          kind: path
          path:
            - snippet
            - authorChannelId
            - value
      - name: snippet__like_count
        type: Int64
        nullable: true
        description: Number of likes on the reply
        expr:
          kind: path
          path:
            - snippet
            - likeCount
      - name: snippet__published_at
        type: Timestamp
        nullable: true
        description: Date and time the reply was posted
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - snippet
              - publishedAt
      - name: snippet__updated_at
        type: Timestamp
        nullable: true
        description: Date and time the reply was last edited
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - snippet
              - updatedAt
