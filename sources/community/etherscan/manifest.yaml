name: etherscan
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Etherscan V2 multichain API for querying ERC-20 token transfers.
  One API key covers all chains via the chainid parameter.
  Uses apikey query param authentication.
inputs:
  ETHERSCAN_API_KEY:
    kind: secret
    hint: Etherscan V2 API key from etherscan.io/apis
base_url: https://api.etherscan.io/v2
request_headers:
  - name: Accept
    from: literal
    value: application/json
test_queries:
  - SELECT hash, from_address, to_address, value FROM etherscan.token_transfers WHERE chainid = 1 AND address = '0x464C71f6c2F760DdA6093dCB91C24c39e5d6e18c' AND contract_address = '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48' LIMIT 1
tables:
  - name: token_transfers
    description: >-
      ERC-20 token transfer events for a wallet address on a given EVM chain.
      Filter by chainid (8453 = Base, 1 = Ethereum) and address.
      Values are in the token's smallest unit (e.g. 6 decimals for USDC).
    filters:
      - name: chainid
        type: Int64
        required: true
        description: EVM chain ID (1 = Ethereum, 8453 = Base, 10 = Optimism, 42161 = Arbitrum).
      - name: address
        type: Utf8
        required: true
        description: Wallet address to query token transfers for.
      - name: contract_address
        type: Utf8
        description: "Token contract address to filter by (e.g. USDC: 0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48)."
      - name: sort_order
        type: Utf8
        description: "Sort order: 'asc' (oldest first, default) or 'desc' (newest first)."
      - name: startblock
        type: Int64
        description: Only return transfers at or after this block number. Narrow the range for active wallets to avoid provider timeouts.
      - name: endblock
        type: Int64
        description: Only return transfers at or before this block number.
    request:
      method: GET
      path: /api
      query:
        - name: module
          from: literal
          value: account
        - name: action
          from: literal
          value: tokentx
        - name: chainid
          from: filter_int
          key: chainid
        - name: address
          from: filter
          key: address
        - name: contractaddress
          from: filter
          key: contract_address
        - name: sort
          from: filter
          key: sort_order
        - name: startblock
          from: filter_int
          key: startblock
        - name: endblock
          from: filter_int
          key: endblock
        - name: apikey
          from: input
          key: ETHERSCAN_API_KEY
    response:
      rows_path:
        - result
      row_strategy: direct
    pagination:
      mode: page
      page_param: page
      page_start: 1
      page_size:
        default: 50
        max: 100
        query_param: offset
    columns:
      - name: chainid
        type: Int64
        description: EVM chain ID the transfers were queried on (echoed from the filter).
        expr:
          kind: from_filter
          key: chainid
      - name: address
        type: Utf8
        description: Wallet address the transfers were queried for (echoed from the filter).
        expr:
          kind: from_filter
          key: address
      - name: sort_order
        type: Utf8
        description: Sort order applied to the request ('asc' or 'desc', echoed from the filter; null if unset).
        expr:
          kind: from_filter
          key: sort_order
      - name: startblock
        type: Int64
        description: Lower block bound applied to the request (echoed from the filter; null if unset).
        expr:
          kind: from_filter
          key: startblock
      - name: endblock
        type: Int64
        description: Upper block bound applied to the request (echoed from the filter; null if unset).
        expr:
          kind: from_filter
          key: endblock
      - name: hash
        type: Utf8
        description: Transaction hash.
      - name: from_address
        type: Utf8
        description: Sender address.
        expr:
          kind: path
          path:
            - from
      - name: to_address
        type: Utf8
        description: Recipient address.
        expr:
          kind: path
          path:
            - to
      - name: contract_address
        type: Utf8
        description: Token contract address.
        expr:
          kind: path
          path:
            - contractAddress
      - name: value
        type: Utf8
        description: Transfer value in token's smallest unit (cast to DOUBLE/1e6 for USDC).
      - name: token_name
        type: Utf8
        description: Token name.
        expr:
          kind: path
          path:
            - tokenName
      - name: token_symbol
        type: Utf8
        description: Token symbol (e.g. 'USDC', 'WETH').
        expr:
          kind: path
          path:
            - tokenSymbol
      - name: token_decimal
        type: Int64
        description: Token decimal places.
        expr:
          kind: path
          path:
            - tokenDecimal
      - name: block_number
        type: Utf8
        description: Block number.
        expr:
          kind: path
          path:
            - blockNumber
      - name: block_time
        type: Utf8
        description: Block timestamp as Unix epoch string.
        expr:
          kind: path
          path:
            - timeStamp
      - name: gas_used
        type: Utf8
        description: Gas used by the transaction.
        expr:
          kind: path
          path:
            - gasUsed
      - name: gas_price
        type: Utf8
        description: Gas price in wei.
        expr:
          kind: path
          path:
            - gasPrice
