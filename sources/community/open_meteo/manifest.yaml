---
name: open_meteo
version: "0.1.0"
dsl_version: 3
backend: http
description: >-
  Query current weather conditions from Open-Meteo.
  Open-Meteo is a free, open-source weather API that requires no API key for non-commercial use.
base_url: "https://api.open-meteo.com/v1"

test_queries:
  - SELECT temperature_2m, wind_speed_10m FROM open_meteo.current_weather WHERE latitude = 52.52 AND longitude = 13.41 LIMIT 1

tables:
  # ──────────────────────────────────────────────────────────────────────
  # current_weather — current weather conditions for a location
  # ──────────────────────────────────────────────────────────────────────
  - name: current_weather
    description: >
      Get the current weather conditions for a specific location.
      Requires `latitude` and `longitude` filters.
    filters:
      - name: latitude
        required: true
      - name: longitude
        required: true
    request:
      method: GET
      path: /forecast
      query:
        - name: latitude
          from: filter
          key: latitude
        - name: longitude
          from: filter
          key: longitude
        - name: current
          from: literal
          value: temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m
    response:
      row_strategy: direct
    columns:
      - name: latitude
        type: Float64
        nullable: false
        description: The latitude of the request.
        expr: {kind: path, path: [latitude]}
      - name: longitude
        type: Float64
        nullable: false
        description: The longitude of the request.
        expr: {kind: path, path: [longitude]}
      - name: time
        type: Utf8
        nullable: true
        description: The timestamp of the current weather data.
        expr: {kind: path, path: [current, time]}
      - name: temperature_2m
        type: Float64
        nullable: true
        description: Air temperature at 2 meters above ground (°C).
        expr: {kind: path, path: [current, temperature_2m]}
      - name: relative_humidity_2m
        type: Float64
        nullable: true
        description: Relative humidity at 2 meters above ground (%).
        expr: {kind: path, path: [current, relative_humidity_2m]}
      - name: apparent_temperature
        type: Float64
        nullable: true
        description: Apparent "feels like" temperature (°C).
        expr: {kind: path, path: [current, apparent_temperature]}
      - name: is_day
        type: Int64
        nullable: true
        description: 1 if day, 0 if night.
        expr: {kind: path, path: [current, is_day]}
      - name: precipitation
        type: Float64
        nullable: true
        description: Total precipitation (rain, showers, snow) sum (mm).
        expr: {kind: path, path: [current, precipitation]}
      - name: weather_code
        type: Int64
        nullable: true
        description: WMO Weather interpretation code.
        expr: {kind: path, path: [current, weather_code]}
      - name: cloud_cover
        type: Float64
        nullable: true
        description: Total cloud cover as a percentage.
        expr: {kind: path, path: [current, cloud_cover]}
      - name: wind_speed_10m
        type: Float64
        nullable: true
        description: Wind speed at 10 meters above ground (km/h).
        expr: {kind: path, path: [current, wind_speed_10m]}
      - name: raw
        type: Json
        nullable: false
        description: Full raw weather response object.
        expr:
          kind: current_row
