  - name: api_keys
    description: >-
      Rootly API key metadata. Secret token values are not returned by Rootly.
    guide: |
      Audit token hygiene:
      `SELECT name, kind, expires_at, last_used_at
       FROM rootly.api_keys WHERE active = true LIMIT 50`.
    filters:
      - name: search
      - name: name
      - name: kind
      - name: active
      - name: sort
    request:
