name: pdf
version: 0.1.0
dsl_version: 3
backend: file
description: >-
  Query text, tables, images, links, annotations, form fields, and
  document metadata from local PDF documents using PyMuPDF.
test_queries:
  - SELECT file_name, page, page_count, length(text) AS char_count FROM pdf.pages LIMIT 5
tables:
  - name: pages
    format: jsonl
    description: >-
      Text, tables, images, links, annotations, and form fields extracted
      from PDF documents, one row per page. Generated by the
      pdf-to-jsonl.py converter script using PyMuPDF.
    guide: |
      First convert your PDFs (run from the Coral repo root):
        pip install pymupdf
        python sources/community/pdf/scripts/pdf-to-jsonl.py --dir ~/pdfs/

      Then query:
        -- Full text search
        SELECT file_name, page, text FROM pdf.pages
        WHERE text LIKE '%report%'

        -- Find links in documents
        SELECT file_name, page, links FROM pdf.pages
        WHERE file_name = 'sample_report.pdf'

        -- Pages with annotations
        SELECT file_name, page, annotations FROM pdf.pages
        WHERE json_length(annotations) > 0

        -- Document-level info
        SELECT file_name, page_count, file_size, metadata
        FROM pdf.documents
        ORDER BY file_size DESC

      Re-run the converter when PDFs change.
    source:
      location: file://~/.coral/pdf/
      glob: pages.jsonl
    columns:
      - name: file_name
        type: Utf8
        nullable: false
        description: File name of the source PDF (e.g. sample_report.pdf).
      - name: path
        type: Utf8
        nullable: false
        description: Absolute filesystem path to the source PDF.
      - name: page
        type: Int64
        nullable: false
        description: Page number within the PDF (1-indexed).
      - name: page_count
        type: Int64
        nullable: false
        description: Total number of pages in the document.
      - name: text
        type: Utf8
        nullable: false
        description: Full plain text content extracted from the page.
      - name: markdown
        type: Utf8
        nullable: false
        description: Structured markdown preserving headings, bold, and italic formatting.
      - name: blocks
        type: Json
        nullable: false
        description: JSON array of text blocks with position (x0,y0,x1,y1), font name, size, bold, italic, and color.
      - name: tables
        type: Json
        nullable: false
        description: JSON array of extracted tables with header row and data rows.
      - name: images
        type: Json
        nullable: false
        description: JSON array of image references with width, height, and xref.
      - name: links
        type: Json
        nullable: false
        description: JSON array of hyperlinks with URI, kind, and bounding box.
      - name: annotations
        type: Json
        nullable: false
        description: JSON array of annotations (comments, highlights, stamps, etc.) with type, content, and position.
      - name: widgets
        type: Json
        nullable: false
        description: JSON array of interactive form fields with name, type, value, and position.

  - name: documents
    format: jsonl
    description: >-
      Per-document summary metadata including table of contents, embedded
      files, page labels, and file-level metadata. Generated by the
      pdf-to-jsonl.py converter script.
    guide: |
      Query document-level information:
        -- List all documents with page count and file size
        SELECT file_name, page_count, file_size FROM pdf.documents
        ORDER BY file_size DESC

        -- Table of contents
        SELECT file_name, toc FROM pdf.documents
        WHERE json_length(toc) > 0

        -- Embedded files
        SELECT file_name, embedded_files FROM pdf.documents
        WHERE json_length(embedded_files) > 0
    source:
      location: file://~/.coral/pdf/
      glob: documents.jsonl
    columns:
      - name: file_name
        type: Utf8
        nullable: false
        description: File name of the source PDF (e.g. sample_report.pdf).
      - name: path
        type: Utf8
        nullable: false
        description: Absolute filesystem path to the source PDF.
      - name: file_size
        type: Int64
        nullable: false
        description: File size in bytes.
      - name: page_count
        type: Int64
        nullable: false
        description: Total number of pages in the document.
      - name: metadata
        type: Json
        nullable: true
        description: PDF document metadata (author, title, subject, producer, creation date, etc.).
      - name: toc
        type: Json
        nullable: false
        description: JSON array of table of contents entries with level, title, and page number.
      - name: embedded_files
        type: Json
        nullable: false
        description: JSON array of embedded file attachments with name, description, size, and MIME type.
      - name: page_labels
        type: Json
        nullable: false
        description: JSON array of page label definitions with start page, style, prefix, and start number.
