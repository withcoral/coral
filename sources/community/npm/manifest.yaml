dsl_version: 3
name: npm
version: "1.0.0"
description: npm package download statistics.
backend: http
base_url: https://api.npmjs.org

tables:
  - name: packages
    description: npm package download stats.
    filters:
      - name: name
        required: true
      - name: period
        required: false
        default: last-month
    request:
      method: GET
      path: /downloads/point/{{filter.period}}/{{filter.name}}
    columns:
      - name: package
        type: Utf8
        expr:
          kind: path
          path: ["package"]
      - name: downloads
        type: Int64
        expr:
          kind: path
          path: ["downloads"]
      - name: start
        type: Utf8
        expr:
          kind: path
          path: ["start"]
      - name: end
        type: Utf8
        expr:
          kind: path
          path: ["end"]
      - name: period
        type: Utf8
        virtual: true
        expr:
          kind: from_filter
          key: period
