          from: filter
          key: id
        - name: slug
          from: filter
          key: slug
        - name: ticker
          from: filter
          key: ticker
        - name: active
          from: filter
          key: active_filter
        - name: closed
          from: filter
          key: closed_filter
        - name: archived
          from: filter
          key: archived_filter
        - name: tag_id
          from: filter
          key: tag_id
        - name: tag
          from: filter
          key: tag
        - name: order
          from: filter
          key: sort_by
        - name: ascending
          from: filter
          key: ascending
