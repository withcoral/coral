        expr:
          kind: path
          path:
            - category
      - name: series_slug
        type: Utf8
        nullable: true
        description: Parent series slug when present.
        expr:
          kind: path
          path:
            - seriesSlug
      - name: active
        type: Boolean
        nullable: true
        description: Whether the event is active.
        expr:
          kind: path
          path:
            - active
      - name: closed
        type: Boolean
        nullable: true
        description: Whether the event is closed.
        expr:
          kind: path
          path:
            - closed
      - name: archived
        type: Boolean
        nullable: true
        description: Whether the event is archived.
        expr:
          kind: path
          path:
            - archived
      - name: featured
        type: Boolean
        nullable: true
        description: Whether Gamma marks the event as featured.
        expr:
          kind: path
          path:
            - featured
      - name: restricted
