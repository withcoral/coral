name: headlamp
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Kubernetes cluster metadata through the Headlamp backend
  configuration API.
base_url: "{{input.HEADLAMP_BASE_URL}}"

inputs:
  HEADLAMP_BASE_URL:
    kind: variable
    hint: |
      Headlamp base URL without a trailing slash, for example
      `https://headlamp.example.com` or `http://localhost:4466`. Include any
      sub-path Headlamp is served under; this source appends `/config`.

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT name FROM headlamp.clusters LIMIT 1

tables:
  - name: clusters
    description: Kubernetes clusters visible through the Headlamp backend configuration.
    guide: |
      Each row is one cluster from `GET /config`, read from the `clusters`
      array in the response body. Headlamp's `/config` endpoint is read-only and
      unauthenticated — the `X-HEADLAMP_BACKEND-TOKEN` guard only applies to
      Headlamp's mutating and in-cluster backend APIs, not to config — so this
      source requires no token.
    request:
      method: GET
      path: /config
    response:
      row_strategy: direct
      rows_path: [clusters]
    pagination:
      mode: none
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Cluster name.
        expr: {kind: path, path: [name]}
      - name: server
        type: Utf8
        nullable: true
        description: Kubernetes API server URL.
        expr: {kind: path, path: [server]}
      - name: auth_type
        type: Utf8
        nullable: true
        description: Authentication type configured for the cluster.
        expr: {kind: path, path: [auth_type]}
