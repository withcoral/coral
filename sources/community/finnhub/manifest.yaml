name: finnhub
version: 0.1.0
dsl_version: 3
backend: http
description: Query real-time and historical market data, stock financials, crypto prices, and financial news from the Finnhub API.
inputs:
  FINNHUB_API_TOKEN:
    kind: secret
    hint: Your Finnhub API Token
  FINNHUB_API_BASE:
    kind: variable
    default: https://finnhub.io/api/v1
    hint: Base URL for the Finnhub API
base_url: '{{input.FINNHUB_API_BASE}}'
auth:
  type: HeaderAuth
  headers:
  - name: X-Finnhub-Token
    from: template
    template: '{{input.FINNHUB_API_TOKEN}}'
tables:
- name: market_news
  description: Fetch the latest market news headlines
  request:
    method: GET
    path: /news
    query:
    - name: category
      from: template
      template: general
  columns:
  - name: id
    type: Int64
  - name: datetime
    type: Int64
  - name: headline
    type: Utf8
  - name: category
    type: Utf8
  - name: source
    type: Utf8
  - name: summary
    type: Utf8
  - name: url
    type: Utf8
  - name: related
    type: Utf8
- name: company_news
  description: Fetch news for a specific company symbol
  filters:
  - name: symbol
    type: Utf8
    required: true
  - name: from
    type: Utf8
    required: true
  - name: to
    type: Utf8
    required: true
  request:
    method: GET
    path: /company-news
    query:
    - name: symbol
      from: template
      template: '{{filter.symbol}}'
    - name: from
      from: template
      template: '{{filter.from}}'
    - name: to
      from: template
      template: '{{filter.to}}'
  columns:
  - name: id
    type: Int64
  - name: headline
    type: Utf8
  - name: datetime
    type: Int64
  - name: source
    type: Utf8
  - name: url
    type: Utf8
  - name: summary
    type: Utf8
  - name: symbol
    type: Utf8
    virtual: true
    expr:
      kind: from_filter
      key: symbol
  - name: from
    type: Utf8
    virtual: true
    expr:
      kind: from_filter
      key: from
  - name: to
    type: Utf8
    virtual: true
    expr:
      kind: from_filter
      key: to
- name: news_sentiment
  description: Get the company's news sentiment and buzz
  filters:
  - name: symbol
    type: Utf8
    required: true
  request:
    method: GET
    path: /news-sentiment
    query:
    - name: symbol
