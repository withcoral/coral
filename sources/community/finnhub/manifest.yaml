name: finnhub
version: 0.1.0
dsl_version: 3
backend: http

inputs:
  API_BASE:
    kind: variable
    default: https://finnhub.io/api/v1
    hint: Base URL for the Finnhub API
  API_TOKEN:
    kind: secret
    hint: Your Finnhub API Token

base_url: "{{input.API_BASE}}"

auth:
  type: HeaderAuth
  headers:
    - name: X-Finnhub-Token
      from: template
      template: "{{input.API_TOKEN}}"

tables:
  - name: market_news
    description: Fetch the latest market news headlines
    request:
      method: GET
      path: /news
      query:
        - name: category
          from: template
          template: general
    columns:
      - name: id
        type: Int64
      - name: datetime
        type: Int64
      - name: headline
        type: Utf8
      - name: category
        type: Utf8
      - name: source
        type: Utf8
      - name: summary
        type: Utf8
      - name: url
        type: Utf8
      - name: related
        type: Utf8

  - name: company_news
    description: Fetch news for a specific company symbol
    filters:
      - name: symbol
        type: Utf8
        required: true
      - name: from
        type: Utf8
        required: true
      - name: to
        type: Utf8
        required: true
    request:
      method: GET
      path: /company-news
      query:
        - name: symbol
          from: template
          template: "{{filter.symbol}}"
        - name: from
          from: template
          template: "{{filter.from}}"
        - name: to
          from: template
          template: "{{filter.to}}"
    columns:
      - name: id
        type: Int64
      - name: headline
        type: Utf8
      - name: datetime
        type: Int64
      - name: source
        type: Utf8
      - name: url
        type: Utf8
      - name: summary
        type: Utf8

  - name: news_sentiment
    description: Get the company's news sentiment and buzz
    filters:
      - name: symbol
        type: Utf8
        required: true
    request:
      method: GET
      path: /news-sentiment
      query:
        - name: symbol
          from: template
          template: "{{filter.symbol}}"
    columns:
      - name: symbol
        type: Utf8
      - name: companyNewsScore
        type: Float64
      - name: sectorAverageBullishPercent
        type: Float64
      - name: buzz__buzz
        type: Float64
      - name: buzz__weeklyAverage
        type: Float64
      - name: sentiment__bullishPercent
        type: Float64
      - name: sentiment__bearishPercent
        type: Float64

  - name: economic_calendar
    description: Fetch upcoming economic events and indicators
    request:
      method: GET
      path: /calendar/economic
    response:
      rows_path:
        - economicCalendar
    columns:
      - name: event
        type: Utf8
      - name: time
        type: Utf8
      - name: country
        type: Utf8
      - name: impact
        type: Utf8
      - name: actual
        type: Float64
      - name: estimate
        type: Float64
      - name: previous
        type: Float64

  - name: quote
    description: Get real-time quote data for US stocks
    filters:
      - name: symbol
        type: Utf8
        required: true
    request:
      method: GET
      path: /quote
      query:
        - name: symbol
          from: template
          template: "{{filter.symbol}}"
    columns:
      - name: c
        type: Float64
      - name: d
        type: Float64
      - name: dp
        type: Float64
      - name: h
        type: Float64
      - name: l
        type: Float64
      - name: o
        type: Float64
      - name: pc
        type: Float64
      - name: t
        type: Int64

  - name: forex_rates
    description: Get latest forex rates against a base currency
    filters:
      - name: base
        type: Utf8
        required: true
    request:
      method: GET
      path: /forex/rates
      query:
        - name: base
          from: template
          template: "{{filter.base}}"
    columns:
      - name: base
        type: Utf8
      - name: quote__EUR
        type: Float64
      - name: quote__GBP
        type: Float64
      - name: quote__JPY
        type: Float64
      - name: quote__CHF
        type: Float64

  - name: market_status
    description: Get current market status for global exchanges
    filters:
      - name: exchange
        type: Utf8
        required: true
    request:
      method: GET
      path: /stock/market-status
      query:
        - name: exchange
          from: template
          template: "{{filter.exchange}}"
    columns:
      - name: exchange
        type: Utf8
      - name: isOpen
        type: Boolean
      - name: session
        type: Utf8
      - name: timezone
        type: Utf8
      - name: t
        type: Int64

  - name: company_profile
    description: Get general information of a company
    filters:
      - name: symbol
        type: Utf8
        required: true
    request:
      method: GET
      path: /stock/profile2
      query:
        - name: symbol
          from: template
          template: "{{filter.symbol}}"
    columns:
      - name: country
        type: Utf8
