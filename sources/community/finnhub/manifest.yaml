        required: true
    request:
      method: GET
      path: /stock/metric
      query:
        - name: symbol
          from: template
          template: "{{filter.symbol}}"
        - name: metric
          from: template
          template: "all"
    columns:
      - name: symbol
        type: Utf8
      - name: metric__52WeekHigh
        type: Float64
      - name: metric__52WeekLow
        type: Float64
      - name: metric__beta
