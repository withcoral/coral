  - name: post_thread
    description: Root post and raw surrounding thread for a post URI.
    args:
      - name: uri
        required: true
        bind:
          arg: uri
      - name: depth
        bind:
          arg: depth
      - name: parent_height
        bind:
          arg: parent_height
    request:
      method: GET
      path: /app.bsky.feed.getPostThread
      query:
        - name: uri
          from: arg
          key: uri
        - name: depth
          from: arg
          key: depth
        - name: parentHeight
          from: arg
          key: parent_height
    response:
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: uri
        type: Utf8
        nullable: true
        description: Root thread post URI.
        expr: {kind: path, path: [thread, post, uri]}
      - name: text
        type: Utf8
        nullable: true
        description: Root thread post text.
        expr: {kind: path, path: [thread, post, record, text]}
      - name: indexed_at
        type: Timestamp
        nullable: true
        description: Root thread post index timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [thread, post, indexedAt]}
      - name: author__handle
        type: Utf8
        nullable: true
        description: Root thread post author handle.
        expr: {kind: path, path: [thread, post, author, handle]}
      - name: reply_count
        type: Int64
        nullable: true
        description: Root thread post reply count.
        expr: {kind: path, path: [thread, post, replyCount]}
      - name: replies
