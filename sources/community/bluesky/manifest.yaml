name: bluesky
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query public Bluesky / AT Protocol profiles, feeds, post search, and social
  graph endpoints.
base_url: "{{input.BLUESKY_BASE_URL}}"

inputs:
  BLUESKY_BASE_URL:
    kind: variable
    default: https://api.bsky.app/xrpc
    hint: >-
      Bluesky AppView XRPC base URL. Use https://public.api.bsky.app/xrpc when
      it is reachable from your network.

test_queries:
  - SELECT uri, author__handle, text FROM bluesky.search_posts(q => 'bluesky') LIMIT 5
  - SELECT did, handle FROM bluesky.profile(actor => 'bsky.app') LIMIT 1

functions:
  - name: search_posts
    kind: search
    description: Search public Bluesky posts with provider-ranked results.
    search_limits:
      default_top_k: 20
      max_top_k: 100
      max_calls_per_query: 1
    args:
      - name: q
        required: true
        bind:
          arg: q
      - name: sort
        bind:
          arg: sort
      - name: lang
        bind:
          arg: lang
      - name: since
        bind:
          arg: since
      - name: until
        bind:
          arg: until
      - name: mentions
        bind:
          arg: mentions
      - name: author
        bind:
          arg: author
      - name: domain
        bind:
          arg: domain
      - name: url
        bind:
          arg: url
      - name: tag
        bind:
          arg: tag
    request:
      method: GET
      path: /app.bsky.feed.searchPosts
      query:
        - name: q
          from: arg
          key: q
        - name: sort
          from: arg
          key: sort
        - name: lang
          from: arg
          key: lang
        - name: since
          from: arg
          key: since
        - name: until
          from: arg
          key: until
        - name: mentions
          from: arg
          key: mentions
        - name: author
          from: arg
          key: author
        - name: domain
          from: arg
          key: domain
        - name: url
          from: arg
          key: url
        - name: tag
          from: arg
          key: tag
    response:
      rows_path: [posts]
    pagination:
      mode: cursor_query
      cursor_param: cursor
      response_cursor_path: [cursor]
      page_size:
        default: 25
        max: 100
        query_param: limit
    columns:
      - name: uri
        type: Utf8
        nullable: false
        description: AT Protocol post URI.
      - name: cid
        type: Utf8
        nullable: true
        description: Content ID.
      - name: text
        type: Utf8
        nullable: true
        description: Post text.
        expr: {kind: path, path: [record, text]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: Timestamp declared by the post record.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [record, createdAt]}
      - name: indexed_at
        type: Timestamp
        nullable: true
        description: Index timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [indexedAt]}
      - name: author__did
        type: Utf8
        nullable: true
        description: Author DID.
        expr: {kind: path, path: [author, did]}
      - name: author__handle
        type: Utf8
        nullable: true
        description: Author handle.
        expr: {kind: path, path: [author, handle]}
      - name: author__display_name
        type: Utf8
        nullable: true
        description: Author display name.
        expr: {kind: path, path: [author, displayName]}
      - name: author__avatar
        type: Utf8
        nullable: true
        description: Author avatar URL.
        expr: {kind: path, path: [author, avatar]}
      - name: embed_type
        type: Utf8
        nullable: true
        description: AT Protocol embed view type.
        expr: {kind: path, path: [embed, "$type"]}
      - name: reply_count
        type: Int64
        nullable: true
        description: Reply count.
        expr: {kind: path, path: [replyCount]}
      - name: repost_count
        type: Int64
        nullable: true
        description: Repost count.
        expr: {kind: path, path: [repostCount]}
      - name: like_count
        type: Int64
        nullable: true
        description: Like count.
        expr: {kind: path, path: [likeCount]}
      - name: quote_count
        type: Int64
        nullable: true
        description: Quote count.
        expr: {kind: path, path: [quoteCount]}
      - name: bookmark_count
        type: Int64
        nullable: true
        description: Bookmark count when returned by the AppView.
        expr: {kind: path, path: [bookmarkCount]}
      - name: langs
        type: Json
        nullable: true
        description: Language tags declared on the post record.
        expr: {kind: path, path: [record, langs]}
      - name: labels
        type: Json
        nullable: true
        description: Moderation labels attached to the post.
        expr: {kind: path, path: [labels]}
      - name: raw
        type: Json
        nullable: false
        description: Full raw post view object.
        expr:
          kind: current_row

  - name: search_actors
    kind: search
    description: Search public Bluesky actors and profiles.
    search_limits:
      default_top_k: 20
      max_top_k: 100
      max_calls_per_query: 1
    args:
      - name: q
        required: true
        bind:
          arg: q
    request:
      method: GET
      path: /app.bsky.actor.searchActors
      query:
        - name: q
          from: arg
          key: q
    response:
      rows_path: [actors]
    pagination:
      mode: cursor_query
      cursor_param: cursor
      response_cursor_path: [cursor]
      page_size:
        default: 25
        max: 100
        query_param: limit
    columns:
      - name: did
        type: Utf8
        nullable: false
        description: Actor DID.
      - name: handle
        type: Utf8
        nullable: false
        description: Actor handle.
      - name: display_name
        type: Utf8
        nullable: true
        description: Display name.
        expr: {kind: path, path: [displayName]}
      - name: description
        type: Utf8
        nullable: true
        description: Profile description.
      - name: avatar
        type: Utf8
        nullable: true
        description: Avatar URL.
      - name: followers_count
        type: Int64
        nullable: true
        description: Follower count when returned.
        expr: {kind: path, path: [followersCount]}
      - name: follows_count
        type: Int64
        nullable: true
        description: Following count when returned.
        expr: {kind: path, path: [followsCount]}
      - name: posts_count
        type: Int64
        nullable: true
        description: Post count when returned.
        expr: {kind: path, path: [postsCount]}
      - name: labels
        type: Json
        nullable: true
        description: Moderation labels attached to the actor.
      - name: raw
        type: Json
        nullable: false
        description: Full raw actor profile object.
        expr:
          kind: current_row

  - name: author_feed
