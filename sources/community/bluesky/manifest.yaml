        expr: {kind: path, path: [post, record, text]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: Timestamp declared by the post record.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [post, record, createdAt]}
      - name: indexed_at
        type: Timestamp
        nullable: true
        description: Index timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [post, indexedAt]}
      - name: author__handle
        type: Utf8
        nullable: true
        description: Author handle.
        expr: {kind: path, path: [post, author, handle]}
      - name: author__did
        type: Utf8
        nullable: true
        description: Author DID.
        expr: {kind: path, path: [post, author, did]}
      - name: author__display_name
        type: Utf8
        nullable: true
        description: Author display name.
        expr: {kind: path, path: [post, author, displayName]}
      - name: reason_type
        type: Utf8
        nullable: true
        description: Reason type, such as repost or pin.
        expr: {kind: path, path: [reason, "$type"]}
      - name: reason_by__handle
        type: Utf8
        nullable: true
        description: Actor handle responsible for the feed reason.
        expr: {kind: path, path: [reason, by, handle]}
      - name: reply__root__uri
        type: Utf8
        nullable: true
        description: Root post URI when the feed item is a reply.
        expr: {kind: path, path: [reply, root, uri]}
      - name: reply__parent__uri
        type: Utf8
        nullable: true
        description: Parent post URI when the feed item is a reply.
        expr: {kind: path, path: [reply, parent, uri]}
      - name: embed_type
        type: Utf8
        nullable: true
        description: AT Protocol embed view type.
        expr: {kind: path, path: [post, embed, "$type"]}
      - name: reply_count
        type: Int64
        nullable: true
        description: Reply count.
        expr: {kind: path, path: [post, replyCount]}
      - name: repost_count
        type: Int64
        nullable: true
        description: Repost count.
        expr: {kind: path, path: [post, repostCount]}
      - name: like_count
        type: Int64
        nullable: true
        description: Like count.
        expr: {kind: path, path: [post, likeCount]}
      - name: quote_count
