      - name: labels
        type: Json
        nullable: true
        description: Moderation labels attached to the post.
        expr: {kind: path, path: [post, labels]}
      - name: raw
        type: Json
        nullable: false
        description: Full raw feed view object.
        expr:
          kind: current_row

