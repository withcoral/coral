name: quickbooks
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query customers, vendors, items, the chart of accounts, invoices, bills,
  payments, other transactions, and financial reports from QuickBooks Online.
base_url: "{{input.QUICKBOOKS_BASE_URL}}/v3/company/{{input.QUICKBOOKS_REALM_ID}}"

inputs:
  QUICKBOOKS_REALM_ID:
    kind: variable
    hint: |
      QuickBooks company ID (realm ID).

      Find it in QuickBooks under Settings > Additional info, or in the
      `realmId` query parameter Intuit returns after you authorize an app.
  QUICKBOOKS_BASE_URL:
    kind: variable
    default: https://quickbooks.api.intuit.com
    hint: |
      QuickBooks Online Accounting API host.

      Default (production companies):
      https://quickbooks.api.intuit.com

      Sandbox companies:
      https://sandbox-quickbooks.api.intuit.com
  QUICKBOOKS_ACCESS_TOKEN:
    kind: secret
    hint: |
      OAuth 2.0 access token for the company in QUICKBOOKS_REALM_ID with the
      `com.intuit.quickbooks.accounting` scope.
    credential:
      methods:
        - type: oauth
          label: Connect with QuickBooks
          description: Authorize Coral in your browser with your own Intuit app.
          hint: |
            Create an app at https://developer.intuit.com with the Accounting
            scope. Under Keys & credentials, add the redirect URI
            `http://localhost:53682/oauth/callback`, then enter the app's
            Client ID and Client Secret below. Intuit only accepts localhost
            redirect URIs on Development keys, so this method works for
            sandbox companies. Coral refreshes the one-hour access token.
          oauth:
            flow:
              type: authorization_code
              pkce: disabled
            redirect_uri: http://localhost:53682/oauth/callback
            redirect_uri_port_mode: fixed
            endpoints:
              authorization_url: https://appcenter.intuit.com/connect/oauth2
              token_url: https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer
            client:
              id:
                input: QUICKBOOKS_OAUTH_CLIENT_ID
              secret:
                input: QUICKBOOKS_OAUTH_CLIENT_SECRET
                transport: basic_auth
            scopes:
              scope:
                delimiter: space
                values:
                  - com.intuit.quickbooks.accounting
        - type: source_config
          label: Paste access token
          description: Paste an existing QuickBooks OAuth access token.
          hint: |
            Paste an access token from your own OAuth flow or the Intuit
            OAuth 2.0 Playground. It expires after one hour and Coral
            cannot refresh a pasted token.

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: bearer
      key: QUICKBOOKS_ACCESS_TOKEN

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT id, company_name, country FROM quickbooks.company_info LIMIT 1
  - SELECT id, name, classification FROM quickbooks.accounts LIMIT 1

# Entity tables page with STARTPOSITION inside the query statement. Offset mode also
# sends a startposition URL parameter, which QuickBooks ignores. page_size is unset
# because QuickBooks can return a short page mid-stream; paging ends on an empty page.
tables:
  - name: company_info
    description: Company profile of the connected QuickBooks company
    guide: >-
      Returns one row describing the connected company: legal name, address, fiscal year
      start, and country. Use it as a cheap connectivity check.
    request:
      method: GET
      path: /companyinfo/{{input.QUICKBOOKS_REALM_ID}}
      query:
        - name: minorversion
          from: literal
          value: "75"
    response:
      rows_path: [CompanyInfo]
    pagination:
      mode: none
    columns:
      - name: id
        type: Utf8
        nullable: false
        description: QuickBooks ID of the company
        expr: {kind: path, path: [Id]}
      - name: company_name
        type: Utf8
        nullable: true
        description: Company name shown in QuickBooks
        expr: {kind: path, path: [CompanyName]}
      - name: legal_name
        type: Utf8
        nullable: true
        description: Legal business name
        expr: {kind: path, path: [LegalName]}
      - name: country
        type: Utf8
        nullable: true
        description: Country code of the company
        expr: {kind: path, path: [Country]}
      - name: email
        type: Utf8
        nullable: true
        description: Company email address
        expr: {kind: path, path: [Email, Address]}
      - name: phone
        type: Utf8
        nullable: true
        description: Company phone number
        expr: {kind: path, path: [PrimaryPhone, FreeFormNumber]}
      - name: website
        type: Utf8
        nullable: true
        description: Company website
        expr: {kind: path, path: [WebAddr, URI]}
      - name: company_start_date
        type: Utf8
        nullable: true
        description: "Date the company started using QuickBooks, as YYYY-MM-DD"
        expr: {kind: path, path: [CompanyStartDate]}
      - name: fiscal_year_start_month
        type: Utf8
        nullable: true
        description: "First month of the fiscal year, such as January"
        expr: {kind: path, path: [FiscalYearStartMonth]}
      - name: default_time_zone
        type: Utf8
        nullable: true
        description: Default time zone of the company
        expr: {kind: path, path: [DefaultTimeZone]}
      - name: supported_languages
        type: Utf8
        nullable: true
        description: Languages supported by the company file
        expr: {kind: path, path: [SupportedLanguages]}
      - name: company_addr
        type: Json
        nullable: true
        description: Company address as a JSON object
        expr: {kind: path, path: [CompanyAddr]}
      - name: legal_addr
        type: Json
        nullable: true
        description: Legal address as a JSON object
        expr: {kind: path, path: [LegalAddr]}
      - name: name_value
        type: Json
        nullable: true
        description: >-
          Extra company attributes as a JSON array of {Name, Value}, including
          subscription and industry details
        expr: {kind: path, path: [NameValue]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the record was created in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, CreateTime]}
      - name: updated_at
        type: Timestamp
        nullable: true
        description: When the record was last updated in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, LastUpdatedTime]}

  - name: accounts
    description: "Chart of accounts, including inactive accounts"
    guide: >-
      One row per account in the chart of accounts. `classification` is Asset,
      Liability, Equity, Revenue, or Expense. `current_balance` excludes sub-accounts;
      `current_balance_with_sub_accounts` includes them. Inactive accounts are included;
      filter on `active` to exclude them. The `updated_since` filter is sent to
      QuickBooks; use it with `=`.
    filters:
      - name: updated_since
    request:
      method: GET
      path: /query
      query:
        - name: query
          from: template
          template: >-
            SELECT * FROM Account WHERE Active IN (true, false) AND
            MetaData.LastUpdatedTime >= '{{filter.updated_since|1970-01-01T00:00:00Z}}'
            ORDERBY Id STARTPOSITION {{state.offset}} MAXRESULTS 1000
        - name: minorversion
          from: literal
          value: "75"
    response:
      rows_path: [QueryResponse, Account]
    pagination:
      mode: offset
      offset_param: startposition
      offset_start: 1
      offset_step: 1000
    columns:
      - name: updated_since
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Optional filter: records updated at or after this RFC 3339 timestamp, such as
          '2026-01-01T00:00:00Z'
        expr: {kind: from_filter, key: updated_since}
      - name: id
        type: Utf8
        nullable: false
        description: QuickBooks ID of the account
        expr: {kind: path, path: [Id]}
      - name: name
        type: Utf8
        nullable: true
        description: Account name
        expr: {kind: path, path: [Name]}
      - name: fully_qualified_name
        type: Utf8
        nullable: true
        description: "Account name including parent accounts, separated by colons"
        expr: {kind: path, path: [FullyQualifiedName]}
      - name: acct_num
        type: Utf8
        nullable: true
        description: User-defined account number
        expr: {kind: path, path: [AcctNum]}
      - name: description
        type: Utf8
        nullable: true
        description: Account description
        expr: {kind: path, path: [Description]}
      - name: classification
        type: Utf8
        nullable: true
        description: "Asset, Liability, Equity, Revenue, or Expense"
        expr: {kind: path, path: [Classification]}
      - name: account_type
        type: Utf8
        nullable: true
        description: "Account type, such as Bank, Accounts Receivable, Income, or Expense"
        expr: {kind: path, path: [AccountType]}
      - name: account_sub_type
        type: Utf8
        nullable: true
        description: Detail type of the account
        expr: {kind: path, path: [AccountSubType]}
      - name: sub_account
        type: Boolean
        nullable: true
        description: Whether the account is a sub-account
        expr: {kind: path, path: [SubAccount]}
      - name: parent_id
        type: Utf8
        nullable: true
        description: ID of the parent account when this is a sub-account
        expr: {kind: path, path: [ParentRef, value]}
      - name: current_balance
        type: Float64
        nullable: true
        description: "Balance of this account, excluding sub-accounts"
        expr: {kind: path, path: [CurrentBalance]}
      - name: current_balance_with_sub_accounts
        type: Float64
        nullable: true
        description: Balance of this account including its sub-accounts
        expr: {kind: path, path: [CurrentBalanceWithSubAccounts]}
      - name: currency
        type: Utf8
        nullable: true
        description: ISO 4217 currency code of the account
        expr: {kind: path, path: [CurrencyRef, value]}
      - name: active
        type: Boolean
        nullable: true
        description: Whether the account is active; inactive accounts are deleted in the QuickBooks UI
        expr: {kind: path, path: [Active]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the record was created in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, CreateTime]}
      - name: updated_at
        type: Timestamp
        nullable: true
        description: When the record was last updated in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, LastUpdatedTime]}

  - name: customers
    description: "Customers, sub-customers, and projects, including inactive ones"
    guide: >-
      One row per customer. Sub-customers and projects are also rows; use `parent_id`,
      `job`, and `is_project` to tell them apart. `balance` is the open A/R balance for
      this customer only; `balance_with_jobs` includes sub-customers. Inactive customers
      are included so historical transactions still join; filter on `active` to exclude
      them. Join `id` to `customer_id` on transaction tables. The `updated_since` filter
      is sent to QuickBooks; use it with `=`.
    filters:
      - name: updated_since
    request:
      method: GET
      path: /query
      query:
        - name: query
          from: template
          template: >-
            SELECT * FROM Customer WHERE Active IN (true, false) AND
            MetaData.LastUpdatedTime >= '{{filter.updated_since|1970-01-01T00:00:00Z}}'
            ORDERBY Id STARTPOSITION {{state.offset}} MAXRESULTS 1000
        - name: minorversion
          from: literal
          value: "75"
    response:
      rows_path: [QueryResponse, Customer]
    pagination:
      mode: offset
      offset_param: startposition
      offset_start: 1
      offset_step: 1000
    columns:
      - name: updated_since
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Optional filter: records updated at or after this RFC 3339 timestamp, such as
          '2026-01-01T00:00:00Z'
        expr: {kind: from_filter, key: updated_since}
      - name: id
        type: Utf8
        nullable: false
        description: QuickBooks ID of the customer
        expr: {kind: path, path: [Id]}
      - name: display_name
        type: Utf8
        nullable: true
        description: "Name shown in QuickBooks; unique across customers, vendors, and employees"
        expr: {kind: path, path: [DisplayName]}
      - name: company_name
        type: Utf8
        nullable: true
        description: Company name
        expr: {kind: path, path: [CompanyName]}
      - name: fully_qualified_name
        type: Utf8
        nullable: true
        description: "Name including parent customers, separated by colons"
        expr: {kind: path, path: [FullyQualifiedName]}
      - name: print_on_check_name
        type: Utf8
        nullable: true
        description: Name printed on checks
        expr: {kind: path, path: [PrintOnCheckName]}
      - name: given_name
        type: Utf8
        nullable: true
        description: First name
        expr: {kind: path, path: [GivenName]}
      - name: middle_name
        type: Utf8
        nullable: true
        description: Middle name
        expr: {kind: path, path: [MiddleName]}
      - name: family_name
        type: Utf8
        nullable: true
        description: Last name
        expr: {kind: path, path: [FamilyName]}
      - name: title
        type: Utf8
        nullable: true
        description: "Title, such as Mr or Dr"
        expr: {kind: path, path: [Title]}
      - name: suffix
        type: Utf8
        nullable: true
        description: "Name suffix, such as Jr"
        expr: {kind: path, path: [Suffix]}
      - name: email
        type: Utf8
        nullable: true
        description: Primary email address
        expr: {kind: path, path: [PrimaryEmailAddr, Address]}
      - name: phone
        type: Utf8
        nullable: true
        description: Primary phone number
        expr: {kind: path, path: [PrimaryPhone, FreeFormNumber]}
      - name: mobile
        type: Utf8
        nullable: true
        description: Mobile phone number
        expr: {kind: path, path: [Mobile, FreeFormNumber]}
      - name: fax
        type: Utf8
        nullable: true
        description: Fax number
        expr: {kind: path, path: [Fax, FreeFormNumber]}
      - name: website
        type: Utf8
        nullable: true
        description: Website URL
        expr: {kind: path, path: [WebAddr, URI]}
      - name: bill_addr
        type: Json
        nullable: true
        description: Billing address as a JSON object
        expr: {kind: path, path: [BillAddr]}
      - name: ship_addr
        type: Json
        nullable: true
        description: Shipping address as a JSON object
        expr: {kind: path, path: [ShipAddr]}
      - name: balance
        type: Float64
        nullable: true
        description: "Open accounts receivable balance, excluding sub-customers"
        expr: {kind: path, path: [Balance]}
      - name: balance_with_jobs
        type: Float64
        nullable: true
        description: Open accounts receivable balance including sub-customers
        expr: {kind: path, path: [BalanceWithJobs]}
      - name: currency
        type: Utf8
        nullable: true
        description: ISO 4217 currency code of the customer
        expr: {kind: path, path: [CurrencyRef, value]}
      - name: taxable
        type: Boolean
        nullable: true
        description: Whether transactions for this customer are taxable
        expr: {kind: path, path: [Taxable]}
      - name: parent_id
        type: Utf8
        nullable: true
        description: ID of the parent customer for sub-customers and projects
        expr: {kind: path, path: [ParentRef, value]}
      - name: level
        type: Int64
        nullable: true
        description: Depth in the customer hierarchy; 0 is a top-level customer
        expr: {kind: path, path: [Level]}
      - name: job
        type: Boolean
        nullable: true
        description: Whether this is a sub-customer (job)
        expr: {kind: path, path: [Job]}
      - name: bill_with_parent
        type: Boolean
        nullable: true
        description: Whether this sub-customer is billed through its parent
        expr: {kind: path, path: [BillWithParent]}
      - name: is_project
        type: Boolean
        nullable: true
        description: Whether this customer record is a project
        expr: {kind: path, path: [IsProject]}
      - name: sales_term_id
        type: Utf8
        nullable: true
        description: "ID of the default sales term; joins to `terms.id`"
        expr: {kind: path, path: [SalesTermRef, value]}
      - name: payment_method_id
        type: Utf8
        nullable: true
        description: "ID of the default payment method; joins to `payment_methods.id`"
        expr: {kind: path, path: [PaymentMethodRef, value]}
      - name: preferred_delivery_method
        type: Utf8
        nullable: true
        description: "Preferred invoice delivery method: Print, Email, or None"
        expr: {kind: path, path: [PreferredDeliveryMethod]}
      - name: resale_num
        type: Utf8
        nullable: true
        description: Resale number for tax exemption
        expr: {kind: path, path: [ResaleNum]}
      - name: notes
        type: Utf8
        nullable: true
        description: Free-form notes about the customer
        expr: {kind: path, path: [Notes]}
      - name: active
        type: Boolean
        nullable: true
        description: Whether the customer is active; inactive customers are deleted in the QuickBooks UI
        expr: {kind: path, path: [Active]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the record was created in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, CreateTime]}
      - name: updated_at
        type: Timestamp
        nullable: true
        description: When the record was last updated in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, LastUpdatedTime]}

  - name: vendors
    description: "Vendors, including inactive ones"
    guide: >-
      One row per vendor. `balance` is the open accounts payable balance. Inactive
      vendors are included so historical bills still join; filter on `active` to exclude
      them. Join `id` to `vendor_id` on bills, purchase orders, bill payments, and
      vendor credits. The `updated_since` filter is sent to QuickBooks; use it with `=`.
    filters:
      - name: updated_since
    request:
      method: GET
      path: /query
      query:
        - name: query
          from: template
          template: >-
            SELECT * FROM Vendor WHERE Active IN (true, false) AND
            MetaData.LastUpdatedTime >= '{{filter.updated_since|1970-01-01T00:00:00Z}}'
            ORDERBY Id STARTPOSITION {{state.offset}} MAXRESULTS 1000
        - name: minorversion
          from: literal
          value: "75"
    response:
      rows_path: [QueryResponse, Vendor]
    pagination:
      mode: offset
      offset_param: startposition
      offset_start: 1
      offset_step: 1000
    columns:
      - name: updated_since
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Optional filter: records updated at or after this RFC 3339 timestamp, such as
          '2026-01-01T00:00:00Z'
        expr: {kind: from_filter, key: updated_since}
      - name: id
        type: Utf8
        nullable: false
        description: QuickBooks ID of the vendor
        expr: {kind: path, path: [Id]}
      - name: display_name
        type: Utf8
        nullable: true
        description: "Name shown in QuickBooks; unique across customers, vendors, and employees"
        expr: {kind: path, path: [DisplayName]}
      - name: company_name
        type: Utf8
        nullable: true
        description: Company name
        expr: {kind: path, path: [CompanyName]}
      - name: print_on_check_name
        type: Utf8
        nullable: true
        description: Name printed on checks
        expr: {kind: path, path: [PrintOnCheckName]}
      - name: given_name
        type: Utf8
        nullable: true
        description: First name
        expr: {kind: path, path: [GivenName]}
      - name: middle_name
        type: Utf8
        nullable: true
        description: Middle name
        expr: {kind: path, path: [MiddleName]}
      - name: family_name
        type: Utf8
        nullable: true
        description: Last name
        expr: {kind: path, path: [FamilyName]}
      - name: title
        type: Utf8
        nullable: true
        description: "Title, such as Mr or Dr"
        expr: {kind: path, path: [Title]}
      - name: suffix
        type: Utf8
        nullable: true
        description: "Name suffix, such as Jr"
        expr: {kind: path, path: [Suffix]}
      - name: email
        type: Utf8
        nullable: true
        description: Primary email address
        expr: {kind: path, path: [PrimaryEmailAddr, Address]}
      - name: phone
        type: Utf8
        nullable: true
        description: Primary phone number
        expr: {kind: path, path: [PrimaryPhone, FreeFormNumber]}
      - name: mobile
        type: Utf8
        nullable: true
        description: Mobile phone number
        expr: {kind: path, path: [Mobile, FreeFormNumber]}
      - name: fax
        type: Utf8
        nullable: true
        description: Fax number
        expr: {kind: path, path: [Fax, FreeFormNumber]}
      - name: website
        type: Utf8
        nullable: true
        description: Website URL
        expr: {kind: path, path: [WebAddr, URI]}
      - name: bill_addr
        type: Json
        nullable: true
        description: Billing address as a JSON object
        expr: {kind: path, path: [BillAddr]}
      - name: acct_num
        type: Utf8
        nullable: true
        description: Account number the vendor uses for this company
        expr: {kind: path, path: [AcctNum]}
      - name: balance
        type: Float64
        nullable: true
        description: Open accounts payable balance
        expr: {kind: path, path: [Balance]}
      - name: currency
        type: Utf8
        nullable: true
        description: ISO 4217 currency code of the vendor
        expr: {kind: path, path: [CurrencyRef, value]}
      - name: vendor_1099
        type: Boolean
        nullable: true
        description: Whether the vendor is tracked for 1099 reporting
        expr: {kind: path, path: [Vendor1099]}
      - name: term_id
        type: Utf8
        nullable: true
        description: "ID of the default payment term; joins to `terms.id`"
        expr: {kind: path, path: [TermRef, value]}
      - name: bill_rate
        type: Float64
        nullable: true
        description: Hourly billing rate
        expr: {kind: path, path: [BillRate]}
      - name: active
        type: Boolean
        nullable: true
        description: Whether the vendor is active; inactive vendors are deleted in the QuickBooks UI
        expr: {kind: path, path: [Active]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the record was created in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, CreateTime]}
      - name: updated_at
        type: Timestamp
        nullable: true
        description: When the record was last updated in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, LastUpdatedTime]}

  - name: employees
    description: "Employees, including inactive ones"
    guide: >-
      One row per employee record in QuickBooks. Payroll data such as pay rates and SSNs
      is not exposed by the Accounting API. Inactive employees are included; filter on
      `active` to exclude them. The `updated_since` filter is sent to QuickBooks; use it
      with `=`.
    filters:
      - name: updated_since
    request:
      method: GET
      path: /query
      query:
        - name: query
          from: template
          template: >-
            SELECT * FROM Employee WHERE Active IN (true, false) AND
            MetaData.LastUpdatedTime >= '{{filter.updated_since|1970-01-01T00:00:00Z}}'
            ORDERBY Id STARTPOSITION {{state.offset}} MAXRESULTS 1000
        - name: minorversion
          from: literal
          value: "75"
    response:
      rows_path: [QueryResponse, Employee]
    pagination:
      mode: offset
      offset_param: startposition
      offset_start: 1
      offset_step: 1000
    columns:
      - name: updated_since
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Optional filter: records updated at or after this RFC 3339 timestamp, such as
          '2026-01-01T00:00:00Z'
        expr: {kind: from_filter, key: updated_since}
      - name: id
        type: Utf8
        nullable: false
        description: QuickBooks ID of the employee
        expr: {kind: path, path: [Id]}
      - name: display_name
        type: Utf8
        nullable: true
        description: Name shown in QuickBooks
        expr: {kind: path, path: [DisplayName]}
      - name: print_on_check_name
        type: Utf8
        nullable: true
        description: Name printed on checks
        expr: {kind: path, path: [PrintOnCheckName]}
      - name: given_name
        type: Utf8
        nullable: true
        description: First name
        expr: {kind: path, path: [GivenName]}
      - name: middle_name
        type: Utf8
        nullable: true
        description: Middle name
        expr: {kind: path, path: [MiddleName]}
      - name: family_name
        type: Utf8
        nullable: true
        description: Last name
        expr: {kind: path, path: [FamilyName]}
      - name: title
        type: Utf8
        nullable: true
        description: "Title, such as Mr or Dr"
        expr: {kind: path, path: [Title]}
      - name: suffix
