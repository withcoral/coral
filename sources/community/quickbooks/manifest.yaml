  - name: profit_and_loss
    description: "Profit and loss (income statement) report, one row per top-level report row"
    guide: >-
      Runs the QuickBooks ProfitAndLoss report. Top-level sections include Income, COGS,
      GrossProfit, Expenses, NetOperatingIncome, OtherIncome, OtherExpenses,
      NetOtherIncome, and NetIncome; sections with no activity are omitted. Section rows
      fill `group`, `section`, `summary_label`, and `summary_value`, with nested rows as
      JSON in `rows`. Data rows fill `name`, `entity_id`, and `col_data`. Values are
      strings as QuickBooks returns them, so CAST them to DOUBLE for math.
      `summary_value` is the first value column, which is the total when the report has
      a single Total column. Use report filters with `=`. QuickBooks truncates very
      large reports, so keep date ranges short.
    filters:
      - name: start_date
      - name: end_date
      - name: date_macro
      - name: accounting_method
      - name: summarize_column_by
    request:
      method: GET
      path: /reports/ProfitAndLoss
      query:
        - name: minorversion
          from: literal
          value: "75"
        - name: start_date
          from: filter
          key: start_date
        - name: end_date
          from: filter
          key: end_date
        - name: date_macro
          from: filter
          key: date_macro
        - name: accounting_method
          from: filter
          key: accounting_method
        - name: summarize_column_by
          from: filter
          key: summarize_column_by
    response:
      rows_path: [Rows, Row]
    pagination:
      mode: none
    columns:
      - name: start_date
        type: Utf8
        nullable: true
        virtual: true
        description: Optional report start date (YYYY-MM-DD)
        expr: {kind: from_filter, key: start_date}
      - name: end_date
        type: Utf8
        nullable: true
        virtual: true
        description: Optional report end date (YYYY-MM-DD)
        expr: {kind: from_filter, key: end_date}
      - name: date_macro
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Optional named date range, such as 'Last Month' or 'This Fiscal Year'; ignored
          when start_date and end_date are set
        expr: {kind: from_filter, key: date_macro}
      - name: accounting_method
        type: Utf8
        nullable: true
        virtual: true
        description: "Optional accounting method, Cash or Accrual; defaults to the company preference"
        expr: {kind: from_filter, key: accounting_method}
      - name: summarize_column_by
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Optional column breakdown: Total, Month, Week, Days, Quarter, Year, Customers,
          Vendors, Classes, Departments, Employees, or ProductsAndServices
        expr: {kind: from_filter, key: summarize_column_by}
      - name: group
        type: Utf8
        nullable: true
        description: "Stable section identifier, such as Income, NetIncome, or GrandTotal"
        expr: {kind: path, path: [group]}
      - name: section
        type: Utf8
        nullable: true
        description: "Section heading as shown in QuickBooks, such as Income; empty for summary-only sections"
        expr: {kind: path, path: [Header, ColData, "0", value]}
      - name: summary_label
        type: Utf8
        nullable: true
        description: "Label of the section summary, such as Total Income or Net Income"
        expr: {kind: path, path: [Summary, ColData, "0", value]}
      - name: summary_value
        type: Utf8
        nullable: true
        description: "First value in the section summary, as a string; the section total for single-column reports"
        expr: {kind: path, path: [Summary, ColData, "1", value]}
      - name: summary
        type: Json
        nullable: true
        description: "All section summary cells as a JSON array of {value}, in the order of the report columns"
        expr: {kind: path, path: [Summary, ColData]}
      - name: name
        type: Utf8
        nullable: true
        description: "Row label of a Data row, such as the account, customer, or vendor name"
        expr: {kind: path, path: [ColData, "0", value]}
      - name: entity_id
        type: Utf8
        nullable: true
        description: "QuickBooks ID of the account, customer, or vendor on a Data row, when QuickBooks provides one"
        expr: {kind: path, path: [ColData, "0", id]}
      - name: col_data
        type: Json
        nullable: true
        description: "All cells of a Data row as a JSON array of {value, id}, in the order of the report columns"
        expr: {kind: path, path: [ColData]}
      - name: rows
        type: Json
        nullable: true
        description: "Nested rows of a section as a JSON array, with the same Section and Data shape"
        expr: {kind: path, path: [Rows, Row]}

