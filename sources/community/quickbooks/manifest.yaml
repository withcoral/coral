  - name: transfers
    description: Transfers between balance sheet accounts
    guide: >-
      One row per transfer, for example moving cash between two bank accounts. The
      `txn_date_from`, `txn_date_to`, and `updated_since` filters are sent to
      QuickBooks; use them with `=`.
    filters:
      - name: updated_since
      - name: txn_date_from
      - name: txn_date_to
    request:
      method: GET
      path: /query
      query:
        - name: query
          from: template
          template: >-
            SELECT * FROM Transfer WHERE MetaData.LastUpdatedTime >=
            '{{filter.updated_since|1970-01-01T00:00:00Z}}' AND TxnDate >=
            '{{filter.txn_date_from|1900-01-01}}' AND TxnDate <=
            '{{filter.txn_date_to|9999-12-31}}' ORDERBY Id STARTPOSITION
            {{state.offset}} MAXRESULTS 1000
        - name: minorversion
          from: literal
          value: "75"
    response:
      rows_path: [QueryResponse, Transfer]
    pagination:
      mode: offset
      offset_param: startposition
      offset_start: 1
      offset_step: 1000
    columns:
      - name: updated_since
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Optional filter: records updated at or after this RFC 3339 timestamp, such as
          '2026-01-01T00:00:00Z'
        expr: {kind: from_filter, key: updated_since}
      - name: txn_date_from
        type: Utf8
        nullable: true
        virtual: true
        description: "Optional filter: transactions dated on or after this YYYY-MM-DD date"
        expr: {kind: from_filter, key: txn_date_from}
      - name: txn_date_to
        type: Utf8
        nullable: true
        virtual: true
        description: "Optional filter: transactions dated on or before this YYYY-MM-DD date"
        expr: {kind: from_filter, key: txn_date_to}
      - name: id
        type: Utf8
        nullable: false
        description: QuickBooks ID of the transfer
        expr: {kind: path, path: [Id]}
      - name: txn_date
        type: Utf8
        nullable: true
        description: Date of the transfer (YYYY-MM-DD)
        expr: {kind: path, path: [TxnDate]}
      - name: from_account_id
        type: Utf8
        nullable: true
        description: ID of the account the money left
        expr: {kind: path, path: [FromAccountRef, value]}
      - name: from_account_name
        type: Utf8
        nullable: true
        description: Display name of the account the money left
        expr: {kind: path, path: [FromAccountRef, name]}
      - name: to_account_id
        type: Utf8
        nullable: true
        description: ID of the account the money went to
        expr: {kind: path, path: [ToAccountRef, value]}
      - name: to_account_name
        type: Utf8
        nullable: true
        description: Display name of the account the money went to
        expr: {kind: path, path: [ToAccountRef, name]}
      - name: amount
        type: Float64
        nullable: true
        description: Amount transferred
        expr: {kind: path, path: [Amount]}
      - name: private_note
        type: Utf8
        nullable: true
        description: Internal memo on the transfer
        expr: {kind: path, path: [PrivateNote]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the record was created in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, CreateTime]}
      - name: updated_at
        type: Timestamp
        nullable: true
        description: When the record was last updated in QuickBooks
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [MetaData, LastUpdatedTime]}

