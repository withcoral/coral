        expr: {kind: path, path: [TotalAmt]}
      - name: currency
        type: Utf8
        nullable: true
        description: ISO 4217 currency code of the transaction
        expr: {kind: path, path: [CurrencyRef, value]}
      - name: exchange_rate
        type: Float64
        nullable: true
        description: Exchange rate to the home currency (multicurrency companies only)
        expr: {kind: path, path: [ExchangeRate]}
      - name: home_total_amt
        type: Float64
        nullable: true
        description: Total amount in the home currency (multicurrency companies only)
        expr: {kind: path, path: [HomeTotalAmt]}
      - name: total_tax
        type: Float64
        nullable: true
        description: Total sales tax on the transaction
        expr: {kind: path, path: [TxnTaxDetail, TotalTax]}
      - name: txn_status
