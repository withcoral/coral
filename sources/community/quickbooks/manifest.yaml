  - name: estimates
    description: Estimates (quotes) sent to customers
    guide: >-
      One row per estimate. `txn_status` is Pending, Accepted, Closed, or Rejected. An
      estimate converted to an invoice lists that invoice in `linked_txns`. The
      `txn_date_from`, `txn_date_to`, and `updated_since` filters are sent to
      QuickBooks; use them with `=`.
    filters:
      - name: updated_since
      - name: txn_date_from
      - name: txn_date_to
    request:
      method: GET
      path: /query
      query:
        - name: query
          from: template
          template: >-
            SELECT * FROM Estimate WHERE MetaData.LastUpdatedTime >=
            '{{filter.updated_since|1970-01-01T00:00:00Z}}' AND TxnDate >=
            '{{filter.txn_date_from|1900-01-01}}' AND TxnDate <=
            '{{filter.txn_date_to|9999-12-31}}' ORDERBY Id STARTPOSITION
            {{state.offset}} MAXRESULTS 1000
        - name: minorversion
          from: literal
          value: "75"
    response:
      rows_path: [QueryResponse, Estimate]
    pagination:
      mode: offset
      offset_param: startposition
      offset_start: 1
      offset_step: 1000
    columns:
      - name: updated_since
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Optional filter: records updated at or after this RFC 3339 timestamp, such as
          '2026-01-01T00:00:00Z'
        expr: {kind: from_filter, key: updated_since}
      - name: txn_date_from
        type: Utf8
        nullable: true
        virtual: true
        description: "Optional filter: transactions dated on or after this YYYY-MM-DD date"
        expr: {kind: from_filter, key: txn_date_from}
      - name: txn_date_to
        type: Utf8
        nullable: true
        virtual: true
        description: "Optional filter: transactions dated on or before this YYYY-MM-DD date"
        expr: {kind: from_filter, key: txn_date_to}
