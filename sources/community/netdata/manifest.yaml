name: netdata
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query real-time infrastructure agent topology, active health alerts, and
  metric context metadata from a Netdata Agent.
base_url: "{{input.NETDATA_URL}}"

inputs:
  NETDATA_URL:
    kind: variable
    hint: |
      Netdata Agent base URL with port and without a trailing slash,
      for example `http://localhost:19999` or `https://netdata.infra.local`.
      Point this at the Agent's own HTTP endpoint (the one that serves
      `/api/v1` and `/api/v3`), not at Netdata Cloud.

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT os_name, kernel_version FROM netdata.nodes LIMIT 1

tables:
  - name: nodes
    description: Runtime parameters, operating system footprint, and hardware specs of the target agent host.
    request:
      method: GET
      path: /api/v1/info
    response:
      row_strategy: direct
      rows_path: []
    pagination:
      mode: none
    columns:
      - name: version
        type: Utf8
        nullable: false
        description: Release version string of the running Netdata agent.
        expr: {kind: path, path: [version]}
      - name: os_name
        type: Utf8
        nullable: true
        description: Operating system distribution name reported by the host (e.g., ubuntu, debian).
        expr: {kind: path, path: [os_name]}
      - name: os_version
        type: Utf8
        nullable: true
        description: OS distribution version release string.
        expr: {kind: path, path: [os_version]}
      - name: kernel_version
        type: Utf8
        nullable: true
        description: Version identifier of the running operating system kernel.
        expr: {kind: path, path: [kernel_version]}
      - name: cpu_cores
        type: Int64
        nullable: true
        description: Number of CPU cores monitored on the host.
        expr: {kind: path, path: [monitored_cpus]}

  - name: alarms
    description: Active and configured health alarm states reported by the agent.
    request:
      method: GET
      path: /api/v1/alarms
      query:
        - name: all
          from: literal
          value: "true"
    response:
      row_strategy: dict_entries
      rows_path: [alarms]
    pagination:
      mode: none
    columns:
      - name: alarm_id
        type: Utf8
        nullable: false
        description: Dictionary key identifying the alarm entry.
        expr: {kind: path, path: [_key]}
      - name: alarm_name
        type: Utf8
        nullable: false
        description: Name of the health alert rule.
        expr: {kind: path, path: [name]}
      - name: chart
        type: Utf8
        nullable: false
        description: Chart the alarm rule is attached to.
        expr: {kind: path, path: [chart]}
      - name: status
        type: Utf8
        nullable: true
        description: Current evaluation state of the alarm (e.g., WARNING, CRITICAL, CLEAR).
        expr: {kind: path, path: [status]}
      - name: value
        type: Float64
        nullable: true
        description: Most recent value evaluated by the alarm.
        expr: {kind: path, path: [value]}
      - name: family
        type: Utf8
        nullable: true
        description: Subsystem group classification (e.g., cpu, disk, network).
        expr: {kind: path, path: [family]}
      - name: recipient
        type: Utf8
        nullable: true
        description: Notification routing target for the alarm.
        expr: {kind: path, path: [recipient]}

  - name: metrics_metadata
    description: >-
      Catalog of metric contexts collected by the agent, from the current
      Netdata v3 contexts API.
    request:
      method: GET
      path: /api/v3/contexts
      query:
        - name: options
          from: literal
          value: titles
    response:
      row_strategy: dict_entries
      rows_path: [contexts]
    pagination:
      mode: none
    columns:
      - name: context_id
        type: Utf8
        nullable: false
        description: Unique context identifier (e.g., system.cpu, disk.io).
        expr: {kind: path, path: [_key]}
      - name: title
        type: Utf8
        nullable: true
        description: Human-readable title of the context (included via the `titles` option).
        expr: {kind: path, path: [title]}
      - name: units
        type: Utf8
        nullable: true
        description: Measurement units for the context (e.g., percentage, MiB/s).
        expr: {kind: path, path: [units]}
      - name: family
        type: Utf8
        nullable: true
        description: Subsystem family the context belongs to (e.g., cpu, disk, network).
        expr: {kind: path, path: [family]}
      - name: priority
        type: Int64
        nullable: true
        description: Relative display priority of the context (lower sorts higher).
        expr: {kind: path, path: [priority]}
      - name: live
        type: Boolean
        nullable: true
        description: Whether the context is currently collecting data.
        expr: {kind: path, path: [live]}
