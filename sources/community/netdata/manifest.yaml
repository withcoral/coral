name: netdata
version: 0.2.0
dsl_version: 3
backend: http
description: >-
  Query node topology, health alerts, and metric context metadata from a
  Netdata Agent using the current v3 API.
base_url: "{{input.NETDATA_URL}}"

inputs:
  NETDATA_URL:
    kind: variable
    hint: |
      Netdata Agent base URL with port and without a trailing slash,
      for example `http://localhost:19999` or `https://netdata.infra.local`.
      Point this at the Agent's own HTTP endpoint (the one that serves
      `/api/v3`), not at Netdata Cloud. Requires Netdata v2.0 or newer,
      which is when the v3 API was introduced.

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT hostname, os_name FROM netdata.nodes LIMIT 1

tables:
  - name: nodes
    description: Nodes monitored by the agent, with OS and hardware details.
    guide: |
      Rows come from `GET /api/v3/nodes`, the current (non-deprecated) node
      endpoint. Each row is one monitored node; a standalone Agent reports
      itself as a single node, while a parent reports its children too.

      The `long-keys` option is requested so the response uses readable
      member names instead of the short-key defaults.
    request:
      method: GET
      path: /api/v3/nodes
      query:
        - name: options
          from: literal
          value: long-keys
    response:
      row_strategy: direct
      rows_path: [nodes]
    pagination:
      mode: none
    columns:
      - name: node_index
        type: Int64
        nullable: false
        description: Index that uniquely identifies this node for this query.
        expr: {kind: path, path: [nodes_array_index]}
      - name: hostname
        type: Utf8
        nullable: false
        description: Name (hostname) of the node.
        expr: {kind: path, path: [hostname]}
      - name: node_id
        type: Utf8
        nullable: true
        description: Node id; absent unless the node is registered to Cloud.
        expr: {kind: path, path: [node_id]}
      - name: machine_guid
        type: Utf8
        nullable: true
        description: Machine GUID of the node.
        expr: {kind: path, path: [machine_guid]}
      - name: state
        type: Utf8
        nullable: true
        description: Node state on this Agent (reachable or stale).
        expr: {kind: path, path: [state]}
      - name: version
        type: Utf8
        nullable: true
        description: Version of the Netdata Agent the node runs.
        expr: {kind: path, path: [v]}
      - name: os_name
        type: Utf8
        nullable: true
        description: Operating system name of the node host.
        expr: {kind: path, path: [os, nm]}
      - name: os_id
        type: Utf8
        nullable: true
        description: Operating system id of the node host.
        expr: {kind: path, path: [os, id]}
      - name: os_version
        type: Utf8
        nullable: true
        description: Operating system version of the node host.
        expr: {kind: path, path: [os, v]}
      - name: kernel_name
        type: Utf8
        nullable: true
        description: Kernel name of the node host.
        expr: {kind: path, path: [os, kernel, nm]}
      - name: kernel_version
        type: Utf8
        nullable: true
        description: Kernel version of the node host.
        expr: {kind: path, path: [os, kernel, v]}
      - name: architecture
        type: Utf8
        nullable: true
        description: CPU architecture of the node host.
        expr: {kind: path, path: [hw, architecture]}
      - name: cpu_cores
        type: Utf8
        nullable: true
        description: Number of CPU cores; the API reports this as a string.
        expr: {kind: path, path: [hw, cpus]}
      - name: memory_total
        type: Utf8
        nullable: true
        description: Total host RAM as reported by the Agent.
        expr: {kind: path, path: [hw, memory]}
      - name: virtualization
        type: Utf8
        nullable: true
        description: Virtualization technology detected on the host.
        expr: {kind: path, path: [hw, virtualization]}
      - name: container
        type: Utf8
        nullable: true
        description: Container technology detected on the host.
        expr: {kind: path, path: [hw, container]}

  - name: alarms
    description: Health alert instances currently known to the agent.
    guide: |
      Rows come from `GET /api/v3/alerts`, the current (non-deprecated)
      alert endpoint, which returns an `alert_instances` array.

      Three options are requested: `instances` (adds status, context,
      family, units, and transition fields), `values` (adds the last
      evaluated value and timestamp), and `long-keys` (readable member
      names). Without `instances` the response carries only names and
      indexes; without `values` there is no current value.

      Key values for `status`: WARNING, CRITICAL, CLEAR, UNDEFINED,
      UNINITIALIZED, REMOVED.
    request:
      method: GET
      path: /api/v3/alerts
      query:
        - name: options
          from: literal
          value: instances,values,long-keys,rfc3339
    response:
      row_strategy: direct
      rows_path: [alert_instances]
    pagination:
      mode: none
    columns:
      - name: alarm_name
        type: Utf8
        nullable: false
        description: Name of the health alert rule.
        expr: {kind: path, path: [alert]}
      - name: node_index
        type: Int64
        nullable: true
        description: Index of the node this alert belongs to.
        expr: {kind: path, path: [nodes_array_index]}
      - name: instance_name
        type: Utf8
        nullable: true
        description: Chart (instance) the alert is attached to.
        expr: {kind: path, path: [instance]}
      - name: instance_id
        type: Utf8
        nullable: true
        description: Chart id the alert is attached to.
        expr: {kind: path, path: [instance_id]}
      - name: context
        type: Utf8
        nullable: true
        description: Metric context the alert is attached to.
        expr: {kind: path, path: [context]}
      - name: status
        type: Utf8
        nullable: true
        description: Alert state (e.g., WARNING, CRITICAL, CLEAR).
        expr: {kind: path, path: [status]}
      - name: value
        type: Float64
        nullable: true
        description: Most recent value evaluated by the alert.
        expr: {kind: path, path: [last_updated_value]}
      - name: last_updated
        type: Timestamp
        nullable: true
        description: When the alert was last evaluated.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [last_updated_timestamp]}
      - name: last_transition_value
        type: Float64
        nullable: true
        description: Value at the last status change.
        expr: {kind: path, path: [last_transition_value]}
      - name: last_transition
        type: Timestamp
        nullable: true
        description: When the alert last changed status.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [last_transition_timestamp]}
      - name: family
        type: Utf8
        nullable: true
        description: Subsystem group classification (e.g., cpu, disk).
        expr: {kind: path, path: [family]}
      - name: info
        type: Utf8
        nullable: true
        description: Human-readable description of the alert.
        expr: {kind: path, path: [info]}
      - name: summary
        type: Utf8
        nullable: true
        description: Short summary of the alert.
        expr: {kind: path, path: [summary]}
      - name: units
        type: Utf8
        nullable: true
        description: Measurement units of the evaluated value.
        expr: {kind: path, path: [units]}
      - name: recipient
        type: Utf8
        nullable: true
        description: Notification routing target for the alert.
        expr: {kind: path, path: [recipients]}
      - name: type
        type: Utf8
        nullable: true
        description: Alert type as declared in its configuration.
        expr: {kind: path, path: [type]}
      - name: component
        type: Utf8
        nullable: true
        description: Alert component as declared in its configuration.
        expr: {kind: path, path: [component]}
      - name: classification
        type: Utf8
        nullable: true
        description: Alert classification as declared in its configuration.
        expr: {kind: path, path: [classification]}
      - name: source
        type: Utf8
        nullable: true
        description: Configuration file the alert was defined in.
        expr: {kind: path, path: [source]}

  - name: metrics_metadata
    description: >-
      Catalog of metric contexts collected by the agent, from the current
      Netdata v3 contexts API.
    request:
      method: GET
      path: /api/v3/contexts
      query:
        - name: options
          from: literal
          value: titles
    response:
      row_strategy: dict_entries
      rows_path: [contexts]
    pagination:
      mode: none
    columns:
      - name: context_id
        type: Utf8
        nullable: false
        description: Unique context identifier (e.g., system.cpu, disk.io).
        expr: {kind: path, path: [_key]}
      - name: title
        type: Utf8
        nullable: true
        description: Context title (included via the `titles` option).
        expr: {kind: path, path: [title]}
      - name: units
        type: Utf8
        nullable: true
        description: Measurement units (e.g., percentage, MiB/s).
        expr: {kind: path, path: [units]}
      - name: family
        type: Utf8
        nullable: true
        description: Subsystem family (e.g., cpu, disk, network).
        expr: {kind: path, path: [family]}
      - name: priority
        type: Int64
        nullable: true
        description: Display priority of the context (lower sorts higher).
        expr: {kind: path, path: [priority]}
      - name: live
        type: Boolean
        nullable: true
        description: Whether the context is currently collecting data.
        expr: {kind: path, path: [live]}
