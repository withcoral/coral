name: linkedin
version: 0.1.0
dsl_version: 3
backend: file

description: Reads LinkedIn account data export CSV files as queryable SQL tables.

inputs:
  LINKEDIN_EXPORT_PATH:
    kind: variable
    default: ./linkedin_export
    hint: Absolute or relative path to the extracted LinkedIn account data export directory (contains Profile.csv, Skills.csv, Positions.csv, Connections.csv).

test_queries:
  - SELECT * FROM linkedin.skills LIMIT 1
  - SELECT * FROM linkedin.profile LIMIT 1
  - SELECT first_name, last_name, company, position FROM linkedin.connections LIMIT 1

tables:
  - name: profile
    description: "LinkedIn profile data: headline, summary, location."
    format: csv
    format_options:
      has_header: true
    source:
      location: file://{{input.LINKEDIN_EXPORT_PATH}}/
      glob: Profile.csv
    columns:
      - name: first_name
        type: Utf8
      - name: last_name
        type: Utf8
      - name: headline
        type: Utf8
      - name: summary
        type: Utf8
      - name: location
        type: Utf8
      - name: industry
        type: Utf8

  - name: skills
    description: LinkedIn skills with endorsement counts.
    format: csv
    format_options:
      has_header: true
    source:
      location: file://{{input.LINKEDIN_EXPORT_PATH}}/
      glob: Skills.csv
    columns:
      - name: name
        type: Utf8
      - name: endorsements
        type: Int64

  - name: positions
    description: "Work history: company, title, and dates."
    format: csv
    format_options:
      has_header: true
    source:
      location: file://{{input.LINKEDIN_EXPORT_PATH}}/
      glob: Positions.csv
    columns:
      - name: company_name
        type: Utf8
      - name: title
        type: Utf8
      - name: description
        type: Utf8
      - name: location
        type: Utf8
      - name: started_on
        type: Utf8
      - name: finished_on
        type: Utf8

  - name: connections
    description: "LinkedIn connections: person, company, and connected date."
    format: csv
    format_options:
      has_header: true
    source:
      location: file://{{input.LINKEDIN_EXPORT_PATH}}/
      glob: Connections.csv
    columns:
      - name: first_name
        type: Utf8
      - name: last_name
        type: Utf8
      - name: email_address
        type: Utf8
      - name: company
        type: Utf8
      - name: position
        type: Utf8
      - name: connected_on
        type: Utf8
