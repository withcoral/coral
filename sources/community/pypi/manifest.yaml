dsl_version: 3
name: pypi
version: "1.0.0"
description: PyPI package download statistics from pypistats.org.
backend: http
base_url: https://pypistats.org/api

tables:
  - name: packages
    description: PyPI package download stats.
    filters:
      - name: name
        required: true
    request:
      method: GET
      path: /packages/{{filter.name}}/recent
    columns:
      - name: package
        type: Utf8
        expr:
          kind: path
          path: ["package"]
      - name: last_day_downloads
        type: Int64
        expr:
          kind: path
          path: ["data", "last_day"]
      - name: last_week_downloads
        type: Int64
        expr:
          kind: path
          path: ["data", "last_week"]
      - name: last_month_downloads
        type: Int64
        expr:
          kind: path
          path: ["data", "last_month"]
