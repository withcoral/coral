            - serviceId
      - name: mount_path
        type: Utf8
        nullable: true
        description: Path where the volume is mounted.
        expr:
          kind: path
          path:
            - mountPath
      - name: state
        type: Utf8
        nullable: true
        description: Volume instance state.
        expr:
          kind: path
