            - state
      - name: size_mb
        type: Int64
        nullable: true
        description: Provisioned volume size in MB.
        expr:
          kind: path
          path:
            - sizeMB
      - name: current_size_mb
        type: Float64
        nullable: true
        description: Current used volume size in MB.
        expr:
          kind: path
