  # ─────────────────────────────────────────────────────────────
  # volume_instances – environment/service-specific volume mounts
  # ─────────────────────────────────────────────────────────────
  - name: volume_instances
    description: Volume mounts for a specific Railway environment/service
    guide: |
      Fetches one volume instance by `volume_instance_id`. Use the
      `volumes.volume_instances` JSON column to discover instance IDs, then
      query this table for mount path, state, size, region, service, and
      environment details.
    filters:
      - name: volume_instance_id
        required: true
    request:
      method: POST
      path: /
      query: []
      body:
        - path:
            - query
          from: literal
          value: |
            query VolumeInstance($id: String!) {
              volumeInstance(id: $id) {
                id
                volumeId
                environmentId
                serviceId
                mountPath
                state
                sizeMB
                currentSizeMB
                region
                externalId
                createdAt
              }
            }
        - path:
            - variables
            - id
          from: filter
          key: volume_instance_id
    response:
      rows_path:
        - data
        - volumeInstance
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: volume_instance_id
        type: Utf8
        nullable: false
        virtual: true
        description: Volume instance ID filter.
        expr:
          kind: from_filter
          key: volume_instance_id
      - name: id
        type: Utf8
        nullable: false
        description: Volume instance ID.
        expr:
          kind: path
          path:
            - id
