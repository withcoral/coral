name: open_meteo_geocoding
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Search global places and resolve Open-Meteo location IDs through the public
  Open-Meteo Geocoding API. No authentication required.
base_url: https://geocoding-api.open-meteo.com/v1

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT id, name, country, latitude, longitude FROM open_meteo_geocoding.locations WHERE name = 'Shanghai' AND count = 1 LIMIT 1
  - SELECT id, name, timezone FROM open_meteo_geocoding.location_by_id WHERE id = '1796236' LIMIT 1

tables:
  - name: locations
    description: |
      Search cities, towns, and geographic places by name. Use this table to
      discover latitude, longitude, timezone, elevation, country, and admin
      metadata before calling weather sources such as open_meteo_weather.
      Optional filters include count, language, country_code, and format.
    fetch_limit_default: 10
    filters:
      - name: name
        required: true
      - name: count
      - name: language
      - name: country_code
      - name: format
    request:
      method: GET
      path: /search
      query:
        - name: name
          from: filter
          key: name
        - name: count
          from: filter_int
          key: count
        - name: language
          from: filter
          key: language
        - name: countryCode
          from: filter
          key: country_code
        - name: format
          from: filter
          key: format
    response:
      rows_path:
        - results
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: id
        type: Int64
        nullable: false
        description: Open-Meteo geocoding location identifier.
      - name: name
        type: Utf8
        nullable: false
        description: Place name.
      - name: latitude
        type: Float64
        nullable: false
        description: Latitude in decimal degrees.
      - name: longitude
        type: Float64
        nullable: false
        description: Longitude in decimal degrees.
      - name: elevation
        type: Float64
        nullable: true
        description: Elevation in meters above sea level.
      - name: feature_code
        type: Utf8
        nullable: true
        description: GeoNames feature code for the place.
      - name: country_code
        type: Utf8
        nullable: true
        description: ISO 3166-1 alpha-2 country code.
      - name: country
        type: Utf8
        nullable: true
        description: Country name.
      - name: country_id
        type: Int64
        nullable: true
        description: GeoNames country identifier.
      - name: admin1
        type: Utf8
        nullable: true
        description: First-level administrative area name.
      - name: admin1_id
        type: Int64
        nullable: true
        description: First-level administrative area identifier.
      - name: admin2
        type: Utf8
        nullable: true
        description: Second-level administrative area name.
      - name: admin2_id
        type: Int64
        nullable: true
        description: Second-level administrative area identifier.
      - name: admin3
        type: Utf8
        nullable: true
        description: Third-level administrative area name.
      - name: admin3_id
        type: Int64
        nullable: true
        description: Third-level administrative area identifier.
      - name: admin4
        type: Utf8
        nullable: true
        description: Fourth-level administrative area name.
      - name: admin4_id
        type: Int64
        nullable: true
        description: Fourth-level administrative area identifier.
      - name: timezone
        type: Utf8
        nullable: true
        description: IANA timezone for the place.
      - name: population
        type: Int64
        nullable: true
        description: Population when available.
      - name: postcodes
        type: Json
        nullable: true
        description: Postal codes returned by Open-Meteo when available.
      - name: raw
        type: Json
        nullable: false
        description: Full raw location object.
        expr:
          kind: current_row
      - name: query_name
        type: Utf8
        nullable: true
        virtual: true
        description: Echoes the requested place-name filter.
        expr:
          kind: from_filter
          key: name
      - name: count
        type: Int64
        nullable: true
        virtual: true
        description: Echoes the requested maximum result count filter.
        expr:
          kind: from_filter
          key: count
      - name: language
        type: Utf8
        nullable: true
        virtual: true
        description: Echoes the requested language filter.
        expr:
          kind: from_filter
          key: language
      - name: format
        type: Utf8
        nullable: true
        virtual: true
        description: Echoes the requested response format filter.
        expr:
          kind: from_filter
          key: format

  - name: location_by_id
    description: |
      Resolve a single Open-Meteo geocoding location by numeric ID. Useful after
      selecting one row from locations and needing a stable lookup.
    filters:
      - name: id
        required: true
      - name: language
      - name: format
    request:
      method: GET
      path: /get
      query:
        - name: id
          from: filter_int
          key: id
        - name: language
          from: filter
          key: language
        - name: format
          from: filter
          key: format
    response:
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: id
        type: Int64
        nullable: false
        description: Open-Meteo geocoding location identifier.
      - name: name
        type: Utf8
        nullable: false
        description: Place name.
      - name: latitude
        type: Float64
        nullable: false
        description: Latitude in decimal degrees.
      - name: longitude
        type: Float64
        nullable: false
        description: Longitude in decimal degrees.
      - name: elevation
        type: Float64
        nullable: true
        description: Elevation in meters above sea level.
      - name: feature_code
        type: Utf8
        nullable: true
        description: GeoNames feature code for the place.
      - name: country_code
        type: Utf8
        nullable: true
        description: ISO 3166-1 alpha-2 country code.
      - name: country
        type: Utf8
        nullable: true
        description: Country name.
      - name: country_id
        type: Int64
        nullable: true
        description: GeoNames country identifier.
      - name: admin1
        type: Utf8
        nullable: true
        description: First-level administrative area name.
      - name: admin1_id
        type: Int64
        nullable: true
        description: First-level administrative area identifier.
      - name: admin2
        type: Utf8
        nullable: true
        description: Second-level administrative area name.
      - name: admin2_id
        type: Int64
        nullable: true
        description: Second-level administrative area identifier.
      - name: admin3
        type: Utf8
        nullable: true
        description: Third-level administrative area name.
      - name: admin3_id
        type: Int64
        nullable: true
        description: Third-level administrative area identifier.
      - name: admin4
        type: Utf8
        nullable: true
        description: Fourth-level administrative area name.
      - name: admin4_id
        type: Int64
        nullable: true
        description: Fourth-level administrative area identifier.
      - name: timezone
        type: Utf8
        nullable: true
        description: IANA timezone for the place.
      - name: population
        type: Int64
        nullable: true
        description: Population when available.
      - name: postcodes
        type: Json
        nullable: true
        description: Postal codes returned by Open-Meteo when available.
      - name: raw
        type: Json
        nullable: false
        description: Full raw location object.
        expr:
          kind: current_row
      - name: requested_id
        type: Utf8
        nullable: true
        virtual: true
        description: Echoes the requested id filter.
        expr:
          kind: from_filter
          key: id
