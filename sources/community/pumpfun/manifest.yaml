      - name: associated_bonding_curve
        type: Utf8
      - name: creator
        type: Utf8
      - name: created_timestamp
        type: Int64
      - name: last_trade_timestamp
        type: Int64
      - name: complete
        type: Boolean
      - name: market_cap
        type: Float64
      - name: usd_market_cap
        type: Float64
      - name: virtual_sol_reserves
        type: Int64
      - name: virtual_token_reserves
        type: Int64
      - name: real_sol_reserves
        type: Int64
      - name: real_token_reserves
        type: Int64
      - name: total_supply
        type: Int64
      - name: reply_count
        type: Int64
      - name: is_currently_live
        type: Boolean
      - name: nsfw
        type: Boolean
      - name: is_banned
        type: Boolean
      - name: ath_market_cap
        type: Float64
      - name: ath_market_cap_timestamp
        type: Int64
      - name: twitter
        type: Utf8
      - name: telegram
        type: Utf8
      - name: website
        type: Utf8

  - name: king_of_the_hill
    description: Current King of the Hill (highest market cap bonding curve token)
    request:
      method: GET
      path: /coins
      query:
        - name: limit
          from: template
          template: "1"
        - name: sort
          from: template
          template: market_cap
        - name: order
          from: template
          template: DESC
        - name: complete
          from: template
          template: "false"
        - name: includeNsfw
          from: template
          template: "false"
    response:
      rows_path: []
    columns:
      - name: mint
        type: Utf8
      - name: name
        type: Utf8
      - name: symbol
        type: Utf8
      - name: description
        type: Utf8
      - name: image_uri
        type: Utf8
      - name: metadata_uri
        type: Utf8
      - name: bonding_curve
        type: Utf8
      - name: associated_bonding_curve
        type: Utf8
      - name: creator
        type: Utf8
      - name: created_timestamp
        type: Int64
      - name: last_trade_timestamp
        type: Int64
      - name: complete
        type: Boolean
      - name: market_cap
        type: Float64
      - name: usd_market_cap
        type: Float64
      - name: virtual_sol_reserves
        type: Int64
      - name: virtual_token_reserves
        type: Int64
      - name: real_sol_reserves
        type: Int64
      - name: real_token_reserves
        type: Int64
      - name: total_supply
        type: Int64
      - name: reply_count
        type: Int64
      - name: is_currently_live
        type: Boolean
      - name: nsfw
        type: Boolean
      - name: is_banned
        type: Boolean
      - name: ath_market_cap
        type: Float64
      - name: ath_market_cap_timestamp
        type: Int64
      - name: twitter
        type: Utf8
      - name: telegram
        type: Utf8
      - name: website
        type: Utf8

  - name: coin_detail
    description: Get full details for a single token by mint address
    filters:
      - name: mint
        type: Utf8
        required: true
    request:
      method: GET
      path: /coins/{{filter.mint}}
    response:
      rows_path: []
    columns:
      - name: mint
        type: Utf8
        virtual: true
        expr:
          kind: from_filter
          key: mint
      - name: name
        type: Utf8
      - name: symbol
        type: Utf8
      - name: description
        type: Utf8
      - name: image_uri
        type: Utf8
      - name: metadata_uri
        type: Utf8
      - name: bonding_curve
        type: Utf8
      - name: associated_bonding_curve
        type: Utf8
      - name: creator
        type: Utf8
      - name: created_timestamp
        type: Int64
      - name: last_trade_timestamp
        type: Int64
      - name: complete
        type: Boolean
      - name: market_cap
        type: Float64
      - name: usd_market_cap
        type: Float64
      - name: virtual_sol_reserves
        type: Int64
      - name: virtual_token_reserves
        type: Int64
      - name: real_sol_reserves
        type: Int64
      - name: real_token_reserves
        type: Int64
      - name: total_supply
        type: Int64
      - name: reply_count
        type: Int64
      - name: is_currently_live
        type: Boolean
      - name: nsfw
        type: Boolean
      - name: is_banned
        type: Boolean
      - name: ath_market_cap
        type: Float64
      - name: ath_market_cap_timestamp
        type: Int64
      - name: twitter
        type: Utf8
      - name: telegram
        type: Utf8
      - name: website
        type: Utf8

  - name: sol_price
    description: Current Solana price in USD
    request:
      method: GET
      path: /sol-price
    response:
      rows_path: []
    columns:
      - name: sol_price
        type: Float64
        expr:
          kind: path
          path: ["solPrice"]
