name: pumpfun
version: 0.1.1
dsl_version: 3
backend: http
description: >-
  Query real-time token launches, bonding curve progress, graduated tokens, market caps,
  and the current SOL price from Pump.fun via the public frontend-api-v3 endpoints.
  No API key required.

inputs:
  API_BASE:
    kind: variable
    default: https://frontend-api-v3.pump.fun
    hint: Base URL for Pump.fun Frontend API v3

base_url: "{{input.API_BASE}}"

test_queries:
  - SELECT name, symbol, creator, created_timestamp, market_cap, usd_market_cap FROM pumpfun.latest_coins LIMIT 5
  - SELECT sol_price FROM pumpfun.sol_price

auth:
  type: HeaderAuth
  headers:
    - name: Origin
      from: template
      template: https://pump.fun
    - name: Accept
      from: template
      template: application/json
    - name: User-Agent
      from: template
      template: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36"

tables:
  - name: coins
    description: Search and list Pump.fun tokens with flexible filtering
    fetch_limit_default: 50
    filters:
      - name: searchTerm
        type: Utf8
      - name: creator
        type: Utf8
      - name: complete
        type: Boolean
      - name: includeNsfw
        type: Boolean
      - name: sort
        type: Utf8
      - name: order
        type: Utf8
    request:
      method: GET
      path: /coins
      query:
        - name: searchTerm
          from: filter
          key: searchTerm
        - name: creator
          from: filter
          key: creator
        - name: complete
          from: filter
          key: complete
        - name: includeNsfw
          from: filter
          key: includeNsfw
        - name: sort
          from: filter
          key: sort
        - name: order
          from: filter
          key: order
    response:
      rows_path: []
    pagination:
      mode: offset
      offset_param: offset
      page_size:
        default: 50
        max: 50
        query_param: limit
    columns:
      - name: search_term
        type: Utf8
        virtual: true
        expr:
          kind: from_filter
          key: searchTerm
      - name: creator_filter
        type: Utf8
        virtual: true
        expr:
          kind: from_filter
          key: creator
      - name: complete_filter
        type: Boolean
        virtual: true
        expr:
          kind: from_filter
          key: complete
      - name: include_nsfw
        type: Boolean
        virtual: true
        expr:
          kind: from_filter
          key: includeNsfw
      - name: sort
        type: Utf8
        virtual: true
        expr:
          kind: from_filter
          key: sort
      - name: order
        type: Utf8
        virtual: true
        expr:
          kind: from_filter
          key: order
      - name: mint
        type: Utf8
      - name: name
        type: Utf8
      - name: symbol
        type: Utf8
      - name: description
        type: Utf8
      - name: image_uri
        type: Utf8
      - name: metadata_uri
        type: Utf8
      - name: bonding_curve
        type: Utf8
      - name: associated_bonding_curve
        type: Utf8
      - name: creator
        type: Utf8
      - name: created_timestamp
        type: Int64
      - name: last_trade_timestamp
        type: Int64
      - name: complete
        type: Boolean
      - name: market_cap
        type: Float64
      - name: usd_market_cap
        type: Float64
      - name: virtual_sol_reserves
        type: Int64
      - name: virtual_token_reserves
        type: Int64
      - name: real_sol_reserves
        type: Int64
      - name: real_token_reserves
        type: Int64
      - name: total_supply
        type: Int64
      - name: reply_count
        type: Int64
      - name: is_currently_live
        type: Boolean
      - name: nsfw
        type: Boolean
      - name: is_banned
        type: Boolean
      - name: ath_market_cap
        type: Float64
      - name: ath_market_cap_timestamp
        type: Int64
      - name: twitter
        type: Utf8
      - name: telegram
        type: Utf8
      - name: website
        type: Utf8

  - name: latest_coins
    description: Most recently launched tokens on Pump.fun
    fetch_limit_default: 30
    request:
      method: GET
      path: /coins
      query:
        - name: sort
          from: template
          template: created_timestamp
        - name: order
          from: template
          template: DESC
        - name: includeNsfw
          from: template
          template: "false"
        - name: complete
          from: template
          template: "false"
    response:
      rows_path: []
    pagination:
      mode: offset
      offset_param: offset
      page_size:
        default: 50
        max: 50
        query_param: limit
    columns:
      - name: mint
        type: Utf8
      - name: name
        type: Utf8
      - name: symbol
        type: Utf8
      - name: description
        type: Utf8
      - name: image_uri
        type: Utf8
      - name: metadata_uri
        type: Utf8
      - name: bonding_curve
        type: Utf8
      - name: associated_bonding_curve
        type: Utf8
      - name: creator
        type: Utf8
      - name: created_timestamp
        type: Int64
      - name: last_trade_timestamp
        type: Int64
      - name: complete
        type: Boolean
      - name: market_cap
        type: Float64
      - name: usd_market_cap
        type: Float64
      - name: virtual_sol_reserves
        type: Int64
      - name: virtual_token_reserves
        type: Int64
      - name: real_sol_reserves
        type: Int64
      - name: real_token_reserves
        type: Int64
      - name: total_supply
        type: Int64
      - name: reply_count
        type: Int64
      - name: is_currently_live
        type: Boolean
      - name: nsfw
        type: Boolean
      - name: is_banned
        type: Boolean
      - name: ath_market_cap
        type: Float64
      - name: ath_market_cap_timestamp
        type: Int64
      - name: twitter
        type: Utf8
      - name: telegram
        type: Utf8
      - name: website
        type: Utf8

  - name: graduated_coins
    description: Tokens that have graduated to Raydium
    fetch_limit_default: 30
    request:
      method: GET
      path: /coins
      query:
        - name: sort
          from: template
          template: last_trade_timestamp
        - name: order
          from: template
          template: DESC
        - name: complete
          from: template
          template: "true"
        - name: includeNsfw
          from: template
          template: "false"
    response:
      rows_path: []
    pagination:
      mode: offset
      offset_param: offset
      page_size:
        default: 50
        max: 50
        query_param: limit
    columns:
      - name: mint
        type: Utf8
      - name: name
        type: Utf8
      - name: symbol
        type: Utf8
      - name: description
        type: Utf8
      - name: image_uri
        type: Utf8
      - name: metadata_uri
        type: Utf8
      - name: bonding_curve
        type: Utf8
      - name: associated_bonding_curve
        type: Utf8
      - name: creator
        type: Utf8
      - name: created_timestamp
        type: Int64
      - name: last_trade_timestamp
        type: Int64
      - name: complete
        type: Boolean
      - name: market_cap
        type: Float64
      - name: usd_market_cap
        type: Float64
      - name: virtual_sol_reserves
        type: Int64
      - name: virtual_token_reserves
        type: Int64
      - name: real_sol_reserves
        type: Int64
      - name: real_token_reserves
        type: Int64
      - name: total_supply
        type: Int64
      - name: reply_count
        type: Int64
      - name: is_currently_live
        type: Boolean
      - name: nsfw
        type: Boolean
      - name: is_banned
        type: Boolean
      - name: ath_market_cap
        type: Float64
      - name: ath_market_cap_timestamp
        type: Int64
      - name: twitter
        type: Utf8
      - name: telegram
        type: Utf8
      - name: website
        type: Utf8

  - name: active_trading_coins
    description: Tokens with the most recent trading activity
    fetch_limit_default: 30
    request:
      method: GET
      path: /coins
      query:
        - name: sort
          from: template
          template: last_trade_timestamp
        - name: order
          from: template
          template: DESC
        - name: includeNsfw
          from: template
          template: "false"
    response:
      rows_path: []
    pagination:
      mode: offset
      offset_param: offset
      page_size:
        default: 50
        max: 50
        query_param: limit
    columns:
      - name: mint
        type: Utf8
      - name: name
        type: Utf8
      - name: symbol
        type: Utf8
      - name: description
        type: Utf8
      - name: image_uri
        type: Utf8
      - name: metadata_uri
        type: Utf8
      - name: bonding_curve
