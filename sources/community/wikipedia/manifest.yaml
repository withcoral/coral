name: wikipedia
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Wikipedia articles via the public MediaWiki and REST APIs. Search
  articles by keyword, look up page summaries by title, and discover random
  articles. No authentication required.
base_url: https://en.wikipedia.org
test_queries:
  - SELECT title, snippet FROM wikipedia.search WHERE query = 'Rust' LIMIT 1
  - SELECT title, description, extract FROM wikipedia.page WHERE title = 'Rust' LIMIT 1
  - SELECT title, description, extract FROM wikipedia.random LIMIT 1
tables:
  - name: search
    description: |
      Search Wikipedia articles by keyword. Returns matching pages with
      metadata such as title, page ID, size, word count, and a snippet.
      Use `query` for the search term and `limit` to control result count.
    fetch_limit_default: 10
    filters:
      - name: query
        required: true
      - name: limit
    request:
      method: GET
      path: /w/api.php
      query:
        - name: action
          from: literal
          value: query
        - name: list
          from: literal
          value: search
        - name: srsearch
          from: filter
          key: query
        - name: format
          from: literal
          value: json
        - name: srlimit
          from: filter
          key: limit
    response:
      rows_path:
        - query
        - search
    pagination:
      mode: offset
      offset_param: sroffset
      page_size:
        default: 10
        max: 50
        query_param: srlimit
    columns:
      - name: ns
        type: Int64
        nullable: false
        description: MediaWiki namespace ID (0 = articles).
        expr:
          kind: path
          path:
            - ns
      - name: title
        type: Utf8
        nullable: false
        description: Article title.
        expr:
          kind: path
          path:
            - title
      - name: pageid
        type: Int64
        nullable: false
        description: Unique Wikipedia page ID.
        expr:
          kind: path
          path:
            - pageid
      - name: size
        type: Int64
        nullable: false
        description: Page size in bytes.
        expr:
          kind: path
          path:
            - size
      - name: wordcount
        type: Int64
        nullable: false
        description: Approximate word count of the article.
        expr:
          kind: path
          path:
            - wordcount
      - name: snippet
        type: Utf8
        nullable: true
        description: HTML snippet of the article content matching the query.
        expr:
          kind: path
          path:
            - snippet
      - name: timestamp
        type: Timestamp
        nullable: true
        description: Last edit timestamp of the page.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - timestamp
      - name: query
        type: Utf8
        nullable: true
        description: Echoes the search query filter.
        expr:
          kind: from_filter
          key: query

  - name: page
    description: |
      Fetch a summary of a Wikipedia article by its exact title. Returns
      metadata including description, extract, and content URLs.
    filters:
      - name: title
        required: true
    request:
      method: GET
      path: /api/rest_v1/page/summary/{{filter.title}}
    response: {}
    pagination:
      mode: none
    columns:
      - name: type
        type: Utf8
        nullable: true
        description: Page type (e.g. standard, disambiguation, no-extract).
        expr:
          kind: path
          path:
            - type
      - name: title
        type: Utf8
        nullable: false
        description: Article title.
        expr:
          kind: path
          path:
            - title
      - name: displaytitle
        type: Utf8
        nullable: true
        description: Formatted display title (may include HTML).
        expr:
          kind: path
          path:
            - displaytitle
      - name: pageid
        type: Int64
        nullable: true
        description: Wikipedia page ID.
        expr:
          kind: path
          path:
            - pageid
      - name: lang
        type: Utf8
        nullable: true
        description: Language code of the article (e.g. en).
        expr:
          kind: path
          path:
            - lang
      - name: dir
        type: Utf8
        nullable: true
        description: Text direction (ltr or rtl).
        expr:
          kind: path
          path:
            - dir
      - name: revision
        type: Utf8
        nullable: true
        description: Current revision ID.
        expr:
          kind: path
          path:
            - revision
      - name: timestamp
        type: Timestamp
        nullable: true
        description: Last modified timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - timestamp
      - name: description
        type: Utf8
        nullable: true
        description: Short description of the article topic.
        expr:
          kind: path
          path:
            - description
      - name: extract
        type: Utf8
        nullable: true
        description: Plain-text summary extract of the article.
        expr:
          kind: path
          path:
            - extract
      - name: extract_html
        type: Utf8
        nullable: true
        description: HTML summary extract of the article.
        expr:
          kind: path
          path:
            - extract_html
      - name: thumbnail_source
        type: Utf8
        nullable: true
        description: URL of the article thumbnail image.
        expr:
          kind: path
          path:
            - thumbnail
            - source
      - name: thumbnail_width
        type: Int64
        nullable: true
        description: Thumbnail image width in pixels.
        expr:
          kind: path
          path:
            - thumbnail
            - width
      - name: thumbnail_height
        type: Int64
        nullable: true
        description: Thumbnail image height in pixels.
        expr:
          kind: path
          path:
            - thumbnail
            - height
      - name: content_url
        type: Utf8
        nullable: true
        description: URL to the article HTML content.
        expr:
          kind: path
          path:
            - content_urls
            - desktop
            - page
      - name: mobile_url
        type: Utf8
        nullable: true
        description: URL to the mobile article HTML content.
        expr:
          kind: path
          path:
            - content_urls
            - mobile
            - page
      - name: wikibase_item
        type: Utf8
        nullable: true
        description: Wikidata item ID (e.g. Q12345).
        expr:
          kind: path
          path:
            - wikibase_item

  - name: random
    description: |
      Fetch a random Wikipedia article summary. Returns metadata including
      title, description, and extract. No filters required.
    request:
      method: GET
      path: /api/rest_v1/page/random/summary
    response: {}
    pagination:
      mode: none
    columns:
      - name: type
        type: Utf8
        nullable: true
        description: Page type (e.g. standard, disambiguation, no-extract).
        expr:
          kind: path
          path:
            - type
      - name: title
        type: Utf8
        nullable: false
        description: Article title.
        expr:
          kind: path
          path:
            - title
      - name: displaytitle
        type: Utf8
        nullable: true
        description: Formatted display title (may include HTML).
        expr:
          kind: path
          path:
            - displaytitle
      - name: pageid
        type: Int64
        nullable: true
        description: Wikipedia page ID.
        expr:
          kind: path
          path:
            - pageid
      - name: lang
        type: Utf8
        nullable: true
        description: Language code of the article (e.g. en).
        expr:
          kind: path
          path:
            - lang
      - name: dir
        type: Utf8
        nullable: true
        description: Text direction (ltr or rtl).
        expr:
          kind: path
          path:
            - dir
      - name: revision
        type: Utf8
        nullable: true
        description: Current revision ID.
        expr:
          kind: path
          path:
            - revision
      - name: timestamp
        type: Timestamp
        nullable: true
        description: Last modified timestamp.
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - timestamp
      - name: description
        type: Utf8
        nullable: true
        description: Short description of the article topic.
        expr:
          kind: path
          path:
            - description
      - name: extract
        type: Utf8
        nullable: true
        description: Plain-text summary extract of the article.
        expr:
          kind: path
          path:
            - extract
      - name: extract_html
        type: Utf8
        nullable: true
        description: HTML summary extract of the article.
        expr:
          kind: path
          path:
            - extract_html
      - name: thumbnail_source
        type: Utf8
        nullable: true
        description: URL of the article thumbnail image.
        expr:
          kind: path
          path:
            - thumbnail
            - source
      - name: thumbnail_width
        type: Int64
        nullable: true
        description: Thumbnail image width in pixels.
        expr:
          kind: path
          path:
            - thumbnail
            - width
      - name: thumbnail_height
        type: Int64
        nullable: true
        description: Thumbnail image height in pixels.
        expr:
          kind: path
          path:
            - thumbnail
            - height
      - name: content_url
        type: Utf8
        nullable: true
        description: URL to the article HTML content.
        expr:
          kind: path
          path:
            - content_urls
            - desktop
            - page
      - name: mobile_url
        type: Utf8
        nullable: true
        description: URL to the mobile article HTML content.
        expr:
          kind: path
          path:
            - content_urls
            - mobile
            - page
      - name: wikibase_item
        type: Utf8
        nullable: true
        description: Wikidata item ID (e.g. Q12345).
        expr:
          kind: path
          path:
            - wikibase_item
