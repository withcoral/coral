          exprs:
            - kind: if_present
              check: {kind: path, path: [amount, specifiedAmount]}
              then_value: SPECIFIED
            - kind: literal
              value: LAST_PERIOD
      - name: specified_amount_units
        type: Utf8
        nullable: true
        description: >-
          Integer budget amount in account currency as a string (int64). Cast with
