        nullable: true
        description: End of the monthly period (YYYY-MM-DD).
        expr:
          kind: path
          path:
            - end_date

  # ──────────────────────────────────────────────────────────────────────
  # TABLE 12: applications
  # TwiML Applications (webhook routing configurations).
  # ──────────────────────────────────────────────────────────────────────
  - name: applications
    description: >
      Lists all TwiML Applications in the Twilio account. Applications
      are reusable webhook configurations that can be assigned to
      phone numbers. Instead of setting webhook URLs on each number
      individually, you can point multiple numbers to a single
      application. Use this table to audit webhook routing and
      ensure all applications have valid URLs.
    guide: >
      Start with `SELECT sid, friendly_name, voice_url, sms_url,
      date_created FROM twilio.applications`. Join
      `voice_application_sid` and `sms_application_sid` on
      `twilio.phone_numbers` to see which numbers use each app.
    request:
      method: GET
      path: /Applications.json
    response:
      rows_path:
        - applications
    pagination:
      mode: next_page_url
      next_page_url_path:
        - next_page_uri
      page_size:
        default: 50
        max: 1000
        query_param: PageSize
    columns:
      - name: sid
        type: Utf8
        nullable: false
        description: >
          Unique 34-character application SID (starts with "AP").
          Referenced by `voice_application_sid` and `sms_application_sid`
          on phone numbers.
        expr:
          kind: path
          path:
            - sid
      - name: friendly_name
        type: Utf8
        nullable: true
        description: A human-readable name for the application.
        expr:
          kind: path
          path:
            - friendly_name
      - name: voice_url
        type: Utf8
        nullable: true
        description: The URL Twilio requests when a call is received.
        expr:
          kind: path
          path:
            - voice_url
      - name: voice_method
        type: Utf8
        nullable: true
        description: HTTP method for the voice webhook (GET or POST).
        expr:
          kind: path
          path:
            - voice_method
      - name: voice_fallback_url
        type: Utf8
        nullable: true
        description: Fallback URL if the primary voice webhook fails.
        expr:
          kind: path
          path:
            - voice_fallback_url
      - name: voice_fallback_method
        type: Utf8
        nullable: true
        description: HTTP method for the voice fallback webhook.
        expr:
          kind: path
          path:
            - voice_fallback_method
      - name: voice_caller_id_lookup
        type: Boolean
        nullable: true
        description: Whether caller ID lookup is enabled for voice.
        expr:
          kind: path
          path:
            - voice_caller_id_lookup
      - name: status_callback
        type: Utf8
        nullable: true
        description: URL for call status callback notifications.
        expr:
          kind: path
          path:
            - status_callback
      - name: status_callback_method
        type: Utf8
        nullable: true
        description: HTTP method for status callbacks.
        expr:
          kind: path
          path:
            - status_callback_method
      - name: sms_url
        type: Utf8
        nullable: true
        description: The URL Twilio requests when an SMS is received.
        expr:
          kind: path
          path:
            - sms_url
      - name: sms_method
        type: Utf8
        nullable: true
        description: HTTP method for the SMS webhook (GET or POST).
        expr:
          kind: path
          path:
            - sms_method
      - name: sms_fallback_url
        type: Utf8
        nullable: true
        description: Fallback URL if the primary SMS webhook fails.
        expr:
          kind: path
          path:
            - sms_fallback_url
      - name: sms_fallback_method
        type: Utf8
        nullable: true
        description: HTTP method for the SMS fallback webhook.
        expr:
          kind: path
          path:
            - sms_fallback_method
      - name: sms_status_callback
        type: Utf8
        nullable: true
        description: URL for SMS status callback notifications.
        expr:
          kind: path
          path:
            - sms_status_callback
      - name: account_sid
        type: Utf8
        nullable: true
        description: The Account SID that owns this application.
        expr:
          kind: path
          path:
            - account_sid
      - name: date_created
        type: Utf8
        nullable: true
        description: When the application was created (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_created
      - name: date_updated
        type: Utf8
        nullable: true
        description: When the application was last updated (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_updated

  # ──────────────────────────────────────────────────────────────────────
  # TABLE 13: alerts
  # Debugging alerts and error logs.
  # ──────────────────────────────────────────────────────────────────────
  - name: alerts
    description: >
      Lists debugging alerts from the Twilio Monitor API. Alerts are
      generated when webhooks fail, API errors occur, or other issues
      arise. Each alert includes the error code, log level, request
      URL, HTTP method, response status code, and a description.
      This is the primary table for debugging and monitoring your
      Twilio integration — use it to detect webhook failures,
      configuration errors, and API issues.
    guide: >
      Start with `SELECT sid, error_code, log_level, alert_text,
      request_url, response_body, date_created FROM twilio.alerts
      LIMIT 50`. Filter by `log_level` (error, warning, notice) for
      severity-based triage. Use `error_code` to identify specific
      failure types. Check `request_url` to find broken webhooks.
    fetch_limit_default: 100
    filters:
      - name: log_level
    request:
      method: GET
      path: /Alerts.json
      query:
        - name: LogLevel
          from: filter
          key: log_level
    response:
      rows_path:
        - alerts
    pagination:
      mode: next_page_url
      next_page_url_path:
        - next_page_uri
      page_size:
        default: 50
        max: 1000
        query_param: PageSize
    columns:
      - name: sid
        type: Utf8
        nullable: false
        description: Unique alert SID.
        expr:
          kind: path
          path:
            - sid
      - name: error_code
        type: Utf8
        nullable: true
        description: >
          The Twilio error code that triggered this alert.
          See https://www.twilio.com/docs/api/errors for reference.
        expr:
          kind: path
          path:
            - error_code
      - name: log_level
        type: Utf8
        nullable: true
        description: >
          Severity level. Values: error, warning, notice.
          Filter by 'error' for critical issues.
        expr:
          kind: path
          path:
            - log_level
      - name: alert_text
        type: Utf8
        nullable: true
        description: >
          Human-readable description of the alert condition.
          May contain details about the specific failure.
        expr:
          kind: path
          path:
            - alert_text
      - name: resource_sid
        type: Utf8
        nullable: true
        description: >
          The SID of the resource that generated this alert
          (e.g., a call SID, message SID, or phone number SID).
        expr:
          kind: path
          path:
            - resource_sid
      - name: request_url
        type: Utf8
        nullable: true
        description: >
          The webhook URL that was requested when the alert occurred.
          Critical for debugging webhook failures.
        expr:
          kind: path
          path:
            - request_url
      - name: request_method
        type: Utf8
        nullable: true
        description: The HTTP method used for the webhook request.
        expr:
          kind: path
          path:
            - request_method
      - name: request_variables
        type: Utf8
        nullable: true
        description: The request variables sent to the webhook.
        expr:
          kind: path
          path:
            - request_variables
      - name: response_body
        type: Utf8
        nullable: true
        description: >
          The response body returned by the webhook. Useful for
          diagnosing application-level errors.
        expr:
          kind: path
          path:
            - response_body
      - name: response_headers
        type: Utf8
        nullable: true
        description: The response headers from the webhook.
        expr:
          kind: path
          path:
            - response_headers
      - name: service_sid
        type: Utf8
        nullable: true
        description: The service SID associated with this alert.
        expr:
          kind: path
          path:
            - service_sid
      - name: account_sid
        type: Utf8
        nullable: true
        description: The Account SID that owns this alert.
        expr:
          kind: path
          path:
            - account_sid
      - name: api_version
        type: Utf8
        nullable: true
        description: The Twilio API version.
        expr:
          kind: path
          path:
            - api_version
      - name: date_created
        type: Utf8
        nullable: true
        description: When the alert was created (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_created
      - name: date_generated
        type: Utf8
        nullable: true
        description: When the alert was generated (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_generated
      - name: date_updated
        type: Utf8
        nullable: true
        description: When the alert was last updated (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_updated

  # ──────────────────────────────────────────────────────────────────────
  # TABLE 14: notifications
  # Event notifications from calls and message processing.
  # ──────────────────────────────────────────────────────────────────────
  - name: notifications
    description: >
      Lists all notifications (event logs) generated during call and
      message processing. Notifications include errors, warnings, and
      informational events about webhook interactions. Each notification
      is tied to a specific call SID and includes the error code, log
      level, and the message text. Use this table alongside `alerts`
      for comprehensive error monitoring.
    guide: >
      Start with `SELECT sid, call_sid, error_code, log, message_text,
      date_created FROM twilio.notifications LIMIT 50`. Join
      `call_sid` to `twilio.calls.sid` for call context. Filter by
      `log` level (0 = ERROR, 1 = WARNING, 2 = NOTICE) for triage.
    fetch_limit_default: 100
    filters:
      - name: log
      - name: message_date_after
      - name: message_date_before
    request:
      method: GET
      path: /Notifications.json
      query:
        - name: Log
          from: filter
          key: log
        - name: "MessageDate>"
          from: filter
          key: message_date_after
        - name: "MessageDate<"
          from: filter
          key: message_date_before
    response:
      rows_path:
        - notifications
    pagination:
      mode: next_page_url
      next_page_url_path:
        - next_page_uri
      page_size:
        default: 50
        max: 1000
        query_param: PageSize
    columns:
      - name: sid
        type: Utf8
        nullable: false
        description: Unique notification SID.
        expr:
          kind: path
          path:
            - sid
      - name: call_sid
        type: Utf8
        nullable: true
        description: >
          The call SID this notification is associated with.
          Join to `twilio.calls.sid`.
        expr:
          kind: path
          path:
            - call_sid
      - name: error_code
        type: Utf8
        nullable: true
        description: The Twilio error code.
        expr:
          kind: path
          path:
            - error_code
      - name: log
        type: Utf8
        nullable: true
        description: >
          Severity level. Values: 0 (ERROR), 1 (WARNING), 2 (NOTICE).
        expr:
          kind: path
          path:
            - log
      - name: message_text
        type: Utf8
        nullable: true
        description: Human-readable description of the notification event.
        expr:
          kind: path
          path:
            - message_text
      - name: request_url
        type: Utf8
        nullable: true
        description: The webhook URL that was requested.
        expr:
          kind: path
          path:
            - request_url
      - name: request_method
        type: Utf8
        nullable: true
        description: HTTP method used for the webhook request.
        expr:
          kind: path
          path:
            - request_method
      - name: request_variables
        type: Utf8
        nullable: true
        description: Request variables sent to the webhook.
        expr:
          kind: path
          path:
            - request_variables
      - name: response_body
        type: Utf8
        nullable: true
        description: Response body from the webhook.
        expr:
          kind: path
          path:
            - response_body
      - name: response_headers
        type: Utf8
        nullable: true
        description: Response headers from the webhook.
        expr:
          kind: path
          path:
            - response_headers
      - name: account_sid
        type: Utf8
        nullable: true
        description: The Account SID.
        expr:
          kind: path
          path:
            - account_sid
      - name: api_version
        type: Utf8
        nullable: true
        description: The Twilio API version.
        expr:
          kind: path
          path:
            - api_version
      - name: date_created
        type: Utf8
        nullable: true
        description: When the notification was created (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_created
      - name: date_updated
        type: Utf8
        nullable: true
        description: When the notification was last updated (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_updated
      - name: message_date
        type: Utf8
        nullable: true
        description: The date of the notification message (RFC 2822 format).
        expr:
          kind: path
          path:
            - message_date

  # ──────────────────────────────────────────────────────────────────────
  # TABLE 15: message_feedback
  # Delivery confirmation feedback for messages.
  # ──────────────────────────────────────────────────────────────────────
  - name: message_feedback
    description: >
      Lists message feedback entries for a specific message. Feedback
      provides delivery confirmation status after a message has been
      sent. Each feedback record confirms whether the message was
      successfully delivered and received by the carrier. Requires
      a `message_sid` filter. Use this table for delivery verification
      auditing and carrier-level delivery analytics.
    guide: >
      Requires `message_sid` filter. Use `SELECT message_sid, outcome,
      date_created FROM twilio.message_feedback WHERE message_sid =
      'SMxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'`. Use `outcome` to verify
      delivery status. Values: confirmed (carrier confirmed delivery),
      unconfirmed.
    filters:
      - name: message_sid
        required: true
    request:
      method: GET
      path: /Messages/{{filter.message_sid}}/Feedback.json
    response:
      rows_path:
        - feedback
    pagination:
      mode: none
    columns:
      - name: message_sid
        type: Utf8
        nullable: false
        description: The message SID this feedback belongs to.
        expr:
          kind: path
          path:
            - message_sid
      - name: outcome
        type: Utf8
        nullable: true
        description: >
          The delivery outcome. Values: confirmed (carrier confirmed),
          unconfirmed (no carrier confirmation).
        expr:
          kind: path
          path:
            - outcome
      - name: account_sid
        type: Utf8
        nullable: true
        description: The Account SID.
        expr:
          kind: path
          path:
            - account_sid
      - name: date_created
        type: Utf8
        nullable: true
        description: When the feedback was created (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_created
      - name: date_updated
        type: Utf8
        nullable: true
        description: When the feedback was last updated (RFC 2822 format).
        expr:
          kind: path
          path:
            - date_updated
      - name: message_sid_filter
        type: Utf8
        nullable: true
        virtual: true
        description: Echoes the message_sid filter value.
        expr:
          kind: from_filter
          key: message_sid
