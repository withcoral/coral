name: argoworkflows
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query Argo Workflows orchestrations, pipeline templates, cluster templates,
  and cron schedules through the Argo Workflows REST API.
base_url: "{{input.ARGOWORKFLOWS_BASE_URL}}/api/v1"

inputs:
  ARGOWORKFLOWS_BASE_URL:
    kind: variable
    hint: |
      Argo Workflows server base URL with NO trailing slash and no /api suffix,
      for example `https://argo.example.com`.
  ARGOWORKFLOWS_AUTH_TOKEN:
    kind: secret
    hint: |
      Authentication token (Bearer or ServiceAccount token credential string).

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.ARGOWORKFLOWS_AUTH_TOKEN}}

request_headers:
  - name: Accept
    from: literal
    value: application/json

test_queries:
  - SELECT name, namespace FROM argoworkflows.workflows WHERE namespace = 'default' LIMIT 1

tables:
  - name: workflows
    description: Executed or active workflow pipeline instances within a namespace.
    filters:
      - name: namespace
        required: true
      - name: label_selector
        required: false
    request:
      method: GET
      path: /workflows/{{filter.namespace}}
      query:
        - name: listOptions.labelSelector
          from: filter
          key: label_selector
    response:
      row_strategy: direct
      rows_path: [items]
    pagination:
      mode: cursor_query
      cursor_param: "listOptions.continue"
      response_cursor_path: [metadata, continue]
      page_size:
        query_param: "listOptions.limit"
        default: 100
        max: 500
    columns:
      - name: namespace
        type: Utf8
        nullable: false
        description: Namespace the workflows are queried from (required filter).
        expr: {kind: from_filter, key: namespace}
      - name: label_selector
        type: Utf8
        nullable: true
        virtual: true
        description: Server-side Kubernetes label selector (e.g., release=v2,tier=backend).
        expr: {kind: from_filter, key: label_selector}
      - name: name
        type: Utf8
        nullable: false
        description: Name of the workflow.
        expr: {kind: path, path: [metadata, name]}
      - name: phase
        type: Utf8
        nullable: true
        description: Workflow execution phase (e.g., Running, Succeeded, Failed).
        expr: {kind: path, path: [status, phase]}
      - name: progress
        type: Utf8
        nullable: true
        description: Step progress fraction string (e.g., 3/5).
        expr: {kind: path, path: [status, progress]}
      - name: message
        type: Utf8
        nullable: true
        description: Human-readable status message from workflow conditions.
        expr: {kind: path, path: [status, message]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the workflow was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [metadata, creationTimestamp]}
      - name: started_at
        type: Timestamp
        nullable: true
        description: When the workflow started executing.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [status, startedAt]}
      - name: finished_at
        type: Timestamp
        nullable: true
        description: When the workflow finished executing.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [status, finishedAt]}

  - name: cron_workflows
    description: Scheduled CronWorkflow resources within a namespace.
    filters:
      - name: namespace
        required: true
    request:
      method: GET
      path: /cron-workflows/{{filter.namespace}}
    response:
      row_strategy: direct
      rows_path: [items]
    pagination:
      mode: none
    columns:
      - name: namespace
        type: Utf8
        nullable: false
        description: Namespace the cron workflows are queried from (required filter).
        expr: {kind: from_filter, key: namespace}
      - name: name
        type: Utf8
        nullable: false
        description: CronWorkflow name.
        expr: {kind: path, path: [metadata, name]}
      - name: schedule
        type: Utf8
        nullable: true
        description: >-
          Cron schedule(s). Reads `spec.schedules` (current Argo, joined with
          ", ") and falls back to the deprecated `spec.schedule` for older
          servers.
        expr:
          kind: coalesce
          exprs:
            - {kind: path, path: [spec, schedule]}
            - {kind: join_array, path: [spec, schedules], separator: ", "}
      - name: schedules
        type: Utf8
        nullable: true
        description: All cron schedules from `spec.schedules`, joined with ", ".
        expr: {kind: join_array, path: [spec, schedules], separator: ", "}
      - name: suspend
        type: Boolean
        nullable: true
        description: Whether the cron schedule is suspended.
        expr: {kind: path, path: [spec, suspend]}
      - name: timezone
        type: Utf8
        nullable: true
        description: Timezone the schedule is evaluated against.
        expr: {kind: path, path: [spec, timezone]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the CronWorkflow was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [metadata, creationTimestamp]}

  - name: workflow_templates
    description: Reusable namespace-scoped workflow template definitions.
    filters:
      - name: namespace
        required: true
    request:
      method: GET
      path: /workflow-templates/{{filter.namespace}}
    response:
      row_strategy: direct
      rows_path: [items]
    pagination:
      mode: none
    columns:
      - name: namespace
        type: Utf8
        nullable: false
        description: Namespace the templates are queried from (required filter).
        expr: {kind: from_filter, key: namespace}
      - name: name
        type: Utf8
        nullable: false
        description: Workflow template name.
        expr: {kind: path, path: [metadata, name]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the template was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [metadata, creationTimestamp]}

  - name: cluster_workflow_templates
    description: Globally reusable cluster-scoped workflow templates.
    request:
      method: GET
      path: /cluster-workflow-templates
    response:
      row_strategy: direct
      rows_path: [items]
    pagination:
      mode: none
    columns:
      - name: name
        type: Utf8
        nullable: false
        description: Cluster workflow template name.
        expr: {kind: path, path: [metadata, name]}
      - name: created_at
        type: Timestamp
        nullable: true
        description: When the cluster workflow template was created.
        expr:
          kind: format_timestamp
          input: iso8601
          expr: {kind: path, path: [metadata, creationTimestamp]}
