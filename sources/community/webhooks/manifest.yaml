name: webhooks
version: 0.1.0
dsl_version: 3
backend: file
description: >-
  Query local webhook delivery JSONL as a Coral SQL table. Each row stores
  a webhook event from providers such as GitHub, Sentry, Stripe, PagerDuty,
  or Linear. The payload column contains the raw JSON body as a string;
  query nested fields with json_get_str and other Coral JSON functions.

test_queries:
  - SELECT * FROM webhooks.deliveries LIMIT 1
  - SELECT * FROM webhooks.subscriptions LIMIT 1

inputs:
  WEBHOOKS_PATH:
    kind: variable
    default: "~/.webhooks/deliveries.jsonl"
    hint: >
      Path to the JSONL file containing webhook deliveries. Each row must be a
      JSON object matching the deliveries table schema.
  WEBHOOK_SUBSCRIPTIONS_PATH:
    kind: variable
    default: "~/.webhooks/subscriptions.jsonl"
    hint: >
      Path to the JSONL file containing subscription configuration rows — one
      per registered webhook source.

tables:
  # ── deliveries ─────────────────────────────────────────────────────────────
  - name: deliveries
    description: >-
      One row per webhook delivery. The payload column contains the raw JSON
      body as a string — use json_get_str(payload, 'field') in Coral SQL to
      reach into it. Rows are appended in arrival order; use received_at for
      time-series filtering.
    source:
      location: "file://{{input.WEBHOOKS_PATH}}"
      glob: "*.jsonl"
    format: jsonl
    columns:
      - name: id
        type: Utf8
        description: "Unique delivery ID for this event"
      - name: source
        type: Utf8
        description: "Originating service name, e.g. github, sentry, stripe, pagerduty, linear"
      - name: event_type
        type: Utf8
        description: "Provider-specific event type, e.g. push, issues.opened, payment_intent.failed"
      - name: payload
        type: Utf8
        description: "Raw JSON body of the webhook delivery as a string"
      - name: received_at
        type: Timestamp
        description: "UTC timestamp when the delivery was received"
      - name: hmac_valid
        type: Boolean
        description: "Whether HMAC signature was verified before writing. Set by the system that produced the row (for example a validating receiver)."
      - name: delivery_id
        type: Utf8
        description: "Provider-assigned delivery ID from the X-Delivery-ID or X-GitHub-Delivery header, if present"
      - name: content_length_bytes
        type: Int64
        description: "Byte length of the raw payload"
  # ── subscriptions ──────────────────────────────────────────────────────────
  - name: subscriptions
    description: >-
      Configuration rows for registered webhook sources. One row per source
      with its receiver URL, secret alias, event list, and active flag.
    source:
      location: "file://{{input.WEBHOOK_SUBSCRIPTIONS_PATH}}"
      glob: "*.jsonl"
    format: jsonl
    columns:
      - name: source
        type: Utf8
        description: "Service name this subscription is for, e.g. github"
      - name: receiver_url
        type: Utf8
        description: "Public URL where the provider will deliver webhooks"
      - name: secret_alias
        type: Utf8
        description: "Name of the credential alias that holds the HMAC secret for this source"
      - name: events
        type: Utf8
        description: "Comma-separated list of event types this subscription covers"
      - name: active
        type: Boolean
        description: "Whether this subscription is currently active"
      - name: registered_at
        type: Timestamp
        description: "UTC timestamp when this subscription was registered"
