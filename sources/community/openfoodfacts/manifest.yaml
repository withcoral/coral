name: openfoodfacts
version: 0.1.0
dsl_version: 3
backend: http
description: Query product details, nutritional information, allergens, ingredients, and packaging data from the Open Food Facts API.
inputs:
  API_BASE:
    kind: variable
    default: https://world.openfoodfacts.org/api/v2
    hint: Base URL for the Open Food Facts API
base_url: '{{input.API_BASE}}'
auth:
  type: HeaderAuth
  headers:
  - name: User-Agent
    from: template
    template: 'CoralFoodFacts/1.0 (contact: info@withcoral.com)'
tables:
- name: product_search
  description: General search across products
  fetch_limit_default: 100
  filters:
  - name: categories_tags
    type: Utf8
  - name: brands_tags
    type: Utf8
  - name: countries_tags
    type: Utf8
  request:
    method: GET
    path: /search
    query:
    - name: categories_tags
      from: filter
      key: categories_tags
    - name: brands_tags
      from: filter
      key: brands_tags
    - name: countries_tags
      from: filter
      key: countries_tags
    - name: fields
      from: template
      template: code,product_name,categories_tags,brands_tags,countries_tags,brands,nutriscore_grade,ecoscore_grade,nova-group,quantity
  response:
    rows_path:
    - products
  columns:
  - name: categories_tags
    type: Json
    virtual: true
    expr:
      kind: from_filter
      key: categories_tags
  - name: brands_tags
    type: Json
    virtual: true
    expr:
      kind: from_filter
      key: brands_tags
  - name: countries_tags
    type: Json
    virtual: true
    expr:
      kind: from_filter
      key: countries_tags
  - name: code
    type: Utf8
  - name: product_name
    type: Utf8
  - &id001
    name: brands
    type: Utf8
  - &id002
    name: nutriscore_grade
    type: Utf8
  - &id003
    name: ecoscore_grade
    type: Utf8
  - &id004
    name: nova_group
    type: Int64
    expr:
      kind: path
      path:
      - nova-group
  - &id005
    name: quantity
    type: Utf8
- name: product_search_by_barcode
  description: General data by barcode
  filters:
  - name: code
    type: Utf8
    required: true
  request:
    method: GET
    path: /search
    query:
    - name: code
      from: filter
      key: code
    - name: fields
      from: template
      template: code,product_name,brands,nutriscore_grade,ecoscore_grade,nova-group,quantity
  response:
    rows_path:
    - products
  columns:
  - name: code
    type: Utf8
    virtual: true
    expr:
      kind: from_filter
      key: code
  - name: product_name
    type: Utf8
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
