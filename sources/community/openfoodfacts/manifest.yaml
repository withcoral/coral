name: openfoodfacts
version: 0.1.0
dsl_version: 3
backend: http

inputs:
  API_BASE:
    kind: variable
    default: https://world.openfoodfacts.org/api/v2
    hint: Base URL for the Open Food Facts API

base_url: "{{input.API_BASE}}"

auth:
  type: HeaderAuth
  headers:
    - name: User-Agent
      from: template
      template: "CoralFoodFacts/1.0 (contact: info@withcoral.com)"

tables:
  - name: product_search
    description: Search for food products globally based on tags
    filters:
      - name: categories_tags
        type: Utf8
      - name: brands_tags
        type: Utf8
      - name: countries_tags
        type: Utf8
    request:
      method: GET
      path: /search
      query:
        - name: categories_tags
          from: filter
          key: categories_tags
        - name: brands_tags
          from: filter
          key: brands_tags
        - name: countries_tags
          from: filter
          key: countries_tags
        - name: fields
          from: template
          template: "code,product_name,brands,nutriscore_grade,ecoscore_grade,nova-group,ingredients_text,quantity,categories_tags,brands_tags,countries_tags"
    response:
      rows_path:
        - products
    columns:
      - name: categories_tags
        type: Json
      - name: brands_tags
        type: Json
      - name: countries_tags
        type: Json
      - name: code
        type: Utf8
      - name: product_name
        type: Utf8
      - name: brands
        type: Utf8
      - name: nutriscore_grade
        type: Utf8
      - name: ecoscore_grade
        type: Utf8
      - name: nova_group
        type: Int64
        expr:
          kind: path
          path:
            - nova-group
      - name: ingredients_text
        type: Utf8
      - name: quantity
        type: Utf8

  - name: product_by_barcode
    description: Get a specific food product by its barcode
    filters:
      - name: code
        type: Utf8
        required: true
    request:
      method: GET
      path: /search
      query:
        - name: code
          from: filter
          key: code
        - name: fields
          from: template
          template: "code,product_name,brands,nutriscore_grade,ecoscore_grade,nova-group,ingredients_text,quantity"
    response:
      rows_path:
        - products
    columns:
      - name: code
        type: Utf8
      - name: product_name
        type: Utf8
      - name: brands
        type: Utf8
      - name: nutriscore_grade
        type: Utf8
      - name: ecoscore_grade
        type: Utf8
      - name: nova_group
        type: Int64
        expr:
          kind: path
          path:
            - nova-group
      - name: ingredients_text
        type: Utf8
      - name: quantity
        type: Utf8

  - name: product_nutrition
    description: Search for products and get detailed nutritional info
    filters:
      - name: categories_tags
        type: Utf8
        required: true
    request:
      method: GET
      path: /search
      query:
        - name: categories_tags
          from: filter
          key: categories_tags
        - name: fields
          from: template
          template: "code,product_name,nutriments,categories_tags"
    response:
      rows_path:
        - products
    columns:
      - name: categories_tags
        type: Json
      - name: code
        type: Utf8
      - name: product_name
        type: Utf8
      - name: energy_kcal_100g
        type: Float64
        expr:
          kind: path
          path:
            - nutriments
            - energy-kcal_100g
      - name: fat_100g
        type: Float64
        expr:
          kind: path
          path:
            - nutriments
            - fat_100g
      - name: saturated_fat_100g
        type: Float64
        expr:
          kind: path
          path:
            - nutriments
            - saturated-fat_100g
      - name: carbohydrates_100g
        type: Float64
        expr:
          kind: path
          path:
            - nutriments
            - carbohydrates_100g
      - name: sugars_100g
        type: Float64
        expr:
          kind: path
          path:
            - nutriments
            - sugars_100g
      - name: fiber_100g
        type: Float64
        expr:
          kind: path
          path:
            - nutriments
            - fiber_100g
      - name: proteins_100g
        type: Float64
        expr:
          kind: path
          path:
            - nutriments
            - proteins_100g
      - name: salt_100g
        type: Float64
        expr:
          kind: path
          path:
            - nutriments
            - salt_100g

