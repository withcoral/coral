name: statusgator
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query StatusGator status monitors and incidents. This source exposes
  monitored services, components, and recent incidents so teams can
  monitor external service health alongside internal telemetry.
base_url: https://statusgator.com/api

inputs:
  STATUSGATOR_API_KEY:
    kind: secret
    hint: >-
      Optional StatusGator API key. If supplied, requests will include a
      `Authorization: Bearer <key>` header. If omitted, the source will
      attempt unauthenticated public requests where available.

auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: Bearer {{input.STATUSGATOR_API_KEY}}

test_queries:
  - SELECT id, name, status FROM statusgator.services LIMIT 5

tables:
  - name: services
    description: >-
      List of monitored services/monitors tracked by StatusGator. Each row
      represents a service with its current status and metadata.
    request:
      method: GET
      path: /v1/services
    response:
      rows_path:
        - data
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: id
        type: Utf8
        nullable: false
        expr:
          kind: path
          path:
            - id
      - name: name
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - name
      - name: status
        type: Utf8
        nullable: true
        description: Current status (e.g. up, partial_outage, down).
        expr:
          kind: path
          path:
            - status
      - name: url
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - url
      - name: last_checked
        type: Timestamp
        nullable: true
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - last_checked
      - name: raw
        type: Json
        nullable: false
        expr:
          kind: current_row

  - name: incidents
    description: >-
      Recent incidents and status updates reported for monitored services.
    request:
      method: GET
      path: /v1/incidents
    response:
      rows_path:
        - data
      row_strategy: direct
    pagination:
      mode: none
    columns:
      - name: id
        type: Utf8
        nullable: false
        expr:
          kind: path
          path:
            - id
      - name: service_id
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - service_id
      - name: status
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - status
      - name: title
        type: Utf8
        nullable: true
        expr:
          kind: path
          path:
            - title
      - name: started_at
        type: Timestamp
        nullable: true
        expr:
          kind: format_timestamp
          input: iso8601
          expr:
            kind: path
            path:
              - started_at
      - name: raw
        type: Json
        nullable: false
        expr:
          kind: current_row
