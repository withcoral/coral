    pagination:
      mode: none
    fetch_limit_default: 500
    columns: *history_cols

  - name: brave_downloads
    description: >-
      Lists the most recent 2,000 Brave Browser file download history records.
    request:
      method: GET
      path: /brave/downloads
    response:
      rows_path:
        - data
    pagination:
      mode: none
    fetch_limit_default: 500
    columns: *download_cols

  - name: brave_extensions
    description: Lists installed Brave Browser extensions.
    request:
      method: GET
      path: /brave/extensions
    response:
      rows_path:
        - data
    pagination:
