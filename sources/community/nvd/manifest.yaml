name: nvd
version: 0.1.0
dsl_version: 3
backend: http
description: >-
  Query CVE records, CVSS severity scores, and advisory references from the
  NIST National Vulnerability Database (NVD) via the public CVE API 2.0.
base_url: https://services.nvd.nist.gov
test_queries:
  - SELECT cve_id, vuln_status FROM nvd.vulnerabilities WHERE cve_id = 'CVE-2021-44228' LIMIT 1
  - SELECT cve_id, base_score, base_severity FROM nvd.cvss_v3 WHERE cve_id = 'CVE-2021-44228' LIMIT 1
  - SELECT cve_id, base_score, severity FROM nvd.cvss_v2 WHERE cve_id = 'CVE-2021-44228' LIMIT 1
  - SELECT cve_id, references FROM nvd.references WHERE cve_id = 'CVE-2021-44228' LIMIT 1
tables:
  - name: vulnerabilities
    description: >-
      Core CVE records from the NVD. Each row is one CVE with its identifier,
      publication dates, status, and English description. Use cve_id to join
      with nvd.cvss_v3, nvd.cvss_v2, and nvd.references.
    guide: >-
      Filter by cve_id for a single record, or use pub_start_date and
      pub_end_date to scope by publication window. Without filters the table
      pages through all CVE in the NVD (350 000+ records); always add a LIMIT
      or a date filter for interactive queries. Join to nvd.cvss_v3 on cve_id
      to add severity scores.
    filters:
      - name: cve_id
        required: false
      - name: pub_start_date
        required: false
      - name: pub_end_date
        required: false
      - name: last_mod_start_date
        required: false
      - name: last_mod_end_date
        required: false
      - name: cvss_v3_severity
        required: false
      - name: keyword_search
        required: false
    request:
      method: GET
      path: /rest/json/cves/2.0
      query:
        - name: cveId
          from: filter
          key: cve_id
        - name: pubStartDate
          from: filter
          key: pub_start_date
        - name: pubEndDate
          from: filter
          key: pub_end_date
        - name: lastModStartDate
          from: filter
          key: last_mod_start_date
        - name: lastModEndDate
          from: filter
          key: last_mod_end_date
        - name: cvssV3Severity
          from: filter
          key: cvss_v3_severity
        - name: keywordSearch
          from: filter
          key: keyword_search
    response:
      rows_path:
        - vulnerabilities
      row_strategy: direct
    pagination:
      mode: offset
      offset_param: startIndex
      page_size:
        default: 2000
        max: 2000
        query_param: resultsPerPage
    columns:
      - name: cve_id
        type: Utf8
        description: CVE identifier (e.g. CVE-2021-44228).
        nullable: false
        expr: { kind: path, path: [cve, id] }
      - name: source_identifier
        type: Utf8
        description: Source organization that assigned the CVE.
        nullable: true
        expr: { kind: path, path: [cve, sourceIdentifier] }
      - name: published
        type: Utf8
        description: Date and time the CVE was published (ISO 8601).
        nullable: true
        expr: { kind: path, path: [cve, published] }
      - name: last_modified
        type: Utf8
        description: Date and time the CVE record was last modified (ISO 8601).
        nullable: true
        expr: { kind: path, path: [cve, lastModified] }
      - name: vuln_status
        type: Utf8
        description: >-
          NVD analysis status of the CVE. Common values are Analyzed,
          Awaiting Analysis, Undergoing Analysis, Modified, Deferred,
          Rejected.
        nullable: true
        expr: { kind: path, path: [cve, vulnStatus] }
      - name: description
        type: Utf8
        description: English-language description of the vulnerability.
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - descriptions
          item_path:
            - value
      - name: cve_id_filter
        type: Utf8
        nullable: true
        virtual: true
        description: Filter by a specific CVE identifier (e.g. CVE-2021-44228).
        expr: { kind: from_filter, key: cve_id }
      - name: pub_start_date
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Filter to CVEs published on or after this date (ISO 8601,
          e.g. 2024-01-01T00:00:00.000).
        expr: { kind: from_filter, key: pub_start_date }
      - name: pub_end_date
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Filter to CVEs published on or before this date (ISO 8601,
          e.g. 2024-12-31T23:59:59.999).
        expr: { kind: from_filter, key: pub_end_date }
      - name: cvss_v3_severity
        type: Utf8
        nullable: true
        virtual: true
        description: >-
          Filter by CVSS v3 severity label. Valid values are LOW, MEDIUM,
          HIGH, CRITICAL.
        expr: { kind: from_filter, key: cvss_v3_severity }
      - name: keyword_search
        type: Utf8
        nullable: true
        virtual: true
        description: Filter by keyword search across CVE descriptions and metadata.
        expr: { kind: from_filter, key: keyword_search }

  - name: cvss_v3
    description: >-
      CVSS v3.x severity scores for CVE records. Each row contains the primary
      NVD scoring for one CVE. Rows are absent when NVD has not yet assigned a
      CVSS v3 score. Join to nvd.vulnerabilities on cve_id.
    guide: >-
      Filter by cve_id for a single record. Use cvss_v3_severity to scope to
      a severity band (LOW, MEDIUM, HIGH, CRITICAL). base_score ranges from
      0.0 to 10.0. vector_string encodes all sub-scores in a compact form.
    filters:
      - name: cve_id
        required: false
      - name: pub_start_date
        required: false
      - name: pub_end_date
        required: false
      - name: cvss_v3_severity
        required: false
      - name: keyword_search
        required: false
    request:
      method: GET
      path: /rest/json/cves/2.0
      query:
        - name: cveId
          from: filter
          key: cve_id
        - name: pubStartDate
          from: filter
          key: pub_start_date
        - name: pubEndDate
          from: filter
          key: pub_end_date
        - name: cvssV3Severity
          from: filter
          key: cvss_v3_severity
        - name: keywordSearch
          from: filter
          key: keyword_search
    response:
      rows_path:
        - vulnerabilities
      row_strategy: direct
    pagination:
      mode: offset
      offset_param: startIndex
      page_size:
        default: 2000
        max: 2000
        query_param: resultsPerPage
    columns:
      - name: cve_id
        type: Utf8
        description: CVE identifier linking to nvd.vulnerabilities.
        nullable: false
        expr: { kind: path, path: [cve, id] }
      - name: base_score
        type: Float64
        description: CVSS v3 base score (0.0 – 10.0).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - baseScore
      - name: base_severity
        type: Utf8
        description: CVSS v3 severity label (LOW, MEDIUM, HIGH, CRITICAL).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - baseSeverity
      - name: exploitability_score
        type: Float64
        description: CVSS v3 exploitability sub-score.
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - exploitabilityScore
      - name: impact_score
        type: Float64
        description: CVSS v3 impact sub-score.
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - impactScore
      - name: vector_string
        type: Utf8
        description: Full CVSS v3 vector string (e.g. CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - vectorString
      - name: attack_vector
        type: Utf8
        description: Attack vector (NETWORK, ADJACENT_NETWORK, LOCAL, PHYSICAL).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - attackVector
      - name: attack_complexity
        type: Utf8
        description: Attack complexity (LOW, HIGH).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - attackComplexity
      - name: privileges_required
        type: Utf8
        description: Privileges required to exploit (NONE, LOW, HIGH).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - privilegesRequired
      - name: user_interaction
        type: Utf8
        description: Whether user interaction is required (NONE, REQUIRED).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - userInteraction
      - name: scope
        type: Utf8
        description: Whether a successful exploit can affect resources beyond the vulnerable component (UNCHANGED, CHANGED).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - scope
      - name: confidentiality_impact
        type: Utf8
        description: Impact to confidentiality (NONE, LOW, HIGH).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - confidentialityImpact
      - name: integrity_impact
        type: Utf8
        description: Impact to integrity (NONE, LOW, HIGH).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - integrityImpact
      - name: availability_impact
        type: Utf8
        description: Impact to availability (NONE, LOW, HIGH).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV31
          item_path:
            - cvssData
            - availabilityImpact
      - name: cve_id_filter
        type: Utf8
        nullable: true
        virtual: true
        description: Filter by a specific CVE identifier.
        expr: { kind: from_filter, key: cve_id }
      - name: cvss_v3_severity
        type: Utf8
        nullable: true
        virtual: true
        description: Filter by CVSS v3 severity label (LOW, MEDIUM, HIGH, CRITICAL).
        expr: { kind: from_filter, key: cvss_v3_severity }

  - name: cvss_v2
    description: >-
      CVSS v2 severity scores for CVE records. Provided as a fallback for
      older CVEs that pre-date CVSS v3. Rows are absent when NVD has not
      assigned a CVSS v2 score. Join to nvd.vulnerabilities on cve_id.
    guide: >-
      Filter by cve_id for a single record. base_score ranges from 0.0 to
      10.0. severity is a string label (LOW, MEDIUM, HIGH). For modern CVEs
      prefer nvd.cvss_v3.
    filters:
      - name: cve_id
        required: false
      - name: pub_start_date
        required: false
      - name: pub_end_date
        required: false
      - name: keyword_search
        required: false
    request:
      method: GET
      path: /rest/json/cves/2.0
      query:
        - name: cveId
          from: filter
          key: cve_id
        - name: pubStartDate
          from: filter
          key: pub_start_date
        - name: pubEndDate
          from: filter
          key: pub_end_date
        - name: keywordSearch
          from: filter
          key: keyword_search
    response:
      rows_path:
        - vulnerabilities
      row_strategy: direct
    pagination:
      mode: offset
      offset_param: startIndex
      page_size:
        default: 2000
        max: 2000
        query_param: resultsPerPage
    columns:
      - name: cve_id
        type: Utf8
        description: CVE identifier linking to nvd.vulnerabilities.
        nullable: false
        expr: { kind: path, path: [cve, id] }
      - name: base_score
        type: Float64
        description: CVSS v2 base score (0.0 – 10.0).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV2
          item_path:
            - cvssData
            - baseScore
      - name: severity
        type: Utf8
        description: CVSS v2 severity label (LOW, MEDIUM, HIGH).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV2
          item_path:
            - baseSeverity
      - name: vector_string
        type: Utf8
        description: Full CVSS v2 vector string (e.g. AV:N/AC:M/Au:N/C:C/I:C/A:C).
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV2
          item_path:
            - cvssData
            - vectorString
      - name: exploitability_score
        type: Float64
        description: CVSS v2 exploitability sub-score.
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV2
          item_path:
            - exploitabilityScore
      - name: impact_score
        type: Float64
        description: CVSS v2 impact sub-score.
        nullable: true
        expr:
          kind: first_array_item_path
          path:
            - cve
            - metrics
            - cvssMetricV2
          item_path:
            - impactScore
      - name: cve_id_filter
        type: Utf8
        nullable: true
        virtual: true
        description: Filter by a specific CVE identifier.
        expr: { kind: from_filter, key: cve_id }

  - name: references
    description: >-
      Advisory and patch reference links for CVE records. Each row is one CVE
      with its full references array. The references column is a JSON array
      where each element contains url, source, and tags fields.
      Join to nvd.vulnerabilities on cve_id.
    guide: >-
      Filter by cve_id to retrieve references for a specific CVE. Each row
      contains a JSON array in the references column. Use json_get_str to
      extract individual URLs. Tags classify links as Patch, Vendor Advisory,
      Exploit, Third Party Advisory, Mailing List, and similar labels.
    filters:
      - name: cve_id
        required: false
      - name: pub_start_date
        required: false
      - name: pub_end_date
        required: false
      - name: keyword_search
        required: false
    request:
      method: GET
      path: /rest/json/cves/2.0
      query:
        - name: cveId
          from: filter
          key: cve_id
        - name: pubStartDate
          from: filter
          key: pub_start_date
        - name: pubEndDate
          from: filter
          key: pub_end_date
        - name: keywordSearch
          from: filter
          key: keyword_search
    response:
      rows_path:
        - vulnerabilities
      row_strategy: direct
    pagination:
      mode: offset
      offset_param: startIndex
      page_size:
        default: 2000
        max: 2000
        query_param: resultsPerPage
    columns:
      - name: cve_id
        type: Utf8
        description: CVE identifier linking to nvd.vulnerabilities.
        nullable: false
        expr: { kind: path, path: [cve, id] }
      - name: references
        type: Json
        description: >-
          Full references array for the CVE. Each element contains url,
          source, and tags fields.
        nullable: true
        expr: { kind: path, path: [cve, references] }
      - name: cve_id_filter
        type: Utf8
        nullable: true
        virtual: true
        description: Filter by a specific CVE identifier.
        expr: { kind: from_filter, key: cve_id }
