spec_version: 1
kind: source
name: slack
description: Query Slack workspace channel and user metadata through the Slack Web API.
inputs:
  - key: SLACK_TOKEN
    kind: secret
    label: Slack token
    hint: Slack OAuth token used as the Web API Authorization bearer token.
    required: true
interfaces:
  - id: rest
    type: openapi
    file: ./openapi.yaml
    base_url: https://slack.com/api
    auth:
      kind: bearer_input
      key: SLACK_TOKEN
