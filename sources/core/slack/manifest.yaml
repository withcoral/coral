spec_version: 1
kind: source
name: slack
description: Use Slack's hosted MCP server over Streamable HTTP to search Slack, read messages and canvases, manage users, and send messages as the authenticated user.
inputs:
    - key: SLACK_BOT_TOKEN
      kind: secret
      label: Slack bot OAuth token
      hint: Bot or user token for Slack Web API REST calls. Bot tokens usually start with xoxb and need scopes matching the methods you invoke.
      required: true
    - key: SLACK_USER_TOKEN
      kind: secret
      label: Slack user OAuth token
      hint: User OAuth token for Slack's hosted MCP server. Install interactively to authorize with Slack OAuth, or set this to an existing user token.
      required: true
      credential:
          methods:
              - type: oauth
                label: Connect with Slack
                description: Authorize Slack with OAuth and store a user token for Slack's hosted MCP server.
                hint: The Slack app must be internal or directory-published, have MCP access and PKCE enabled, and allow the redirect URL http://localhost:53682/oauth/callback.
                oauth:
                    flow:
                        type: authorization_code
                        pkce: required
                    redirect_uri: http://localhost:53682/oauth/callback
                    redirect_uri_port_mode: fixed
                    endpoints:
                        authorization_url: https://slack.com/oauth/v2_user/authorize
                        token_url: https://slack.com/api/oauth.v2.user.access
                    client:
                        id:
                            input: SLACK_OAUTH_CLIENT_ID
                    scopes:
                        scope:
                            delimiter: comma
                            values:
                                - search:read.public
                                - search:read.private
                                - search:read.mpim
                                - search:read.im
                                - search:read.files
                                - files:read
                                - emoji:read
                                - search:read.users
                                - chat:write
                                - channels:history
                                - groups:history
                                - mpim:history
                                - im:history
                                - channels:write
                                - groups:write
                                - im:write
                                - mpim:write
                                - reactions:write
                                - canvases:read
                                - canvases:write
                                - users:read
                                - users:read.email
                                - channels:read
                                - groups:read
                                - mpim:read
interfaces:
    - id: rest
      type: openapi
      file: slack.openapi.yaml
      overlays:
          - file: slack.coral.overlay.yaml
      base_url: https://slack.com/api
      auth:
          kind: bearer_input
          key: SLACK_BOT_TOKEN
    - id: mcp
      type: mcp
      server:
          transport:
              type: streamable_http
              url: https://mcp.slack.com/mcp
          auth:
              kind: bearer_input
              key: SLACK_USER_TOKEN
