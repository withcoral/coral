spec_version: 1
kind: source
name: github
description: Query GitHub repositories, issues, pull requests, workflows, organizations, users, teams, notifications, code, Actions, security alerts, and API metadata through GitHub REST, GraphQL, and MCP APIs.
inputs:
  - key: GITHUB_TOKEN
    kind: secret
    label: GitHub token
    hint: GitHub personal access token or OAuth bearer token. Coral sends it as an Authorization bearer token for GitHub REST, GraphQL, and MCP calls.
    required: true
interfaces:
  - id: rest
    type: openapi
    url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
    base_url: https://api.github.com
    auth:
      kind: bearer_input
      key: GITHUB_TOKEN
  - id: graph
    type: graphql
    endpoint: https://api.github.com/graphql
    auth:
      kind: bearer_input
      key: GITHUB_TOKEN
    schema:
      kind: introspection_query
  - id: mcp
    type: mcp
    server:
      transport:
        type: streamable_http
        url: https://api.githubcopilot.com/mcp/
      auth:
        kind: bearer_input
        key: GITHUB_TOKEN
