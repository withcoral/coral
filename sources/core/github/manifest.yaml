spec_version: 1
kind: source
name: github
description: Query GitHub repositories, issues, pull requests, workflows, organizations, users, teams, and API metadata.
inputs:
  - key: GITHUB_TOKEN
    kind: secret
    label: GitHub token
    hint: GitHub personal access token or OAuth bearer token used as the REST Authorization bearer token.
    required: true
interfaces:
  - id: rest
    type: openapi
    url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
    base_url: https://api.github.com
    auth:
      kind: bearer_input
      key: GITHUB_TOKEN
  - id: graph
    type: graphql
    endpoint: https://api.github.com/graphql
    auth:
      kind: bearer_input
      key: GITHUB_TOKEN
    schema:
      kind: introspection_query
