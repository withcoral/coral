spec_version: 1
kind: source
name: linear
description: Query Linear issues, teams, users, projects, cycles, initiatives, comments, workflow states, and API metadata through Linear's GraphQL API.
inputs:
  - key: LINEAR_API_KEY
    kind: secret
    label: Linear API key
    hint: Personal Linear API key. Coral sends it as the Authorization header value.
    required: true
interfaces:
  - id: graph
    type: graphql
    endpoint: https://api.linear.app/graphql
    auth:
      kind: header_input
      name: Authorization
      key: LINEAR_API_KEY
    schema:
      kind: introspection_query
