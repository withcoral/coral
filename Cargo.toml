[workspace]
members = ["crates/coral", "crates/coral-*", "xtask", "ee/crates/*"]
# A plain `cargo build` or `cargo test` builds only the Apache-2.0 crates.
# `--workspace` or `-p coral-ee` brings in ee/. See ADR 0033.
default-members = ["crates/coral", "crates/coral-*", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.8.0" # x-release-please-version
license = "Apache-2.0"
rust-version = "1.100"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
# enforcement
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# don't panic
unwrap_used = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
indexing_slicing = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
unchecked_time_subtraction = "warn"
# don't fail silently
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
# easy wins
dbg_macro = "warn"
mem_forget = "warn"
rc_mutex = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
disallowed_methods = "deny"
print_stderr = "warn"
print_stdout = "warn"

[workspace.dependencies]
assert_cmd = "2"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive", "env"] }
deno_core_icudata = "=0.78.0"
encoding_rs = "0.8"
etcetera = "0.11"
flate2 = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
hyper-util = "0.1"
jsonschema = { version = "0.60.2", default-features = false }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
mime = "0.3"
oxc_allocator = "0.156"
oxc_ast = "0.156"
oxc_parser = "0.156"
oxc_span = "0.156"
opentelemetry = "0.33.1"
# The build downloads ONNX Runtime 1.31.0, built by pyke, and links it
# statically. `tracing` sends ONNX Runtime's log to Coral's.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "download-binaries", "tls-rustls", "tracing"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "form", "http2", "json", "query", "rustls", "system-proxy"] }
ring = "0.17.14"
rmcp = { version = "3.8.0", features = ["client", "reqwest", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rustix = { version = "1.1", features = ["time"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
schemars = "1.2.3"
sea-query = { version = "1", default-features = false, features = ["backend-postgres", "backend-sqlite", "derive", "thread-safe"] }
sea-query-sqlx = { version = "0.9", default-features = false, features = [
  "postgres-array",
  "sqlx-postgres",
  "sqlx-sqlite",
  "with-bigdecimal",
  "with-chrono",
  "with-rust_decimal",
  "with-time",
] }
sha2 = "0.11"
subtle = "2.6"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "postgres", "regexp", "runtime-tokio", "sqlite", "tls-rustls"] }
sourcemap = "9.3.2"
sse-stream = "0.2.6"
thiserror = "2"
thread-priority = "3.1.1"
tokio = { version = "1", features = ["full"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
tokio-stream = "0.1"
toml = "1.1"
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14"
prost-types = "0.14"
tower = "0.5"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3"
url = "2"
urlencoding = "2"
unicode-general-category = "1.1"
unicode-id-start = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# The build downloads V8 as a prebuilt archive. A new version needs new
# digests in [workspace.metadata.v8-archive] below.
v8 = "=152.2.0"
wiremock = "0.6"
zeroize = "1.9"

coral = { path = "crates/coral" }
coral-administration = { path = "crates/coral-administration" }
coral-app = { path = "crates/coral-app" }
coral-auth = { path = "crates/coral-auth" }
coral-catalog = { path = "crates/coral-catalog" }
coral-credentials = { path = "crates/coral-credentials" }
coral-db = { path = "crates/coral-db" }
coral-edition = { path = "crates/coral-edition" }
coral-embed = { path = "crates/coral-embed" }
coral-tools = { path = "crates/coral-tools" }
coral-grpc = { path = "crates/coral-grpc" }
coral-identifier = { path = "crates/coral-identifier" }
coral-mcp = { path = "crates/coral-mcp" }
coral-outbound = { path = "crates/coral-outbound" }
coral-policy = { path = "crates/coral-policy" }
coral-provider = { path = "crates/coral-provider" }
coral-release = { path = "crates/coral-release" }
coral-usage = { path = "crates/coral-usage" }
coral-secret-store = { path = "crates/coral-secret-store" }
coral-run = { path = "crates/coral-run" }
coral-run-executor = { path = "crates/coral-run-executor" }
coral-search = { path = "crates/coral-search" }
coral-task = { path = "crates/coral-task" }
coral-telemetry = { path = "crates/coral-telemetry" }
coral-test-support = { path = "crates/coral-test-support" }
coral-upstream = { path = "crates/coral-upstream" }
coral-v8 = { path = "crates/coral-v8" }
coral-value = { path = "crates/coral-value" }
coral-workspace = { path = "crates/coral-workspace" }

# The v8 crate's build script downloads a prebuilt V8 archive from the
# rusty_v8 release of the same version and links it. Cargo.lock covers the
# crate's source, not that archive. The build script stops the build when
# RUSTY_V8_ARCHIVE_SHA256 is set and the archive has another digest. The
# builds that Coral publishes set it to their target's row: Desktop's staging
# (apps/desktop/scripts/runtime.mjs) reads this table, and docker/Dockerfile
# repeats its Linux rows. xtask/tests/v8_archive.rs keeps them in step. Other
# builds, `make install` among them, do not check the archive.
#
# Each value is the SHA-256 of the release asset as downloaded, still gzipped:
#   https://github.com/denoland/rusty_v8/releases/download/v<version>/librusty_v8_release_<target>.a.gz
# The Windows asset is rusty_v8_release_<target>.lib.gz. The build script
# links the `release` archive under every Cargo profile.
[workspace.metadata.v8-archive]
version = "152.2.0"

[workspace.metadata.v8-archive.sha256]
aarch64-apple-darwin = "a4a5484444ad4b5f10dc7bed141236dd9dbeabf2006d14520f19b935d4db4227"
aarch64-unknown-linux-gnu = "c40196bbf182532e583f65b7daf0196fdbb3354e6fac59b31d0539c20f931f3d"
x86_64-pc-windows-msvc = "0b17ca072bae37dd4ff00e6014d2b413becb031c9342ee11cb8226a5881f62b2"
x86_64-unknown-linux-gnu = "b6683e9afcb77fbd8cb2c3acf45d34d52029ab216b332522c95179c12f0fed3c"

[profile.dev]
debug = 1
opt-level = 0

# Keep application code easy to debug without making large-document setup spend
# seconds in unoptimized parsing and catalog generation.
[profile.dev.package.coral-catalog]
opt-level = 2

[profile.dev.package.serde_yaml]
opt-level = 2

[profile.dev.package.unsafe-libyaml]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.test]
debug = 1
