[workspace]
members = ["crates/coral", "crates/coral-*", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.4.0" # x-release-please-version
license = "Apache-2.0"
rust-version = "1.97"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
# enforcement
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# don't panic
unwrap_used = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
indexing_slicing = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
unchecked_time_subtraction = "warn"
# don't fail silently
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"
# easy wins
dbg_macro = "warn"
mem_forget = "warn"
rc_mutex = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
disallowed_methods = "deny"
print_stderr = "warn"
print_stdout = "warn"

[workspace.dependencies]
assert_cmd = "2"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive", "env"] }
deno_core_icudata = "=0.78.0"
encoding_rs = "0.8"
etcetera = "0.11"
flate2 = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
jsonschema = { version = "0.58.6", default-features = false }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
mime = "0.3"
oxc_allocator = "0.153"
oxc_ast = "0.153"
oxc_parser = "0.153"
oxc_span = "0.153"
opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "form", "http2", "json", "query", "rustls", "system-proxy"] }
ring = "0.17.14"
rmcp = { version = "3.5.1", features = ["client", "reqwest", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rusqlite = { version = "0.39", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
serde_yaml = "0.9"
schemars = "1.2.2"
sea-query = { version = "1", default-features = false, features = ["backend-postgres", "backend-sqlite", "derive", "thread-safe"] }
sea-query-sqlx = { version = "0.9", default-features = false, features = [
  "postgres-array",
  "sqlx-postgres",
  "sqlx-sqlite",
  "with-bigdecimal",
  "with-chrono",
  "with-rust_decimal",
  "with-time",
] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "postgres", "regexp", "runtime-tokio", "sqlite", "tls-rustls"] }
sourcemap = "9.3.2"
sse-stream = "0.2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1.1"
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14"
prost-types = "0.14"
tower = "0.5"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3"
url = "2"
urlencoding = "2"
unicode-general-category = "1.1"
unicode-id-start = "1"
uuid = { version = "1", features = ["serde", "v4"] }
v8 = "=152.2.0"
wiremock = "0.6"
zeroize = "1.9"

coral-administration = { path = "crates/coral-administration" }
coral-app = { path = "crates/coral-app" }
coral-auth = { path = "crates/coral-auth" }
coral-catalog = { path = "crates/coral-catalog" }
coral-credentials = { path = "crates/coral-credentials" }
coral-db = { path = "crates/coral-db" }
coral-functions = { path = "crates/coral-functions" }
coral-grpc = { path = "crates/coral-grpc" }
coral-identifier = { path = "crates/coral-identifier" }
coral-mcp = { path = "crates/coral-mcp" }
coral-outbound = { path = "crates/coral-outbound" }
coral-policy = { path = "crates/coral-policy" }
coral-provider = { path = "crates/coral-provider" }
coral-release = { path = "crates/coral-release" }
coral-run = { path = "crates/coral-run" }
coral-search = { path = "crates/coral-search" }
coral-task = { path = "crates/coral-task" }
coral-telemetry = { path = "crates/coral-telemetry" }
coral-test-support = { path = "crates/coral-test-support" }
coral-upstream = { path = "crates/coral-upstream" }
coral-v8 = { path = "crates/coral-v8" }
coral-value = { path = "crates/coral-value" }
coral-workspace = { path = "crates/coral-workspace" }

[profile.dev]
debug = 1
opt-level = 0

# Keep application code easy to debug without making large-document setup spend
# seconds in unoptimized parsing and catalog generation.
[profile.dev.package.coral-catalog]
opt-level = 2

[profile.dev.package.serde_yaml]
opt-level = 2

[profile.dev.package.unsafe-libyaml]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.test]
debug = 1
