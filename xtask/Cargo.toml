[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Operator recovery commands over a Coral deployment's state database.
#
# Off by default on purpose: it is the only thing here that pulls `coral-app`,
# and the docs tooling plus `.github/workflows/release.yml` build `-p xtask`
# with default features and must stay as fast as they are today.
admin = ["dep:coral-app", "dep:tokio"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid.workspace = true
walkdir.workspace = true

jsonschema.workspace = true
reqwest.workspace = true

coral-spec.workspace = true
coral-app = { workspace = true, features = ["admin"], optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
insta = "1"
tempfile.workspace = true
