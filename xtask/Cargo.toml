[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Repository-side workspace recovery. Off by default and never enabled by a
# shipped Coral binary: possession of the state database is the tool's whole
# authority, so it stays a break-glass repository utility. Every dependency it
# needs is optional and reachable only through this feature.
admin = ["dep:chrono", "dep:etcetera", "dep:sqlx", "dep:tokio", "dep:toml"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid.workspace = true
walkdir.workspace = true

jsonschema.workspace = true
reqwest.workspace = true

coral-spec.workspace = true

# Admin-only. Enabled solely by the `admin` feature: the default `xtask` build
# resolves none of these dependency edges.
chrono = { workspace = true, optional = true }
etcetera = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
insta = "1"
tempfile.workspace = true
